<style>
@font-face { font-family: 'Chomsky'; src: url('../Chomsky.woff2') format('woff2'); font-display: swap; }

:root {
  color-scheme: light;
  --page: #f3f6f3; --surface: #ffffff; --surface-2: #eef3ef;

}

  :root:not([data-theme="light"]) {

    --ink: #e8eee9; --ink-2: #a3b2a8; --ink-3: #7f8f85;
    --line: #29332d; --brand: #62c48f; --brand-2: #4fb07c; --brand-soft: #17281f; --on-brand: #0b1a12;
    --grid: #303030; --axis: #474747;
    --c1: #338ced; --c2: #e76624; --c3: #00a888; --c4: #d28e05;
    --o1: #1757ac; --o2: #338ced; --o3: #9dc8f7;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d1210; --surface: #161c19; --surface-2: #1d2521;
  --ink: #e8eee9; --ink-2: #a3b2a8; --ink-3: #7f8f85;
  --line: #29332d; --brand: #62c48f; --brand-2: #4fb07c; --brand-soft: #17281f; --on-brand: #0b1a12;
  --grid: #303030; --axis: #474747;
  --c1: #338ced; --c2: #e76624; --c3: #00a888; --c4: #d28e05;
  --o1: #1757ac; --o2: #338ced; --o3: #9dc8f7;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 400 17px/1.75 'Sarabun', system-ui, -apple-system, 'Segoe UI', sans-serif;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: var(--brand); text-underline-offset: 3px; }
h1, h2, h3, h4 { line-height: 1.35; margin: 0; font-weight: 700; }
p { margin: 0 0 .9em; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .wrap { padding: 0 28px; } }
.skip { position: absolute; left: -999px; top: 8px; background: var(--brand); color: var(--on-brand); padding: 6px 12px; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }
:focus-visible { outline: 3px solid var(--c1); outline-offset: 2px; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
.masthead { font-family: 'Chomsky', 'UnifrakturMaguntia', serif; font-size: 24px; color: var(--ink); text-decoration: none; white-space: nowrap; line-height: 1; }
.toc { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; mask-image: linear-gradient(90deg, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent); }
.toc::-webkit-scrollbar { display: none; }

.toc a:hover { background: var(--surface-2); color: var(--ink); }
.toc a.active { background: var(--brand-soft); color: var(--brand); }
.icon-btn { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }

/* Hero */
.hero { position: relative; color: #fff; background: #123d28; overflow: hidden; }
.hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center 40%; opacity: .55; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,40,25,.35), rgba(8,30,19,.92) 85%); }
.hero .wrap { position: relative; z-index: 1; padding-top: 72px; padding-bottom: 36px; }
.eyebrow { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; opacity: .85; font-weight: 600; }
.hero h1 { font-size: clamp(36px, 7vw, 64px); margin: 6px 0 10px; letter-spacing: -.01em; }
.hero .org { font-size: clamp(18px, 2.6vw, 22px); font-weight: 500; max-width: 760px; }
.hero .sub { opacity: .85; margin-top: 4px; }
.hero-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 32px; }
.hero-stat { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(4px); }

/* Sections */
main { padding-bottom: 40px; }
.section { padding: 56px 0 8px; }

.muted { color: var(--ink-2); }
.small { font-size: 14px; }

/* Foreword */
.foreword p { text-indent: 2.2em; }

/* Lists */
ol.results, ul.plain { margin: 0; padding-left: 1.4em; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 14px; padding: 3px 12px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.brand { background: var(--brand-soft); color: var(--brand); border-color: transparent; font-weight: 600; }

/* Vision */
.vision { font-size: clamp(20px, 3vw, 26px); font-weight: 600; line-height: 1.55; color: var(--brand); border-left: 4px solid var(--brand); padding: 4px 0 4px 18px; margin: 0; }

/* Stat tiles */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.stat .v { font-size: 26px; font-weight: 700; line-height: 1.2; color: var(--ink); }
.stat .u { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.stat .l { font-size: 14px; color: var(--ink-2); line-height: 1.5; margin-top: 4px; }
.stat.context { background: transparent; border: 1px dashed var(--line); }
.stat .tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--ink-3); margin-bottom: 2px; }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.55; }
th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }

tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td, tr.total th { font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--axis); }
tr.pct td, tr.pct th { color: var(--ink-2); background: var(--surface-2); }
tr.group th { background: var(--brand-soft); color: var(--brand); font-weight: 600; font-size: 14px; }

td.l1 { padding-left: 28px; } td.l2 { padding-left: 46px; } td.l3 { padding-left: 64px; }
.approx { color: var(--ink-2); }
.tbl-caption { font-size: 14px; color: var(--ink-2); margin: 6px 2px 0; }

/* Figures */
.figure { margin-top: 18px; }
.figure > h4 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
.chart-box { position: relative; width: 100%; }
details.table-view { margin-top: 8px; }
details.table-view > summary { cursor: pointer; font-size: 14px; color: var(--ink-2); list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; }
details.table-view > summary::before { content: "▸"; transition: transform .15s; }
details.table-view[open] > summary::before { transform: rotate(90deg); }
details.table-view > summary::-webkit-details-marker { display: none; }
details.table-view .table-wrap { margin-top: 6px; }

/* Segmented bar */
.seg-bar { display: flex; gap: 2px; height: 28px; width: 100%; }
.seg { position: relative; border-radius: 4px; min-width: 2px; display: flex; align-items: center; padding: 0 8px; overflow: visible; cursor: default; }
.seg span { font-size: 13px; font-weight: 600; white-space: nowrap; color: #fff; }
.seg.dark-text span { color: #0b0b0b; }
.seg span[hidden] { display: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 14px; color: var(--ink-2); padding: 0; list-style: none; }
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend b { color: var(--ink); font-weight: 600; }
.status-icon { font-weight: 700; }

/* WQI rows */
.wqi-rows { display: grid; gap: 12px; }
.wqi-row { display: grid; grid-template-columns: 1fr; gap: 4px; }

.wqi-row .q { font-weight: 600; font-size: 15px; line-height: 1.35; }

.wqi-row .n { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Tooltip for HTML marks */
#tip { position: fixed; z-index: 90; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 13px; line-height: 1.45; padding: 6px 10px; border-radius: 8px; max-width: 280px; opacity: 0; transition: opacity .1s; }
#tip.show { opacity: 1; }

/* Budget */
.big-figure { font-size: clamp(40px, 7vw, 56px); font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
.big-figure small { font-size: 18px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; margin-left: 6px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.kv .k { font-size: 14px; color: var(--ink-2); }
.kv .v { font-size: 22px; font-weight: 700; }
.meter { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--good) 22%, var(--surface)); overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; background: var(--good); border-radius: 999px; }
td.name a { color: inherit; text-decoration-color: var(--line); }
td.name a:hover { color: var(--brand); }

/* KPI */
.kpi-head { display: grid; gap: 20px; align-items: center; }
@media (min-width: 860px) { .kpi-head { grid-template-columns: 300px 1fr; } }
.score-ring { text-align: center; padding: 18px; border-radius: 16px; background: var(--brand-soft); }
.score-ring .big-figure { color: var(--brand); }
.photo-wide { border-radius: 14px; overflow: hidden; margin: 18px auto 0; max-width: 760px; }
.photo-wide img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
figcaption { font-size: 14px; color: var(--ink-2); margin-top: 6px; }

/* Profile */
.map-grid { display: grid; gap: 18px; align-items: start; }
@media (min-width: 900px) { .map-grid { grid-template-columns: 420px 1fr; } }
.map-grid > *, .kpi-head > *, .director > *, .grid-2 > *, .pane-2 > *, .wqi-row > * { min-width: 0; }
.map-grid img { border-radius: 12px; border: 1px solid var(--line); background: #fff; }
.org-top { text-align: center; }
.org-top .box { display: inline-block; background: var(--brand); color: var(--on-brand); border-radius: 12px; padding: 10px 22px; font-weight: 600; }
.divisions { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 16px; }
.division { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; border-top: 4px solid var(--brand-2); }
.division .code { font-size: 13px; font-weight: 700; color: var(--brand); }
.division h4 { font-size: 16px; margin: 2px 0 4px; }
.division p { font-size: 14px; color: var(--ink-2); margin: 0; line-height: 1.6; }
.director { display: grid; gap: 18px; align-items: center; }
@media (min-width: 720px) { .director { grid-template-columns: 260px 1fr; } }
.director img { border-radius: 14px; aspect-ratio: 4/3; object-fit: cover; width: 100%; }
.director .name { font-size: 22px; font-weight: 700; }
.teams { display: grid; gap: 16px; margin-top: 16px; }
@media (min-width: 860px) { .teams { grid-template-columns: 1fr 1fr; } }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.team img { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: center 25%; cursor: zoom-in; }
.team .body { padding: 14px 18px 16px; }
.team h4 { font-size: 17px; margin-bottom: 8px; }
.members { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px 16px; }
@media (min-width: 520px) { .members { grid-template-columns: 1fr 1fr; } }
.members li { line-height: 1.4; }
.members li.head { grid-column: 1 / -1; }
.members .n { font-weight: 600; font-size: 15px; display: block; }
.members .p { font-size: 13px; color: var(--ink-2); }

/* Operations */
.ops-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 8px; }
.search { flex: 1 1 260px; position: relative; }
.search input { width: 100%; font: inherit; font-size: 16px; padding: 10px 14px 10px 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); }
.ops-count { font-size: 14px; color: var(--ink-2); }
.project-index { display: grid; gap: 14px; margin-top: 14px; }
@media (min-width: 860px) { .project-index { grid-template-columns: repeat(2, 1fr); } }
.pi-group h4 { font-size: 15px; color: var(--ink-2); font-weight: 600; margin-bottom: 6px; }
.pi-group ol { margin: 0; padding-left: 1.3em; font-size: 15px; line-height: 1.6; }
.pi-group li { margin-bottom: 4px; }
.pi-group a { color: var(--ink); text-decoration: none; }
.pi-group a:hover { color: var(--brand); text-decoration: underline; }
.group-head { margin: 44px 0 14px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.group-head h3 { font-size: clamp(20px, 3vw, 24px); }
.group-head .count { font-size: 14px; color: var(--ink-3); }
.project { margin-bottom: 18px; }
.project-head { display: grid; gap: 8px; margin-bottom: 14px; }
.project-head h3 { font-size: clamp(19px, 2.6vw, 23px); line-height: 1.45; }
.project-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.budget-pill { font-size: 14px; color: var(--ink-2); }
.budget-pill b { color: var(--ink); }
.project .stats { margin: 14px 0 4px; }
.block-title { font-size: 15px; font-weight: 700; color: var(--brand); margin: 22px 0 10px; letter-spacing: .01em; }
details.bg { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
details.bg > summary { cursor: pointer; font-weight: 600; color: var(--ink-2); font-size: 15px; }
details.bg[open] > summary { margin-bottom: 10px; }
.pane-2 { display: grid; gap: 14px; margin-top: 18px; }
@media (min-width: 860px) { .pane-2 { grid-template-columns: 1fr 1fr; } }
.pane { border-radius: 12px; padding: 14px 16px; background: var(--surface-2); }
.pane h4 { font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.pane ol { margin: 0; padding-left: 1.3em; font-size: 15px; line-height: 1.65; }
.pane li { margin-bottom: .45em; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 18px; }
.gallery button { padding: 0; border: 0; background: var(--surface-2); border-radius: 10px; overflow: hidden; cursor: zoom-in; aspect-ratio: 4/3; }
.gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform .25s; }
.gallery button:hover img { transform: scale(1.04); }
.empty-hit { padding: 28px; text-align: center; color: var(--ink-2); }
mark { background: color-mix(in srgb, var(--c4) 35%, transparent); color: inherit; border-radius: 3px; }

/* Lightbox */
dialog#lightbox { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 94vh; }
dialog#lightbox::backdrop { background: rgba(5,10,8,.88); }
.lb-inner { position: relative; display: grid; gap: 8px; justify-items: center; }
.lb-inner img { max-width: 94vw; max-height: 82vh; border-radius: 10px; object-fit: contain; background: #111; }
.lb-cap { color: #e8eee9; font-size: 14px; text-align: center; max-width: 80ch; }
.lb-btn { position: fixed; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 22px; cursor: pointer; }
.lb-btn:hover { background: rgba(255,255,255,.26); }
.lb-prev { left: 12px; } .lb-next { right: 12px; }
.lb-close { position: fixed; top: 12px; right: 12px; transform: none; }

/* Footer */

<script>
(function () {
  'use strict';

  /* The page is a renderer: every word and number comes from DATA_URL.

  var DATA_URL = 'report-2569.json';

  // ---------- helpers ----------
  function h(tag, props) {

      else if (k === 'text') el.textContent = v;

  function add(el, kid) {

  var nfCache = {};
  function nf(d) { return nfCache[d] || (nfCache[d] = new Intl.NumberFormat('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d })); }
  function decs(v) { if (Number.isInteger(v)) return 0; var s = String(v).split('.')[1] || ''; return Math.min(3, s.length); }

  function isApprox(c) { return !!(c && typeof c === 'object' && c.approx); }
  function fmt(v, d) {
    if (v == null || v === '') return '–';
    if (typeof v === 'string') return v;
    return nf(d == null ? decs(v) : d).format(v);
  }
  function fmtCell(c, d) { var v = cv(c); return isApprox(c) ? '≈' + fmt(v, Math.max(1, decs(v))) : fmt(v, d); }
  function baht(v) { return nf(2).format(v); }
  function pct(a, b, d) { return b ? nf(d == null ? 2 : d).format(a / b * 100) : '–'; }
  function sum(arr) { return arr.reduce(function (s, x) { return s + (typeof x === 'number' ? x : 0); }, 0); }
  function millions(v) { return nf(2).format(v / 1e6); }
  function slug(s) { return 'sec-' + s; }
  function token(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  // Thai is written without spaces between words, so break on word
  // boundaries with Intl.Segmenter where available (falls back to spaces).
  var seg = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
  function words(s, max) {

      if (seg && t.length > max) Array.prototype.push.apply(out, Array.from(seg.segment(t), function (x) { return x.segment; }));
      else out.push(t);
    });
    return out;
  }
  function wrapLabel(s, max) {
    if (s.length <= max) return s;
    var lines = [], cur = '';
    words(s, max).forEach(function (w) {
      if (cur && (cur + w).trim().length > max) { lines.push(cur.trim()); cur = w.trim() ? w : ''; }
      else cur += w;
    });
    if (cur.trim()) lines.push(cur.trim());
    return lines;
  }
  function paras(list) { return (list || []).map(function (t) { return h('p', null, t); }); }
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- shared tooltip for HTML marks ----------
  var tip = document.getElementById('tip');
  function bindTip(el, text) {

    el.setAttribute('aria-label', text);

      var y = e && e.clientY != null ? e.clientY : r.top;

      tip.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, x - tw / 2)) + 'px';
      tip.style.top = Math.max(8, y - tip.offsetHeight - 12) + 'px';

    function hide() { tip.classList.remove('show'); }
    el.addEventListener('mousemove', show);
    el.addEventListener('mouseleave', hide);
    el.addEventListener('focus', function () { show(); });
    el.addEventListener('blur', hide);
  }

  // ---------- theme ----------
  var root = document.documentElement;
  try { var saved = localStorage.getItem('ar2569-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  function currentTheme() {

  }
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';

    try { localStorage.setItem('ar2569-theme', next); } catch (e) {}

  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { if (!root.getAttribute('data-theme')) redrawCharts(); });
  }

  // ---------- charts (Chart.js) ----------
  var charts = [];
  function chartReady() { return typeof window.Chart !== 'undefined'; }
  var tipLabels = {
    id: 'tipLabels',
    afterDatasetsDraw: function (chart, args, o) {
      if (!o || !o.enabled) return;

      ctx.font = '600 12px Sarabun, system-ui, sans-serif';
      ctx.fillStyle = o.color;
      var horiz = chart.options.indexAxis === 'y';
      chart.data.datasets.forEach(function (ds, di) {
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        meta.data.forEach(function (el, i) {
          var v = ds.data[i];
          if (v == null) return;
          if (o.only === 'last' && i !== ds.data.length - 1) return;
          var txt = o.format(v, di, i);
          if (horiz) { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(txt, el.x + 6, el.y); }
          else if (chart.config.type === 'line') { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(txt, el.x + 10, el.y); }
          else { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(txt, el.x, el.y - 4); }
        });
      });
      ctx.restore();
    }
  };

  // spec: {kind:'hbar'|'bar'|'line', labels, series:[{label,data,approx,colorVar}], unit, max, min, decimals, legend, valueLabels, tickFormat}
  function makeChart(box, spec) {
    var canvas = h('canvas', { role: 'img', 'aria-label': spec.aria || spec.title || 'แผนภูมิ' });
    box.appendChild(canvas);
    var entry = { box: box, canvas: canvas, spec: spec, chart: null, narrow: null };
    charts.push(entry);
    drawChart(entry);
    return entry;
  }
  function drawChart(entry) {
    if (!chartReady()) return;
    var spec = entry.spec;
    if (entry.chart) { entry.chart.destroy(); entry.chart = null; }
    var narrow = isNarrow();
    entry.narrow = narrow;
    var labels = spec.kind === 'hbar' ? spec.labels.map(function (l) { return wrapLabel(l, narrow ? 13 : 26); }) : spec.labels;
    if (spec.kind === 'hbar') entry.box.style.height = sizeFor('hbar', labels, spec.series.length > 1) + 'px';
    else if (!entry.box.style.height) entry.box.style.height = '300px';
    var ink = token('--ink'), ink2 = token('--ink-2'), grid = token('--grid'), axis = token('--axis'), surface = token('--surface');
    var font = { family: 'Sarabun, system-ui, sans-serif', size: 13 };
    var horiz = spec.kind === 'hbar';
    var isLine = spec.kind === 'line';
    var multi = spec.series.length > 1;
    var datasets = spec.series.map(function (s, i) {
      var color = token(s.colorVar || ('--c' + (i + 1)));
      var ds = { label: s.label, data: s.data, approx: s.approx || [] };
      if (isLine) {
        var ap = s.approx || [];
        Object.assign(ds, { borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 5, pointHoverRadius: 7,
          pointBorderColor: s.data.map(function (v, k) { return ap[k] ? color : surface; }),
          pointBorderWidth: 2,
          pointBackgroundColor: s.data.map(function (v, k) { return ap[k] ? surface : color; }),
          tension: 0, borderJoinStyle: 'round', borderCapStyle: 'round' });
      } else {
        Object.assign(ds, { backgroundColor: color, hoverBackgroundColor: color, borderRadius: 4, borderSkipped: 'start',
          maxBarThickness: multi ? 18 : 24, barPercentage: multi ? 0.92 : 0.8, categoryPercentage: multi ? 0.8 : 0.85 });
      }
      return ds;
    });
    var unit = spec.unit ? ' ' + spec.unit : '';
    var d = spec.decimals;
    var valueAxis = {
      beginAtZero: !isLine, min: spec.min, max: spec.max, grace: horiz ? '12%' : '8%',
      grid: { color: grid, lineWidth: 1, drawTicks: false }, border: { color: axis, display: false },
      ticks: { color: ink2, font: font, padding: 6, maxTicksLimit: 6, callback: spec.tickFormat || function (v) { return fmt(v); } }
    };
    var catAxis = { grid: { display: false }, border: { color: axis }, ticks: { color: ink2, font: font, autoSkip: false, padding: 6 } };
    var cfg = {
      type: isLine ? 'line' : 'bar',
      data: { labels: labels, datasets: datasets },
      options: {
        indexAxis: horiz ? 'y' : 'x', responsive: true, maintainAspectRatio: false,
        animation: reduceMotion ? false : { duration: 450 },
        layout: { padding: { right: horiz ? 40 : (isLine ? 56 : 0), top: horiz ? 0 : 18 } },
        interaction: { mode: isLine ? 'index' : 'nearest', intersect: !isLine, axis: horiz ? 'y' : 'x' },
        plugins: {
          legend: { display: multi, position: 'top', align: 'start',
            labels: { color: ink2, font: font, usePointStyle: true, pointStyle: 'rectRounded', boxWidth: 10, boxHeight: 10, padding: 14 } },
          tooltip: {
            backgroundColor: ink, titleColor: surface, bodyColor: surface, titleFont: Object.assign({}, font, { weight: '600' }), bodyFont: font,
            padding: 10, cornerRadius: 8, displayColors: multi, boxPadding: 4,
            callbacks: {
              title: function (items) { var l = items[0].label; return Array.isArray(l) ? l.join(' ') : l; },
              label: function (c) {
                var ap = c.dataset.approx && c.dataset.approx[c.dataIndex];
                return (multi || isLine ? c.dataset.label + ': ' : '') + (ap ? '≈' + fmt(c.raw, Math.max(1, decs(c.raw))) + ' (ค่าประมาณ)' : fmt(c.raw, d)) + unit;
              }
            }
          },
          tipLabels: { enabled: spec.valueLabels !== false && !multi, only: isLine ? 'last' : null, color: ink,
            format: function (v, di, i) { var ap = datasets[di].approx[i]; return ap ? '≈' + fmt(v, Math.max(1, decs(v))) : fmt(v, d); } }
        },

      plugins: [tipLabels]

  }
  function isNarrow() { return window.innerWidth < 560; }
  var resizeTimer;
  window.addEventListener('resize', function () {

    }, 200);
  });
  function redrawCharts() {
    if (!chartReady()) return;
    charts.forEach(function (e) { drawChart(e); });
  }
  function sizeFor(kind, labels, multi) {
    if (kind !== 'hbar') return 300;
    var hgt = labels.reduce(function (s, l) { var lines = Array.isArray(l) ? l.length : 1; return s + Math.max(multi ? 52 : 38, lines * 18 + 16); }, 0);
    return Math.max(140, hgt + (multi ? 70 : 40));
  }

  // ---------- generic blocks ----------
  function tableViewDetails(tableWrap, open) {
    var d = h('details', { class: 'table-view' }, h('summary', null, 'ดูตารางข้อมูล'), tableWrap);
    if (open) d.open = true;
    return d;
  }

  function renderTable(b) {
    var cols = b.columns.map(function (c) { return typeof c === 'string' ? { label: c } : c; });
    var dataRows = b.rows.filter(Array.isArray);
    var numericCol = cols.map(function (c, i) { return i > 0 && dataRows.some(function (r) { return typeof cv(r[i]) === 'number'; }); });
    var totals = cols.map(function (c, i) { return numericCol[i] ? sum(dataRows.map(function (r) { return cv(r[i]); })) : null; });
    var pc = b.percent;
    var pBase = pc ? (pc.of != null ? pc.of : totals[pc.col]) : null;

    var headCells = cols.map(function (c, i) { return h('th', { class: numericCol[i] ? 'num' : null, scope: 'col' }, c.label); });
    if (pc) headCells.push(h('th', { class: 'num', scope: 'col' }, pc.label || 'ร้อยละ'));
    var body = h('tbody');
    b.rows.forEach(function (r) {
      if (!Array.isArray(r)) { body.appendChild(h('tr', { class: 'group' }, h('th', { colspan: cols.length + (pc ? 1 : 0), scope: 'colgroup' }, r.group))); return; }
      var tr = h('tr');
      r.forEach(function (c, i) {
        var col = cols[i] || {};
        if (i === 0) tr.appendChild(h('td', null, fmtCell(c)));
        else tr.appendChild(h('td', { class: (typeof cv(c) === 'number' || cv(c) == null) && numericCol[i] ? 'num' + (isApprox(c) ? ' approx' : '') : null }, fmtCell(c, col.decimals)));
      });
      if (pc) tr.appendChild(h('td', { class: 'num' }, typeof cv(r[pc.col]) === 'number' ? pct(cv(r[pc.col]), pBase) : '–'));
      body.appendChild(tr);
    });
    if (b.total) {
      var tr = h('tr', { class: 'total' });
      cols.forEach(function (c, i) {
        if (i === 0) tr.appendChild(h('th', { scope: 'row' }, b.total));
        else tr.appendChild(h('td', { class: numericCol[i] ? 'num' : null }, numericCol[i] ? fmt(totals[i], c.decimals) : ''));
      });
      if (pc) tr.appendChild(h('td', { class: 'num' }, pc.of == null ? '100.00' : ''));
      body.appendChild(tr);
    }
    var table = h('table', null, h('thead', null, h('tr', null, headCells)), body);
    return { wrap: h('div', { class: 'table-wrap' }, table), cols: cols, dataRows: dataRows, totals: totals, numericCol: numericCol };
  }

  function renderTableBlock(b) {
    var fig = h('div', { class: 'figure' });
    if (b.title) fig.appendChild(h('h4', null, b.title));
    var t = renderTable(b);
    if (b.countRows) {
      var n = t.dataRows.length;
      var lastNum = t.numericCol.lastIndexOf(true);
      var extra = (b.totalLabel && lastNum > 0) ? ' · ' + b.totalLabel + ' ' + fmt(t.totals[lastNum]) + ' ' + ((t.cols[lastNum].label.match(/\((.*)\)/) || [])[1] || '') : '';
      fig.appendChild(h('p', { class: 'muted small', style: 'margin:-4px 0 8px' }, 'รวม ' + n + ' ' + b.countRows + extra));
    }
    if (b.chart) {
      var ch = b.chart;
      var rows = t.dataRows.filter(function (r) { return ch.series.every(function (s) { return typeof cv(r[s]) === 'number'; }); });
      var multi = ch.series.length > 1;
      var labels = rows.map(function (r) { return String(cv(r[0])); });
      var box = h('div', { class: 'chart-box' });

        kind: ch.kind, labels: labels, unit: ch.unit, max: ch.max, min: ch.min,
        title: b.title, aria: b.title + ' (ดูตารางข้อมูลด้านล่าง)',
        series: ch.series.map(function (s) {
          return { label: t.cols[s].label, data: rows.map(function (r) { return cv(r[s]); }), approx: rows.map(function (r) { return isApprox(r[s]); }) };
        })
      };
      if (ch.kind === 'line') spec.series[0].colorVar = '--c1';
      makeChart(box, spec);
      if (b.show === 'both') { t.wrap.style.marginTop = '12px'; fig.appendChild(t.wrap); }
      else fig.appendChild(tableViewDetails(t.wrap, !chartReady()));
    } else {
      fig.appendChild(t.wrap);
    }
    if (b.note) fig.appendChild(h('p', { class: 'note' }, b.note));
    return fig;
  }

  var catVars = ['--c1', '--c2', '--c3', '--c4'];
  function segColor(p, i) { return p.status === 'good' ? '--good' : p.status === 'critical' ? '--critical' : catVars[i % catVars.length]; }
  function segmentBar(parts, unit, d, aria) {
    var total = sum(parts.map(function (p) { return p.value; }));
    var bar = h('div', { class: 'seg-bar', role: 'group', 'aria-label': aria || '' });
    parts.forEach(function (p, i) {
      if (!p.value) return;
      var share = total ? p.value / total * 100 : 0;
      var cvar = p.colorVar || segColor(p, i);
      var seg = h('div', { class: 'seg' + (cvar === '--c4' ? ' dark-text' : ''), style: 'flex:' + p.value + ' 1 0;background:var(' + cvar + ')' },
        h('span', null, nf(share >= 1 ? 0 : 1).format(share) + '%'));
      bindTip(seg, p.label + ': ' + fmt(p.value, d) + ' ' + (unit || '') + ' (' + nf(1).format(share) + '%)');
      bar.appendChild(seg);
    });
    requestAnimationFrame(function () {
      Array.prototype.forEach.call(bar.children, function (seg) {
        var s = seg.firstChild; s.hidden = false;
        if (s.offsetWidth + 14 > seg.clientWidth) s.hidden = true;
      });
    });
    return { bar: bar, total: total };
  }
  function legendFor(parts, unit, d) {
    return h('ul', { class: 'legend' }, parts.map(function (p, i) {
      var cvar = p.colorVar || segColor(p, i);
      return h('li', null, h('span', { class: 'sw', style: 'background:var(' + cvar + ')' }),
        p.status === 'good' ? h('span', { class: 'status-icon', 'aria-hidden': 'true' }, '✓') : null,
        p.status === 'critical' ? h('span', { class: 'status-icon', 'aria-hidden': 'true' }, '✕') : null,
        h('span', null, p.label), p.value != null ? h('b', null, fmt(p.value, d)) : null);
    }));
  }
  function renderSegments(b) {
    var fig = h('div', { class: 'figure' });
    if (b.title) fig.appendChild(h('h4', null, b.title));
    var sb = segmentBar(b.parts, b.unit, b.decimals, b.title);
    fig.appendChild(sb.bar);
    fig.appendChild(legendFor(b.parts, b.unit, b.decimals));
    var t = renderTable({ columns: ['รายการ', { label: 'จำนวน (' + b.unit + ')', decimals: b.decimals }], rows: b.parts.map(function (p) { return [p.label, p.value]; }), total: 'รวม', percent: { col: 1, label: 'ร้อยละ' } });
    fig.appendChild(tableViewDetails(t.wrap));
    if (b.note) fig.appendChild(h('p', { class: 'note' }, b.note));
    return fig;
  }

  function renderCompare(b) {
    var fig = h('div', { class: 'figure' });
    if (b.title) fig.appendChild(h('h4', null, b.title));
    var ny = b.years.length;
    var r1 = h('tr', null, h('th', { rowspan: 2, scope: 'col' }, 'จังหวัด'));
    var r2 = h('tr');
    b.metrics.forEach(function (m) {
      r1.appendChild(h('th', { colspan: ny, scope: 'colgroup', style: 'text-align:center' }, m));
      b.years.forEach(function (y) { r2.appendChild(h('th', { class: 'num', scope: 'col' }, String(y))); });
    });
    var body = h('tbody');
    var tot = b.metrics.map(function () { return b.years.map(function () { return 0; }); });
    function z(v) { return v ? fmt(v) : '–'; }
    b.rows.forEach(function (r) {
      var tr = h('tr', null, h('th', { scope: 'row', style: 'font-weight:500' }, r.name));
      r.values.forEach(function (pair, mi) { pair.forEach(function (v, yi) { tot[mi][yi] += v || 0; tr.appendChild(h('td', { class: 'num' }, z(v))); }); });
      body.appendChild(tr);
    });
    var trT = h('tr', { class: 'total' }, h('th', { scope: 'row' }, 'รวม'));
    var trP = h('tr', { class: 'pct' }, h('th', { scope: 'row' }, 'ร้อยละ'));

    var yTot = T.years.map(function (y, i) { return sum(T.rows.map(function (r) { return r.values[i]; })); });
    var growth = (yTot[yTot.length - 1] / yTot[0] - 1) * 100;
    var trendCard = h('div', { class: 'card' });
    trendCard.appendChild(h('p', null, 'เมื่อพิจารณางบประมาณที่ได้รับจัดสรรในปีงบประมาณ พ.ศ. ' + T.years[0] + '–' + T.years[T.years.length - 1] +
      ' พบว่ามีแนวโน้ม' + (growth >= 0 ? 'เพิ่มขึ้น' : 'ลดลง') + ' ร้อยละ ' + nf(2).format(Math.abs(growth)) + ' ' + (T.note || '')));
    var trendBox = h('div', { class: 'chart-box', style: 'height:320px' });
    trendCard.appendChild(h('div', { class: 'figure' }, h('h4', null, 'งบประมาณที่ได้รับจัดสรร ปีงบประมาณ ' + T.years[0] + '–' + T.years[T.years.length - 1] + ' (บาท)'), trendBox));
    makeChart(trendBox, {
      kind: 'bar', labels: T.rows.map(function (r) { return r.label; }), unit: 'บาท', decimals: 2,
      title: 'งบประมาณที่ได้รับจัดสรร เปรียบเทียบ 3 ปี',
      tickFormat: function (v) { return v === 0 ? '0' : nf(1).format(v / 1e6) + ' ล้าน'; },
      series: T.years.map(function (y, i) { return { label: 'ปี ' + y, data: T.rows.map(function (r) { return r.values[i]; }), colorVar: '--o' + (i + 1) }; })
    });
    var trendTable = h('table', null,
      h('thead', null, h('tr', null, h('th', { scope: 'col' }, 'งบประมาณ'), T.years.map(function (y) { return h('th', { class: 'num', scope: 'col' }, String(y)); }))),
      h('tbody', null, T.rows.map(function (r) { return h('tr', null, h('td', null, r.label), r.values.map(function (v) { return h('td', { class: 'num' }, baht(v)); })); }),
        h('tr', { class: 'total' }, h('th', { scope: 'row' }, 'รวมงบประมาณ'), yTot.map(function (v) { return h('td', { class: 'num' }, baht(v)); }))));
    trendCard.appendChild(h('div', { class: 'table-wrap', style: 'margin-top:12px' }, trendTable));
    bg.appendChild(h('h3', { class: 'sub' }, 'เปรียบเทียบงบประมาณย้อนหลัง 3 ปี'));
    bg.appendChild(trendCard);

    // ----- KPI -----
    var K = data.kpi;
    var kp = section('kpi', 'ส่วนที่ 3', 'ผลการปฏิบัติราชการตามคำรับรองการปฏิบัติราชการ');
    kp.appendChild(h('div', { class: 'card' },
      h('div', { class: 'kpi-head' },
        h('div', { class: 'score-ring' }, h('div', { class: 'k muted small' }, 'คะแนนที่ได้สุทธิ'), h('div', { class: 'big-figure' }, nf(4).format(kpi.net), h('small', null, '/ ' + K.maxScore)), h('div', { class: 'muted' }, 'คิดเป็นร้อยละ ' + nf(2).format(kpi.percent))),
        h('p', { style: 'margin:0' }, K.intro + ' ในปีนี้ได้คะแนนการประเมินเท่ากับ ' + nf(4).format(kpi.net) + ' คะแนน คิดเป็นร้อยละ ' + nf(2).format(kpi.percent))),
      K.photo ? h('figure', { class: 'photo-wide' }, h('img', { src: K.photo, alt: K.photoCaption || '', loading: 'lazy' }), K.photoCaption ? h('figcaption', null, K.photoCaption) : null) : null));
    var kb = h('tbody');
    function kRow(it, lvl, isPart) {
      var w = it.score == null ? null : it.weight * it.score / 100;
      kb.appendChild(h('tr', { class: isPart ? 'part' : null },
        h('td', { class: 'l' + lvl }, it.name),
        h('td', { class: 'num' }, fmt(it.weight)),
        h('td', { class: 'num' }, it.score == null ? '–' : nf(4).format(it.score)),
        h('td', { class: 'num' }, w == null ? '–' : nf(4).format(w))));
      (it.items || []).forEach(function (c) { kRow(c, lvl + 1, false); });
    }
    K.parts.forEach(function (p) { kRow(p, 0, true); });
    kb.appendChild(h('tr', { class: 'total' }, h('th', { scope: 'row' }, 'รวมน้ำหนัก'), h('td', { class: 'num' }, fmt(kpi.weightSum)), h('td'), h('td', { class: 'num' }, nf(4).format(kpi.weighted))));
    kb.appendChild(h('tr', { class: 'total' }, h('th', { scope: 'row' }, 'เทียบน้ำหนัก 100'), h('td', { class: 'num' }, '100'), h('td'), h('td', { class: 'num' }, nf(4).format(kpi.normalized))));
    if (K.bonus) {
      kb.appendChild(h('tr', { class: 'part' }, h('td', { colspan: 4 }, K.bonus.name)));
      K.bonus.items.forEach(function (it) { kRow(it, 1, false); });
    }
    kb.appendChild(h('tr', { class: 'total' }, h('th', { scope: 'row' }, 'รวมคะแนนที่ได้สุทธิ (สูงสุด ' + K.maxScore + ')'), h('td'), h('td'), h('td', { class: 'num' }, nf(4).format(kpi.net))));
    kb.appendChild(h('tr', { class: 'total' }, h('th', { scope: 'row' }, 'คิดเป็นร้อยละ'), h('td'), h('td'), h('td', { class: 'num' }, nf(2).format(kpi.percent))));
    kp.appendChild(h('h3', { class: 'sub' }, 'ตัวชี้วัดและผลคะแนน'));
    kp.appendChild(h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, h('th', { scope: 'col' }, 'ตัวชี้วัด'), h('th', { class: 'num', scope: 'col' }, 'น้ำหนัก'), h('th', { class: 'num', scope: 'col' }, 'คะแนนที่ได้'), h('th', { class: 'num', scope: 'col' }, 'คะแนนถ่วงน้ำหนัก'))),
      kb)));
    kp.appendChild(h('p', { class: 'note' }, 'คะแนนถ่วงน้ำหนัก = น้ำหนัก × คะแนนที่ได้ ÷ 100 · คะแนนสุทธิ = คะแนนเทียบน้ำหนัก 100 + คะแนนเพิ่มเติม (ไม่เกินคะแนนเต็ม)'));

    // ----- operations -----
    var op = section('operations', 'ส่วนที่ 4', 'ผลการดำเนินงานที่สำคัญในรอบปีงบประมาณ พ.ศ. ' + M.fiscalYear);
    var nProjects = 0; data.operations.forEach(function (g) { nProjects += g.projects.length; });
    var searchInput = h('input', { type: 'search', placeholder: 'ค้นหาโครงการ เช่น PM2.5, ขยะ, น้ำประปา…', 'aria-label': 'ค้นหาโครงการ' });
    var countEl = h('span', { class: 'ops-count', 'aria-live': 'polite' }, nProjects + ' โครงการ/กิจกรรม');
    op.appendChild(h('div', { class: 'ops-tools' },
      h('label', { class: 'search' }, h('span', { html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' }), searchInput),
      countEl));
    op.appendChild(h('div', { class: 'card project-index' }, data.operations.map(function (g) {
      return h('div', { class: 'pi-group' }, h('h4', null, g.name),
        h('ol', null, g.projects.map(function (p) { return h('li', null, h('a', { href: '#p-' + p.id }, p.title)); })));
    })));

    var projectEls = [];
    var noHit = h('div', { class: 'card empty-hit', hidden: true }, 'ไม่พบโครงการที่ตรงกับคำค้น');
    data.operations.forEach(function (g) {
      var groupEl = h('div', { class: 'ops-group', id: slug(g.id) });
      groupEl.appendChild(h('div', { class: 'group-head' }, h('h3', null, g.name), h('span', { class: 'count' }, g.projects.length + ' โครงการ/กิจกรรม')));
      g.projects.forEach(function (p) {
        var art = h('article', { class: 'card project', id: 'p-' + p.id });
        var bud = bIdx[p.id];
        art.appendChild(h('header', { class: 'project-head' },
          h('div', { class: 'project-meta' },
            h('span', { class: 'chip brand' }, g.short || g.name),
            (p.tags || []).map(function (t) { return h('span', { class: 'chip' }, t); })),
          h('h3', null, p.title),
          bud ? h('div', { class: 'budget-pill' }, 'งบประมาณ ', h('b', null, baht(bud.allocated) + ' บาท'), ' · ใช้จ่าย ' + baht(bud.spent) + ' บาท (ร้อยละ ' + pct(bud.spent, bud.allocated) + ')') : null));
        if (p.intro) art.appendChild(h('p', { class: 'lead', style: 'font-size:17px' }, p.intro));
        if (p.stats && p.stats.length) art.appendChild(renderStats(p.stats));
        if (p.results && p.results.length) {
          art.appendChild(h('div', { class: 'block-title' }, 'ผลการดำเนินงาน'));
          art.appendChild(h('ol', { class: 'results' }, p.results.map(function (r) {
            if (typeof r === 'string') return h('li', null, r);
            return h('li', null, r.text, r.items ? h('ul', null, r.items.map(function (x) { return h('li', null, x); })) : null);
          })));
        }
        (p.blocks || []).forEach(function (b) { var el = renderBlock(b); if (el) art.appendChild(el); });
        var hasProb = p.problems && p.problems.length, hasSug = p.suggestions && p.suggestions.length;
        if (hasProb || hasSug) {
          art.appendChild(h('div', { class: 'pane-2' },
            hasProb ? h('div', { class: 'pane' }, h('h4', null, 'ปัญหาและอุปสรรค'), h('ol', null, p.problems.map(function (x) { return h('li', null, x); }))) : null,
            hasSug ? h('div', { class: 'pane' }, h('h4', null, 'ข้อเสนอแนะ'), h('ol', null, p.suggestions.map(function (x) { return h('li', null, x); }))) : null));
        }
        var hasRat = p.rationale && p.rationale.length, hasGoal = p.goals && p.goals.length;
        if (hasRat || hasGoal) {
          art.appendChild(h('details', { class: 'bg' }, h('summary', null, hasRat && hasGoal ? 'หลักการและเหตุผล · เป้าหมาย' : hasRat ? 'หลักการและเหตุผล' : 'เป้าหมาย'),
            hasRat ? h('div', null, h('h4', null, 'หลักการและเหตุผล'), paras(p.rationale)) : null,
            hasGoal ? h('div', null, h('h4', null, 'เป้าหมาย'), h('ol', { class: 'results' }, p.goals.map(function (x) { return h('li', null, x); }))) : null));
        }
        if (p.photos && p.photos.length) art.appendChild(gallery(p.photos, p.title));
        groupEl.appendChild(art);
        projectEls.push({ el: art, group: groupEl, text: art.textContent.toLowerCase() });
      });
      op.appendChild(groupEl);
    });
    op.appendChild(noHit);

    var searchTimer;
    searchInput.addEventListener('input', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        var q = searchInput.value.trim().toLowerCase();
        var shown = 0;
        projectEls.forEach(function (p) { var hit = !q || p.text.indexOf(q) !== -1; p.el.hidden = !hit; if (hit) shown++; });
        document.querySelectorAll('.ops-group').forEach(function (g) { g.hidden = !g.querySelector('.project:not([hidden])'); });
        noHit.hidden = shown !== 0;
        countEl.textContent = q ? 'พบ ' + shown + ' จาก ' + nProjects + ' โครงการ/กิจกรรม' : nProjects + ' โครงการ/กิจกรรม';
      }, 120);
    });

    // ----- footer -----
    app.appendChild(h('footer', { class: 'site' }, h('div', { class: 'wrap' },
      h('div', { class: 'row' },
        h('div', null, h('div', null, 'ที่มา: ' + M.source), h('div', null, M.organization + ' · ' + M.address), h('div', { class: 'small' }, 'เผยแพร่ ' + M.published + ' · ปรับปรุงข้อมูลล่าสุด ' + M.lastUpdated)),
        h('div', { class: 'btns' },
          h('a', { class: 'btn', href: DATA_URL, download: 'report-2569.json' }, 'ดาวน์โหลดข้อมูล (JSON)'),
          h('button', { class: 'btn', type: 'button', onclick: function () { window.print(); } }, 'พิมพ์ / บันทึกเป็น PDF'),
          h('a', { class: 'btn', href: '/' }, 'The Siam Times'))))));

    setupScrollSpy(sections);
    if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }

  function setupScrollSpy(sections) {
    if (!('IntersectionObserver' in window)) return;
    var links = {};
    document.querySelectorAll('#toc a').forEach(function (a) { links[a.getAttribute('data-sec')] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          Object.keys(links).forEach(function (k) { links[k].classList.toggle('active', k === e.target.id); });
          var a = links[e.target.id];
          if (a && a.scrollIntoView) { var toc = document.getElementById('toc'); toc.scrollTo({ left: a.offsetLeft - 16, behavior: reduceMotion ? 'auto' : 'smooth' }); }
        }
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    sections.forEach(function (s) { var el = document.getElementById(s.id); if (el) io.observe(el); });
  }

  window.addEventListener('beforeprint', function () {
    document.querySelectorAll('details').forEach(function (d) { d.setAttribute('data-was-open', d.open ? '1' : '0'); d.open = true; });
  });
  window.addEventListener('afterprint', function () {
    document.querySelectorAll('details[data-was-open]').forEach(function (d) { d.open = d.getAttribute('data-was-open') === '1'; });
  });

  function start() {
    fetch(DATA_URL, { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        render(data);
        if (!chartReady()) {
          // Chart.js unavailable (offline/blocked): show the data tables instead.
          document.querySelectorAll('.chart-box').forEach(function (b) { b.hidden = true; });
          document.querySelectorAll('details.table-view').forEach(function (d) { d.open = true; });
        }
      })
      .catch(function (err) {
        var app = document.getElementById('app');
        app.innerHTML = '';
        app.appendChild(h('div', { class: 'error wrap' },
          h('p', null, 'ไม่สามารถโหลดข้อมูลรายงานได้ (' + err.message + ')'),
          h('p', { class: 'small' }, 'หน้านี้อ่านข้อมูลจากไฟล์ ', h('code', null, DATA_URL), ' จึงต้องเปิดผ่านเว็บเซิร์ฟเวอร์ ไม่ใช่เปิดไฟล์โดยตรง (file://)')));
      });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
