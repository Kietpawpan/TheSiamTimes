<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเฝ้าระวังและติดตามสภาพอากาศ สคพ.11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        
        .btn-active {
            background-color: #f59e0b; /* Amber 500 */
            color: #0f172a; /* Slate 900 */
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 2px solid #fbbf24; /* Amber 400 */
        }
        .btn-inactive {
            background-color: #334155; /* Slate 700 */
            color: #cbd5e1; /* Slate 300 */
            border: 2px solid transparent;
        }
        .btn-inactive:hover {
            background-color: #475569; /* Slate 600 */
        }
    </style>
</head>
<body class="flex flex-col bg-slate-900 text-slate-100">
    
    <header class="flex-none bg-slate-950 shadow-lg z-20 py-3 px-4 border-b border-slate-800">
        <h1 class="text-xl md:text-2xl font-bold text-center tracking-wide text-amber-500">
            ระบบเฝ้าระวังและติดตามสภาพอากาศ สคพ.11
        </h1>
    </header>

    <div class="flex-none bg-slate-800 py-3 px-2 border-b border-slate-700 shadow-md z-10">
        <div class="max-w-5xl mx-auto flex flex-wrap justify-center items-center gap-2 md:gap-4">
            <span class="flex items-center text-slate-300 text-sm font-semibold mr-2 mb-2 md:mb-0 w-full md:w-auto justify-center">
                📍 ปักหมุดพื้นที่และดูข้อมูลเชิงลึก:
            </span>
            
            <button onclick="updateLocation(14.97, 102.10, 'btn-korat')" id="btn-korat" 
                class="province-btn btn-active px-4 py-2 rounded-lg text-sm transition-all duration-200 hover:-translate-y-0.5">
                นครราชสีมา
            </button>
            <button onclick="updateLocation(15.80, 102.03, 'btn-chaiyaphum')" id="btn-chaiyaphum" 
                class="province-btn btn-inactive px-4 py-2 rounded-lg text-sm transition-all duration-200 hover:-translate-y-0.5">
                ชัยภูมิ
            </button>
            <button onclick="updateLocation(14.99, 103.10, 'btn-buriram')" id="btn-buriram" 
                class="province-btn btn-inactive px-4 py-2 rounded-lg text-sm transition-all duration-200 hover:-translate-y-0.5">
                บุรีรัมย์
            </button>
            <button onclick="updateLocation(14.88, 103.49, 'btn-surin')" id="btn-surin" 
                class="province-btn btn-inactive px-4 py-2 rounded-lg text-sm transition-all duration-200 hover:-translate-y-0.5">
                สุรินทร์
            </button>
        </div>
    </div>

    <main class="flex-1 flex flex-col md:flex-row w-full h-full overflow-hidden bg-black">
        
        <div class="flex-1 flex flex-col md:border-r border-slate-700 relative">
            <div class="flex-none bg-slate-800/90 text-amber-400 text-xs px-3 py-1.5 font-semibold flex items-center justify-between z-10 absolute top-0 left-0 right-0 backdrop-blur-sm shadow">
                <div class="flex items-center gap-2">
                    <span>🌬️</span>
                    <span>Windy: ข้อมูลล่วงหน้าแบบละเอียด (ECMWF)</span>
                </div>
            </div>
            <!-- Iframe สำหรับ Windy (โหลดค่าเริ่มต้นที่โคราช พร้อมเปิด detail) -->
            <iframe id="windy-iframe"
                src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km/h&metricGust=km/h&zoom=10&overlay=rain&product=ecmwf&level=surface&lat=14.97&lon=102.10&detailLat=14.97&detailLon=102.10&detail=true&marker=true" 
                class="flex-1 w-full h-full border-none pt-7"
                title="Windy Map Embed"
                allowfullscreen>
            </iframe>
        </div>

        <div class="flex-1 flex flex-col relative">
            <div class="flex-none bg-slate-800/90 text-amber-400 text-xs px-3 py-1.5 font-semibold flex items-center gap-2 z-10 absolute top-0 left-0 right-0 backdrop-blur-sm shadow">
                <span>📡</span>
                <span>เรดาร์สถานีพิมาย: ตรวจสอบฝนตกจริง</span>
            </div>
            <!-- Iframe สำหรับเรดาร์กรมอุตุฯ -->
            <iframe 
                src="https://weather.tmd.go.th/pimai.php" 
                class="flex-1 w-full h-full border-none bg-white pt-7"
                title="TMD Phimai Radar"
                allowfullscreen>
            </iframe>
        </div>

    </main>

    <script>
        function updateLocation(lat, lon, btnId) {
            // 1. สร้าง URL ใหม่ พร้อมพารามิเตอร์ทั้งหมดเพื่อเปิด detail ให้ครบถ้วน
            // กำหนด metric ต่างๆ ให้ครบ และบังคับ detail=true, marker=true
            const baseUrl = "https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km/h&metricGust=km/h&zoom=10&overlay=rain&product=ecmwf&level=surface";
            const newUrl = `${baseUrl}&lat=${lat}&lon=${lon}&detailLat=${lat}&detailLon=${lon}&detail=true&marker=true`;
            
            // 2. อัปเดต iframe
            document.getElementById('windy-iframe').src = newUrl;

            // 3. จัดการสถานะสีของปุ่ม (ลบ active ออกจากทุกปุ่ม)
            const buttons = document.querySelectorAll('.province-btn');
            buttons.forEach(btn => {
                btn.classList.remove('btn-active');
                btn.classList.add('btn-inactive');
            });

            // 4. เพิ่มสถานะ active ให้ปุ่มที่เลือก
            const activeBtn = document.getElementById(btnId);
            activeBtn.classList.remove('btn-inactive');
            activeBtn.classList.add('btn-active');
        }
    </script>
</body>
</html>
