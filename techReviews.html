<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Siam Times - Social Listening</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Chomsky';
            src: url('Chomsky.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
    </style>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
                        serif: ['Newsreader', 'serif'],
                        title: ['Newsreader', 'serif'],
                        masthead: ['Chomsky', 'UnifrakturMaguntia', 'cursive'],
                    },
                    colors: {
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                        },
                        emerald: {
                            400: '#34d399',
                            500: '#10b981',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a; 
            color: #e2e8f0; 
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-7xl mx-auto">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row items-center justify-between border-b border-slate-700 pb-6 mb-8 gap-4">
            <div class="flex items-center gap-4">
                <img src="IMG_6412.jpeg" alt="The Siam Times Logo" class="w-12 h-12 object-cover rounded shadow-md border border-slate-600">
                <div class="flex flex-col">
                    <span class="text-emerald-400 font-bold tracking-widest text-xs uppercase mb-1">Pulse Dashboard</span>
                    <h1 class="font-masthead text-5xl tracking-wide text-white leading-none mt-1">The Siam Times</h1>
                </div>
            </div>
            <div class="text-right glass-panel px-4 py-2 rounded-lg">
                <div class="text-xs text-slate-400 uppercase tracking-wider">Live Updates</div>
                <div class="text-sm font-medium text-emerald-400 flex items-center justify-end gap-2 mt-1">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    Auto-sync Active
                </div>
            </div>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="glass-panel p-5 rounded-xl">
                <h3 class="text-slate-400 text-xs uppercase tracking-wider mb-2">Total Mentions (7 Days)</h3>
                <p class="text-3xl font-bold text-white" id="total-mentions">...</p>
            </div>
            <div class="glass-panel p-5 rounded-xl">
                <h3 class="text-slate-400 text-xs uppercase tracking-wider mb-2">Sentiment Shift</h3>
                <p class="text-3xl font-bold text-emerald-400">+12%</p>
            </div>
            <div class="glass-panel p-5 rounded-xl">
                <h3 class="text-slate-400 text-xs uppercase tracking-wider mb-2">Top Publisher</h3>
                <p class="text-xl font-bold text-white truncate" id="top-publisher">...</p>
            </div>
            <div class="glass-panel p-5 rounded-xl">
                <h3 class="text-slate-400 text-xs uppercase tracking-wider mb-2">Topic Velocity</h3>
                <p class="text-3xl font-bold text-emerald-400">High</p>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="glass-panel p-6 rounded-xl lg:col-span-2">
                <h3 class="text-sm text-slate-300 font-bold mb-4 uppercase tracking-wider">Mention Volume Trend</h3>
                <div class="h-64 w-full relative">
                    <canvas id="volumeChart"></canvas>
                </div>
            </div>
            <div class="glass-panel p-6 rounded-xl">
                <h3 class="text-sm text-slate-300 font-bold mb-4 uppercase tracking-wider">Sentiment Analysis</h3>
                <div class="h-64 w-full relative">
                    <canvas id="sentimentChart"></canvas>
                </div>
            </div>
        </div>

        <!-- News Feed Section -->
        <div class="glass-panel rounded-xl p-6">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <h3 class="text-2xl text-white font-title font-bold">Recent Green Tech Intelligence</h3>
                <span class="text-xs text-slate-400">Powered by Google News</span>
            </div>
            
            <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading State -->
                <div class="col-span-full text-center py-10">
                    <div class="inline-block animate-spin w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-
