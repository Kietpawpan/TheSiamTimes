<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        body { font-family: 'Inter', 'Sarabun', sans-serif; }
        /* ทำให้ QR Code ปรับขนาดย่อลงพอดีกับหน้าจอ แต่ดาวน์โหลดด้วยความละเอียดสูง */
        #qrContainer canvas, #qrContainer svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border-t-4 border-green-600">
        <div class="flex items-center justify-center mb-6">
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Emblem_of_the_Pollution_Control_Department.svg/250px-Emblem_of_the_Pollution_Control_Department.svg.png" alt="Pollution Control Department Logo" class="h-16 w-16 mr-3">
            <h1 class="text-xl font-semibold text-green-800">QR Code Generator<br><span class="text-sm text-green-600"> Environmental and Pollution Control Office 11</span></h1>
        </div>

        <div class="space-y-4">
            <div>
                <label for="urlInput" class="block text-sm font-medium text-gray-700 mb-1">Enter URL or text</label>
                <input type="text" id="urlInput" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" placeholder="https://www.pcd.go.th" value="">
            </div>

            <div>
                <label for="descInput" class="block text-sm font-medium text-gray-700 mb-1">Description (Optional)</label>
                <input type="text" id="descInput" maxlength="40" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" placeholder="e.g. PCD Official Website">
            </div>

            <!-- ส่วนสำหรับเลือกโลโก้ -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Center Logo</label>
                <div class="grid grid-cols-3 gap-3">
                    <!-- PCD -->
                    <label class="cursor-pointer flex flex-col items-center gap-2 border border-gray-200 rounded-md p-2 hover:bg-gray-50 has-[:checked]:border-green-600 has-[:checked]:ring-1 has-[:checked]:ring-green-600 transition-all">
                        <input type="radio" name="logoOption" value="pcd" class="sr-only" checked>
                        <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Emblem_of_the_Pollution_Control_Department.svg/250px-Emblem_of_the_Pollution_Control_Department.svg.png" class="h-8 w-8 object-contain">
                        <span class="text-xs font-medium text-gray-700">PCD</span>
                    </label>
                    <!-- MNRE -->
                    <label class="cursor-pointer flex flex-col items-center gap-2 border border-gray-200 rounded-md p-2 hover:bg-gray-50 has-[:checked]:border-green-600 has-[:checked]:ring-1 has-[:checked]:ring-green-600 transition-all">
                        <input type="radio" name="logoOption" value="mnre" class="sr-only">
                        <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/ตรากระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม.svg/250px-ตรากระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม.svg.png" class="h-8 w-8 object-contain">
                        <span class="text-xs font-medium text-gray-700">MNRE</span>
                    </label>
                    <!-- ZPOT -->
                    <label class="cursor-pointer flex flex-col items-center gap-2 border border-gray-200 rounded-md p-2 hover:bg-gray-50 has-[:checked]:border-green-600 has-[:checked]:ring-1 has-[:checked]:ring-green-600 transition-all">
                        <input type="radio" name="logoOption" value="zpot" class="sr-only">
                        <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/Logo_of_the_Zoological_Park_Organization_of_Thailand.svg/250px-Logo_of_the_Zoological_Park_Organization_of_Thailand.svg.png" class="h-8 w-8 object-contain">
                        <span class="text-xs font-medium text-gray-700">ZPOT</span>
                    </label>
                </div>
            </div>

            <!-- ส่วนสำหรับเลือกสี QR Code แบบสี่เหลี่ยมสีทึบ -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">QR Code Color</label>
                <div class="grid grid-cols-2 gap-3">
                    <!-- Green -->
                    <label class="cursor-pointer flex items-center gap-3 border border-gray-200 rounded-md p-2.5 hover:bg-gray-50 has-[:checked]:border-green-600 has-[:checked]:ring-1 has-[:checked]:ring-green-600 transition-all">
                        <input type="radio" name="colorOption" value="green" class="sr-only" checked>
                        <div class="w-5 h-5 rounded-sm bg-[#166534] shadow-sm border border-gray-300"></div>
                        <span class="text-sm font-medium text-gray-700">Green</span>
                    </label>
                    <!-- Black -->
                    <label class="cursor-pointer flex items-center gap-3 border border-gray-200 rounded-md p-2.5 hover:bg-gray-50 has-[:checked]:border-black has-[:checked]:ring-1 has-[:checked]:ring-black transition-all">
                        <input type="radio" name="colorOption" value="black" class="sr-only">
                        <div class="w-5 h-5 rounded-sm bg-black shadow-sm border border-gray-300"></div>
                        <span class="text-sm font-medium text-gray-700">Black</span>
                    </label>
                    <!-- Blue -->
                    <label class="cursor-pointer flex items-center gap-3 border border-gray-200 rounded-md p-2.5 hover:bg-gray-50 has-[:checked]:border-blue-800 has-[:checked]:ring-1 has-[:checked]:ring-blue-800 transition-all">
                        <input type="radio" name="colorOption" value="blue" class="sr-only">
                        <div class="w-5 h-5 rounded-sm bg-[#1e3a8a] shadow-sm border border-gray-300"></div>
                        <span class="text-sm font-medium text-gray-700">Blue</span>
                    </label>
                    <!-- Red -->
                    <label class="cursor-pointer flex items-center gap-3 border border-gray-200 rounded-md p-2.5 hover:bg-gray-50 has-[:checked]:border-red-800 has-[:checked]:ring-1 has-[:checked]:ring-red-800 transition-all">
                        <input type="radio" name="colorOption" value="red" class="sr-only">
                        <div class="w-5 h-5 rounded-sm bg-[#7f1d1d] shadow-sm border border-gray-300"></div>
                        <span class="text-sm font-medium text-gray-700">Red</span>
                    </label>
                </div>
            </div>

            <button id="generateBtn" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-300 font-medium">
                Generate QR Code
            </button>

            <!-- พื้นที่แสดงผล QR Code และคำอธิบาย -->
            <div id="previewContainer" class="flex flex-col items-center mt-6 p-4 bg-gray-50 rounded-lg min-h-[250px] justify-center hidden">
                <div id="qrContainer" class="w-full max-w-[220px] flex justify-center"></div>
                <p id="qrDescriptionText" class="mt-3 text-gray-800 font-medium text-center hidden"></p>
            </div>

            <button id="downloadBtn" class="w-full bg-gray-800 text-white py-2 px-4 rounded-md hover:bg-gray-900 transition duration-300 hidden font-medium">
                Download Image (PNG)
            </button>
        </div>
    </div>

    <script>
        const qrCode = new QRCodeStyling({
            width: 400,
            height: 400,
            data: "https://www.pcd.go.th",
            image: "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Emblem_of_the_Pollution_Control_Department.svg/250px-Emblem_of_the_Pollution_Control_Department.svg.png",
            dotsOptions: {
                color: "#166534", 
                type: "rounded"
            },
            backgroundOptions: {
                color: "#ffffff",
            },
            imageOptions: {
                crossOrigin: "anonymous",
                margin: 10,
                imageSize: 0.4
            },
            cornersSquareOptions: {
                color: "#15803d",
                type: "extra-rounded"
            }
        });

        const urlInput = document.getElementById('urlInput');
        const descInput = document.getElementById('descInput');
        const colorRadios = document.querySelectorAll('input[name="colorOption"]');
        const logoRadios = document.querySelectorAll('input[name="logoOption"]');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const previewContainer = document.getElementById('previewContainer');
        const qrContainer = document.getElementById('qrContainer');
        const qrDescriptionText = document.getElementById('qrDescriptionText');

        // กำหนดค่าสีสำหรับแต่ละตัวเลือก
        const colorMap = {
            green: { dots: "#166534", corners: "#15803d" },
            black: { dots: "#000000", corners: "#000000" },
            blue:  { dots: "#1e3a8a", corners: "#1d4ed8" },
            red:   { dots: "#7f1d1d", corners: "#b91c1c" }
        };

        // กำหนด URL ของโลโก้สำหรับแต่ละตัวเลือก
        const logoMap = {
            pcd: "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Emblem_of_the_Pollution_Control_Department.svg/250px-Emblem_of_the_Pollution_Control_Department.svg.png",
            mnre: "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/ตรากระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม.svg/250px-ตรากระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม.svg.png",
            zpot: "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/Logo_of_the_Zoological_Park_Organization_of_Thailand.svg/250px-Logo_of_the_Zoological_Park_Organization_of_Thailand.svg.png"
        };

        function updateQR() {
            const data = urlInput.value.trim();
            const descText = descInput.value.trim();
            
            // ดึงค่าสีจาก Radio button ที่ถูกเลือก
            const selectedColorValue = document.querySelector('input[name="colorOption"]:checked').value;
            const selectedColor = colorMap[selectedColorValue];

            // ดึงค่าโลโก้จาก Radio button ที่ถูกเลือก
            const selectedLogoValue = document.querySelector('input[name="logoOption"]:checked').value;
            const selectedLogo = logoMap[selectedLogoValue];

            if (data) {
                // อัปเดตข้อมูล สี และโลโก้
                qrCode.update({ 
                    data: data,
                    image: selectedLogo,
                    dotsOptions: {
                        color: selectedColor.dots,
                        type: "rounded"
                    },
                    cornersSquareOptions: {
                        color: selectedColor.corners,
                        type: "extra-rounded"
                    }
                });
                
                qrContainer.innerHTML = '';
                qrCode.append(qrContainer);
                
                if (descText) {
                    qrDescriptionText.textContent = descText;
                    qrDescriptionText.classList.remove('hidden');
                } else {
                    qrDescriptionText.textContent = '';
                    qrDescriptionText.classList.add('hidden');
                }

                previewContainer.classList.remove('hidden');
                downloadBtn.classList.remove('hidden');
            }
        }

        // สร้าง QR Code อัตโนมัติเมื่อเปิดหน้าเว็บ
        updateQR();

        // เหตุการณ์เมื่อกดปุ่มหรือ Enter
        generateBtn.addEventListener('click', updateQR);
        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') updateQR();
        });
        descInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') updateQR();
        });
        
        // อัปเดตทันทีที่คลิกเลือกสีหรือโลโก้
        colorRadios.forEach(radio => {
            radio.addEventListener('change', updateQR);
        });
        logoRadios.forEach(radio => {
            radio.addEventListener('change', updateQR);
        });

        // ฟังก์ชันดาวน์โหลดรูปภาพแบบรวมคำอธิบาย
        downloadBtn.addEventListener('click', async () => {
            const text = descInput.value.trim();
            const originalBtnText = downloadBtn.textContent;
            downloadBtn.textContent = 'Generating...';
            downloadBtn.disabled = true;

            try {
                const blob = await qrCode.getRawData("png");
                const blobUrl = URL.createObjectURL(blob);
                const img = new Image();
                img.crossOrigin = "anonymous";
                
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");
                    
                    const padding = 30;
                    const fontSize = 24;
                    const textSpacing = 15;
                    const textHeight = text ? (fontSize + textSpacing) : 0;
                    
                    // ตั้งค่าขนาดกรอบภาพรวมทั้งหมด
                    canvas.width = img.width + (padding * 2);
                    canvas.height = img.height + (padding * 2) + textHeight;
                    
                    // เติมพื้นหลังสีขาว
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // วาด QR Code
                    ctx.drawImage(img, padding, padding);
                    
                    // วาดข้อความคำอธิบาย
                    if (text) {
                        ctx.fillStyle = "#1f2937";
                        ctx.font = `500 ${fontSize}px Inter, Sarabun, sans-serif`;
                        ctx.textAlign = "center";
                        ctx.textBaseline = "top";
                        ctx.fillText(text, canvas.width / 2, padding + img.height + textSpacing);
                    }
                    
                    // สั่งดาวน์โหลด
                    const link = document.createElement("a");
                    link.download = "pcd-qrcode.png";
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                    
                    URL.revokeObjectURL(blobUrl);
                    downloadBtn.textContent = originalBtnText;
                    downloadBtn.disabled = false;
                };
                img.src = blobUrl;
            } catch (error) {
                console.error("Download Error:", error);
                qrCode.download({ name: "pcd-qrcode", extension: "png" });
                downloadBtn.textContent = originalBtnText;
                downloadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
