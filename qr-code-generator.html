<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - PCD</title>
    <!-- Tailwind CSS สำหรับการตกแต่ง -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ฟอนต์สารบรรณ -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- ไลบรารีสำหรับสร้าง QR Code พร้อมโลโก้ -->

    <script src="js/qr-code-styling.js"></script>

<!--
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
-->
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border-t-4 border-green-600">
        <div class="flex items-center justify-center mb-6">
            <!-- ดึงรูปโลโก้มาจาก Wikimedia -->
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Emblem_of_the_Pollution_Control_Department.svg/250px-Emblem_of_the_Pollution_Control_Department.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" alt="โลโก้กรมควบคุมมลพิษ" class="h-16 w-16 mr-3">
            <h1 class="text-xl font-semibold text-green-800">QR Code Generator<br><span class="text-sm text-green-600">Envrionmental and Pollution Control Office 11</span></h1>
        </div>

        <div class="space-y-4">
            <div>
                <label for="urlInput" class="block text-sm font-medium text-gray-700 mb-1">Target URL</label>
                <input type="text" id="urlInput" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" placeholder="https://www.pcd.go.th" value="">
            </div>

            <button id="generateBtn" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-300">
                Create QR Code
            </button>

            <!-- พื้นที่แสดง QR Code -->
            <div id="qrContainer" class="flex justify-center mt-6 p-4 bg-gray-50 rounded-lg min-h-[250px] items-center"></div>

            <button id="downloadBtn" class="w-full bg-gray-800 text-white py-2 px-4 rounded-md hover:bg-gray-900 transition duration-300 hidden">
                ดาวน์โหลดภาพ (PNG)
            </button>
        </div>
    </div>

    <script>
        const qrCode = new QRCodeStyling({
            width: 250,
            height: 250,
            data: "https://www.pcd.go.th",
            image: "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Emblem_of_the_Pollution_Control_Department.svg/250px-Emblem_of_the_Pollution_Control_Department.svg.png",
            dotsOptions: {
                color: "#166534", 
                type: "rounded"
            },
            backgroundOptions: {
                color: "#ffffff",
            },
            imageOptions: {
                crossOrigin: "anonymous",
                margin: 5,
                imageSize: 0.4
            },
            cornersSquareOptions: {
                color: "#15803d",
                type: "extra-rounded"
            }
        });

        const urlInput = document.getElementById('urlInput');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const qrContainer = document.getElementById('qrContainer');

        function updateQR() {
            const data = urlInput.value.trim();
            if (data) {
                qrCode.update({ data: data });
                qrContainer.innerHTML = '';
                qrCode.append(qrContainer);
                downloadBtn.classList.remove('hidden');
            }
        }

        // สร้าง QR Code ครั้งแรกเมื่อเปิดโปรแกรม
        updateQR();

        generateBtn.addEventListener('click', updateQR);
        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                updateQR();
            }
        });

        downloadBtn.addEventListener('click', () => {
            qrCode.download({ name: "pcd-qrcode", extension: "png" });
        });
    </script>
</body>
</html>
