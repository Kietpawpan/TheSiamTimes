<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Germany & Prague 2026 Itinerary</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        premium: {
                            dark: '#2C3034',
                            gold: '#C6A87C',
                            light: '#F8F9FA',
                            gray: '#8C929D'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #F8F9FA;
            color: #2C3034;
        }
        
        /* Custom Scrollbar for Modal */
        .modal-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .modal-scroll::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .modal-scroll::-webkit-scrollbar-thumb {
            background: #C6A87C; 
            border-radius: 10px;
        }
        .modal-scroll::-webkit-scrollbar-thumb:hover {
            background: #b5986c; 
        }

        /* Card Hover Effects */
        .itinerary-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .itinerary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: #C6A87C;
        }
        .itinerary-card:hover .card-icon {
            color: #C6A87C;
            transform: scale(1.1);
        }
        
        /* Modal Transitions */
        #modal-backdrop {
            transition: opacity 0.3s ease-in-out;
        }
        #modal-panel {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Timeline line styling */
        .timeline-container::before {
            content: '';
            position: absolute;
            top: 10px;
            bottom: 20px;
            left: 23px; /* Center of the dot */
            width: 2px;
            background-color: #e5e7eb;
            z-index: 0;
        }
    </style>
</head>
<body class="antialiased font-sans min-h-screen flex flex-col">

    <!-- Hero Section -->
    <header class="bg-premium-dark text-white py-16 md:py-24 px-6 text-center relative overflow-hidden shadow-lg">
        <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>
        <div class="relative z-10 max-w-4xl mx-auto">
            <span class="text-premium-gold font-medium tracking-[0.2em] text-sm md:text-base uppercase block mb-4">Travel Itinerary</span>
            <h1 class="text-4xl md:text-6xl font-serif mb-6 leading-tight">Germany & Prague 2026</h1>
            <div class="w-16 h-1 bg-premium-gold mx-auto mb-6"></div>
            <p class="text-lg md:text-xl font-light text-gray-300">สัมผัสประสบการณ์แห่งยุโรปที่ถูกคัดสรรมาอย่างพิถีพิถัน</p>
        </div>
    </header>

    <!-- Main Content (Cards Grid) -->
    <main class="flex-grow container mx-auto px-6 py-12 md:py-16 max-w-6xl">
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
            <!-- Cards will be generated by JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
        <p>Premium Travel Itinerary &copy; 2026</p>
    </footer>

    <!-- Modal Overlay -->
    <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <!-- Backdrop -->
        <div id="modal-backdrop" class="fixed inset-0 bg-premium-dark/70 opacity-0 backdrop-blur-sm" onclick="closeModal()"></div>
        
        <!-- Modal Panel -->
        <div id="modal-panel" class="relative z-10 bg-white w-full max-w-lg mx-4 md:mx-auto rounded-2xl shadow-2xl opacity-0 scale-95 flex flex-col max-h-[85vh] overflow-hidden">
            
            <!-- Modal Header -->
            <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-20">
                <div>
                    <span id="modal-date" class="text-premium-gold text-sm font-medium tracking-wide"></span>
                    <h2 id="modal-title" class="text-2xl font-semibold text-premium-dark mt-1"></h2>
                </div>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-premium-dark transition-colors focus:outline-none">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- Modal Body (Timeline) -->
            <div id="modal-content" class="p-6 overflow-y-auto modal-scroll relative bg-premium-light">
                <!-- Timeline will be injected here -->
            </div>
            
            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-gray-100 bg-white text-center rounded-b-2xl">
                <button onclick="closeModal()" class="px-6 py-2 bg-premium-dark text-white rounded-lg hover:bg-black transition-colors text-sm font-medium shadow-md">
                    ปิดหน้าต่าง
                </button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->

            },
            {

                ]

            {

                    { time: "14:45", activity: "ถึงสนามบินปราก" },

                ]
            },
            {
                day: 9,
                date: "31 ต.ค.",
                location: "แฟรงก์เฟิร์ต",
                icon: "fa-bag-shopping",
                schedule: [
                    { time: "09:00", activity: "ไปใจกลางเมือง" },
                    { time: "10:00", activity: "ถนน Zeil" },
                    { time: "11:30", activity: "ช้อปปิ้ง MyZeil" },
                    { time: "13:00", activity: "ทานข้าว" },
                    { time: "ช่วงบ่าย", activity: "ถนน Goethestraße" },
                    { time: "20:40", activity: "เที่ยวบิน TG 923 กลับ" }
                ]
            }
        ];

        // Function to render cards
        function renderCards() {
            const container = document.getElementById('cards-container');
            
            // Using array map and joining with empty string to avoid commas in HTML output
            const cardsHTML = itineraryData.map((data, index) => {
                return `
                    <div class="itinerary-card bg-white rounded-2xl p-6 border border-gray-100 shadow-sm cursor-pointer relative overflow-hidden group" onclick="openModal(${index})">
                        <div class="absolute top-0 left-0 w-1 h-full bg-premium-gold opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-xs font-semibold tracking-wider text-premium-gray uppercase mb-1 block">Day ${data.day} &bull; ${data.date}</span>
                                <h3 class="text-xl font-medium text-premium-dark">${data.location}</h3>
                            </div>
                            <div class="w-12 h-12 rounded-full bg-gray-50 flex items-center justify-center">
                                <i class="fa-solid ${data.icon} text-xl text-premium-dark card-icon transition-colors transition-transform"></i>
                            </div>
                        </div>
                        
                        <div class="flex items-center text-sm text-premium-gold font-medium mt-6 group-hover:translate-x-2 transition-transform">
                            <span>ดูตารางเวลา</span>
                            <i class="fa-solid fa-arrow-right-long ml-2"></i>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = cardsHTML;
        }

        // Function to open modal and populate data
        function openModal(index) {
            const data = itineraryData[index];
            const modalContainer = document.getElementById('modal-container');
            const backdrop = document.getElementById('modal-backdrop');
            const panel = document.getElementById('modal-panel');
            
            // Populate Header
            document.getElementById('modal-date').textContent = `Day ${data.day} | ${data.date}`;
            document.getElementById('modal-title').textContent = data.location;
            
            // Generate Timeline
            // Avoid commas by using .join('')
            const timelineHTML = `
                <div class="timeline-container relative pl-2">
                    ${data.schedule.map((item, idx) => `
                        <div class="relative pl-12 pb-6 group">
                            <!-- Dot -->
                            <div class="absolute left-[16px] top-1 w-4 h-4 rounded-full bg-white border-4 border-premium-gold z-10 shadow-sm group-hover:scale-125 transition-transform"></div>
                            
                            <!-- Content -->
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                                <span class="text-premium-gold font-semibold text-sm block mb-1">
                                    <i class="fa-regular fa-clock mr-1"></i> ${item.time}
                                </span>
                                <p class="text-premium-dark text-base">${item.activity}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('modal-content').innerHTML = timelineHTML;
            
            // Show modal with animation
            modalContainer.classList.remove('hidden');
            // Small delay to allow display block to apply before animating opacity
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                backdrop.classList.add('opacity-100');
                panel.classList.remove('opacity-0', 'scale-95');
                panel.classList.add('opacity-100', 'scale-100');
            }, 10);
            
            // Prevent body scroll
            document.body.style.overflow = 'hidden';
        }

        // Function to close modal
        function closeModal() {
            const modalContainer = document.getElementById('modal-container');
            const backdrop = document.getElementById('modal-backdrop');
            const panel = document.getElementById('modal-panel');
            
            // Animate out
            backdrop.classList.remove('opacity-100');
            backdrop.classList.add('opacity-0');
            panel.classList.remove('opacity-100', 'scale-100');
            panel.classList.add('opacity-0', 'scale-95');
            
            // Hide after animation finishes
            setTimeout(() => {
                modalContainer.classList.add('hidden');
                document.body.style.overflow = ''; // Restore body scroll
            }, 300);
        }

        // Initialize on load
        window.onload = () => {
            renderCards();
            
            // Add escape key listener to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !document.getElementById('modal-container').classList.contains('hidden')) {
                    closeModal();
                }
            });
        };
    </script>
</body>
</html>
