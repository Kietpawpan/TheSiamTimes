        /* Loader Styles */

<body>

    <!-- Loading Overlay -->
    <div class="loader-overlay" id="global-loader">
        <div class="spinner"></div>
        <div class="loader-text" id="loader-text">กำลังประมวลผล...</div>
    </div>

    <h2>Professional Proofreader</h2>

    <div class="ai-controls">
        <div class="control-group">
            <label for="ai-style">AI Rewrite Style:</label>
            <select id="ai-style">
                <option value="the New York Times">New York Times</option>
                <option value="Strunk and White (The Elements of Style)">Strunk and White</option>
                <option value="Academic English">Academic English</option>
                <option value="the King James Bible">King James' Bible</option>
            </select>
        </div>
        <div class="control-group">
            <label for="image-upload">แทรกรูปภาพ:</label>
            <input type="file" id="image-upload" accept="image/*">
        </div>
        <div class="control-group">
            <label for="img-border">เส้นขอบรูปภาพ:</label>
            <select id="img-border">
                <option value="0">0px (ไม่มีเส้นขอบ)</option>
                <option value="1px solid #212529" selected>1px</option>
                <option value="2px solid #212529">2px</option>
                <option value="3px solid #212529">3px</option>
            </select>
        </div>
        <div class="control-group">
            <label for="img-filter">สไตล์รูปภาพ:</label>
            <select id="img-filter">
                <option value="newspaper" selected>ฟิลเตอร์หนังสือพิมพ์เก่า</option>
                <option value="original">ภาพสีต้นฉบับ</option>
            </select>
        </div>
        <button class="btn-ai" onclick="rewriteText()">✨ Generate Final Draft</button>
    </div>

    <div class="container">
        <!-- ช่อง Draft พร้อมปุ่มล้างข้อมูล -->
        <div class="box">
            <div class="box-header">
                <label for="draft">Draft</label>


<!-- สำหรับช่อง Draft -->
<button type="button" class="btn-clear" onclick="clearDraftText()">🗑️ ล้างข้อมูล</button>

            </div>
            <textarea id="draft" placeholder="Paste draft text here..."></textarea>
        </div>

        <!-- ช่อง Final พร้อมปุ่มล้างข้อมูลและปุ่มคัดลอก -->
        <div class="box">
            <div class="box-header">
                <label for="final">Final</label>
                <div class="btn-action-group">
           
<!-- สำหรับช่อง Final -->
<button type="button" class="btn-clear" onclick="clearFinalText()">🗑️ ล้างข้อมูล</button>

                    <button class="btn-copy" id="copyBtn" onclick="copyFinalText()">📋 Copy</button>

    <div class="btn-group">
        <button class="btn-proofread" onclick="compareTexts()">Show Proofread Marks</button>

    <div class="result-container" id="result-proofread">

    <div class="newspaper-container lang-en" id="result-newspaper">

            <div class="nyt-slogan-box">
                "All the News<br>That's Nice to Print"
            </div>
            <div class="nyt-header">The Siam Times</div>
        </div>
        <div class="nyt-date-line"></div>
        
        <div class="nyt-title" id="nyt-title-display">LATEST UPDATES</div>

        <div class="nyt-content" id="nyt-body">
            <em>Newspaper content will be displayed here...</em>

    <script>
let uploadedImageSrc = '';

// ควบคุมการแสดงหน้าโหลด
function showLoader(text) {
    const loaderText = document.getElementById('loader-text');
    if(text) loaderText.innerText = text;
    document.getElementById('global-loader').style.display = 'flex';
}

function hideLoader() {
    document.getElementById('global-loader').style.display = 'none';
}


function clearDraftText() {
    const draftBox = document.getElementById('draft');
    if (!draftBox.value.trim()) {
        alert('ช่อง Draft ว่างอยู่แล้วครับ');
        return;
    }
    if (confirm('ต้องการล้างข้อมูลในช่อง Draft ใช่หรือไม่?')) {
        draftBox.value = '';
        // เพิ่มคำสั่งซ่อนกล่องผลลัพธ์เมื่อกดล้างข้อมูล
        document.getElementById('result-proofread').style.display = 'none';
        document.getElementById('result-newspaper').style.display = 'none';
    }
}

function clearFinalText() {
    const finalBox = document.getElementById('final');
    if (!finalBox.value.trim()) {
        alert('ช่อง Final ว่างอยู่แล้วครับ');
        return;
    }
    if (confirm('ต้องการล้างข้อมูลในช่อง Final ใช่หรือไม่?')) {
        finalBox.value = '';
        // เพิ่มคำสั่งซ่อนกล่องผลลัพธ์เมื่อกดล้างข้อมูล
        document.getElementById('result-proofread').style.display = 'none';
        document.getElementById('result-newspaper').style.display = 'none';
    }
}

// โหลดไฟล์รูปภาพเมื่อมีการเลือก
document.getElementById('image-upload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            uploadedImageSrc = event.target.result;
        };
        reader.readAsDataURL(file);
    } else {
        uploadedImageSrc = '';
    }
});

async function rewriteText() {
    const draft = document.getElementById('draft').value;
    const finalBox = document.getElementById('final');
    
    if (!draft) {
        alert('กรุณาใส่ข้อความในช่อง Draft ก่อนใช้งาน AI ครับ');
        return;
    }

    const style = document.getElementById('ai-style').value;
    
    finalBox.value = 'กำลังประมวลผลด้วย AI โปรดรอสักครู่...';
    showLoader('กำลังให้ AI เขียนเนื้อหาใหม่ โปรดรอสักครู่...');

    const instructionPrompt = "You MUST format the output strictly as follows without using any labels like 'Title:' or 'Subtitle:'. Paragraph 1 must be the Title. Paragraph 2 must be the Subtitle. Paragraph 3 must be the Image Caption. Paragraph 4 and onwards must be the Main Content. \n\nOriginal Text to rewrite:\n";
    const augmentedDraft = instructionPrompt + draft;

    const scriptUrl = 'https://script.google.com/macros/s/AKfycbySUJvCYbctRhB00m_h5_8w5sA-FBy5gM-sCMeAOavM5g2dTQH6pTAUtc0jlEyTQvKK/exec';

    try {
        const response = await fetch(scriptUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
                draft: augmentedDraft,
                style: style
            })
        });

        const data = await response.json();
        
        if (data.result) {
            finalBox.value = data.result;
        } else {
            finalBox.value = 'เกิดข้อผิดพลาดจาก Backend: ' + (data.error || 'Unknown error');
        }
    } catch (error) {
        finalBox.value = 'เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์';
        console.error(error);
    } finally {
        hideLoader();
    }
}

function compareTexts() {
    const draft = document.getElementById('draft').value;
    const final = document.getElementById('final').value;
    const resultDiv = document.getElementById('result-proofread');
    const newspaperDiv = document.getElementById('result-newspaper');

    if (!draft && !final) {
        alert('Please enter text in both fields');
        return;
    }

    newspaperDiv.style.display = 'none';
    resultDiv.style.display = 'block';

    const diff = Diff.diffWords(draft, final);
    
    resultDiv.innerHTML = '';
    const fragment = document.createDocumentFragment();

    diff.forEach((part) => {
        const span = document.createElement(part.added ? 'ins' : part.removed ? 'del' : 'span');
        const lines = part.value.split('\n');
        
        for (let i = 0; i < lines.length; i++) {
            span.appendChild(document.createTextNode(lines[i]));
            if (i < lines.length - 1) {
                span.appendChild(document.createElement('br'));
            }
        }
        
        fragment.appendChild(span);
    });

    resultDiv.appendChild(fragment);
}

// ฟังก์ชันสร้าง style สำหรับรูปภาพจากตัวเลือก
function getDynamicImageStyle() {
    const borderVal = document.getElementById('img-border').value;
    const filterVal = document.getElementById('img-filter').value;
    
    let css = `border: ${borderVal === '0' ? 'none' : borderVal}; `;
    
    if (filterVal === 'newspaper') {
        css += `filter: grayscale(100%) contrast(140%) sepia(20%); mix-blend-mode: multiply;`;
    } else {
        css += `filter: none; mix-blend-mode: normal;`;
    }
    
    return css;
}

async function generateNewspaper(lang) {
    const final = document.getElementById('final').value;
    const resultDiv = document.getElementById('result-proofread');
    const newspaperDiv = document.getElementById('result-newspaper');
    const contentDiv = document.getElementById('nyt-body');
    const titleDiv = document.getElementById('nyt-title-display');
    const dateLineDiv = document.querySelector('.nyt-date-line');
    const headerDiv = document.querySelector('.nyt-header');
    const footerDiv = document.getElementById('nyt-footer-display');

    if (!final) {
        alert('Please enter text in the Final box');
        return;
    }

    resultDiv.style.display = 'none';
    newspaperDiv.style.display = 'block';

    let processedText = final;
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbySUJvCYbctRhB00m_h5_8w5sA-FBy5gM-sCMeAOavM5g2dTQH6pTAUtc0jlEyTQvKK/exec';
    
    const currentStyle = document.getElementById('ai-style').value;

    const thaiCharCount = (final.match(/[\u0E00-\u0E7F]/g) || []).length;
    const engCharCount = (final.match(/[a-zA-Z]/g) || []).length;

    let needsTranslation = false;

if (lang === 'th') {
        newspaperDiv.classList.add('lang-th');
        newspaperDiv.classList.remove('lang-en');
        headerDiv.innerText = 'เดอะ สยาม ไทมส์';
        footerDiv.innerText = '© 2569 The Siam Times สงวนลิขสิทธิ์ ไม่อนุญาตให้นำรูปแบบการจัดหน้า โลโก้ หรือองค์ประกอบของแบรนด์ไปดัดแปลงหรือใช้ในเชิงพาณิชย์ ภาพประกอบและข้อมูลอ้างอิงเป็นลิขสิทธิ์ของแหล่งที่มาตามที่ระบุไว้ในเนื้อหา';

        const isEnglish = engCharCount > thaiCharCount;
        if (isEnglish) {
            needsTranslation = true;
            titleDiv.innerText = 'กำลังแปลภาษา...';
            contentDiv.innerHTML = '<p>กำลังแปลเนื้อหา... โปรดรอสักครู่</p>';
            
            showLoader('กำลังให้ AI แปลเนื้อหาเป็นภาษาไทย โปรดรอสักครู่...');
            
            const translatePrompt = "TRANSLATE THE FOLLOWING TEXT INTO THAI. Ensure the output is entirely in Thai. You MUST format the output strictly as follows without using any labels like 'Title:' or 'Subtitle:'. Paragraph 1 must be the Title. Paragraph 2 must be the Subtitle. Paragraph 3 must be the Image Caption. Paragraph 4 and onwards must be the Main Content.\n\nOriginal Text:\n" + final;
            
            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        draft: translatePrompt,
                        style: 'Thai Newspaper'
                    })
                });
                const data = await response.json();
                if (data.result) processedText = data.result;
            } catch (error) {
                console.error(error);
                contentDiv.innerHTML = '<p>เกิดข้อผิดพลาดในการแปลภาษา ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้</p>';
                hideLoader();
                return;
            }
        }

} else {
        newspaperDiv.classList.add('lang-en');
        newspaperDiv.classList.remove('lang-th');
        headerDiv.innerText = 'The Siam Times';
        footerDiv.innerText = '© 2026 The Siam Times. All rights reserved. Modification or commercial use of the page layout, logos, or brand elements is strictly prohibited without prior permission. Images and referenced information remain the copyright of their respective sources as credited within the content.';
       
        const isThai = thaiCharCount > engCharCount;
        if (isThai) {
            needsTranslation = true;
            titleDiv.innerText = 'Translating...';
            contentDiv.innerHTML = '<p>Translating content... Please wait.</p>';
            
            showLoader('Translating to English via AI. Please wait...');
            
            const translatePrompt = "TRANSLATE THE FOLLOWING TEXT INTO ENGLISH. Ensure the output is entirely in English. Adapt the tone to the style of " + currentStyle + ". You MUST format the output strictly as follows without using any labels like 'Title:' or 'Subtitle:'. Paragraph 1 must be the Title. Paragraph 2 must be the Subtitle. Paragraph 3 must be the Image Caption. Paragraph 4 and onwards must be the Main Content.\n\nOriginal Text:\n" + final;
            
            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        draft: translatePrompt,
                        style: currentStyle
                    })
                });
                const data = await response.json();
                if (data.result) processedText = data.result;
            } catch (error) {
                console.error(error);
                contentDiv.innerHTML = '<p>Error translating text. Could not connect to the server.</p>';
                hideLoader();
                return;
            }
        }
    }

    if(needsTranslation) hideLoader();

    const paragraphs = processedText.split(/\n+/).filter(p => p.trim() !== '');
    
    if (paragraphs.length >= 1) {
        titleDiv.innerText = paragraphs[0];
    }

    let newContentHTML = '';
    const noContentMsg = lang === 'th' ? 'ไม่มีเนื้อหาเพิ่มเติม' : 'No additional content provided.';
    
    const imgStyleCss = getDynamicImageStyle();

    if (paragraphs.length >= 2) {
        newContentHTML += `<div class="nyt-inline-subheading">${paragraphs[1]}</div>`;
        
        let imageCaption = '';
        let bodyPars = [];

if (uploadedImageSrc) {
            if (paragraphs.length >= 3) {
                let rawCaption = paragraphs[2];
                
                // ค้นหาจุดจบประโยคแรก (. ! ?) ที่ตามด้วยช่องว่าง
                const match = rawCaption.match(/^([^.!?]+[.!?]+)\s+(.*)$/);
                if (match) {
                    imageCaption = `${match[1]} ${match[2]}`;
                } else {
                    imageCaption = rawCaption;
                }
                
                bodyPars = paragraphs.slice(3); 
            }
            
            newContentHTML += `
            <div class="nyt-image-container">
                <img class="nyt-image" src="${uploadedImageSrc}" alt="Newspaper Image" style="${imgStyleCss}">
                ${imageCaption ? `<div class="nyt-image-caption">${imageCaption}</div>` : ''}
            </div>`;
        } else {
            bodyPars = paragraphs.slice(2);
        }

        if (bodyPars.length > 0) {
            newContentHTML += bodyPars.map(p => `<p>${p}</p>`).join('');
        } else if (!uploadedImageSrc) {
            newContentHTML += `<p>${noContentMsg}</p>`;
        }
    } else {
        if (uploadedImageSrc) {
            newContentHTML += `
            <div class="nyt-image-container">
                <img class="nyt-image" src="${uploadedImageSrc}" alt="Newspaper Image" style="${imgStyleCss}">
            </div>`;
        }
        newContentHTML += `<p>${noContentMsg}</p>`;
    }

    contentDiv.innerHTML = newContentHTML;

    const now = new Date();
    const hour = now.getHours();
    const dateNum = now.getDate();
    const year = now.getFullYear();
    const monthIdx = now.getMonth();
    const dayIdx = now.getDay();

    const enDays = 'SUNDAY MONDAY TUESDAY WEDNESDAY THURSDAY FRIDAY SATURDAY'.split(' ');
    const thDays = 'อาทิตย์ จันทร์ อังคาร พุธ พฤหัสบดี ศุกร์ เสาร์'.split(' ');
    
    const enMonths = 'JANUARY FEBRUARY MARCH APRIL MAY JUNE JULY AUGUST SEPTEMBER OCTOBER NOVEMBER DECEMBER'.split(' ');
    const thMonths = 'มกราคม กุมภาพันธ์ มีนาคม เมษายน พฤษภาคม มิถุนายน กรกฎาคม สิงหาคม กันยายน ตุลาคม พฤศจิกายน ธันวาคม'.split(' ');

    const issueNo = (monthIdx + 1) * 10000 + dateNum * 100 + hour;

    let dateHTML = '';

    if (lang === 'th') {
        const thYear = year + 543;
        const dName = thDays[dayIdx];
        const mName = thMonths[monthIdx];
        
        const span1 = '<span>ปีที่ ' + (year - 2020) + ' ฉบับที่ ' + issueNo + '</span>';
        const span2 = '<span>วัน' + dName + 'ที่ ' + dateNum + ' ' + mName + ' พ.ศ. ' + thYear + '</span>';
        const span3 = '<span>ราคา 15 บาท</span>';
        
        dateHTML = span1 + span2 + span3;
    } else {
        const dName = enDays[dayIdx];
        const mName = enMonths[monthIdx];
        
        let volNum = year - 1851;
        let volRoman = '';
        
        while (volNum >= 1000) { volRoman += 'M'; volNum -= 1000; }
        while (volNum >= 900) { volRoman += 'CM'; volNum -= 900; }
        while (volNum >= 500) { volRoman += 'D'; volNum -= 500; }
        while (volNum >= 400) { volRoman += 'CD'; volNum -= 400; }
        while (volNum >= 100) { volRoman += 'C'; volNum -= 100; }
        while (volNum >= 90) { volRoman += 'XC'; volNum -= 90; }
        while (volNum >= 50) { volRoman += 'L'; volNum -= 50; }
        while (volNum >= 40) { volRoman += 'XL'; volNum -= 40; }
        while (volNum >= 10) { volRoman += 'X'; volNum -= 10; }
        while (volNum >= 9) { volRoman += 'IX'; volNum -= 9; }
        while (volNum >= 5) { volRoman += 'V'; volNum -= 5; }
        while (volNum >= 4) { volRoman += 'IV'; volNum -= 4; }
        while (volNum >= 1) { volRoman += 'I'; volNum -= 1; }

        const span1 = '<span>VOL. ' + volRoman + '... No. ' + issueNo + '</span>';
        const span2 = '<span>BANGKOK, ' + dName + ', ' + mName + ' ' + dateNum + ', ' + year + '</span>';
        const span3 = '<span>$3.00</span>';
        
        dateHTML = span1 + span2 + span3;
    }

    dateLineDiv.innerHTML = dateHTML;
}

// ฟังก์ชันคัดลอกข้อความจากกล่อง Final
function copyFinalText() {
    const finalBox = document.getElementById('final');
    const copyBtn = document.getElementById('copyBtn');
    
    if (!finalBox.value.trim()) {
        alert('ไม่มีข้อความให้คัดลอกครับ');
        return;
    }

    navigator.clipboard.writeText(finalBox.value).then(() => {
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '✅ Copied!';
        copyBtn.style.background = '#0dcaf0';
        
        setTimeout(() => {
            copyBtn.innerHTML = originalText;
            copyBtn.style.background = '#198754';
        }, 2000);
    }).catch(err => {
        console.error('Failed to copy text: ', err);
        alert('เกิดข้อผิดพลาด ไม่สามารถคัดลอกได้ครับ');
    });
}

// ฟังก์ชันสำหรับ Double Click ที่หน้าหนังสือพิมพ์เพื่อคัดลอกทั้งโค้ดและรูปแบบ
document.getElementById('result-newspaper').addEventListener('dblclick', function(e) {
    window.getSelection().removeAllRanges();
    const newspaperNode = this;

    let styles = document.querySelector('style').innerHTML;
    try {
        const fontUrl = new URL('Chomsky.woff2', window.location.href).href;
        styles = styles.replace(/url\(['"]?Chomsky\.woff2['"]?\)/g, `url('${fontUrl}')`);
    } catch (err) {
        console.warn('URL parsing failed');
    }

    const fonts = `<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Lora&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Playfair+Display:wght@400;900&family=Pridi:wght@700&family=Sarabun:wght@400;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">`;

    const htmlContent = `<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    ${fonts}
    <style>
        ${styles}
        body { background: #ffffff; margin: 0; padding: 20px; }
    </style>
</head>
<body>
    ${newspaperNode.cloneNode(true).outerHTML}
</body>
</html>`;

    // 1. ให้โหมดสำรองทำงานก่อนแบบทันทีเพื่อไม่ให้เสียสิทธิ User Gesture จากเบราว์เซอร์
    let fallbackSuccess = false;
    try {
        const tempStyle = document.createElement('style');
        tempStyle.innerHTML = styles;
        newspaperNode.prepend(tempStyle);

        const range = document.createRange();
        range.selectNode(newspaperNode);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        fallbackSuccess = document.execCommand('copy');

        selection.removeAllRanges();
        newspaperNode.removeChild(tempStyle);
    } catch (err) {
        console.warn('Fallback copy failed');
    }

    // 2. ใช้ Clipboard API รุ่นใหม่คัดลอกโค้ดเต็มทับลงไป
    if (navigator.clipboard && window.ClipboardItem) {
        const htmlBlob = new Blob([htmlContent], { type: 'text/html' });
        const textBlob = new Blob([htmlContent], { type: 'text/plain' });
        const clipboardItem = new ClipboardItem({
            'text/html': htmlBlob,
            'text/plain': textBlob
        });

        navigator.clipboard.write([clipboardItem]).then(() => {
            showCopyToast();
        }).catch((err) => {
            if (fallbackSuccess) {
                showCopyToast();
            } else {
                fallbackRawCopy();
            }
        });
    } else {
        if (fallbackSuccess) {
            showCopyToast();
        } else {
            fallbackRawCopy();
        }
    }

    function fallbackRawCopy() {
        try {
            const textArea = document.createElement("textarea");
            textArea.value = htmlContent;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert('คัดลอกสำเร็จเฉพาะโค้ด HTML (เนื่องจากข้อจำกัดของเบราว์เซอร์)');
        } catch(e) {
            alert('เบราว์เซอร์ของคุณไม่รองรับการคัดลอกอัตโนมัติ');
        }
    }

    function showCopyToast() {
        const toast = document.createElement('div');
        toast.innerHTML = '✅ <b>Copied!</b><br>คัดลอกรูปแบบหนังสือพิมพ์เรียบร้อย<br><span style="font-size:12px; font-weight:normal;">นำไปวางในโปรแกรม Word หรือ Email ได้เลย</span>';
        Object.assign(toast.style, {
            position: 'fixed', bottom: '30px', right: '30px',
            background: '#212529', color: 'white', padding: '15px 20px',
            borderRadius: '8px', boxShadow: '0 8px 16px rgba(0,0,0,0.2)',
            fontFamily: 'Sarabun, sans-serif', zIndex: '9999',
            opacity: '0', transition: 'opacity 0.3s ease-in-out',
            textAlign: 'center', lineHeight: '1.4'
        });
        document.body.appendChild(toast);
        setTimeout(() => toast.style.opacity = '1', 10);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }
});
</script>
