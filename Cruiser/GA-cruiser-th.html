  color-scheme: dark;
  --night: #0c131b;
  --glass: rgba(9, 15, 22, .62);
  --glass-hi: rgba(9, 15, 22, .84);
  --rule: rgba(239, 231, 212, .16);

  --brass: #d6ad5f;
  --brass-hi: #f2d28c;
  --brass-ink: #1d1606;
  --blue: #6ca6d1;
  --sign: #1c4d99;
  --red: #e0573f;
  --font-mast: "Chomsky", "Old English Text MT", "UnifrakturCook", serif;
  --font-display: "Chonburi", "Newsreader", Georgia, serif;
  --font-text: "Sarabun", "Newsreader", system-ui, sans-serif;
  --font-ui: "Kanit", "Sarabun", system-ui, -apple-system, sans-serif;
  --safe-l: max(16px, env(safe-area-inset-left, 0px));
  --safe-r: max(16px, env(safe-area-inset-right, 0px));

  --safe-b: max(12px, env(safe-area-inset-bottom, 0px));

}

html, body { height: 100%; margin: 0; background: var(--night); color: var(--paper); overflow: hidden; overscroll-behavior: none; }
body { font: 16px/1.5 var(--font-text); -webkit-font-smoothing: antialiased; padding-left: var(--safe-l); padding-right: var(--safe-r); }
#game { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: var(--night); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button { font: inherit; color: inherit; touch-action: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; }
[hidden] { display: none !important; }

/* ---------- loading ---------- */
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--night); z-index: 50; transition: opacity .6s; }
#loading.gone { opacity: 0; pointer-events: none; }
#loading .box { text-align: center; display: grid; gap: 10px; }
#loading .mast { font: 34px var(--font-mast); letter-spacing: .01em; }
#loading .bar { width: min(260px, 60vw); height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; margin: 6px auto 0; }
#loading .bar i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .25s; }
#loading p { margin: 0; color: var(--muted); font: 15px var(--font-ui); }

/* ---------- title ---------- */
#title { position: absolute; inset: 0; z-index: 20; display: flex; pointer-events: none; }
#title .col {
  pointer-events: auto; width: min(470px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box;
  padding: calc(var(--safe-t) + 18px) 28px calc(var(--safe-b) + 18px) calc(var(--safe-l) + 12px);
  background: linear-gradient(90deg, rgba(8, 12, 18, .93) 0%, rgba(8, 12, 18, .82) 62%, rgba(8, 12, 18, 0) 100%);
  display: flex; flex-direction: column; gap: 14px; scrollbar-width: none;
}
#title .col::-webkit-scrollbar { display: none; }
.mast { font: 26px/1 var(--font-mast); color: var(--paper); opacity: .92; }
.kicker { font: 600 12px/1 var(--font-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--brass); margin-top: 6px; }
#title h1 { margin: 0; font: 400 clamp(54px, 9vw, 92px)/1.05 var(--font-display); color: var(--paper); text-wrap: balance; text-shadow: 0 4px 30px rgba(0, 0, 0, .5); }
:root:lang(en) #title h1 { font-size: clamp(42px, 6.6vw, 72px); }
#title h1::after { content: ""; display: block; width: 84px; height: 3px; background: var(--brass); margin-top: 14px; border-radius: 2px; }
#title .lede { margin: 0; color: #d9d2c2; font-size: 16.5px; max-width: 36ch; }
.opt { display: grid; gap: 8px; }
.opt > span { font: 600 11.5px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  border: 1px solid var(--rule); background: rgba(239, 231, 212, .05); border-radius: 999px;

.swatch[aria-pressed="true"] { border-color: var(--brass-hi); }
.paintname { font: 500 14px var(--font-ui); color: var(--paper); margin-left: 4px; }
.startbar { position: sticky; bottom: calc(-1 * (var(--safe-b) + 18px)); margin: 4px -28px calc(-1 * (var(--safe-b) + 18px)) calc(-1 * (var(--safe-l) + 12px)); padding: 14px 28px calc(var(--safe-b) + 18px) calc(var(--safe-l) + 12px); background: linear-gradient(180deg, rgba(8, 12, 18, 0), rgba(8, 12, 18, .96) 30%); display: grid; gap: 10px; }
#startBtn {
  align-self: flex-start; justify-self: start; border: 0; border-radius: 999px; cursor: pointer;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: var(--brass-ink);
  font: 600 20px/1 var(--font-ui); padding: 17px 34px 16px; box-shadow: 0 10px 30px rgba(214, 173, 95, .25);

}
#startBtn svg { width: 22px; height: 22px; }

.revwrap { position: absolute; right: calc(var(--safe-r) + 6px); bottom: calc(var(--safe-b) + 10px); display: flex; align-items: flex-end; gap: 18px; pointer-events: none; }
.paintcap { font: 500 13px var(--font-ui); color: rgba(239, 231, 212, .75); text-align: right; pointer-events: none; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); padding-bottom: 6px; }
.paintcap b { display: block; font: 400 22px var(--font-display); color: var(--paper); }
#revBtn {
  pointer-events: auto; width: 124px; height: 124px; border-radius: 50%; border: 0; cursor: pointer; color: var(--paper); display: grid; place-content: center; gap: 3px; flex: none;
  --r: 0; --c: #d6ad5f;
  background: radial-gradient(circle closest-side, rgba(9, 15, 22, .9) 82%, transparent 84%), conic-gradient(from 225deg, var(--c) calc(var(--r) * 270deg), rgba(239, 231, 212, .16) 0 270deg, transparent 0);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45); font: 600 19px/1.1 var(--font-ui);
}
#revBtn small { font: 500 11.5px/1.2 var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
#revBtn.on { color: var(--brass-hi); }
#gearBox { position: absolute; left: calc(var(--safe-l) + 4px); bottom: calc(var(--safe-b) + 124px); display: flex; flex-direction: column; gap: 10px; }
.gbtn { width: 78px; height: 62px; border-radius: 16px; border: 1px solid var(--rule); background: var(--glass); color: var(--paper); cursor: pointer; display: grid; place-content: center; font: 600 22px/1 var(--font-ui); gap: 2px; }
.gbtn small { font: 500 10.5px/1 var(--font-ui); color: var(--muted); letter-spacing: .06em; }
.gbtn.on { background: rgba(214, 173, 95, .35); border-color: var(--brass); }

#steer.auto .lbl { color: var(--blue); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#hud > * { pointer-events: auto; }
.tl { position: absolute; left: var(--safe-l); top: var(--safe-t); display: flex; gap: 12px; align-items: flex-start; pointer-events: none; }
#minimap { width: 148px; height: 148px; border-radius: 50%; box-shadow: 0 6px 24px rgba(0, 0, 0, .45), 0 0 0 2px rgba(239, 231, 212, .22); background: rgba(9, 15, 22, .7); }
.roadsign { background: var(--sign); border: 2px solid #fff; border-radius: 6px; padding: 6px 12px 7px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); min-width: 120px; transition: opacity .4s, transform .4s; }
.roadsign.dim { opacity: .0; transform: translateY(-6px); }
.roadsign b { display: block; font: 600 20px/1.2 var(--font-ui); color: #fff; }
.roadsign span { display: block; font: 500 12.5px/1.2 "Helvetica Neue", Arial, var(--font-ui); color: #dfe8f7; letter-spacing: .02em; }
.vis { font: 500 12.5px var(--font-ui); color: var(--paper); background: var(--glass); border-radius: 999px; padding: 4px 10px; margin-top: 8px; display: inline-block; }
.tr { position: absolute; right: var(--safe-r); top: var(--safe-t); display: flex; gap: 8px; }
.ib {
  min-width: 54px; height: 54px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--rule); background: var(--glass);
  display: grid; place-items: center; cursor: pointer; font: 500 11px/1.1 var(--font-ui); color: var(--paper); gap: 2px;
}
.ib svg { width: 22px; height: 22px; display: block; }
.ib[aria-pressed="true"] { border-color: var(--brass); color: var(--brass-hi); }
#district { position: absolute; left: 50%; top: calc(var(--safe-t) + 18px); transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity 1s; white-space: nowrap; }
#district.on { opacity: 1; }
#district b { display: block; font: 400 clamp(26px, 4vw, 40px)/1.15 var(--font-display); text-shadow: 0 2px 18px rgba(0, 0, 0, .7); }
#district span { font: 600 12px/1 var(--font-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--brass-hi); text-shadow: 0 1px 8px rgba(0, 0, 0, .8); }
#toast { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); background: var(--glass-hi); border: 1px solid var(--rule); border-radius: 999px; padding: 9px 18px; font: 500 16px var(--font-ui); pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
#toast.on { opacity: 1; }
#gauge { position: absolute; left: 50%; bottom: calc(var(--safe-b) - 4px); transform: translateX(-50%); width: 230px; height: 230px; pointer-events: none; }
#steer { position: absolute; left: 0; bottom: 0; width: 42%; height: 58%; }
#steer .pad {
  position: absolute; left: calc(var(--safe-l) + 4px); bottom: calc(var(--safe-b) + 8px); width: 250px; height: 92px; border-radius: 46px;
  background: var(--glass); border: 1px solid var(--rule); display: grid; place-items: center; pointer-events: none;
}
#steer .pad i { position: absolute; top: 50%; width: 2px; height: 34px; margin-top: -17px; background: var(--rule); }
#steer .pad i:nth-child(1) { left: 25%; } #steer .pad i:nth-child(2) { left: 50%; } #steer .pad i:nth-child(3) { left: 75%; }
#steer .lbl { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font: 500 11px var(--font-ui); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; transform: translateY(100%); padding-top: 4px; }
#knob { position: absolute; left: 50%; top: 50%; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f6dfaa, var(--brass) 60%, #8d6a2a); box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }

#steer.tilt .pad { opacity: .35; }
.pedals { position: absolute; right: var(--safe-r); bottom: calc(var(--safe-b) + 6px); display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 12px 14px; align-items: end; justify-items: center; }
.pbtn { border-radius: 50%; border: 1px solid var(--rule); background: var(--glass); display: grid; place-items: center; cursor: pointer; font: 600 15px/1 var(--font-ui); color: var(--paper); }
.pbtn small { display: block; font: 500 10.5px/1 var(--font-ui); color: var(--muted); letter-spacing: .1em; margin-top: 4px; }
.pbtn.on { background: rgba(214, 173, 95, .3); border-color: var(--brass); }
#throttleBtn { width: 132px; height: 132px; font-size: 19px; background: radial-gradient(circle at 50% 35%, rgba(214, 173, 95, .35), rgba(9, 15, 22, .7) 70%); border-color: rgba(214, 173, 95, .55); }

#brakeBtn { width: 104px; height: 104px; font-size: 17px; }

#hornBtn, #cruiseBtn { width: 66px; height: 66px; font-size: 13px; }
#cruiseBtn[aria-pressed="true"] { border-color: var(--blue); background: rgba(108, 166, 209, .3); }

/* ---------- postcard ---------- */
#postcard {
  position: absolute; right: var(--safe-r); top: calc(var(--safe-t) + 70px); width: min(330px, 70vw); pointer-events: none;
  background: #f3ecdc; color: #1b232c; border-radius: 6px; padding: 14px 16px 15px; box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
  transform: translateX(130%) rotate(2deg); transition: transform .7s cubic-bezier(.2, .9, .2, 1);
}
#postcard.on { transform: translateX(0) rotate(-1.5deg); }
#postcard .pk { font: 600 11px/1 var(--font-ui); letter-spacing: .2em; text-transform: uppercase; color: #8a6420; }
#postcard h3 { margin: 6px 0 4px; font: 400 25px/1.2 var(--font-display); }
#postcard p { margin: 0; font-size: 15px; line-height: 1.5; color: #39434e; }
#postcard .stamp { position: absolute; right: 12px; top: 10px; width: 46px; height: 54px; border: 2px dashed #b68c3c; border-radius: 3px; display: grid; place-items: center; font: 22px var(--font-mast); color: #8a6420; transform: rotate(6deg); }

/* ---------- pause ---------- */
#pause { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(6, 10, 15, .62); padding: 16px; box-sizing: border-box; }
#pause .card { width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: var(--glass-hi); border: 1px solid var(--rule); border-radius: 18px; padding: 22px 24px; display: grid; gap: 14px; box-sizing: border-box; }
#pause h2 { margin: 0; font: 400 32px/1.1 var(--font-display); }
#pause .stats { display: flex; gap: 22px; flex-wrap: wrap; font: 500 14px var(--font-ui); color: var(--muted); }
#pause .stats b { display: block; font: 600 24px/1.1 var(--font-ui); color: var(--paper); font-variant-numeric: tabular-nums; }
.album { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.album div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px; font: 500 12px/1.3 var(--font-ui); color: var(--muted); min-height: 46px; }
.album div.got { background: #f3ecdc; color: #1b232c; border-color: #f3ecdc; }
.album div.got::before { content: "✓ "; color: #8a6420; font-weight: 700; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 1px solid var(--rule); background: rgba(239, 231, 212, .06); border-radius: 999px; padding: 11px 18px; font: 500 15px/1 var(--font-ui); cursor: pointer; color: var(--paper); text-decoration: none; display: inline-block; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 600; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; z-index: 40; }
#fade.on { opacity: 1; }
#rotate { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 250px); transform: translateX(-50%); z-index: 15; background: var(--glass-hi); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; font: 500 14px var(--font-ui); text-align: center; width: max-content; max-width: 80vw; }

/* phones and portrait */
@media (max-width: 760px), (max-height: 560px) {
  #minimap { width: 112px; height: 112px; }
  .roadsign b { font-size: 16px; }
  #gauge { width: 180px; height: 180px; }
  #throttleBtn { width: 106px; height: 106px; }
  #brakeBtn { width: 86px; height: 86px; }
  #hornBtn, #cruiseBtn { width: 56px; height: 56px; }
  #steer .pad { width: 200px; height: 80px; }
  #knob { width: 64px; height: 64px; margin: -32px 0 0 -32px; }
  .ib { min-width: 46px; height: 46px; padding: 0 8px; }
  .ib span { display: none; }
  #gearBox { bottom: calc(var(--safe-b) + 108px); gap: 8px; }
  .gbtn { width: 64px; height: 52px; font-size: 19px; }
  #revBtn { width: 100px; height: 100px; font-size: 16px; }
  .revwrap .paintcap { display: none; }
}
@media (orientation: portrait) and (max-width: 760px) {
  #gauge { bottom: calc(var(--safe-b) + 150px); }
}
@media (prefers-reduced-motion: reduce) {
  #postcard, .roadsign, #district, #fade { transition: none; }
}

/* ---------- colliders ---------- */
const COL = { rects: [], circles: [] };
const addRect = (x0, z0, x1, z1) => COL.rects.push([x0, z0, x1, z1]);

// push point p {x,z} out of everything; returns the deepest contact normal or null
function collide(p, r) {
  let hit = null;
  for (const [x0, z0, x1, z1] of COL.rects) {
    if (p.x < x0 - r || p.x > x1 + r || p.z < z0 - r || p.z > z1 + r) continue;
    const dl = p.x - (x0 - r), dr = (x1 + r) - p.x, dt = p.z - (z0 - r), db = (z1 + r) - p.z;
    const m = Math.min(dl, dr, dt, db);
    if (m === dl) { p.x = x0 - r; hit = { nx: -1, nz: 0, d: m }; }
    else if (m === dr) { p.x = x1 + r; hit = { nx: 1, nz: 0, d: m }; }
    else if (m === dt) { p.z = z0 - r; hit = { nx: 0, nz: -1, d: m }; }
    else { p.z = z1 + r; hit = { nx: 0, nz: 1, d: m }; }
  }
  for (const [cx, cz, cr] of COL.circles) {
    const dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz), m = cr + r;
    if (d < m && d > 1e-4) { p.x = cx + dx / d * m; p.z = cz + dz / d * m; hit = { nx: dx / d, nz: dz / d, d: m - d }; }
  }
  return hit;
}

  for (const [x0, z0, x1, z1] of COL.rects) if (x > x0 - r && x < x1 + r && z > z0 - r && z < z1 + r) return true;

/* a row of shophouses along a street front from A to B, facing the street */
function shopRow(ax, az, bx, bz, depth, kind, opt = {}) {

  const dx = (bx - ax) / len, dz = (bz - az) / len;     // along the street
  const ox = -dz, oz = dx;                              // outward (towards the street) = dir × up

    g.wall(p1x, p1z, p2x, p2z, 0, h, pu0, pu1, 0.945, 0.99);
    g.wall(p2x, p2z, p3x, p3z, 0, h, pu0, pu1, 0.945, 0.99);
    g.wall(p3x, p3z, p0x, p0z, 0, h, pu0, pu1, 0.945, 0.99);

      rf.quad([p0x + dx * 0.2 + ox * 0.02, y0, p0z + dz * 0.2 + oz * 0.02], [p1x - dx * 0.2 + ox * 0.02, y0, p1z - dz * 0.2 + oz * 0.02], [p1x - dx * 0.2 + ox * out, y1, p1z - dz * 0.2 + oz * out], [p0x + dx * 0.2 + ox * out, y1, p0z + dz * 0.2 + oz * out]);

/* ---------- Thai roof: three overlapping gables, orange tiles, green edge, gold gable ends ---------- */
function thaiRoof(cx, cz, L, W, y0, alongX = false, tiers = 3) {
  const t = gb('temple'), gd = gb('gold');
  const P = (a, b, y) => alongX ? [cx + a, y, cz + b] : [cx + b, y, cz + a]; // a along ridge, b across
  for (let k = 0; k < tiers; k++) {
    const l = L * (1 - k * 0.18), w = W + 2.4 - k * 1.2, yb = y0 + k * 1.3, ridge = yb + w * 0.62;
    const hl = l / 2, hw = w / 2;
    // two slopes, built so their normals face out and up
    const s1 = [P(-hl, hw, yb), P(hl, hw, yb), P(hl, 0, ridge), P(-hl, 0, ridge)];
    const s2 = [P(hl, -hw, yb), P(-hl, -hw, yb), P(-hl, 0, ridge), P(hl, 0, ridge)];
    const flip = alongX; // keep the winding outward whichever way the ridge runs
    for (const s of [s1, s2]) {
      const q = flip ? [s[1], s[0], s[3], s[2]] : s;
      t.color(0xc2481f); t.quad(...q);
      // green border along the eave
      const e = (a, b, f) => [lerp(a[0], b[0], f), lerp(a[1], b[1], f) + 0.03, lerp(a[2], b[2], f)];
      const b0 = q[0], b1 = q[1], b2 = e(q[1], q[2], 0.16), b3 = e(q[0], q[3], 0.16);
      t.color(0x2d6a3c); t.quad([b0[0], b0[1] + 0.03, b0[2]], [b1[0], b1[1] + 0.03, b1[2]], b2, b3);
    }
    // gable ends
    for (const sgn of [-1, 1]) {
      const a = P(sgn * hl, hw, yb), b = P(sgn * hl, -hw, yb), c = P(sgn * hl, 0, ridge);
      // red pediment with gold bargeboards and a gold motif in the middle
      t.color(0x7d1a14); t.tri(a, b, c);
      gd.geo(GEO.box, between(a, c, 0.42, 0.28)); gd.geo(GEO.box, between(b, c, 0.42, 0.28));
      const m = [(a[0] + b[0] + c[0]) / 3, (a[1] + b[1] + c[1]) / 3, (a[2] + b[2] + c[2]) / 3];
      const out = alongX ? [sgn * 0.06, 0, 0] : [0, 0, sgn * 0.06];
      gd.geo(GEO.sphere, mat(m[0] + out[0], m[1] - 0.4, m[2] + out[2], 0, w * 0.045, w * 0.07, w * 0.045));
      // chofa: gold horn at the ridge end
      const tip = P(sgn * (hl + 0.6), 0, ridge + 1.4);
      gd.geo(GEO.cone, new THREE.Matrix4().compose(new THREE.Vector3((c[0] + tip[0]) / 2, (c[1] + tip[1]) / 2, (c[2] + tip[2]) / 2),
        new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(tip[0] - c[0], tip[1] - c[1], tip[2] - c[2]).normalize()), new THREE.Vector3(0.22, 1.6, 0.22)));
    }
  }
}

/* ---------- the world ---------- */
const WORLD = { blocks: [], lamps: [], landmarks: [], trains: [], boats: [], trafficLights: [], beams: [] };

function buildRoads() {
  const road = gb('road'), mk = gb('mark');
  const ROADY = 0;
  const rect = (x0, z0, x1, z1) => road.top(x0, z0, x1, z1, ROADY, x0 / 10, -z1 / 10, x1 / 10, -z0 / 10);
  const paint = (x0, z0, x1, z1, c) => { mk.color(c); mk.top(x0, z0, x1, z1, 0.012); };
  const W = 0xf2f0ea, Y = 0xf0c22a;
  // intersections
  for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) rect(RX[i] - WX[i] / 2, RZ[j] - WZ[j] / 2, RX[i] + WX[i] / 2, RZ[j] + WZ[j] / 2);
  // north–south segments
  for (let i = 0; i < 7; i++) for (let j = 0; j < 6; j++) {
    const x = RX[i], w = WX[i], z0 = RZ[j] + WZ[j] / 2, z1 = RZ[j + 1] - WZ[j + 1] / 2;
    rect(x - w / 2, z0, x + w / 2, z1);
    segMarks(paint, x, w, z0, z1, false, W, Y);
  }
  // east–west segments
  for (let j = 0; j < 7; j++) for (let i = 0; i < 6; i++) {
    const z = RZ[j], w = WZ[j], x0 = RX[i] + WX[i] / 2, x1 = RX[i + 1] - WX[i + 1] / 2;
    rect(x0, z - w / 2, x1, z + w / 2);
    segMarks(paint, z, w, x0, x1, true, W, Y);
  }
}
// lane paint for one segment. c = centreline coordinate, a0..a1 = extent along the road
function segMarks(paint, c, w, a0, a1, alongX, W, Y) {
  const P = (u0, v0, u1, v1, colr) => alongX ? paint(u0, v0, u1, v1, colr) : paint(v0, u0, v1, u1, colr); // u along, v across
  const A0 = a0 + 4.2, A1 = a1 - 4.2;
  const median = w >= 22;
  if (!median) { P(A0, c - 0.28, A1, c - 0.14, Y); P(A0, c + 0.14, A1, c + 0.28, Y); }
  // lane dashes
  for (const s of [-1, 1]) {
    const lc = c + s * (median ? 6.0 : w / 4 + (w >= 20 ? 0.6 : 0));
    for (let a = A0 + 1; a < A1 - 3; a += 8) P(a, lc - 0.07, a + 3, lc + 0.07, W);
    const e = c + s * (w / 2 - 0.35); P(A0 - 3, e - 0.07, A1 + 3, e + 0.07, W);
  }
  // stop lines (left-hand traffic: each direction keeps to its left) and zebra crossings
  for (const end of [0, 1]) {
    const a = end ? a1 : a0;
    const dir = end ? -1 : 1;
    // zebra: stripes running along the road, across the full width
    for (let v = c - w / 2 + 0.8; v < c + w / 2 - 0.6; v += 1.1) P(Math.min(a, a + dir * 3), v, Math.max(a, a + dir * 3), v + 0.55, W);

    const s0 = c + (sideSign > 0 ? 0.3 : -w / 2 + 0.3), s1 = c + (sideSign > 0 ? w / 2 - 0.3 : -0.3);
    const sa = a + dir * 3.6; P(Math.min(sa, sa + dir * 0.4), s0, Math.max(sa, sa + dir * 0.4), s1, W);
  }
}

function buildBlocks() {
  const walk = gb('walk'), curb = gb('curb'), curbG = gb('curbGrey');
  const blocks = [];
  for (let bz = -1; bz <= 6; bz++) for (let bx = 0; bx <= 6; bx++) {
    let x0 = RX[bx] + WX[bx] / 2;
    let x1 = bx <= 5 ? RX[bx + 1] - WX[bx + 1] / 2 : RX[6] + 130;
    let z0 = bz >= 0 && bz <= 6 ? RZ[bz] + WZ[bz] / 2 : RZ[0] - 130;
    let z1 = bz === -1 ? RZ[0] - WZ[0] / 2 : bz <= 5 ? RZ[bz + 1] - WZ[bz + 1] / 2 : RZ[6] + 130;
    const outer = bx === 6 || bz === -1 || bz === 6;
    // the outer ring touches end to end, so the roads at the edge of the map end at a wall of buildings
    if (bz === -1 || bz === 6) { x0 = bx === 0 ? -7 : RX[bx]; x1 = bx === 6 ? RX[6] + 130 : RX[bx + 1]; }
    else if (bx === 6) { z0 = bz === 0 ? RZ[0] - WZ[0] / 2 : RZ[bz]; z1 = bz === 5 ? RZ[6] + WZ[6] / 2 : RZ[bz + 1]; }
    const type = blockType(bx, bz);
    blocks.push({ bx, bz, x0, z0, x1, z1, outer, type });
    addRect(x0, z0, x1, z1);
    walk.top(x0, z0, x1, z1, KERB, x0 / 3.2, -z1 / 3.2, x1 / 3.2, -z0 / 3.2);

    const sides = [[x0, z1, x1, z1], [x1, z1, x1, z0], [x1, z0, x0, z0], [x0, z0, x0, z1]];
    for (const [ax, az, bx2, bz2] of sides) {
      const L = Math.hypot(bx2 - ax, bz2 - az), dx = (bx2 - ax) / L, dz = (bz2 - az) / L;
      const cut = Math.min(12, L / 2);
      const seg = (t0, t1, g) => g.wall(ax + dx * t0, az + dz * t0, ax + dx * t1, az + dz * t1, 0, KERB, t0 / 2, t1 / 2, 0, 1);
      seg(0, cut, curb); if (L > 2 * cut) seg(cut, L - cut, curbG); seg(L - cut, L, curb);
    }

  // the river bank promenade
  walk.top(-16, -900, -7, 1600, KERB, -16 / 3.2, -1600 / 3.2, -7 / 3.2, 900 / 3.2);
  curbG.wall(-7, -900, -7, 1600, 0, KERB, 0, 1250, 0, 1);
  addRect(-2000, -2000, -7, 3000);

  gb('ground').top(-3000, -3000, 3600, 3600, -0.04, 0, 0, 1, 1);
}

function fillBlocks() {
  for (const b of WORLD.blocks) {
    const X0 = b.x0 + WALK, X1 = b.x1 - WALK, Z0 = b.z0 + WALK, Z1 = b.z1 - WALK;
    const t = b.type;
    if (b.outer) { outerBlock(b, X0, Z0, X1, Z1); continue; }

    if (j < 6) app.push({ axis: 'z', x: x - hw - 0.8, z: z + hd + 3.4, ry: Math.PI });     // northbound
    if (i > 0) app.push({ axis: 'x', x: x - hw - 3.4, z: z - hd - 0.8, ry: Math.PI / 2 }); // eastbound keeps north side
    if (i < 6) app.push({ axis: 'x', x: x + hw + 3.4, z: z + hd + 0.8, ry: -Math.PI / 2 });  // westbound keeps south side
    for (const a of app) {
      if (i === 0 && a.x < 0) continue;
      inst('tlPole', mat(a.x, KERB, a.z, a.ry), null);
      const idx = (INST.tlRed || []).length;
      for (const [k, y] of [['tlRed', 4.55], ['tlAmber', 4.2], ['tlGreen', 3.85]]) {
        const fx = Math.sin(a.ry) * -0.2, fz = Math.cos(a.ry) * -0.2;
        inst(k, mat(a.x + fx, KERB + y, a.z + fz, 0, 0.13, 0.13, 0.13), col(0x222222));
      }
      node.heads.push({ axis: a.axis, idx });
    }
    WORLD.trafficLights.push(node);
  }
}

/* road name and district under a point */
function roadAt(x, z) {
  let best = null;
  for (let i = 0; i < 7; i++) if (Math.abs(x - RX[i]) < WX[i] / 2 + 1.5) best = { th: ROAD_X[i][0], en: ROAD_X[i][1], k: 'x' + i };
  for (let j = 0; j < 7; j++) if (Math.abs(z - RZ[j]) < WZ[j] / 2 + 1.5) {
    const seg = ROAD_Z[j].find(s => x < s[0]);
    const r = { th: seg[1], en: seg[2], k: 'z' + j + seg[1] };
    if (best) return null; // at a crossing: keep the previous name
    best = r;
  }
  return best;
}

function updateTraffic(dt, player) {

      const st = lightState(node, dx !== 0 ? 'x' : 'z', tnow);

}

function collideTraffic(p, r) {
  for (const car of CARS) {
    const dx = p.x - car.pos.x, dz = p.z - car.pos.z;
    if (dx * dx + dz * dz > 64) continue;
    const hx = car.pos.hx, hz = car.pos.hz;
    const lx = dx * -hz + dz * hx, lz = dx * hx + dz * hz;   // local: x across, z along
    const ex = car.wid / 2 + r, ez = car.len / 2 + r;
    if (Math.abs(lx) < ex && Math.abs(lz) < ez) {
      const px = ex - Math.abs(lx), pz = ez - Math.abs(lz);
      let nx, nz;
      if (px < pz) { const s = Math.sign(lx) || 1; nx = -hz * s; nz = hx * s; p.x += nx * px; p.z += nz * px; }
      else { const s = Math.sign(lz) || 1; nx = hx * s; nz = hz * s; p.x += nx * pz; p.z += nz * pz; }
      return { car, nx, nz };
    }
  }
  return null;
}

function updateWorldAnim(dt, time) {
  for (const t of WORLD.trains) {
    if (t.wait > 0) { t.wait -= dt; if (t.wait <= 0) t.v = 0.1; }
    else {
      const ahead = t.stops.concat(t.dir > 0 ? [638] : [262]).filter(s => (s - t.x) * t.dir > 0.5).sort((a, b) => (a - b) * t.dir)[0];
      const dist = ahead === undefined ? 0 : Math.abs(ahead - t.x);
      const vt = Math.min(16, Math.sqrt(2 * 1.0 * Math.max(0, dist - 0.3)));
      t.v = vt > t.v ? Math.min(vt, t.v + 1.1 * dt) : vt;
      t.x += t.v * dt * t.dir;

    }

function initAudio() {

  const master = g(settings.sound ? 0.8 : 0);
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -15; comp.knee.value = 10; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.22;

  master.connect(comp).connect(lim).connect(ctx.destination);

  revIn.connect(conv).connect(master);

  for (let k = 0; k < 4; k++) E.pops.push(makePop(ctx, 300 + k));

  E.bankIn = [0, 1].map(() => { const gi = g(1), pn = ctx.createStereoPanner(); gi.connect(pn).connect(E.bus); gi.pan = pn; return gi; });

function setEngine(id, quiet) {
  if (!ENGINES[id]) id = 'vtwin';
  settings.engine = id; if (!quiet) save();
  const V = AUDIO.voice = ENGINES[id];
  const E = AUDIO.E; if (!E) return;
  if (!V.electric) {
    if (!E.cache[id]) E.cache[id] = V.pulse.map((P, b) => [0, 1, 2, 3].map(k => makePulse(AUDIO.ctx, 100 * (b + 1) + k + id.length * 7, P)));
    E.pulses = E.cache[id];
    E.bark.frequency.value = V.barkF;
    E.bankIn.forEach((gi, b) => { gi.pan.pan.value = V.pan[b] ?? 0; });
  }
  E.cyl = 0;
}
function setSound(on) {
  settings.sound = on; save();
  if (AUDIO.master) AUDIO.master.gain.setTargetAtTime(on ? 0.8 : 0, AUDIO.ctx.currentTime, 0.05);
}

function scheduleEngine() {
  const E = AUDIO.E, V = AUDIO.voice; if (!E || !E.running || V.electric || !E.pulses.length) return;
  const ctx = AUDIO.ctx, now = ctx.currentTime, n = V.pattern.length;
  if (E.next < now) E.next = now + 0.005;
  while (E.next < now + 0.1) {
    const rpm = Math.max(V.idle * 0.4, E.rpm);
    const k = E.cyl % n;
    const interval = 120 / rpm * V.pattern[k] / 720;
    const limiter = rpm > V.red - 25 && E.thr > 0.5 && Math.random() < 0.55;
    if (!limiter) {
      const bank = V.banks[k];
      const s = ctx.createBufferSource();
      s.buffer = E.pulses[bank][Math.random() * 4 | 0];
      s.playbackRate.value = (0.8 + rpm / V.red * V.rate) * (1 + (Math.random() - 0.5) * 0.03);
      s.connect(E.bankIn[bank]); s.start(E.next);
      if (Math.random() < 0.7 * Math.min(1, 2 / n)) { const c = ctx.createBufferSource(); c.buffer = E.click; c.playbackRate.value = 0.8 + Math.random() * 0.5; c.connect(E.tickBus); c.start(E.next + interval * 0.3); }
      // off the throttle at speed: burbles and pops in the pipes
      if (E.thr < 0.08 && rpm > V.idle * 2.2 && Math.random() < V.pop * (rpm / (V.red * 0.6)) * Math.min(1, 2 / n)) {
        const p = ctx.createBufferSource(); p.buffer = E.pops[Math.random() * 4 | 0]; p.playbackRate.value = 0.8 + Math.random() * 0.5; p.connect(E.popBus); p.start(E.next + interval * (0.3 + Math.random() * 0.5));
      }
    }
    E.next += interval * (1 + (Math.random() - 0.5) * (rpm < V.idle * 1.4 ? V.lope : V.lope * 0.22));
    E.cyl++;
  }
}

/* called every frame while riding */
function audioUpdate(dt, s) {
  if (!AUDIO.ready) return;
  const E = AUDIO.E, ctx = AUDIO.ctx, t = ctx.currentTime, P = AUDIO.voice;
  const vr = voiceRpm(s.rpm), n = clamp((s.rpm - IDLE) / (REDLINE - IDLE), 0, 1.05);
  E.rpm = vr; E.thr = s.throttle;
  const set = (param, v, tc = 0.06) => param.setTargetAtTime(v, t, tc);
  const load = s.throttle;
  if (E.running && !P.electric) {
    set(E.bus.gain, (0.34 + 0.66 * load) * (0.75 + 0.25 * Math.min(1, n * 2)), 0.05);
    set(E.drive.gain, P.drive * (0.7 + 0.6 * load));
    set(E.lp.frequency, P.lpBase + P.lpThr * load + vr * P.lpRpm, 0.05);
    set(E.bark.gain, P.bark * (0.4 + 0.6 * load));
    set(E.body.gain, P.body); set(E.chest.gain, P.chest);
    set(E.out.gain, P.out * (s.cam === 2 ? 0.8 : 1));
    set(E.intake.gain, (0.01 + 0.05 * load * Math.min(1, n * 1.4)) * (s.cam === 2 ? 1.6 : 1));
    set(E.intakeF.frequency, 500 + n * 2000);
    set(E.el.gain, 0); set(E.elHi.gain, 0);
  } else if (E.running) {
    set(E.bus.gain, 0); set(E.intake.gain, 0);
    const f = 70 + n * 820;
    E.elOsc.forEach((o, k) => set(o.frequency, f * [1, 2.01, 3.03][k], 0.05));
    set(E.el.gain, 0.05 + 0.1 * load + 0.05 * n, 0.05);
    set(E.elHiOsc.frequency, 2600 + n * 2600, 0.05); set(E.elHi.gain, 0.003 + 0.009 * load, 0.05);
  } else { set(E.bus.gain, 0); set(E.intake.gain, 0); set(E.el.gain, 0); set(E.elHi.gain, 0); }
  set(E.whineG.gain, Math.min(0.012, s.speed * 0.0004));
  set(E.whine.frequency, 60 + s.speed * 22);
  const v = s.speed;
  set(AUDIO.wind.gain, Math.min(0.5, (v / 45) ** 2 * 0.45) * (s.cam === 2 ? 1.4 : 0.8));
  set(AUDIO.windF.frequency, 500 + v * 18);
  set(AUDIO.tyre.gain, Math.min(0.16, v * 0.004));
  set(AUDIO.hum.gain, look.night ? 0.035 : 0.055, 0.5);
  set(AUDIO.revIn.gain, s.reverb, 0.4);
  // nearest vehicles
  set(AUDIO.pass.gain, s.passGain, 0.08); set(AUDIO.passPan.pan, s.passPan, 0.08); set(AUDIO.passF.frequency, 380 + s.passSpeed * 30, 0.1);
  set(AUDIO.tuk.gain, s.tukGain, 0.1); set(AUDIO.tukPan.pan, s.tukPan, 0.1); set(AUDIO.tukOsc.frequency, 85 + s.tukSpeed * 6, 0.2);
  set(AUDIO.train.gain, s.trainGain, 0.2); set(AUDIO.trainHi.gain, s.trainHi, 0.15);
  set(AUDIO.river.gain, s.riverGain, 0.4);
  // ambient one-shots near places
  AUDIO.amb = (AUDIO.amb || 0) - dt;
  if (AUDIO.amb <= 0) { AUDIO.amb = 0.4 + Math.random() * 1.6; ambientOneShot(s); }
}

function voice(type, f, dur, peak, dest, attack = 0.005, pan = 0) {
  const ctx = AUDIO.ctx, t = ctx.currentTime, o = ctx.createOscillator(), gg = ctx.createGain(), p = ctx.createStereoPanner();
  o.type = type; o.frequency.value = f; gg.gain.value = 0; p.pan.value = pan;
  gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(peak, t + attack); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gg).connect(p).connect(dest || AUDIO.master); o.start(t); o.stop(t + dur + 0.05);
  return o;
}
function bell(f, peak, pan = 0) { for (const [m, a, d] of [[1, 1, 3.2], [2.76, 0.4, 1.6], [5.4, 0.2, 0.8], [8.9, 0.08, 0.4]]) voice('sine', f * m, d, peak * a, null, 0.003, pan); }
function ambientOneShot(s) {
  if (!AUDIO.ready || !settings.sound) return;
  const x = s.x, z = s.z;
  // temple chimes
  const dT = Math.hypot(x - 150, z - 50);
  if (dT < 90 && Math.random() < 0.6) bell(pick([1320, 1480, 1760, 1980, 2220], Math.random), 0.04 * (1 - dT / 90), clamp((150 - x) / -60, -0.8, 0.8));
  // birds by day, crickets at night, near the park and the temple trees
  const dP = Math.min(Math.hypot(x - 350, z - 250), dT);
  if (dP < 90) {
    if (!look.night && look.lamps < 0.5) { const f = 2600 + Math.random() * 1800; for (let k = 0; k < 3; k++) setTimeout(() => { const o = voice('sine', f, 0.09, 0.02 * (1 - dP / 90)); o.frequency.exponentialRampToValueAtTime(f * 1.4, AUDIO.ctx.currentTime + 0.08); }, k * 110); }
    else for (let k = 0; k < 6; k++) setTimeout(() => voice('sine', 4600 + Math.random() * 300, 0.04, 0.008 * (1 - dP / 90)), k * 55);
  }
  // distant horns
  if (Math.random() < 0.18) { const f = pick([380, 440, 520, 610], Math.random); const pan = Math.random() * 1.6 - 0.8; voice('square', f, 0.25, 0.006, null, 0.01, pan); voice('square', f * 1.2, 0.25, 0.005, null, 0.01, pan); }
}

/* one-shot effects */
const SFX = {
  start() {
    if (!AUDIO.ready) return false;
    const ctx = AUDIO.ctx, t = ctx.currentTime, E = AUDIO.E;
    if (E.running || E.starting) return false;
    E.starting = true;
    if (AUDIO.voice.electric) {   // no starter: a power-on chime and the motor is live
      [660, 990].forEach((f, k) => setTimeout(() => bell(f, 0.035), k * 150));
      setTimeout(() => { E.running = true; E.starting = false; }, 380);
      return true;
    }
    // starter motor: a geared whine with compression pulses
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(70, t); o.frequency.linearRampToValueAtTime(95, t + 0.8);
    const am = ctx.createOscillator(); am.frequency.value = 7; const amg = AUDIO.g(0.5); am.connect(amg); const vca = AUDIO.g(0.5); amg.connect(vca.gain);
    const out = AUDIO.g(0); out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(0.18, t + 0.05); out.gain.setValueAtTime(0.18, t + 0.85); out.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
    o.connect(vca).connect(AUDIO.filt('bandpass', 900, 0.9)).connect(out).connect(AUDIO.master); o.start(t); am.start(t); o.stop(t + 1.05); am.stop(t + 1.05);
    setTimeout(() => { E.running = true; E.starting = false; E.next = AUDIO.ctx.currentTime + 0.01; }, 850);
    return true;
  },
  horn(on) { if (!AUDIO.ready) return; AUDIO.horn.gain.setTargetAtTime(on ? 0.16 : 0, AUDIO.ctx.currentTime, on ? 0.008 : 0.03); },
  shift(up) { if (!AUDIO.ready || AUDIO.voice.electric) return; voice('sine', up ? 85 : 110, 0.12, 0.12); const s = AUDIO.ctx.createBufferSource(); s.buffer = AUDIO.E.click; s.playbackRate.value = 0.35; const gg = AUDIO.g(0.35); s.connect(gg).connect(AUDIO.master); s.start(); },
  thud(strength) {
    if (!AUDIO.ready) return;
    const ctx = AUDIO.ctx, s = ctx.createBufferSource(); s.buffer = AUDIO.brown; const gg = AUDIO.g(0); const t = ctx.currentTime;
    gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(0.5 * strength, t + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    s.connect(AUDIO.filt('lowpass', 300, 1)).connect(gg).connect(AUDIO.master); s.start(t, Math.random()); s.stop(t + 0.4);
    voice('sine', 60, 0.25, 0.25 * strength);
  },
  scrape(strength) {
    if (!AUDIO.ready) return;
    const ctx = AUDIO.ctx, s = ctx.createBufferSource(); s.buffer = AUDIO.white; const gg = AUDIO.g(0); const t = ctx.currentTime;
    gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(0.12 * strength, t + 0.02); gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    s.connect(AUDIO.filt('bandpass', 1800, 2)).connect(gg).connect(AUDIO.master); s.start(t, Math.random()); s.stop(t + 0.35);
  },
  chime() { if (!AUDIO.ready) return; [784, 988, 1175, 1568].forEach((f, k) => setTimeout(() => bell(f, 0.05), k * 140)); },
  click() { if (!AUDIO.ready) return; voice('triangle', 900, 0.05, 0.03); },

AUDIO.carHorn = car => {
  if (!AUDIO.ready || !settings.sound) return;
  const f = car.kind === 'tuktuk' || car.kind === 'scooter' ? 620 : car.kind === 'bus' ? 300 : 430;
  const dx = car.pos.x - BIKE.root.position.x, dz = car.pos.z - BIKE.root.position.z;
  const pan = clamp((dx * Math.cos(bike.yaw) - dz * Math.sin(bike.yaw)) / 10, -0.9, 0.9);
  for (let k = 0; k < (car.kind === 'tuktuk' ? 2 : 1); k++) setTimeout(() => { voice('square', f, 0.28, 0.03, null, 0.01, pan); voice('square', f * 1.19, 0.28, 0.025, null, 0.01, pan); }, k * 320);
};


/* =====================================================================
   Riding, controls, cameras, HUD, the main loop
   ===================================================================== */
const GEAR_TOP = [12.5, 20.8, 29.2, 37.5, 44.4, 51.4];   // m/s at the red line, gears 1–6
const GEAR_ACC = [6.4, 5.0, 3.9, 3.1, 2.45, 1.95];
const IDLE = 880, REDLINE = 5800;
const START = { x: 136, z: 95, yaw: -Math.PI / 2 };       // Bamrung Mueang, by the Giant Swing, facing east
const bike = { x: START.x, z: START.z, yaw: START.yaw, v: 0, lean: 0, steer: 0, throttle: 0, brake: 0, gear: 0, rpm: IDLE, shiftT: 0, cruise: 0, pitch: 0, started: false, back: 0, shake: 0, bumpT: 0 };
const input = { steer: 0, throttle: 0, brake: 0, keys: new Set(), padSteer: 0, padActive: false, tiltSteer: 0, horn: false };
const titleRev = { on: false, thr: 0, blipT: 0 };
let time = 0, last = performance.now();
const HUDS = { road: '', roadT: 0, dist: '', distT: 0, toastT: 0, cardT: 0 };

function torque(rpm) {
  let t = 0.7 + 0.3 * Math.sin(clamp((rpm - 900) / 3400, 0, 1) * Math.PI * 0.95);
  if (rpm > 4600) t *= 1 - (rpm - 4600) / 1200 * 0.35;
  return t;
}

function shiftUp() {
  if (settings.gearbox !== 'manual' || !bike.started) return;
  if (bike.gear >= 5) { toast(T.topGear); return; }
  bike.gear++; bike.shiftT = 0.16; SFX.shift(true); flashGear('gearUp');
}
function shiftDown() {
  if (settings.gearbox !== 'manual' || !bike.started) return;
  if (bike.gear <= 0) { toast(T.firstGear); return; }
  if (Math.max(0, bike.v) / GEAR_TOP[bike.gear - 1] * REDLINE > REDLINE + 250) { toast(T.overRev); return; }

/* ---------- placing the bike model ---------- */
function poseBike(dt, parked) {
  BIKE.root.position.set(bike.x, 0, bike.z);
  BIKE.root.rotation.y = bike.yaw;
  BIKE.lean.rotation.z = parked ? 0.11 : bike.lean;
  BIKE.body.rotation.x = bike.pitch;
  // a big twin shakes at idle and smooths out with revs
  const shakeAmp = (bike.started || AUDIO.E?.running) ? 0.0022 * clamp(1.6 - bike.rpm / 2200, 0.15, 1.2) : 0;
  const f = bike.rpm / 60 * Math.PI;
  BIKE.body.position.y = Math.sin(time * f) * shakeAmp + Math.sin(time * f * 0.5 + 1) * shakeAmp * 0.6;
  BIKE.body.rotation.z = Math.sin(time * f * 0.5) * shakeAmp * 1.5;
  const sp = Math.abs(bike.v);
  BIKE.frontW.rotation.x -= bike.v / 0.34 * dt;
  BIKE.rearW.rotation.x -= bike.v / 0.334 * dt;
  BIKE.steer.rotation.y = parked ? 0.5 : bike.steer * (0.42 * (1 - smooth(0, 12, sp)) + 0.04);
  BIKE.stand.visible = parked;
  BIKE.rider.visible = state === 'title' || settings.cam !== 2;
  const on = !!(AUDIO.E && AUDIO.E.running) || bike.started;   // lights come on with the ignition
  BIKE.spot.intensity = on ? look.head * 1.7 : 0;
  BIKE.fill.intensity = (look.night ? 7 : look.lamps > 0.5 ? 5 : look.head > 0 ? 2.5 : 0) * (parked ? 1.6 : 1);
  BM.glow.opacity = !on ? 0 : look.lamps > 0.5 ? 0.8 : look.head > 0 ? 0.22 : 0.08;
  BM.tail.emissiveIntensity = !on ? 0.05 : bike.brake > 0.1 ? 4 : look.lamps > 0.3 ? 1.5 : 0.7;
  BM.lens.color.setScalar(!on ? 0.22 : look.lamps > 0.3 ? 2.2 : 1.3);
  BM.plate.emissiveIntensity = !on ? 0 : look.lamps > 0.3 ? 0.6 : 0.1;
}

/* ---------- cameras ---------- */
const cam = { pos: new THREE.Vector3(), look: new THREE.Vector3(), tv: null, tvT: 0, orbit: 0, init: false, fov: 60 };

function updateCamera(dt, mode) {
  const sp = Math.abs(bike.v);

    target = bp.clone().addScaledVector(_f, 6); target.y = 0.85;

    if (need) {

      const ahead = Math.max(22, sp * 2.4);
      const c = new THREE.Vector3(bike.x, 0, bike.z).addScaledVector(_f, ahead).addScaledVector(_r, side * (6 + Math.random() * 3));
      for (let n = 0; n < 12 && insideSolid(c.x, c.z, 0.5); n++) c.addScaledVector(_r, -side * 1.2);

/* ---------- input ---------- */
function bindHold(id, on, off) {
  const el = $(id);

  const up = e => { e.preventDefault(); off(); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

  bindHold('throttleBtn', () => { input.throttle = 1; }, () => { input.throttle = 0; });
  bindHold('brakeBtn', () => { input.brake = 1; }, () => { input.brake = 0; });
  bindHold('hornBtn', () => { SFX.horn(true); $('hornBtn').classList.add('on'); }, () => { SFX.horn(false); $('hornBtn').classList.remove('on'); });
  $('cruiseBtn').addEventListener('pointerdown', e => { e.preventDefault(); toggleCruise(); });

  const area = $('steer'), knob = $('knob'), pad = area.querySelector('.pad');
  let pid = null, x0 = 0;

    e.preventDefault(); if (pid !== null) return;
    pid = e.pointerId; x0 = e.clientX; input.padActive = true; try { area.setPointerCapture(pid); } catch (er) { /* fine */ }
    if (settings.steer === 'tilt') calibrateTilt();
  });
  area.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    const dx = clamp(e.clientX - x0, -95, 95);

  });
  const end = e => { if (e.pointerId !== pid) return; pid = null; input.padSteer = 0; input.padActive = false; knob.style.transform = ''; };
  for (const [id, fn] of [['gearUp', shiftUp], ['gearDown', shiftDown]]) $(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fn(); });

  area.addEventListener('pointerup', end); area.addEventListener('pointercancel', end); area.addEventListener('lostpointercapture', end);

  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT')) return;

    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(c)) e.preventDefault();

      if (c === 'KeyX') toggleCruise();

const tilt = { on: false, b0: 0, beta: 0 };
function tiltAngle(e) {
  const g = e.accelerationIncludingGravity; if (!g || g.x === null) return null;
  const th = ((window.orientation ?? (screen.orientation ? screen.orientation.angle : 0)) || 0) * Math.PI / 180;
  const ios = /iP(ad|hone|od)|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
  const sgn = ios ? 1 : -1;
  const ax = g.x * sgn, ay = g.y * sgn;
  const sx = ax * Math.cos(th) - ay * Math.sin(th), sy = ax * Math.sin(th) + ay * Math.cos(th);
  return Math.atan2(-sx, -sy);
}
function onMotion(e) { const b = tiltAngle(e); if (b === null) return; tilt.beta = b; let d = b - tilt.b0; d = Math.atan2(Math.sin(d), Math.cos(d)); input.tiltSteer = clamp(d / 0.42, -1, 1); }
function calibrateTilt() { tilt.b0 = tilt.beta; }
async function setSteerMode(mode) {
  if (mode === 'tilt') {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission(); if (r !== 'granted') throw new Error('denied');
      }
      if (typeof DeviceMotionEvent === 'undefined') throw new Error('none');
      let got = false;
      const probe = e => { if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x !== null) got = true; };
      window.addEventListener('devicemotion', probe);
      await new Promise(r => setTimeout(r, 600));
      window.removeEventListener('devicemotion', probe);
      if (!got) throw new Error('no data');
      if (!tilt.on) { window.addEventListener('devicemotion', onMotion); tilt.on = true; }
      setTimeout(calibrateTilt, 100);
      settings.steer = 'tilt'; toast(T.tiltOn, 2.5);
    } catch (e) { settings.steer = 'pad'; toast(T.tiltFail, 2.8); }
  } else settings.steer = 'pad';
  save(); $('steer').classList.toggle('tilt', settings.steer === 'tilt'); chipsUI();
}

/* ---------- title, pause ---------- */
function chip(row, label, pressed, fn, cls = 'chip', style) {
  const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
  if (cls === 'swatch') { b.style.backgroundColor = style; b.setAttribute('aria-label', label); b.title = label; } else b.textContent = label;
  b.addEventListener('click', () => { SFX.click(); fn(); });
  row.appendChild(b);
}
function chipsUI() {
  const pr = $('paintRow'); pr.innerHTML = '';
  PAINTS.forEach((p, i) => chip(pr, T.paints[i], settings.paint === i, () => { setPaint(i); chipsUI(); }, 'swatch', p.css));
  const nm = document.createElement('span'); nm.className = 'paintname'; nm.textContent = T.paints[settings.paint]; pr.appendChild(nm);
  const V = ENGINES[settings.engine];
  $('paintCap').innerHTML = `<b>Chandler 1864</b>${TH ? V.capTh : V.capEn} · ${T.paints[settings.paint]}<br>${TH ? OUTFITS[settings.outfit].th : OUTFITS[settings.outfit].en}`;
  const or = $('outfitRow'); or.innerHTML = '';
  OUTFITS.forEach((o, i) => chip(or, TH ? o.th : o.en, settings.outfit === i, () => { setOutfit(i); chipsUI(); }));
  for (const id of ['engineRow', 'engineRow2']) {
    const er = $(id); er.innerHTML = '';
    ENGINE_LIST.forEach(n => chip(er, TH ? ENGINES[n].th : ENGINES[n].en, settings.engine === n, () => { setEngine(n); chipsUI(); if (AUDIO.E && AUDIO.E.running && state === 'title') titleRev.blipT = 0.5; }));
  }
  for (const id of ['gearRow', 'gearRow2']) {
    const gr = $(id); gr.innerHTML = '';
    [['auto', T.gearAuto], ['manual', T.gearManual]].forEach(([n, l]) => chip(gr, l, settings.gearbox === n, () => { settings.gearbox = n; save(); gearUI(); chipsUI(); }));
  }
  const tr = $('timeRow'); tr.innerHTML = '';
  TIMES.forEach(n => chip(tr, T.times[n], settings.time === n, () => { if (settings.time !== n) fadeTo(() => { setTime(n); chipsUI(); }); }));
  for (const id of ['qualRow', 'qualRow2']) {
    const qr = $(id); qr.innerHTML = '';
    ['auto', 'high', 'medium', 'low'].forEach(n => chip(qr, T.quals[n], settings.quality === n, () => { setQuality(n); chipsUI(); }));
  }
  const sr = $('steerRow'); sr.innerHTML = '';
  chip(sr, T.steerPad, settings.steer !== 'tilt', () => setSteerMode('pad'));
  chip(sr, T.steerTilt, settings.steer === 'tilt', () => setSteerMode('tilt'));
}
function setQuality(n) {
  settings.quality = n; save();
  const lv = n === 'auto' ? 'medium' : n;
  if (lv !== qualityLevel) { qualityLevel = lv; applyQuality(); }
}
function showTitle() {
  state = 'title';
  $('title').hidden = false; $('hud').hidden = true;
  chipsUI();
  $('helpText').innerHTML = T.help;
  revUI();
}
function revUI() {
  const running = !!(AUDIO.E && AUDIO.E.running), V = AUDIO.voice, r = running ? clamp(voiceRpm(bike.rpm) / V.red, 0, 1) : 0;
  const b = $('revBtn'); b.style.setProperty('--r', r.toFixed(3)); b.style.setProperty('--c', r > 0.9 ? '#e0573f' : V.electric ? '#6ca6d1' : '#d6ad5f');
  $('revRpm').textContent = running ? (V.electric ? `${Math.round(r * 100)}%` : `${Math.round(voiceRpm(bike.rpm) / 50) * 50} rpm`) : T.revHold;
}
function toTitle() { bike.v = 0; bike.cruise = 0; cruiseUI(); bike.lean = 0; bike.steer = 0; showTitle(); cam.init = false; }
let titleIdleT = 0;
function startRide() {
  if (state !== 'title') return;
  initAudio();
  const fresh = SFX.start() !== false || !!(AUDIO.E && AUDIO.E.starting);
  titleRev.on = false; $('revBtn').classList.remove('on');
  try {
    const fs = APP.requestFullscreen || APP.webkitRequestFullscreen;
    if (fs && !(document.fullscreenElement || document.webkitFullscreenElement) && matchMedia('(pointer: coarse)').matches) { const r = fs.call(APP); if (r && r.catch) r.catch(() => {}); }
  } catch (e) { /* not allowed here */ }
  state = 'ride';
  $('title').hidden = true; $('hud').hidden = false;
  bike.started = false;
  setTimeout(() => { bike.started = true; bike.rpm = 1700; }, fresh ? 950 : 50);
  cam.init = false;
  HUDS.road = ''; HUDS.dist = '';
  visUI(); soundUI(); cruiseUI(); gearUI();
  if (settings.cam === 3 && !AP.on) apSet(true, true); else autoUI();
  $('steer').classList.toggle('tilt', settings.steer === 'tilt');
  if (settings.steer === 'tilt' && !tilt.on) setSteerMode('tilt');
  resize();
}
function pause(on) {
  if (on && state === 'ride') {
    state = 'pause'; $('pause').hidden = false;
    input.throttle = 0; input.brake = 0; input.padSteer = 0; SFX.horn(false);
    $('stOdo').textContent = settings.odo.toFixed(1); $('stTop').textContent = Math.round(settings.top); $('stVis').textContent = `${settings.visited.length}/${LANDMARKS.length}`;
    const al = $('album'); al.innerHTML = '';
    for (const L of LANDMARKS) { const d = document.createElement('div'); d.textContent = TH ? L.th : L.en; if (settings.visited.includes(L.id)) d.className = 'got'; al.appendChild(d); }
    $('helpText2').innerHTML = T.help;
    chipsUI(); save();
  } else if (!on && state === 'pause') { state = 'ride'; $('pause').hidden = true; }
}

/* ---------- quality watchdog ---------- */
const perf = { t: 0, n: 0, checks: 0 };
function watchPerf(dt) {
  if (settings.quality !== 'auto' || state !== 'ride') return;
  perf.t += dt; perf.n++;
  if (perf.t > 4) {
    const fps = perf.n / perf.t; perf.t = 0; perf.n = 0; perf.checks++;
    if (fps < 36 && qualityLevel !== 'low') { qualityLevel = qualityLevel === 'high' ? 'medium' : 'low'; applyQuality(); toast(T.qualDown, 2.2); }
    else if (fps > 58 && qualityLevel === 'medium' && perf.checks === 2 && (window.devicePixelRatio || 1) >= 2) { qualityLevel = 'high'; applyQuality(); }
  }
}

/* ---------- main loop ---------- */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now; time += dt;
  if (state === 'loading') return;
  if (state === 'ride') { rideUpdate(dt); poseBike(dt, false); updateCamera(dt, settings.cam); hudTimers(dt); }
  else if (state === 'title') {
    const running = !!(AUDIO.E && AUDIO.E.running);
    titleRev.blipT -= dt;
    const revving = running && (titleRev.on || titleRev.blipT > 0);
    titleRev.thr = damp(titleRev.thr, revving ? 1 : 0, revving ? 7 : 10, dt);
    bike.rpm = damp(bike.rpm, revving ? REDLINE + 80 : IDLE, revving ? 1.7 : 2.4, dt);
    bike.pitch = damp(bike.pitch, titleRev.thr * 0.006, 8, dt);
    poseBike(dt, !running);
    updateCamera(dt, 'title');
    if (AUDIO.ready) audioUpdate(dt, { ...audioState(titleRev.thr), rpm: bike.rpm });
    if ((frameNo++ & 1) === 0) revUI();
  } else { poseBike(dt, false); updateCamera(dt, settings.cam); if (AUDIO.ready) audioUpdate(dt, { ...audioState(0), speed: 0, rpm: (bike.rpm = damp(bike.rpm, IDLE, 3, dt)) }); }
  if (state !== 'pause') updateTraffic(dt, bike);
  updateWorldAnim(dt, time);
  // sky follows the camera; the sun's shadow box follows the bike
  sky.position.copy(camera.position); dome.position.copy(camera.position);
  if (moon.userData.dir) moon.position.copy(camera.position).addScaledVector(moon.userData.dir, 1500);
  const sx = Math.round(bike.x / 2) * 2, sz = Math.round(bike.z / 2) * 2;
  sun.target.position.set(sx, 0, sz); sun.position.set(sx + sunDir.x * 160, sunDir.y * 160, sz + sunDir.z * 160);
  if (state === 'ride' || state === 'pause') { if ((frameNo++ & 1) === 0) drawMinimap(); drawGauge(); }
  composer.render();
  watchPerf(dt);
}
let frameNo = 0;

/* ---------- start-up ---------- */
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
async function progress(i) {
  $('loadBar').style.width = `${Math.round(i / 6 * 100)}%`;
  $('loadText').textContent = T.loading[i];
  await nextFrame(); await nextFrame();
}
async function boot() {
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = T[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
  document.title = TH ? 'ล่องกรุง · The Siam Times' : 'Bangkok Cruiser · The Siam Times';
  await progress(0);
  if (document.fonts && document.fonts.load) {
    await Promise.race([Promise.all([document.fonts.load('700 40px Kanit', 'กขค Kan'), document.fonts.load('600 40px Kanit', '0123'), document.fonts.load('40px Chonburi', 'กข'), document.fonts.load('40px Chomsky', 'Chandler')]), new Promise(r => setTimeout(r, 3500))]).catch(() => {});
  }
  buildTextures(); buildBillboard();
  await buildWorld(progress);
  await progress(4); buildTraffic();
  await progress(5); buildBike();
  applyQuality();
  setTime(settings.time);
  poseBike(0, true);
  bindInput(); gearUI(); autoUI();
  cam.init = false; updateCamera(0.016, 'title');
  try { renderer.compile(scene, camera); } catch (e) { /* compile lazily */ }
  await progress(6);
  window.__cruiserBooted = true;
  showTitle();
  $('loading').classList.add('gone');
  setTimeout(() => { $('loading').hidden = true; }, 700);
}
requestAnimationFrame(frame);
boot().catch(err => { console.error(err); $('loadText').textContent = T.loadFail + ' (' + (err && err.message || err) + ')'; });
if (/[?&]debug\b/.test(location.search)) window.__cruiser = { updateTraffic, rideUpdate, input, collide, makePulse, makePop, makeImpulse, softClip, ENGINES, setEngine, setOutfit, apSet, AP, shiftUp, shiftDown, titleRev, snap: () => { cam.init = false; cam.tv = null; }, bike, settings, setTime, CARS, WORLD, camera, startRide, nextCam, pause, BIKE, AUDIO, renderer, get state() { return state; } };

</script>
<script>
/* If the game files never arrive, say so instead of showing an empty bar. */
setTimeout(function () {
  if (window.__cruiserBooted) return;
  var t = document.getElementById('loadText'); if (!t) return;
  t.textContent = document.getElementById('game').getAttribute('data-lang') === 'en' ? 'Still loading. If this stays, check the connection and reload the page.' : 'ยังโหลดอยู่ ถ้าค้างนาน ตรวจอินเทอร์เน็ตแล้วโหลดหน้าใหม่';
}, 20000);
</script>
<script>
/* No zooming: a pinch or a double tap would leave the game half off the screen. */
(() => {
  const stop = e => { const vv = window.visualViewport; if (!vv || vv.scale <= 1.01) e.preventDefault(); };
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) stop(e); }, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) stop(e); }, { passive: false });
  window.addEventListener('wheel', e => { if (e.ctrlKey) stop(e); }, { passive: false });
})();
</script>
