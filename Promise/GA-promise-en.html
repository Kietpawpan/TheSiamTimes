*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--paper);
  font: 16px/1.5 var(--font-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
html:lang(th) body { font-family: "Sarabun", var(--font-text); line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.screen { position: fixed; inset: 0; display: none; }
.screen.on { display: block; }
.fill { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.btn-brass {
  min-height: 50px; padding: 0 26px;
  border: 0; border-radius: 8px;
  background: var(--brass); color: var(--brass-ink);
  font: 700 15px/1 var(--font-label); letter-spacing: .08em; text-transform: uppercase;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22);
  transition: filter .15s, transform .05s;
}
html:lang(th) .btn-brass { font-size: 17px; letter-spacing: .01em; }
.btn-brass:hover { filter: brightness(1.08); }
.btn-brass:active { transform: translateY(1px); }
.btn-line {
  min-height: 42px; padding: 0 16px;
  border: 1px solid var(--rule); border-radius: 8px;
  background: rgba(12, 19, 27, .6);
  font: 600 14px/1 var(--font-label); color: var(--paper);
}
.btn-line:hover { border-color: var(--paper); }
.btn-line[aria-pressed="false"] { color: var(--muted); }
.btn-pill {
  min-height: 34px; padding: 0 14px;
  border: 1px solid var(--rule); border-radius: 999px;
  background: rgba(12, 19, 27, .78);
  font: 600 13px/1 var(--font-label); color: var(--paper);
}
.btn-pill:hover { border-color: var(--paper); }
a.btn-pill { display: inline-flex; align-items: center; text-decoration: none; }

/* ---------- Title ---------- */
.title-panel {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(560px, calc(100% - 32px));
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  text-align: center;
  padding: 28px 26px 26px;
  background: rgba(10, 16, 23, .74);
  border: 1px solid var(--rule); border-top: 2px solid var(--brass);
  border-radius: 12px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
  backdrop-filter: blur(3px);
}
.title-panel .mast { font: 400 clamp(38px, 9vw, 58px)/1 var(--font-mast); }
.title-panel .rule { width: 100%; border-top: 1px solid var(--brass); border-bottom: 1px solid var(--brass); height: 4px; opacity: .7; }
.title-panel h1 { margin: 4px 0 0; font: 700 clamp(30px, 7vw, 44px)/1.15 "Sarabun", var(--font-text); color: var(--brass); text-wrap: balance; }
html:lang(en) .title-panel h1 { font: italic 600 clamp(32px, 7vw, 48px)/1.1 var(--font-text); }
.title-panel .sub { margin: 0; color: var(--muted); font-size: 16px; max-width: 42ch; }
.title-panel .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
.title-panel .progress { font: 600 13px/1.3 var(--font-label); color: var(--paper); letter-spacing: .04em; }
.corner { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; z-index: 2; }
/* a phone on its side: the panel shrinks to fit the height, the buttons stack down the right-hand side */
@media (orientation: landscape) and (max-height: 520px) {
  .corner { flex-direction: column; align-items: flex-end; }
  .title-panel {
    --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
    left: calc(var(--sl) + (100% - var(--sl) - var(--sr) - 130px) / 2);   /* centred in the room left of the buttons */
    width: min(560px, calc(100% - var(--sl) - var(--sr) - 150px));
    gap: 6px; padding: 12px 20px 14px; max-height: calc(100% - 12px); overflow-y: auto;
  }
  .title-panel .mast { font-size: 30px; }
  .title-panel h1 { margin: 0; font-size: 26px; }
  html:lang(en) .title-panel h1 { font-size: 28px; }
  .title-panel .sub { font-size: 14px; line-height: 1.4; }
  .title-panel .row { margin-top: 2px; }
}

/* ---------- Cut scenes ---------- */
.dateline {
  position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px));
  max-width: calc(100% - 130px);
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(12, 19, 27, .72); border: 1px solid var(--rule);
  font: 600 12.5px/1.3 var(--font-label); letter-spacing: .06em; text-transform: uppercase;
  color: var(--paper);
  transition: opacity .5s;
}
html:lang(th) .dateline { font-size: 13.5px; letter-spacing: .01em; text-transform: none; }
.cut-corner { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.caption {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  width: min(880px, calc(100% - 24px));
  padding: 14px 20px 18px;
  background: rgba(10, 16, 23, .86);
  border: 1px solid var(--rule); border-top: 2px solid var(--brass);
  border-radius: 10px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
  cursor: pointer;
  user-select: none; -webkit-user-select: none;
}
.caption .who { display: block; min-height: 1.2em; font: 700 12px/1.2 var(--font-label); letter-spacing: .12em; text-transform: uppercase; color: var(--brass); margin-bottom: 6px; }
html:lang(th) .caption .who { font-size: 14px; letter-spacing: .02em; text-transform: none; }
.caption .say { margin: 0; font-size: clamp(17px, 2.3vw, 21px); line-height: 1.6; min-height: 3.2em; text-wrap: pretty; }
.caption .say.letter { font-style: italic; font-family: var(--font-text); color: #f4ead2; }
html:lang(th) .caption .say.letter { font-family: "Sarabun", var(--font-text); }
.caption .more { position: absolute; right: 16px; bottom: 8px; color: var(--brass); font: 700 14px/1 var(--font-label); animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(3px); opacity: .5; } }
.card-title {
  position: absolute; inset: 0;
  display: grid; place-content: center; justify-items: center; gap: 6px;
  text-align: center; pointer-events: none;
  transition: opacity .8s;
  padding: 0 20px;
}
.card-title .kicker { font: 700 13px/1.2 var(--font-label); letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
html:lang(th) .card-title .kicker { font-size: 16px; letter-spacing: .04em; }
.card-title .sortbig { width: 92px; height: 116px; margin: 8px 0; }

/* ---------- Scene art ----------
   Every scene is painted on a 1600 × 900 picture, in metres-free picture units, every frame,
   with a little life in it (rain, lamps, water, steam). 1864–65 is drawn in sepia ink like an
   engraving; tonight in the dark blues and lamp light of the Siam Times games. */
const INK = '#3b2c1c', SEPIA_HI = '#efe0bd';
const NIGHT_INK = '#0b1119';
function lin(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); for (const [o, col] of stops) g.addColorStop(o, col); return g; }

    c.moveTo(cx - ca * d / 2 - sa * k, cy - sa * d / 2 + ca * k); c.lineTo(cx + ca * d / 2 - sa * k, cy + sa * d / 2 + ca * k);

function mastText(c, x, y, size, col, align = 'center') {

  c.fillStyle = '#efe7d4'; c.fillRect(x - w / 2, y - h / 2, w, h);
  c.strokeStyle = '#8f6f3a'; c.lineWidth = 3; c.strokeRect(x - w / 2 + 6, y - h / 2 + 6, w - 12, h - 12);
  mastText(c, x, y - (sub ? h * 0.1 : 0), h * 0.5, '#1d1a16');
  if (sub) { c.font = `italic ${h * 0.16}px Newsreader, Georgia, serif`; c.fillStyle = '#5b5246'; c.fillText(sub, x, y + h * 0.3); }

function rain(c, t, n, a = 0.35, x0 = 0, y0 = 0, w = 1600, h = 900, wind = 0.18) {
  c.save(); c.beginPath(); c.rect(x0, y0, w, h); c.clip();
  c.strokeStyle = `rgba(190,210,235,${a})`; c.lineWidth = 1.4; c.beginPath();

function person(c, x, y, h, o = {}) { // a silhouette standing (feet at y), rim-lit from one side

  c.restore();
}
function sortBlock(c, x, y, w, h, letter, kind) { // a piece of type standing up, face towards us
  const lead = kind !== 2;

  c.fillStyle = lin(c, x, y, x + w, y, lead ? [[0, '#6d737a'], [0.3, '#b4bac0'], [1, '#5e646b']] : [[0, '#9a7029'], [0.3, '#f3d48e'], [1, '#8a6322']]);

  c.strokeStyle = '#05080c'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, y - 30); c.stroke();

/* ---- 1864: the press house on the Chao Phraya ---- */
function sceneRiver1865(c, t) {
  box(c, 0, 0, 1600, 900, lin(c, 0, 0, 0, 520, [[0, '#e9dab6'], [1, '#dcbf8f']]));
  circ(c, 1200, 250, 74, '#f4e6c2'); c.strokeStyle = 'rgba(59,44,28,.25)'; c.lineWidth = 1.2;
  for (let r = 90; r < 200; r += 14) { c.beginPath(); c.arc(1200, 250, r, Math.PI * 1.05, Math.PI * 1.95); c.stroke(); }
  for (const [cx, cy, w] of [[320, 150, 260], [820, 110, 200], [1450, 170, 220]]) { // clouds, hatched
    const x = cx + Math.sin(t * 0.05 + cx) * 20;
    c.fillStyle = 'rgba(244,230,194,.9)'; c.beginPath(); c.ellipse(x, cy, w / 2, 30, 0, 0, 7); c.fill();
    hatch(c, x - w / 2, cy, w, 32, 0, 6, 'rgba(59,44,28,.25)', 1);
  }
  // far bank: shophouses, palms, a prang
  const bank = 470;
  for (let k = 0; k < 16; k++) {
    const x = 520 + k * 72, h = 40 + ((k * 37) % 30);
    box(c, x, bank - h, 66, h, '#8e7350'); poly(c, [[x - 6, bank - h], [x + 33, bank - h - 26], [x + 72, bank - h]], '#6e5638');
    hatch(c, x, bank - h, 66, h, Math.PI / 2.3, 7, 'rgba(59,44,28,.35)', 1);
  }
  poly(c, [[1040, bank], [1062, 250], [1072, 205], [1082, 250], [1104, bank]], '#7a603f');
  for (let k = 0; k < 5; k++) { c.strokeStyle = INK; c.lineWidth = 1.5; c.beginPath(); c.moveTo(1050 + k * 2, 300 + k * 34); c.lineTo(1094 - k * 2, 300 + k * 34); c.stroke(); }
  for (const px of [610, 760, 1240, 1390]) {
    c.strokeStyle = '#5a4630'; c.lineWidth = 5; c.beginPath(); c.moveTo(px, bank); c.quadraticCurveTo(px + 8, bank - 80, px + 4, bank - 140); c.stroke();
    for (let f = 0; f < 6; f++) { const a = -Math.PI / 2 + (f - 2.5) * 0.5 + Math.sin(t + f) * 0.04; c.beginPath(); c.moveTo(px + 4, bank - 140); c.quadraticCurveTo(px + 4 + Math.cos(a) * 30, bank - 160 + Math.sin(a) * 20, px + 4 + Math.cos(a) * 60, bank - 130 + Math.sin(a) * 30); c.stroke(); }
  }
  // river
  box(c, 0, bank, 1600, 900 - bank, lin(c, 0, bank, 0, 900, [[0, '#cdb186'], [1, '#b8996c']]));
  c.strokeStyle = 'rgba(59,44,28,.28)'; c.lineWidth = 1.3; c.beginPath();
  for (let y = bank + 8; y < 900; y += 9 + (y - bank) * 0.03) {
    const o = (t * 18 * (1 + (y - bank) / 300)) % 80;
    for (let x = -80 + o; x < 1600; x += 80) { c.moveTo(x, y); c.lineTo(x + 30 + (y - bank) * 0.06, y); }
  }
  c.stroke();
  c.strokeStyle = 'rgba(250,240,210,.8)'; c.lineWidth = 2; c.beginPath();
  for (let k = 0; k < 20; k++) { const y = bank + 12 + k * 14, w = 50 - k * 1.5 + Math.sin(t * 3 + k) * 10; c.moveTo(1200 - w / 2, y); c.lineTo(1200 + w / 2, y); }
  c.stroke();
  // paddle steamer crossing, smoke rising
  const sx = ((t * 14) % 2000) - 200;
  poly(c, [[sx, 545], [sx + 230, 545], [sx + 210, 575], [sx + 20, 575]], '#4a3826');
  box(c, sx + 40, 515, 150, 30, '#6e5638'); box(c, sx + 100, 455, 18, 62, INK);
  c.beginPath(); c.arc(sx + 120, 552, 26, Math.PI, 0); c.fillStyle = '#5a4630'; c.fill();
  for (let k = 0; k < 6; k++) { const p = ((t * 0.5 + k / 6) % 1); circ(c, sx + 109 - p * 60, 450 - p * 140, 10 + p * 26, `rgba(110,90,66,${0.35 * (1 - p)})`); }

  for (const [bx, by, sp] of [[700, 640, 6], [1000, 760, -4]]) {
    const x = (bx + t * sp + 1800) % 1800 - 100, y = by + Math.sin(t * 1.3 + bx) * 3;

    c.beginPath(); c.ellipse(x - 10, y - 10, 34, 18, 0, Math.PI, 0); c.fillStyle = '#7a603f'; c.fill();
    person(c, x + 55, y, 70, { col: '#3b2c1c' });
    c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(x + 60, y - 50); c.lineTo(x + 110, y + 26); c.stroke();

  poly(c, [[-30, 300], [260, 190], [550, 300]], '#6e5638'); hatch(c, 0, 190, 550, 110, 0.5, 8, 'rgba(59,44,28,.35)', 1);
  for (const wx of [60, 200, 340]) { box(c, wx, 360, 80, 90, '#3b2c1c'); glow(c, wx + 40, 405, 70, 'rgba(255,200,120,.35)'); box(c, wx + 6, 366, 68, 78, 'rgba(240,190,110,.55)'); }
  box(c, 120, 238, 290, 52, '#efe0bd'); c.strokeStyle = INK; c.lineWidth = 3; c.strokeRect(126, 244, 278, 40);

/* ---- 1865: Chandler's desk at night ---- */

  c.strokeStyle = '#2a2016'; c.lineWidth = 14; c.strokeRect(1140, 140, 320, 400); c.beginPath(); c.moveTo(1300, 140); c.lineTo(1300, 540); c.moveTo(1140, 340); c.lineTo(1460, 340); c.stroke();

  const f = L.focus || [800, 450, 1];
  cut.goal = { x: f[0], y: f[1], z: f[2] };
  cut.segs = seg(L.text); cut.shown = REDUCED ? cut.segs.length : 0;
  $('who').textContent = L.who ? T.who[L.who] : '';
  $('say').classList.toggle('letter', LETTER_SPEAKERS.has(L.who));
  $('dateline').textContent = L.date || '';
  $('dateline').style.opacity = L.date ? 1 : 0;
  renderSay();
}
function renderSay() {
  $('say').textContent = cut.segs.slice(0, cut.shown).join('');
  $('more').style.visibility = cut.shown >= cut.segs.length ? 'visible' : 'hidden';
}
function endCut() {
  const fn = cut.onDone; cut.onDone = null; cut.lines = [];
  if (fn) fn();
}
$('caption').addEventListener('click', () => { audioInit(); advance(); });
$('cutCv').addEventListener('click', () => { audioInit(); advance(); });
$('cSkip').addEventListener('click', e => { e.stopPropagation(); audioInit(); endCut(); });
window.addEventListener('keydown', e => {
  if (screen !== 'cut' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); audioInit(); advance(); }
  else if (e.key === 'Escape') { e.preventDefault(); endCut(); }
});

function frameCut(now, dt) {
  const t = now / 1000;
  // typing
  if (cut.i >= 0 && cut.shown < cut.segs.length && !(cut.card && t - cut.cardT < 2.6)) {
    cut.typeAcc += dt * (LANG === 'th' ? 42 : 48);
    let n = 0;
    while (cut.typeAcc >= 1 && cut.shown < cut.segs.length) { cut.typeAcc -= 1; cut.shown++; n++; }
    if (n) { renderSay(); if (cut.shown % 3 === 0 && cut.segs[cut.shown - 1] !== ' ') sfx.type(); }
  }
  // the chapter card fades in and out over the first scene
  if (cut.card) {
    const k = t - cut.cardT;
    const a = k < 0 ? 0 : k < 0.6 ? k / 0.6 : k < 2.0 ? 1 : k < 2.6 ? 1 - (k - 2.0) / 0.6 : 0;
    $('cardTitle').style.opacity = a;
    if (k >= 2.6 || k < 0) { cut.card = null; $('caption').style.visibility = ''; $('cardTitle').style.opacity = 0; }
  }
  // scene change: fade to ink, swap, fade back
  let fade = cut.card ? 0.55 : 0;
  if (cut.next) {
    const k = t - cut.switchAt;
    if (k < 0.4) fade = Math.max(fade, k / 0.4);
    else { cut.scene = cut.next; cut.next = null; cut.sceneT0 = t - 0.0; setAmbience(AMB_OF[cut.scene.split(':')[0]] || 'room'); fade = 1; cut.switchAt = t; cut.cam = { ...cut.goal, z: cut.goal.z * 0.96 }; }
  } else if (t - cut.switchAt < 0.9) fade = Math.max(fade, 1 - (t - cut.switchAt - 0.4) / 0.5);
  // slow camera drift towards this line's focus (a Ken Burns move)
  const k = 1 - Math.exp(-dt * 0.9);
  cut.cam.x += (cut.goal.x - cut.cam.x) * k; cut.cam.y += (cut.goal.y - cut.cam.y) * k;
  cut.cam.z += (cut.goal.z * 1.04 - cut.cam.z) * k * 0.6;
  const st = t - cut.sceneT0;
  if (cut.scene === 'building' && (st % 9.5) < cut.lastFlash) sfx.thunder();
  cut.lastFlash = st % 9.5;
  drawScene($('cutCv'), cut.scene, st, cut.cam, null, fade);
}

/* Lines for the prologue, a chapter's intro or outro, and the epilogue */
function linesOf(script, texts, dates) {
  return script.map((s, i) => ({ scene: s[0], who: s[1], focus: s[2], text: texts[i], date: dates ? dates[s[3]] : null }));
}
function chapterLines(i, part) {
  const ch = CH[i], tx = T.ch[i];
  return linesOf(ch[part], tx[part]).map(l => Object.assign(l, { date: `${ch.time} · ${tx.place}` }));
}

/* ---------- The story's flow ---------- */
function playPrologue() {
  playCut(linesOf(PROLOGUE, T.prologue, T.datePro), {
    card: { kicker: 'The Siam Times', title: T.gameName, place: T.datePro[0] },
    onDone: () => { save.prologue = true; persist(); showWorld(); },
  });
}
function playEpilogue() {
  playCut(linesOf(EPILOGUE, T.epilogue, T.dateEnd), {
    card: { kicker: '06:00', title: T.headDone, place: T.dateEnd[0] }, music: true,
    onDone: () => { const first = !save.ending; save.ending = true; persist(); showWorld(13); if (first) sfx.fanfare(); },
  });
}
function chapterCard(i) {
  return { kicker: `${T.chap(i + 1)} · ${CH[i].time}`, title: T.ch[i].title, place: `${T.ch[i].place} · ${T.games[CH[i].key]}`, letter: MAST[i], kind: save.sorts[i] };
}
function startChapter(i) {
  if (i >= 12) { playEpilogue(); return; }
  playCut(chapterLines(i, 'intro'), { card: chapterCard(i), onDone: () => openGame(i) });
}
function playOutro(i) {
  pendingOutro = -1;
  const lines = chapterLines(i, 'outro');
  const go = () => { if (nextChapter() >= 12) playEpilogue(); else showWorld(); };
  if (!lines.length) { go(); return; }
  playCut(lines, { onDone: go });
}

/* ---------- Contents page ---------- */
function showMap() {
  renderMap();
  showScreen('map');
  $('map').scrollTop = 0;
}
function renderMap() {
  const n = sortsWon(), next = nextChapter();
  $('ruleMid').textContent = T.ruleMid(n);
  $('mHead').textContent = save.ending ? T.headDone : T.headMid;
  $('mDeck').textContent = save.ending ? T.deckDone : T.deck;
  const stick = $('stick'); stick.innerHTML = '';
  for (let k = 0; k < 12; k++) {
    if (k === 3 || k === 7) { const g = document.createElement('span'); g.className = 'gap'; stick.appendChild(g); }
    stick.appendChild(sortEl(MAST[k], save.sorts[k], save.prologue && k === next ? 'next' : ''));
  }
  stick.setAttribute('aria-label', `The Siam Times: ${n}/12`);
  const lead = save.sorts.filter(v => v === 1).length, brass = save.sorts.filter(v => v === 2).length;
  $('stickNote').textContent = T.stickNote(lead, brass);
  const nb = $('mNext');
  nb.textContent = !save.prologue ? T.prologueBtn : next >= 12 ? T.epilogueBtn : next === 11 ? T.pressBtn : T.nextBtn(next + 1, MAST[next]);
  const list = $('chapters'); list.innerHTML = '';
  CH.forEach((ch, i) => {
    const tx = T.ch[i], won = save.sorts[i], open = isOpen(i);
    const el = document.createElement('section');
    el.className = 'ch' + (open ? '' : ' locked');
    el.appendChild(sortEl(MAST[i], won, save.prologue && i === next ? 'next' : ''));
    const h = document.createElement('h3'); h.textContent = `${T.chap(i + 1)} · ${tx.title}`; el.appendChild(h);
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = `${ch.time} · ${tx.place} · ${T.games[ch.key]}`; el.appendChild(m);
    const st = document.createElement('div'); st.className = 'state';
    st.textContent = won === 2 ? T.stBrass : won === 1 ? T.stLead : open ? T.stOpen : T.stLocked;
    el.appendChild(st);
    if (open) {
      const acts = document.createElement('div'); acts.className = 'acts';
      const btn = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tbtn'; b.textContent = label; b.addEventListener('click', () => { audioInit(); fn(); }); acts.appendChild(b); };
      if (!won) btn(T.play, () => startChapter(i));
      else {
        btn(T.replay, () => openGame(i));
        btn(T.rewatch, () => playCut(chapterLines(i, 'intro'), { card: chapterCard(i), onDone: showMap }));
      }
      el.appendChild(acts);
    }
    list.appendChild(el);
  });
}
$('mNext').addEventListener('click', () => {
  audioInit();
  const next = nextChapter();
  if (!save.prologue) playPrologue(); else if (next >= 12) playEpilogue(); else startChapter(next);
});
$('mTitle').addEventListener('click', () => { audioInit(); showTitle(); });
$('mWorld').addEventListener('click', () => { audioInit(); showWorld(); });
$('mReset').addEventListener('click', () => {
  audioInit();
  modal({ label: T.reset, title: T.resetQ, text: T.resetText, ok: [T.resetYes, () => {
    save.sorts = save.sorts.map(() => 0); save.prologue = false; save.ending = false; save.results = []; save.mapAt = 0; persist(); showTitle();
  }], alt: [T.cancel, null] });
});

/* ---------- A game in its frame ---------- */
let playing = -1, pendingOutro = -1, reported = false;
function openGame(i) {
  playing = i; reported = false;
  const ch = CH[i];
  showScreen('play');
  setSort($('pSort'), MAST[i], save.sorts[i]);
  $('pT1').textContent = `${T.chap(i + 1)} · ${T.games[ch.key]} — ${T.ch[i].title}`;
  $('pT2').textContent = `${T.goal}: ${T.ch[i].goal}`;
  $('frame').title = T.frameTitle(T.games[ch.key]);
  // Checkers speaks Thai too: open it in the story's language, unless the player has picked one in the game
  if (ch.key === 'checkers') try { const k = 'st-checkers.settings', s = JSON.parse(localStorage.getItem(k) || '{}'); if (!s.langChosen) { s.lang = LANG; s.langChosen = true; localStorage.setItem(k, JSON.stringify(s)); } } catch (e) { /* no storage */ }
  $('frame').src = ch.url[LANG];
  setTimeout(() => { try { $('frame').focus(); } catch (e) { /* ignore */ } }, 400);
}
function closeGame() {
  $('frame').src = 'about:blank';
  playing = -1;
}
$('pBack').addEventListener('click', () => {
  audioInit();
  const i = playing;
  closeGame();
  if (pendingOutro === i && i >= 0) playOutro(i); else showWorld(i + 1);
});
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object' || d.tst !== 'story') return;
  if (playing < 0 || e.source !== $('frame').contentWindow || d.game !== CH[playing].key) return;
  sortWon(playing, d);
});
function resultLine(i, r) {
  if (VERSUS.has(CH[i].key)) return r.draw ? T.resultDraw : r.won ? T.resultWon : T.resultLost;
  if (r.text) return T.resultScore(r.text);
  return r.score != null ? T.resultScore(typeof r.score === 'number' ? Math.round(r.score).toLocaleString(LANG === 'th' ? 'th-TH' : 'en-GB') : r.score) : T.resultWon;
}
function sortWon(i, r) {
  const kind = CH[i].brass(r) ? 2 : 1;
  const prev = save.sorts[i], first = !prev, up = prev === 1 && kind === 2;
  if (reported && !up) return;
  reported = true;
  save.sorts[i] = Math.max(prev, kind);
  save.results[i] = { won: !!r.won, draw: !!r.draw, score: r.score ?? null };
  persist();
  if (first) pendingOutro = i;
  setSort($('pSort'), MAST[i], save.sorts[i]);
  sfx.clink(save.sorts[i] === 2);
  const line = resultLine(i, r) + ' · ';
  modal({
    label: T.gotLabel, sort: [MAST[i], save.sorts[i]], title: T.gotTitle(MAST[i]),
    text: line + (up ? T.gotUp : save.sorts[i] === 2 ? T.gotBrass : T.gotLead),
    ok: [T.goOn, () => { closeGame(); if (first) playOutro(i); else showWorld(i + 1); }],
    alt: [T.stay, null],
  });
}

/* ---------- Dialog ---------- */
let mdOk = null, mdAlt = null;
function modal({ label, sort = null, title, text, ok, alt }) {
  $('mdLabel').textContent = label; $('mdTitle').textContent = title; $('mdText').textContent = text;
  const s = $('mdSort'); s.hidden = !sort; if (sort) { setSort(s, sort[0], sort[1]); s.style.animation = 'none'; void s.offsetWidth; s.style.animation = ''; }
  $('mdOk').textContent = ok[0]; mdOk = ok[1];
  $('mdAlt').hidden = !alt; if (alt) { $('mdAlt').textContent = alt[0]; mdAlt = alt[1]; }
  $('modal').hidden = false;
  setTimeout(() => $('mdOk').focus(), 30);
}
$('mdOk').addEventListener('click', () => { $('modal').hidden = true; const f = mdOk; mdOk = null; if (f) f(); });
$('mdAlt').addEventListener('click', () => { $('modal').hidden = true; const f = mdAlt; mdAlt = null; if (f) f(); });

/* ---------- Title ---------- */
function showTitle() {
  const n = sortsWon(), next = nextChapter();
  $('tProgress').textContent = T.progress(n);
  $('tStart').textContent = !save.prologue ? T.begin : T.openMap;
  showScreen('title');
}
$('tStart').addEventListener('click', () => {
  audioInit();
  const next = nextChapter();
  if (!save.prologue) playPrologue(); else showWorld();
});
$('tContents').addEventListener('click', () => { audioInit(); showMap(); });
// About: who made it, fact and fiction, privacy, sound, fonts
(function about() {
  const body = $('abBody');
  for (const [h, p] of T.about) {
    if (h) { const e = document.createElement('h3'); e.textContent = h; body.appendChild(e); }
    const e = document.createElement('p'); e.textContent = p; body.appendChild(e);
  }
  const ul = document.createElement('ul');
  for (const f of T.fonts) { const li = document.createElement('li'); li.textContent = f; ul.appendChild(li); }
  body.appendChild(ul);
  const close = () => { $('about').hidden = true; $('tAbout').focus(); };
  $('tAbout').addEventListener('click', () => { audioInit(); $('about').hidden = false; $('about').querySelector('.mcard').scrollTop = 0; setTimeout(() => $('abClose').focus({ preventScroll: true }), 30); });
  $('abClose').addEventListener('click', close);
  $('about').addEventListener('click', e => { if (e.target === $('about')) close(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('about').hidden) { e.preventDefault(); close(); } });
})();
document.addEventListener('pointerdown', () => audioInit(), { passive: true });
document.addEventListener('visibilitychange', () => { if (AU.ctx) { if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); } });

/* ---------- Main loop ---------- */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  if (screen === 'title') drawScene($('titleCv'), save.ending ? 'sunrise' : 'building', now / 1000, { x: 800, y: 420, z: 1.02 + 0.03 * Math.sin(now / 9000) }, null);
  else if (screen === 'cut') frameCut(now, dt);
  else if (screen === 'world') frameWorld(now, dt);
  scheduleMusic();
  ambienceEvents(dt);
}

/* ---------- Start ---------- */
soundLabels();
showTitle();
if (document.fonts && document.fonts.load) document.fonts.load('40px Chomsky').catch(() => {});
requestAnimationFrame(frame);
})();
</script>
<script>
/* No zooming: a pinch or a double tap would leave the game half off the screen and stuck.
   If the page is zoomed in all the same (Safari lets people zoom whatever a page asks), nothing is
   blocked any more, so it can be pinched back, and a note in the middle of the screen says how. */
(() => {
  const own = window.visualViewport;
  let vv = own;
  try { if (window.top !== window && window.top.visualViewport) vv = window.top.visualViewport; } catch (e) { /* a page from another site around this one */ }
  const zoomed = () => !!vv && vv.scale > 1.01;
  const stop = e => { if (!zoomed()) e.preventDefault(); };
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) stop(e); }, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) stop(e); }, { passive: false });
  window.addEventListener('wheel', e => { if (e.ctrlKey) stop(e); }, { passive: false });
  window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) stop(e); });
  document.documentElement.style.touchAction = 'manipulation';
  if (!own || window.top !== window) return;
  const th = /^th/i.test(document.documentElement.lang);
  let note = null;
  const show = () => {
    const z = zoomed();
    if (!note) {
      if (!z) return;
      note = document.createElement('div');
      note.setAttribute('role', 'status');
      note.style.cssText = 'position:fixed;left:0;top:0;z-index:2147483647;transform-origin:0 0;width:max-content;max-width:300px;padding:14px 18px;border-radius:12px;background:#b23a2e;color:#fff;font:600 17px/1.45 system-ui,-apple-system,"Sarabun",sans-serif;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;';
      note.textContent = th ? 'หน้าจอถูกขยายอยู่ ใช้สองนิ้วบีบเข้าหากันเพื่อย่อกลับ แล้วเล่นต่อได้' : 'The page is zoomed in. Pinch with two fingers to zoom back out, then carry on.';
      document.body.appendChild(note);
    }
    note.style.display = z ? 'block' : 'none';
    if (z) note.style.transform = `translate(${own.offsetLeft + own.width / 2}px, ${own.offsetTop + own.height * 0.42}px) scale(${1 / own.scale}) translate(-50%, -50%)`;
  };
  own.addEventListener('resize', show);
  own.addEventListener('scroll', show);
})();
</script>
</body>
