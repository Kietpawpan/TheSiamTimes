/* Layout: a top-down photo of a teak table under a lamp. The board sits in the middle; each
   player's name card and the caps they have taken lie on the table beside it (left and right
   on wide screens, above and below on phones). A thin header runs across the top.
   Deliberately one look (warm wood), so there are no light/dark theme blocks. */
:root {
  color-scheme: dark;
  --teak: #6b4224;        /* table colour before the wood texture is drawn */
  --paper: #f2e8d2;       /* newsprint cream: name cards, dialogs, header text */
  --paper-dim: #dccfb3;
  --ink: #21160d;         /* text on paper */
  --ink-soft: #5e4b38;
  --glass: rgba(28, 15, 6, .6);   /* header controls lying on the wood */
  --line: rgba(242, 232, 210, .26);
  --brass: #dcae58;       /* whose turn, primary button, focus, must-capture ring */
  --brass-ink: #2a1c05;
  --hint: rgba(255, 240, 200, .92);
  --font-mast: "Chomsky", "Old English Text MT", "UnifrakturCook", serif;
  --font-head: "Trirong", "Newsreader", Georgia, serif;
  --font-text: "Newsreader", "Trirong", Georgia, serif;
  --font-ui: "IBM Plex Sans Thai", "Helvetica Neue", Arial, sans-serif;
  --bs: 480px; --F: 36px; --sq: 51px; --cap: 47px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--teak);
  color: var(--paper);
  font: 15px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

#table { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.app {
  position: relative; z-index: 1; height: 100%;
  display: grid; grid-template-rows: auto minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Header ---------- */
.topbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; padding-block: 12px 6px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
.brand h1 { margin: 0; font: 700 22px/1.15 var(--font-head); color: var(--paper); }
.brand span { font: italic 400 15px/1 var(--font-text); color: var(--paper-dim); white-space: nowrap; }
.status { flex: 1 1 240px; min-width: 0; display: flex; justify-content: center; }
.status p {
  margin: 0; padding: 6px 14px; border-radius: 999px; max-width: 100%;
  background: var(--glass); border: 1px solid var(--line);
  font: 500 14px/1.35 var(--font-ui); text-align: center; text-wrap: balance;
}
.status p.flash { border-color: var(--brass); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--glass); color: var(--paper);
  font: 500 14px/1 var(--font-ui); white-space: nowrap;
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.btn:hover { border-color: var(--brass); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: transparent; font-weight: 600; }
.btn.icon { padding: 6px 9px; min-width: 38px; }
.btn svg { width: 18px; height: 18px; display: block; }
@media (max-width: 720px) {
  .status { order: 3; flex-basis: 100%; }
  .btn { font-size: 13.5px; }
  .brand span { display: none; }
  .topbar { gap: 8px 10px; padding-block: 10px 4px; }
  .actions { gap: 6px; }
  .btn { padding: 6px 9px; }
  .btn.icon { min-width: 34px; padding: 6px 7px; }
}

/* ---------- Table and board ---------- */
.arena { position: relative; min-height: 0; }
.board {
  position: absolute; left: 0; top: 0; width: var(--bs); height: var(--bs);
  border-radius: calc(var(--bs) * .012);
  box-shadow:
    0 1px 2px rgba(0, 0, 0, .55),
    calc(var(--bs) * .006) calc(var(--bs) * .012) calc(var(--bs) * .016) rgba(18, 7, 0, .45),

<script id="engine-src">
/* Engine: Thai checkers (หมากฮอส) rules and the computer player. Pure functions, no DOM,
   so the same source also runs inside the AI worker.
   Board: 64 cells, row 0 at the top. +1/+2 = bottom side man/king, -1/-2 = top side.
   The bottom side moves up the board, the top side moves down. */
(function (root) {
  'use strict';
  var WIN = 100000;
  var DIRS = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  function sgn(p) { return p > 0 ? 1 : p < 0 ? -1 : 0; }

    var b = new Int8Array(64);
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      if (!((r + c) & 1)) continue;
      if (r < 2) b[r * 8 + c] = -1;
      else if (r > 5) b[r * 8 + c] = 1;

  function mk(from, path, caps, capv, promote) {
    return { from: from, to: path[path.length - 1], path: path.slice(), caps: caps.slice(), capv: capv.slice(), promote: promote };
  }

  // Every capture sequence for the piece p standing on s. Captured caps leave the board at once
  // (Thai rule), so b is changed during the search and put back afterwards.
  function capSeq(b, s, p, from, path, caps, capv, out) {
    var side = sgn(p), r = s >> 3, c = s & 7, any = false, i, m, t, cv, r2, c2;
    if (p === side) {

      for (i = -1; i <= 1; i += 2) {
        r2 = r + 2 * dr; c2 = c + 2 * i;
        if (r2 < 0 || r2 > 7 || c2 < 0 || c2 > 7) continue;
        m = (r + dr) * 8 + (c + i); t = r2 * 8 + c2;
        if (b[t] !== 0 || sgn(b[m]) !== -side) continue;
        any = true;
        cv = b[m]; b[m] = 0; b[s] = 0; b[t] = p;
        path.push(t); caps.push(m); capv.push(cv);
        var promo = r2 === (side === 1 ? 0 : 7);
        if (promo || !capSeq(b, t, p, from, path, caps, capv, out)) out.push(mk(from, path, caps, capv, promo));
        path.pop(); caps.pop(); capv.pop();
        b[t] = 0; b[s] = p; b[m] = cv;
      }
    } else {
      for (var d = 0; d < 4; d++) {
        var ddr = DIRS[d][0], ddc = DIRS[d][1], rr = r + ddr, cc = c + ddc;
        while (rr >= 0 && rr < 8 && cc >= 0 && cc < 8 && b[rr * 8 + cc] === 0) { rr += ddr; cc += ddc; }
        if (rr < 0 || rr > 7 || cc < 0 || cc > 7) continue;
        m = rr * 8 + cc;
        if (sgn(b[m]) !== -side) continue;
        r2 = rr + ddr; c2 = cc + ddc;
        if (r2 < 0 || r2 > 7 || c2 < 0 || c2 > 7) continue;
        t = r2 * 8 + c2;
        if (b[t] !== 0) continue;       // a king must land on the square right behind the cap it takes
        any = true;
        cv = b[m]; b[m] = 0; b[s] = 0; b[t] = p;
        path.push(t); caps.push(m); capv.push(cv);
        if (!capSeq(b, t, p, from, path, caps, capv, out)) out.push(mk(from, path, caps, capv, false));
        path.pop(); caps.pop(); capv.pop();
        b[t] = 0; b[s] = p; b[m] = cv;
      }
    }
    return any;
  }

  function genMoves(b, side) {
    var out = [], s, p;
    for (s = 0; s < 64; s++) {
      p = b[s];
      if (p !== 0 && sgn(p) === side) capSeq(b, s, p, s, [], [], [], out);
    }
    if (out.length) return out;      // capturing is compulsory
    for (s = 0; s < 64; s++) {
      p = b[s];
      if (p === 0 || sgn(p) !== side) continue;
      var r = s >> 3, c = s & 7;
      if (p === side) {
        var r2 = r + (side === 1 ? -1 : 1);
        if (r2 < 0 || r2 > 7) continue;
        for (var i = -1; i <= 1; i += 2) {
          var c2 = c + i;
          if (c2 < 0 || c2 > 7) continue;
          var t = r2 * 8 + c2;
          if (b[t] === 0) out.push({ from: s, to: t, path: [t], caps: [], capv: [], promote: r2 === (side === 1 ? 0 : 7) });
        }
      } else {
        for (var d = 0; d < 4; d++) {
          var rr = r + DIRS[d][0], cc = c + DIRS[d][1];
          while (rr >= 0 && rr < 8 && cc >= 0 && cc < 8 && b[rr * 8 + cc] === 0) {
            var tt = rr * 8 + cc;
            out.push({ from: s, to: tt, path: [tt], caps: [], capv: [], promote: false });

      }
    }

  }

  function apply(b, mv) {
    var n = b.slice(), p = n[mv.from];
    n[mv.from] = 0;
    for (var i = 0; i < mv.caps.length; i++) n[mv.caps[i]] = 0;
    n[mv.to] = mv.promote ? 2 * sgn(p) : p;
    return n;
  }

  function key(b, side) { return side + ':' + Array.prototype.join.call(b, ''); }

  // ---- evaluation ----
  var KING = 310;
  var ADV = [0, 2, 5, 9, 14, 20, 28, 0];
  var CEN = new Int8Array(64), KPOS = new Int8Array(64);
  (function () {
    for (var s = 0; s < 64; s++) {

/* ---------------- Table ---------------- */
function drawTable() {
  const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(1.5, window.devicePixelRatio || 1);
  tableCv.width = Math.round(w * dpr); tableCv.height = Math.round(h * dpr);
  const ctx = tableCv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rnd = mulberry32(1864);
  const plankH = clamp(V ? V.bs * 0.3 : 170, 110, 250);
  const scale = plankH / (TX.table.height * 0.45);
  let y = -rnd() * plankH * 0.6;
  while (y < h) {
    let x = -rnd() * 500;
    while (x < w) {
      const len = Math.min(TX.table.width * scale, 520 + rnd() * 900);
      const sw = len / scale, shh = plankH / scale;
      const sx = rnd() * (TX.table.width - sw), sy = rnd() * (TX.table.height - shh);
      const flipY = rnd() < 0.5;
      ctx.save();
      if (flipY) { ctx.translate(0, 2 * y + plankH); ctx.scale(1, -1); }
      ctx.drawImage(TX.table, sx, sy, sw, shh, x, y, len, plankH);
      ctx.restore();
      ctx.fillStyle = rnd() < 0.5 ? 'rgba(255,214,160,' + (rnd() * 0.08).toFixed(3) + ')' : 'rgba(40,18,4,' + (0.04 + rnd() * 0.12).toFixed(3) + ')';
      ctx.fillRect(x, y, len, plankH);
      ctx.fillStyle = 'rgba(22,9,2,.75)'; ctx.fillRect(x - 1, y, 2, plankH);
      x += len;
    }
    ctx.fillStyle = 'rgba(22,9,2,.8)'; ctx.fillRect(0, y - 1.5, w, 3);
    ctx.fillStyle = 'rgba(255,220,170,.1)'; ctx.fillRect(0, y + 1.5, w, 1);
    y += plankH;
  }
  // lamp light pooled on the board, falling off to the edges
  let cx = w / 2, cy = h / 2;
  if (V) { const ar = arena.getBoundingClientRect(); cx = ar.left + V.bx + V.bs / 2; cy = ar.top + V.by + V.bs / 2; }
  const R = Math.max(w, h) * 0.75;
  let g = ctx.createRadialGradient(cx - R * 0.08, cy - R * 0.1, R * 0.05, cx, cy, R);
  g.addColorStop(0, 'rgba(255,214,150,.12)'); g.addColorStop(0.45, 'rgba(255,214,150,0)');
  g.addColorStop(0.8, 'rgba(14,5,0,.35)'); g.addColorStop(1, 'rgba(14,5,0,.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  g = ctx.createLinearGradient(0, 0, 0, 120);
  g.addColorStop(0, 'rgba(14,5,0,.5)'); g.addColorStop(1, 'rgba(14,5,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, 120);
}

/* ---------------- Layout ---------------- */
const GAP = 14;
function layout() {
  const ar = arena.getBoundingClientRect();
  const W = ar.width, H = ar.height;
  const wide = W >= H + 290;
  let bs;
  const sideH = W < 420 ? 52 : 58;
  if (wide) bs = Math.min(H - 28, W - 2 * (150 + GAP), 940);
  else bs = Math.min(W, H - 2 * (sideH + GAP) - 8, 940);
  bs = Math.max(240, Math.floor(bs));
  const F = Math.round(Math.max(bs * 0.078, Math.min(32, bs * 0.09))), sq = (bs - 2 * F) / 8, cap = sq * 0.92;
  const bx = Math.round((W - bs) / 2), by = Math.max(wide ? 8 : sideH + GAP, Math.round((H - bs) / 2));
  const root = document.documentElement.style;
  root.setProperty('--bs', bs + 'px'); root.setProperty('--F', F + 'px'); root.setProperty('--sq', sq + 'px'); root.setProperty('--cap', cap + 'px');
  boardEl.style.left = bx + 'px'; boardEl.style.top = by + 'px';
  for (const side of [1, -1]) {
    const el = SIDE[side].el;
    el.className = 'side ' + (wide ? 'col' : 'row') + (side === 1 ? ' bottom' : ' top');
    if (wide) {
      const sw = Math.min(230, Math.floor((W - bs) / 2 - GAP - 2)), sh = Math.round(bs * 0.7);
      el.style.width = sw + 'px'; el.style.height = sh + 'px';
      el.style.left = (side === 1 ? bx + bs + GAP : bx - GAP - sw) + 'px';
      el.style.top = (side === 1 ? by + bs - sh : by) + 'px';
    } else {
      el.style.width = bs + 'px'; el.style.height = sideH + 'px';
      el.style.left = bx + 'px';
      el.style.top = (side === 1 ? by + bs + GAP : by - GAP - sideH) + 'px';
    }
  }
  banner.style.left = bx + 'px'; banner.style.top = by + 'px'; banner.style.width = bs + 'px'; banner.style.height = bs + 'px';
  const changed = !V || V.bs !== bs || V.dpr !== window.devicePixelRatio;
  V = { W, H, wide, bs, bx, by, F, sq, cap, playX: bx + F, playY: by + F, dpr: window.devicePixelRatio, pile: {} };
  for (const side of [1, -1]) {
    const r = SIDE[side].pile.getBoundingClientRect();
    V.pile[side] = { x: r.left - ar.left, y: r.top - ar.top, w: r.width, h: r.height };
  }
  if (changed) drawBoard();
  if (G) renderHUD();

}
let resizeTimer = 0;
window.addEventListener('resize', () => {
  layout();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawTable, 120);
});

/* ---------------- Sound (Web Audio, no files) ---------------- */
const sfx = (() => {
  let ac = null, noise = null, unlocked = false;
  function ctx() {
    if (!settings.sound || !unlocked) return null;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { return null; }
    return ac;
  }
  function knock(a, t, vol, freq) {
    if (!noise) {
      noise = a.createBuffer(1, Math.round(a.sampleRate * 0.08), a.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 5);
    }
    const src = a.createBufferSource(); src.buffer = noise;
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.4;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(a.destination); src.start(t);
  }
  function ping(a, t, vol, base) {
    [[1, 1, 0.08], [1.55, 0.6, 0.06], [2.2, 0.35, 0.045]].forEach(([m, amp, dec]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = base * m * (0.97 + Math.random() * 0.06);
      g.gain.setValueAtTime(vol * amp, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dec + 0.02);
    });
  }
  function clink(delay, vol, pitch) {
    const a = ctx(); if (!a) return;
    const t = a.currentTime + (delay || 0);
    knock(a, t, vol, 1500 * pitch); ping(a, t, vol * 0.22, 3000 * pitch);
  }
  return {
    unlock() { unlocked = true; ctx(); },
    place() { clink(0, 0.55, 1); },
    lift() { clink(0, 0.12, 1.3); },
    hop() { clink(0, 0.45, 1.08); },
    toss() { clink(0, 0.32, 1.25); clink(0.07, 0.2, 1.4); clink(0.13, 0.1, 1.5); },
    flip() { clink(0, 0.3, 1.2); clink(0.32, 0.5, 0.95); },
    nope() { const a = ctx(); if (a) knock(a, a.currentTime, 0.25, 500); },
    chime(up) {
      const a = ctx(); if (!a) return;
      const notes = up ? [523.25, 659.25, 783.99, 1046.5] : [392, 329.63, 261.63];
      notes.forEach((f, i) => {
        const t = a.currentTime + i * 0.12, o = a.createOscillator(), g = a.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.55);
      });
    },
  };
})();

/* ---------------- Game state ---------------- */
let G = null;          // committed position and bookkeeping
let pieces = [];       // the 16 caps
let history = [];      // snapshots before each move, for Undo
let legal = [];        // legal moves for the side to move
let sel = null;        // selected square
let step = null;       // a multi-jump in progress { from, cur, path, man, moves }
let busy = false;      // a cap is moving
let thinking = false;
let aiToken = 0, pending = null, worker = null;
let flashTimer = 0;
const other = (c) => (c === 'green' ? 'red' : 'green');
const colorOf = (side) => (side === 1 ? G.bottom : other(G.bottom));
const teamName = (team) => L.paint[paintOf(team)];
const colorName = (side) => teamName(colorOf(side));
const isHuman = (side) => G.mode === 'pvp' || side === 1;
function nameOf(side) {
  if (G.mode === 'ai') return side === 1 ? L.you : L.editor;
  return L.player(colorName(side));
}

function homeOf(p) {
  if (p.cap) return pileXY(p);
  const s = G.ids.indexOf(p.id);
  return sqXY(s);
}
const sqXY = (s) => [V.playX + ((s & 7) + 0.5) * V.sq, V.playY + ((s >> 3) + 0.5) * V.sq];
function pileXY(p) {
  const P = V.pile[p.cap.by], n = p.cap.n, c = V.cap * 0.92;
  let fx, fy;
  if (V.wide) { fx = ((n % 2) + 0.5) / 2; fy = (Math.floor(n / 2) + 0.5) / 4; if (p.cap.by === 1) fy = 1 - fy; }
  else { fx = (n + 0.5) / 8; fy = 0.5; }
  const x = P.x + c / 2 + fx * Math.max(0, P.w - c) + p.cap.jx * V.cap * 0.16;
  const y = P.y + c / 2 + fy * Math.max(0, P.h - c) + p.cap.jy * V.cap * 0.14;
  return [clamp(x, P.x + c / 2, P.x + Math.max(c / 2, P.w - c / 2)), clamp(y, P.y + c / 2, P.y + Math.max(c / 2, P.h - c / 2))];
}
function setPos(p, x, y) {
  p.x = x; p.y = y;
  p.el.style.transform = 'translate(' + (x - V.cap / 2).toFixed(1) + 'px,' + (y - V.cap / 2).toFixed(1) + 'px)';
}
function glide(p, x, y, ms, easing) {
  const from = p.el.style.transform;
  setPos(p, x, y);
  const to = p.el.style.transform;
  if (reduceMotion || !ms || from === to) return Promise.resolve();
  if (p.anim) p.anim.cancel();
  p.anim = p.el.animate([{ transform: from }, { transform: to }], { duration: ms, easing: easing || 'cubic-bezier(.3,.7,.3,1)' });
  return p.anim.finished.then(() => { p.anim = null; }, () => {});
}
function bounce(p, ms, peak) {
  if (reduceMotion) return;
  p.el.querySelector('.lift').animate([{ transform: 'scale(1.1)' }, { transform: 'scale(' + peak + ')' }, { transform: 'scale(1.1)' }], { duration: ms, easing: 'ease-in-out' });
}

function makePiece(id, side, color, seed) {
  const el = document.createElement('div');
  el.className = 'piece';
  el.innerHTML = '<div class="shadow"></div><div class="lift"><div class="flip"></div></div>';
  const front = document.createElement('canvas'), back = document.createElement('canvas');
  front.width = front.height = back.width = back.height = SPRITE;
  front.className = 'front'; back.className = 'back';
  drawCapFront(front, paintOf(color), seed, styleOf(color)); drawCapBack(back, paintOf(color), seed);
  el.querySelector('.flip').append(front, back);
  capsEl.appendChild(el);
  return { id, side, color, seed, king: false, cap: null, el, x: 0, y: 0, anim: null };
}
function syncPieceLook(p) {
  p.el.classList.toggle('king', p.king);
  p.el.style.zIndex = p.cap ? String(1 + p.cap.n) : '';
}

function newGame() {
  cancelAI();
  hideBanner();
  const bottom = settings.mode === 'ai' ? settings.human : 'green';
  G = { board: E.initial(), ids: new Int8Array(64).fill(-1), turn: bottom === 'green' ? 1 : -1, quiet: 0, keys: [], moveNo: 0, last: null, over: false, result: null, mode: settings.mode, level: settings.level, bottom };
  buildPieces(null);
  G.keys.push(E.key(G.board, G.turn));
  history = []; sel = null; step = null; busy = false;
  pieces.forEach((p) => { syncPieceLook(p); setPos(p, ...homeOf(p)); });
  if (!reduceMotion) {
    pieces.forEach((p, i) => {
      const t = p.el.style.transform;
      p.el.animate([{ transform: t + ' translateY(-18px) scale(1.25)', opacity: 0 }, { transform: t, opacity: 1 }], { duration: 380, delay: 40 * i, easing: 'cubic-bezier(.2,.8,.3,1.15)', fill: 'backwards' });
      if (i % 3 === 0) setTimeout(() => sfx.place(), 40 * i + 300);
    });
  }
  drawPlates();
  save();
  startTurn(reduceMotion ? 0 : 900);
}
function buildPieces(saved) {
  pieces.forEach((p) => p.el.remove());
  pieces = [];
  if (saved) {
    saved.forEach((s, id) => pieces.push(makePiece(id, s.side, s.color, s.seed)));
    return;
  }
  let id = 0;
  for (let s = 0; s < 64; s++) {
    const v = G.board[s];
    if (!v) continue;
    const side = v > 0 ? 1 : -1;
    pieces.push(makePiece(id, side, colorOf(side), (Math.random() * 2 ** 31) | 0));
    G.ids[s] = id++;
  }
}

function snapshot() {
  return {
    board: Array.from(G.board), ids: Array.from(G.ids), turn: G.turn, quiet: G.quiet, keys: G.keys.slice(), moveNo: G.moveNo, last: G.last,
    pcs: pieces.map((p) => ({ king: p.king, cap: p.cap ? Object.assign({}, p.cap) : null })),
  };
}
function restore(s, animate) {
  G.board = Int8Array.from(s.board); G.ids = Int8Array.from(s.ids); G.turn = s.turn; G.quiet = s.quiet;
  G.keys = s.keys.slice(); G.moveNo = s.moveNo; G.last = s.last; G.over = false; G.result = null;
  pieces.forEach((p, i) => {
    p.king = s.pcs[i].king; p.cap = s.pcs[i].cap ? Object.assign({}, s.pcs[i].cap) : null;
    p.el.classList.remove('up');
    syncPieceLook(p);
    const [x, y] = homeOf(p);
    if (animate) glide(p, x, y, 360); else setPos(p, x, y);
  });
}

function startTurn(aiDelay) {
  sel = null; step = null; busy = false;
  legal = E.genMoves(G.board, G.turn);
  if (!legal.length) {
    const left = G.board.some((v) => Math.sign(v) === G.turn);
    return endGame(-G.turn, left ? 'stuck' : 'wiped');
  }
  if (G.quiet >= 60) return endGame(0, 'quiet');
  const k = G.keys[G.keys.length - 1];
  if (G.keys.filter((x) => x === k).length >= 3) return endGame(0, 'repeat');
  renderAll();
  if (!isHuman(G.turn)) requestAI(aiDelay || 0);
}

/* Story mode: when this page runs inside the Siam Times story (in a frame), tell the story when a game ends. */

/* ---------------- Moving caps ---------------- */
function beginMove() { history.push(snapshot()); if (history.length > 400) history.shift(); }
function toPile(v, bySide) {

  v.el.style.zIndex = '40';
  v.el.classList.add('up');
  const [x, y] = pileXY(v);
  bounce(v, 560, 1.4);
  return glide(v, x, y, 560, 'cubic-bezier(.25,.6,.3,1)').then(() => {
    v.el.classList.remove('up'); syncPieceLook(v); sfx.toss();

}

  const ms = capSq >= 0 ? 340 : 260;
  if (capSq >= 0) bounce(p, ms, 1.24);
  const moving = glide(p, x, y, ms);
  G.board[to] = G.board[from]; G.board[from] = 0;
  G.ids[to] = G.ids[from]; G.ids[from] = -1;
  let tossed = null;
  if (capSq >= 0) {
    const v = pieces[G.ids[capSq]];
    G.board[capSq] = 0; G.ids[capSq] = -1;
    await sleep(reduceMotion ? 0 : ms * 0.5);
    tossed = toPile(v, p.side);

}
async function playMove(mv) {
  busy = true; sel = null; renderMarks();

  const man = Math.abs(G.board[mv.from]) === 1;
  const p = pieces[G.ids[mv.from]];
  let cur = mv.from;
  const tosses = [];
  for (let i = 0; i < mv.path.length; i++) {
    tosses.push(await hop(p, cur, mv.path[i], mv.caps.length ? mv.caps[i] : -1));
    cur = mv.path[i];
    if (i < mv.path.length - 1) await sleep(70);

}

  const p = pieces[G.ids[mv.to]];

    G.board[mv.to] = 2 * p.side;
    p.king = true;
    await sleep(reduceMotion ? 0 : 120);
    syncPieceLook(p);
    sfx.flip();
    flash(L.crowned);
    if (!reduceMotion) { bounce(p, 620, 1.35); await sleep(640); }
  }
  p.el.classList.remove('up');
  p.el.style.zIndex = '';

  G.quiet = (mv.caps.length || man) ? 0 : G.quiet + 1;
  G.last = { from: mv.from, to: mv.to };
  G.turn = -G.turn; G.moveNo++;
  if (mv.caps.length || man) G.keys = [];
  G.keys.push(E.key(G.board, G.turn));
  save();
  startTurn(0);
}

/* ---------------- Computer player ---------------- */
function makeWorker() {
  try {
    const src = $('engine-src').textContent +
      '\nself.onmessage=function(e){var d=e.data;var mv=self.Engine.choose(Int8Array.from(d.board),d.side,d.level,d.seed);self.postMessage({id:d.id,move:mv});};';
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const w = new Worker(url);
    w.onmessage = (e) => {
      if (pending && e.data.id === pending.token) { const h = pending.handle; pending = null; h(e.data.move); }
    };
    w.onerror = () => {
      worker = null;
      if (pending) { const p = pending; pending = null; runLocal(p); }
    };
    return w;
  } catch (e) { return null; }
}
function runLocal(p) {
  setTimeout(() => p.handle(E.choose(Int8Array.from(p.payload.board), p.payload.side, p.payload.level, p.payload.seed)), 30);
}
function requestAI(delay) {
  const token = ++aiToken, t0 = performance.now();

  const payload = { id: token, board: Array.from(G.board), side: G.turn, level: G.level, seed: (Math.random() * 2 ** 31) | 0 };
  const minThink = (G.level === 'easy' ? 650 : 500) + (delay || 0);
  const handle = (mv) => {
    if (token !== aiToken || G.over) return;
    const wait = Math.max(0, minThink - (performance.now() - t0));
    setTimeout(() => {
      if (token !== aiToken || G.over) return;
      thinking = false;
      const real = mv && legal.find((m) => m.from === mv.from && m.path.length === mv.path.length && m.path.every((s, i) => s === mv.path[i]));
      playMove(real || legal[0]);

  const req = { token, payload, handle };
  if (worker) { pending = req; worker.postMessage(payload); }
  else runLocal(req);
}
function cancelAI() { aiToken++; pending = null; thinking = false; }

/* ---------------- Human input ---------------- */
const targetsOf = (st) => [...new Set(st.moves.map((m) => m.path[st.path.length]))];

}

let kbDir = 1;

  const forced = legal.length > 0 && legal[0].caps.length > 0;

    add(sel, 'sel');

/* ---------------- Undo ---------------- */
function canUndo() {
  if (!G || !history.length) return false;
  if (G.mode === 'ai') return history.some((h) => isHuman(h.turn));
  return true;
}

  if (!canUndo() || (busy && !step)) return;

  let snap = history.pop();
  if (!step && G.mode === 'ai') { while (!isHuman(snap.turn) && history.length) snap = history.pop(); }
  step = null;
  hideBanner();
  restore(snap, true);
  save();
  startTurn(400);
}

/* ---------------- Saving ---------------- */

  if (!G) return null;

  return {
    v: 1,
    G: Object.assign({}, G, { board: Array.from(G.board), ids: Array.from(G.ids) }),
    pieces: pieces.map((p) => ({ side: p.side, color: p.color, seed: p.seed, king: p.king, cap: p.cap })),

    });
  });
  ['teamA', 'teamB'].forEach((id) => $(id).addEventListener('click', () => { pickTeam = $(id).dataset.team; refreshPicker(); }));
}
function pickerTeams() {
  const mode = G ? G.mode : settings.mode;
  const bottom = G ? G.bottom : (mode === 'ai' ? settings.human : 'green');
  return { mode, bottom, top: other(bottom) };
}
function refreshPicker() {
  const t = pickerTeams();
  if (pickTeam !== t.bottom && pickTeam !== t.top) pickTeam = t.bottom;
  [['teamA', t.bottom, t.mode === 'ai' ? L.teamYou : L.teamBottom], ['teamB', t.top, t.mode === 'ai' ? L.teamEditor : L.teamTop]].forEach(([id, team, label]) => {
    const b = $(id);
    b.dataset.team = team; b.setAttribute('aria-pressed', String(pickTeam === team));
    const sp = b.querySelector('span'); sp.textContent = label;
    const sm = document.createElement('small'); sm.textContent = teamName(team); sp.appendChild(sm);
    drawCapFront(b.querySelector('canvas'), paintOf(team), 31, styleOf(team));
  });
  $('lgPaint').textContent = L.paintLegend(teamName(pickTeam));
  $('lgBeer').textContent = L.beerCaps; $('lgSoda').textContent = L.sodaCaps;
  $('lgZodiac').textContent = L.zodiacCaps; $('lgCards').textContent = L.cardCaps;
  document.querySelectorAll('.swatch input').forEach((i) => {
    i.checked = i.value === paintOf(pickTeam);
    i.setAttribute('aria-label', L.paint[i.value]); i.parentNode.title = L.paint[i.value];
  });
  document.querySelectorAll('.tile').forEach((lab) => {
    const i = lab.querySelector('input');
    i.checked = i.value === styleOf(pickTeam);
    drawCapFront(lab.querySelector('canvas'), paintOf(pickTeam), 90 + CAP_STYLES.indexOf(i.value) * 13, i.value);
    lab.querySelector('em').textContent = L.styles[i.value];
  });
}
function fillCapsForm() {
  $('capsHead').textContent = L.capsHead; $('capsNote').textContent = L.capsNote; $('btnCapsDone').textContent = L.done;
  refreshPicker();
}
function setPaint(team, k) {
  const o = other(team);
  if (settings.capPaint[o] === k) settings.capPaint[o] = settings.capPaint[team];   // never two sides in one colour
  settings.capPaint[team] = k; store.set('settings', settings);
  restyleCaps(team); restyleCaps(o); refreshPicker(); sfx.lift();
}
function restyleCaps(team) {
  pieces.forEach((p) => {
    if (p.color !== team) return;
    drawCapFront(p.el.querySelector('canvas.front'), paintOf(team), p.seed, styleOf(team));
    drawCapBack(p.el.querySelector('canvas.back'), paintOf(team), p.seed);
  });
  if (G) { drawPlates(); renderAll(); if (G.over && !banner.hidden) showBanner(); }
}
function applyLang() {
  L = STR[settings.lang];
  document.documentElement.lang = L.lang;
  $('brandTitle').textContent = L.brand; $('brandSub').textContent = L.brandSub;
  $('btnNew').textContent = L.newGame; $('btnUndo').textContent = L.undo; $('btnRules').textContent = L.rules; $('btnCaps').textContent = L.capsBtn;
  $('btnLang').textContent = L.langBtn; $('btnLang').setAttribute('aria-label', L.langLabel); $('btnLang').lang = L.lang === 'th' ? 'en' : 'th';
  applySound();
  fillRules(); fillNewForm(); fillCapsForm();
  if (G) { renderAll(); if (G.over) showBanner(); }
}
function applySound() {
  const b = $('btnSound');
  b.innerHTML = settings.sound ? ICON_ON : ICON_OFF;
  b.setAttribute('aria-pressed', String(settings.sound));
  b.setAttribute('aria-label', settings.sound ? L.soundOn : L.soundOff);
  b.title = settings.sound ? L.soundOn : L.soundOff;
}
$('btnNew').addEventListener('click', openNew);
$('btnUndo').addEventListener('click', undo);
$('btnRules').addEventListener('click', () => { fillRules(); open($('rulesModal')); });
$('btnCaps').addEventListener('click', () => { fillCapsForm(); open($('capsModal')); });
$('btnSound').addEventListener('click', () => { settings.sound = !settings.sound; store.set('settings', settings); applySound(); if (settings.sound) sfx.place(); });
$('btnLang').addEventListener('click', () => { settings.lang = settings.lang === 'th' ? 'en' : 'th'; settings.langChosen = true; store.set('settings', settings); applyLang(); });
$('btnAgain').addEventListener('click', () => newGame());
$('btnLook').addEventListener('click', () => { hideBanner(); $('btnNew').focus(); });
document.addEventListener('pointerdown', () => sfx.unlock(), true);
document.addEventListener('keydown', (e) => {
  sfx.unlock();
  if (openModal || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input') return;
  if (e.key === 'u' || e.key === 'U') { e.preventDefault(); undo(); }
  else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openNew(); }
  else if (e.key === 'Escape') { if (!banner.hidden) hideBanner(); else if (sel !== null) { sel = null; liftOnly(null); renderMarks(); } }
});

/* ---------------- Start ---------------- */
async function init(saved) {
  try {
    await Promise.race([document.fonts.load('48px Chomsky'), sleep(2500)]);
  } catch (e) { /* draw with the fallback face */ }
  makeTextures();
  buildHits();
  buildCapPicker();
  applyLang();
  layout();
  drawTable();
  worker = makeWorker();
  if (!loadGame(saved) && !loadGame(store.get('game', null))) newGame();
  layout();
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ saved: serialize() }));
const boot = (data) => init(data && data.saved);
if (hot && typeof hot.ready === 'function') hot.ready(boot);
else boot((hot && hot.data) || {});
})();
</script>
<script>
/* No zooming: a pinch or a double tap would leave the game half off the screen and stuck. */
(() => {
  const stop = e => e.preventDefault();
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
  document.documentElement.style.touchAction = 'manipulation';
})();
</script>
