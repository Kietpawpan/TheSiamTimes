/* Layout: the car park fills the left as the scene, with the scoreline across its top;
   a narrow control rail sits on the right and drops under the scene on phones.
   One dark look (a car park lit by its own lamps), like Siam Times Slingshot and Darts. */
:root {
  color-scheme: dark;
  --night: #0c131b;      /* page ground */
  --rail: #121c27;       /* control rail and scoreline */
  --well: #0f1821;       /* inset fields */
  --rule: #263548;       /* hairlines and tracks */
  --paper: #efe7d4;      /* newsprint cream, main text */
  --muted: #9ba7b3;      /* secondary text, blue-grey */
  --blue: #6ca6d1;       /* Siam Times blue (dark value): forward, focus */
  --brass: #d6ad5f;      /* reverse, scores, stars */
  --brass-ink: #1d1606;
  --good: #82d09c;
  --bad: #e58576;
  --font-mast: "Chomsky", "Old English Text MT", "UnifrakturCook", serif;
  --font-text: "Newsreader", "Sarabun", Georgia, "Times New Roman", serif;
  --font-label: "Helvetica Neue", Helvetica, Arial, "Sarabun", sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--paper);
  font: 16px/1.45 var(--font-text);
  -webkit-font-smoothing: antialiased;
}
html:lang(th) body { font-family: "Sarabun", var(--font-text); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
  height: 100%;
}

/* ---------- Scene ---------- */
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.scorebar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 8px 26px;
  padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
  background: var(--rail);
  border-bottom: 1px solid var(--rule);
}
.sb-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.label {
  font: 600 11px/1.2 var(--font-label);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
html:lang(th) .label { font-size: 12.5px; letter-spacing: .01em; text-transform: none; }
.sb-sub { font-size: 15px; line-height: 1.2; }
.big {
  font: 600 32px/1 var(--font-text);
  font-variant-numeric: tabular-nums lining-nums;
  color: var(--brass);
}
.big.neg { color: var(--bad); }
.mid {
  font: 600 18px/1.2 var(--font-text);
  font-variant-numeric: tabular-nums lining-nums;
}
.mid.neg { color: var(--bad); }
.sb-stars { color: var(--brass); letter-spacing: .08em; }
.sb-msg {
  flex-basis: 100%;
  margin: 0;
  font-style: italic;
  font-size: 15px;
  min-height: 1.45em;
}
html:lang(th) .sb-msg { font-style: normal; }

.scene { position: relative; flex: 1; min-height: 0; background: #0f1b28; overflow: hidden; }
#canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
}
#canvas:focus-visible { outline-offset: -3px; }

/* Pedals, bottom left: forward above reverse */
.pedals {
  position: absolute;
  left: max(12px, env(safe-area-inset-left, 0px));
  bottom: 12px;
  display: grid;
  gap: 10px;
  justify-items: start;
}
.readout {
  font: 600 12px/1.2 var(--font-label);
  color: var(--paper);
  background: rgba(12, 19, 27, .78);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 4px 10px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.readout b { color: var(--brass); font-size: 14px; margin-right: 4px; }
.pedal {
  width: 74px; height: 66px;
  display: grid; place-items: center; align-content: center; gap: 1px;
  border-radius: 14px;
  border: 2px solid var(--rule);
  background: rgba(15, 24, 33, .88);
  color: var(--paper);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45), inset 0 -4px 0 rgba(0, 0, 0, .35);
  touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: transform .06s, background .1s;
}
.pedal .pk { font: 700 22px/1 var(--font-label); }
.pedal .pl { font: 600 11.5px/1.15 var(--font-label); color: var(--muted); }
html:lang(th) .pedal .pl { font-size: 12.5px; }
.pedal.fwd .pk { color: var(--blue); }
.pedal.rev .pk { color: var(--brass); }
.pedal.on { transform: translateY(2px); box-shadow: 0 2px 8px rgba(0, 0, 0, .4), inset 0 -1px 0 rgba(0, 0, 0, .35); }
.pedal.fwd.on { background: var(--blue); border-color: var(--blue); }
.pedal.rev.on { background: var(--brass); border-color: var(--brass); }
.pedal.on .pk, .pedal.on .pl { color: var(--brass-ink); }

/* Steering wheel, bottom right */
.wheel-wrap {
  position: absolute;
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: 12px;
  display: grid;
  justify-items: center;
  gap: 8px;
}
.wheel-top { display: flex; gap: 6px; align-items: center; }
.btn-pill {
  min-height: 30px; padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: rgba(12, 19, 27, .82);
  font: 600 12px/1 var(--font-label);
  color: var(--paper);
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
html:lang(th) .btn-pill { font-size: 13px; }
.btn-pill:hover { border-color: var(--paper); }
.wheel {
  width: 136px; height: 136px;
  border-radius: 50%;
  touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  cursor: grab;
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .55));
}
.wheel.grabbing { cursor: grabbing; }
.wheel svg { width: 100%; height: 100%; display: block; will-change: transform; }

.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding: 16px;
  background: rgba(6, 10, 15, .58);
}
.card {
  width: min(400px, 100%);
  max-height: 100%;
  overflow-y: auto;
  padding: 22px 24px 24px;
  border-radius: 12px;
  background: var(--rail);
  border: 1px solid var(--rule);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
  display: flex; flex-direction: column; gap: 10px;
  text-align: center;
}
.card canvas { align-self: center; width: 200px; height: 84px; }
.card h2 {
  margin: 0;
  font: 600 36px/1.1 var(--font-text);
  font-variant-numeric: tabular-nums lining-nums;
  color: var(--brass);
  text-wrap: balance;
}
html:lang(th) .card h2 { font: 700 30px/1.25 "Sarabun", sans-serif; }
.card .stars { font-size: 40px; line-height: 1; letter-spacing: .1em; color: var(--brass); }
.card .stars .off { color: var(--rule); }
.card p { margin: 0; }
.card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.card li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted var(--rule); padding: 2px 0; }
.card li b { font-variant-numeric: tabular-nums; }
.card li .neg { color: var(--bad); }
.card .note { text-align: center; }
.card .btn-brass { margin-top: 6px; }

/* ---------- Control rail ---------- */
.rail {
  display: flex; flex-direction: column; gap: 22px;
  min-width: 0;
  overflow-y: auto;
  padding-block: 20px 28px;
  padding-left: 20px;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--rail);
  border-left: 1px solid var(--rule);
}
.brand { display: flex; flex-direction: column; gap: 6px; }
.brand-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.brand h1 { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-weight: 400; line-height: 1; }
.brand .mast { font: 400 34px/1 var(--font-mast); letter-spacing: .005em; }
.brand .game { font: italic 400 26px/1.1 var(--font-text); color: var(--brass); }
html:lang(th) .brand .game { font: 600 24px/1.2 "Sarabun", sans-serif; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; max-width: 36ch; }
.btn-lang {
  flex: none;
  display: inline-flex; align-items: center;
  min-height: 32px; padding: 0 12px;
  color: var(--paper); text-decoration: none;
  border: 1px solid var(--rule); border-radius: 999px;
  background: transparent;
  font: 600 13px/1 var(--font-label);
}
.btn-lang:hover { border-color: var(--paper); }

.group { display: flex; flex-direction: column; gap: 10px; border: 0; margin: 0; padding: 0; min-width: 0; }
.group > legend { padding: 0; margin-bottom: 10px; }

.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.stage-btn {
  width: 100%;
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr) auto;
  grid-template-rows: auto auto;
  align-items: center;
  gap: 2px 12px;
  padding: 8px 12px 8px 8px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--well);
  text-align: left;
  transition: border-color .15s, background .15s;
}
.stage-btn canvas { grid-row: 1 / 3; width: 88px; height: 36px; }
.stage-btn .st-name { font: 600 15px/1.2 var(--font-label); }
.stage-btn .st-meta { grid-column: 2; font-size: 13px; line-height: 1.3; color: var(--muted); }
.stage-btn .st-stars { grid-column: 3; grid-row: 1 / 3; font-size: 15px; letter-spacing: .06em; color: var(--brass); white-space: nowrap; }
.stage-btn .st-stars .off { color: var(--rule); }
.stage-btn:hover:not(:disabled) { border-color: var(--muted); }
.stage-btn[aria-current="true"] { border-color: var(--brass); background: #1a2633; }
.stage-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--well); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg label {
  padding: 9px 6px;
  text-align: center;
  font: 600 13px/1.2 var(--font-label);
  color: var(--muted);
  cursor: pointer;
  border-left: 1px solid var(--rule);
  transition: background .15s, color .15s;
}
html:lang(th) .seg label { font-size: 14px; }
.seg label:first-of-type { border-left: 0; }
.seg label:hover { color: var(--paper); }
.seg input:checked + label { background: var(--paper); color: var(--night); }
.seg input:focus-visible + label { outline: 2px solid var(--blue); outline-offset: -2px; }
.note { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.45; }

.btn-brass {
  width: 100%; min-height: 52px;
  border: 0; border-radius: 8px;
  background: var(--brass);
  color: var(--brass-ink);
  font: 700 15px/1 var(--font-label);
  letter-spacing: .1em;
  text-transform: uppercase;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22);
  transition: filter .15s, transform .05s;
}
html:lang(th) .btn-brass { font-size: 17px; letter-spacing: .01em; }
.btn-brass:hover { filter: brightness(1.08); }
.btn-brass:active { transform: translateY(1px); }
.btn-brass:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
.keys { margin: 0; font: 12px/1.8 var(--font-label); color: var(--muted); }
html:lang(th) .keys { font-size: 13px; }
kbd {
  display: inline-block; min-width: 1.6em; padding: 0 5px;
  border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px;
  font: 600 11px/1.5 var(--font-label); color: var(--paper); text-align: center;
  background: var(--well);
}
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-line {
  flex: 1 1 auto;
  min-height: 40px; padding: 0 14px;
  border: 1px solid var(--rule); border-radius: 8px;
  background: transparent;
  font: 600 13px/1 var(--font-label);
}
html:lang(th) .btn-line { font-size: 14px; }
.btn-line:hover { border-color: var(--paper); }
.btn-line[aria-pressed="false"] { color: var(--muted); }

details { border-top: 1px solid var(--rule); padding-top: 14px; }
summary { cursor: pointer; font: 600 14px/1.3 var(--font-label); }
details ul { margin: 12px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; max-width: 60ch; }
details li::marker { color: var(--brass); }

@media (max-width: 899px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .scene { flex: none; height: clamp(400px, 74vh, 170vw); height: clamp(400px, 74svh, 170vw); }
  .rail {
    overflow: visible;
    border-left: 0;
    border-top: 1px solid var(--rule);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
  }
  .scorebar { gap: 4px 14px; padding-block: 8px 6px; }
  .sb-sub { font-size: 14px; }
  .sb-msg { font-size: 14px; }
  .big { font-size: 24px; }
  .mid { font-size: 16px; }
  .sb-hide-sm { display: none; }
  .pedal { width: 66px; height: 60px; }
  .wheel { width: 122px; height: 122px; }
}
@media (max-width: 380px) {
  .wheel { width: 108px; height: 108px; }
  .pedal { width: 60px; height: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  .pedal, .stage-btn { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="scorebar">
      <div class="sb-cell">
        <span class="label" id="sbStageLabel"></span>
        <span class="sb-sub" id="sbStageSub"></span>
      </div>

      </div>
      <div class="sb-cell">

          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <radialGradient id="rimG" cx="50%" cy="40%" r="60%">

            </defs>
            <circle cx="50" cy="50" r="48" fill="rgba(12,19,27,.55)"/>
            <path d="M14 53 Q50 60 86 53 L86 47 Q50 41 14 47 Z" fill="#20262e"/>
            <path d="M44 62 L41 90 L59 90 L56 62 Z" fill="#20262e"/>
            <circle cx="50" cy="50" r="40" fill="none" stroke="url(#rimG)" stroke-width="11"/>
            <circle cx="50" cy="50" r="45.2" fill="none" stroke="#d6ad5f" stroke-width="1.1" opacity=".85"/>
            <circle cx="50" cy="50" r="34.6" fill="none" stroke="#000" stroke-width=".8" opacity=".5"/>
            <rect x="47" y="4.5" width="6" height="11" rx="1.6" fill="#efe7d4"/>
            <circle cx="50" cy="50" r="15" fill="url(#hubG)" stroke="#d6ad5f" stroke-width="1.6"/>

          </svg>
        </div>
      </div>

      <div class="overlay" id="overlay" hidden>
        <div class="card" role="dialog" aria-modal="false" aria-labelledby="ovTitle">
          <span class="label" id="ovEyebrow"></span>
          <canvas id="ovPic" width="400" height="168" hidden></canvas>
          <div class="stars" id="ovStars" hidden></div>
          <h2 id="ovTitle"></h2>

          <ul id="ovList" hidden></ul>
          <p class="note" id="ovNote"></p>
          <button class="btn-brass" id="ovBtn" type="button"></button>
          <button class="btn-line" id="ovBtn2" type="button" hidden></button>
        </div>
      </div>
    </div>
  </main>

  <aside class="rail">
    <header class="brand">
      <div class="brand-top">

function obb(cx, cy, a, hx, hy) {

    const rb = B.hx * Math.abs(B.c * ax + B.s * ay) + B.hy * Math.abs(-B.s * ax + B.c * ay);
    if (Math.abs(dx * ax + dy * ay) > ra + rb) return false;

/* ---------- Driving ----------
   Low-speed kinematics with no tyre slip: the rear axle moves along the vehicle's heading and the
   heading turns at v·tan(steer)/wheelbase. A trailer's axle is dragged (or pushed) along the line
   to its hitch, which is the exact no-slip rule in the limit of small steps (steps are ≤ 2 cm). */
let L = null;   // the stage being played
let V = null;   // its vehicle
const car = { x: 0, y: 0, a: 0, v: 0, wheel: 0, steer: 0, tx: 0, ty: 0, ta: 0, gear: 'N', odo: 0 };
const input = { fwd: false, rev: false, kLeft: false, kRight: false, kFast: false };
const WHEEL_MAX = 360; // degrees of steering-wheel turn to full lock

function placeCar() {
  const s = L.start;
  Object.assign(car, { x: s.x, y: s.y, a: s.a, v: 0, wheel: 0, steer: 0, gear: 'N', odo: 0 });
  if (V.tr) {
    const hx = car.x - V.hitch * Math.cos(car.a), hy = car.y - V.hitch * Math.sin(car.a);
    car.tx = hx - V.tr.d * Math.cos(car.a); car.ty = hy - V.tr.d * Math.sin(car.a); car.ta = car.a;
  }
}
function setWheel(deg) {
  car.wheel = clamp(deg, -WHEEL_MAX, WHEEL_MAX);
  car.steer = car.wheel / WHEEL_MAX * V.steer * DEG;
}

/* The bodies of the vehicle (truck, then trailer) as boxes, for any state */
function bodies(st) {
  const out = [];
  const c = Math.cos(st.a), s = Math.sin(st.a);
  const mid = (V.wb + V.fo - V.ro) / 2;
  out.push(obb(st.x + c * mid, st.y + s * mid, st.a, (V.wb + V.fo + V.ro) / 2, V.w / 2));
  if (V.tr) {
    const t = V.tr, m = (t.front - t.rear) / 2;
    out.push(obb(st.tx + Math.cos(st.ta) * m, st.ty + Math.sin(st.ta) * m, st.ta, (t.front + t.rear) / 2, t.w / 2));
  }
  return out;
}
function move(st, ds, steer) {
  const da = ds * Math.tan(steer) / V.wb;
  const am = st.a + da / 2;
  st.x += Math.cos(am) * ds; st.y += Math.sin(am) * ds; st.a += da;
  if (V.tr) {
    const hx = st.x - V.hitch * Math.cos(st.a), hy = st.y - V.hitch * Math.sin(st.a);
    const dx = hx - st.tx, dy = hy - st.ty, l = Math.hypot(dx, dy) || 1;
    st.tx = hx - dx / l * V.tr.d; st.ty = hy - dy / l * V.tr.d;
    st.ta = Math.atan2(dy, dx);
  }
}
const articulation = st => V.tr ? wrapA(st.a - st.ta) : 0;
const jackObs = { kind: 'jack', armed: true };

/* Move the vehicle by its speed; stop dead at the first contact and report it */
function drive(dt) {
  let left = car.v * dt;
  if (Math.abs(left) < 1e-6) return;
  const n = Math.max(1, Math.ceil(Math.abs(left) / 0.02));
  const ds = left / n;
  for (let k = 0; k < n; k++) {
    const prev = { x: car.x, y: car.y, a: car.a, tx: car.tx, ty: car.ty, ta: car.ta };
    move(car, ds, car.steer);
    const hits = contacts(car);
    if (V.tr && Math.abs(articulation(car)) > V.maxArt * DEG) hits.push(jackObs);
    if (hits.length) {
      Object.assign(car, prev);
      const speed = Math.abs(car.v);
      car.v = 0;
      for (const o of hits) if (o.armed) { o.armed = false; onHit(o, speed); }
      return;
    }
    car.odo += Math.abs(ds);
  }
}
function contacts(st, margin = 0) {
  const bs = bodies(st).map(b => margin ? grow(b, margin) : b);
  const out = [];
  for (const o of L.obs) for (const b of bs) if (hit(b, o.box)) { out.push(o); break; }
  return out;
}
/* An obstacle can cost points again only once the vehicle has pulled clear of it */
function rearm() {
  const near = contacts(car, 0.25);
  for (const o of L.obs) if (!o.armed && !near.includes(o)) o.armed = true;
  if (!jackObs.armed && Math.abs(articulation(car)) < (V.maxArt - 10) * DEG) jackObs.armed = true;
}

function pedals(dt) {
  const f = input.fwd && !input.rev, r = input.rev && !input.fwd;
  const target = f ? V.vF : r ? -V.vR : 0;
  let acc = V.acc;
  if (target === 0) acc = 4.5;                                        // let go: brake
  else if (car.v * target < 0 && Math.abs(car.v) > 0.02) acc = 5;      // changing direction: brake first
  if (car.v < target) car.v = Math.min(target, car.v + acc * dt);
  else car.v = Math.max(target, car.v - acc * dt);
  if (f) car.gear = 'D'; else if (r) car.gear = 'R';
}

/* How the vehicle sits in the bay */
function parkState(st = car) {
  const S = L.slot.box;
  let inside = 0, total = 0, off = 0;
  for (const b of bodies(st)) {
    for (const [px, py] of corners(b)) {
      total++;
      const [u, v] = toLocal(S, px, py);
      if (Math.abs(u) <= S.hx + 0.02 && Math.abs(v) <= S.hy + 0.02) inside++;
    }
    off = Math.max(off, Math.abs(toLocal(S, b.cx, b.cy)[1]));
  }
  const errs = [Math.abs(wrapA(st.a - L.slot.a))];
  if (V.tr) errs.push(Math.abs(wrapA(st.ta - L.slot.a)));
  const err = Math.max(...errs);
  const room = Math.max(0.05, S.hy - V.w / 2);
  const acc = clamp(0.5 * (1 - err / (10 * DEG)) + 0.5 * (1 - off / room), 0, 1);
  return { inside, total, all: inside === total, any: inside > 0, err, nose: err > 150 * DEG, aligned: err < 10 * DEG, acc };
}

/* Where the back (or front) corners will go with the wheel held where it is */
function predict(dir, dist) {
  const st = { x: car.x, y: car.y, a: car.a, tx: car.tx, ty: car.ty, ta: car.ta };
  const out = [];
  let travelled = 0, last = null;
  const steps = Math.ceil(dist / 0.12);
  for (let i = 0; i <= steps; i++) {
    if (i) move(st, dir * 0.12, car.steer);
    const bs = bodies(st);
    const u = dir < 0 ? bs[bs.length - 1] : bs[0];
    const cs = corners(u);
    const p = dir < 0 ? [cs[3], cs[2]] : [cs[0], cs[1]];
    const mx = (p[0][0] + p[1][0]) / 2, my = (p[0][1] + p[1][1]) / 2;
    if (last) travelled += Math.hypot(mx - last[0], my - last[1]);
    last = [mx, my];
    out.push({ l: p[0], r: p[1], d: travelled });
    if (travelled > dist) break;
  }
  return out;
}

/* Parking sensor: the gap from the moving end of the vehicle to the nearest thing beyond it */
function sensorGap(dir) {
  const bs = bodies(car);
  const u = dir < 0 ? bs[bs.length - 1] : bs[0];
  const end = dir < 0 ? -u.hx : u.hx;
  let best = Infinity;
  for (const o of L.obs) {
    const b = o.box;
    if ((b.cx - u.cx) ** 2 + (b.cy - u.cy) ** 2 > (b.r + u.r + 3) ** 2) continue;
    for (let k = -2; k <= 2; k++) {
      const lu = end, lv = k / 2 * u.hy;
      const px = u.cx + lu * u.c - lv * u.s, py = u.cy + lu * u.s + lv * u.c;
      // nearest point of the obstacle, and whether it lies beyond this end of the vehicle
      const [ou, ov] = toLocal(b, px, py);
      const qx = clamp(ou, -b.hx, b.hx), qy = clamp(ov, -b.hy, b.hy);
      const wx = b.cx + qx * b.c - qy * b.s, wy = b.cy + qx * b.s + qy * b.c;
      const along = (wx - u.cx) * u.c + (wy - u.cy) * u.s;
      if (dir < 0 ? along > end + 0.15 : along < end - 0.15) continue;
      best = Math.min(best, Math.hypot(wx - px, wy - py));
    }
  }
  return best;
}

/* ---------- Drawing vehicles from above ----------
   Each function draws in the vehicle's own frame: metres, x forward, y to the right. */
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shade(hex, f) { // f < 0 darker, > 0 lighter
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return `rgb(${r},${g},${b})`;
}
function tyre(ctx, x, y, len, wid, ang = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = '#121417';
  rr(ctx, -len / 2, -wid / 2, len, wid, wid * 0.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.fillRect(-len / 2 + 0.05, -wid / 2 + 0.03, len - 0.1, wid * 0.25);
  ctx.restore();
}
function shadow(ctx, x0, x1, hw) {
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  rr(ctx, x0 + 0.1, -hw + 0.16, x1 - x0, hw * 2, hw * 0.5); ctx.fill();
}
function lamps(ctx, x0, x1, hw, opt) {
  // headlights at x1, tail lights at x0
  ctx.fillStyle = opt.head ? '#fff6d8' : '#e8e2c8';
  rr(ctx, x1 - 0.16, -hw + 0.12, 0.14, 0.38, 0.06); ctx.fill();
  rr(ctx, x1 - 0.16, hw - 0.5, 0.14, 0.38, 0.06); ctx.fill();
  ctx.fillStyle = opt.brake ? '#ff4a3a' : opt.rev ? '#f4f1ea' : '#9c2a24';
  rr(ctx, x0 + 0.02, -hw + 0.1, 0.12, 0.42, 0.05); ctx.fill();
  rr(ctx, x0 + 0.02, hw - 0.52, 0.12, 0.42, 0.05); ctx.fill();
  if (opt.blink) {
    ctx.fillStyle = '#ffb02e';
    for (const [x, y] of [[x1 - 0.1, -hw + 0.05], [x1 - 0.1, hw - 0.05], [x0 + 0.1, -hw + 0.05], [x0 + 0.1, hw - 0.05]]) {
      ctx.beginPath(); ctx.arc(x, y, 0.16, 0, 7); ctx.fill();
    }
  }
}

/* A car-shaped vehicle (sedan, hatch, SUV, taxi, pickup, van), centred at the origin */
function drawCar(ctx, kind, col, opt = {}) {
  const k = PK[kind] || PK.sedan;
  const Lh = (opt.L || k.L) / 2, hw = (opt.W || k.W) / 2;
  shadow(ctx, -Lh, Lh, hw);
  const wx = Lh * 0.62;
  for (const x of [-wx, wx]) for (const y of [-hw + 0.08, hw - 0.08]) tyre(ctx, x, y, 0.62, 0.22, x > 0 ? (opt.steer || 0) : 0);
  const body = col;
  const g = ctx.createLinearGradient(0, -hw, 0, hw);
  g.addColorStop(0, shade(body, -0.25)); g.addColorStop(0.5, shade(body, 0.14)); g.addColorStop(1, shade(body, -0.3));
  ctx.fillStyle = g;
  rr(ctx, -Lh, -hw, Lh * 2, hw * 2, hw * 0.55); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 0.04; ctx.stroke();
  const glass = '#1d2a36';
  let cab0, cab1, roof0, roof1;
  if (kind === 'van') { cab0 = -Lh + 0.25; cab1 = Lh - 0.7; roof0 = cab0 + 0.15; roof1 = cab1 - 0.45; }
  else if (kind === 'pickup') { cab0 = -0.2; cab1 = Lh - 1.25; roof0 = 0.0; roof1 = cab1 - 0.5; }
  else if (kind === 'hatch' || kind === 'suv') { cab0 = -Lh + 0.35; cab1 = Lh - 1.05; roof0 = cab0 + 0.35; roof1 = cab1 - 0.55; }
  else { cab0 = -Lh + 0.95; cab1 = Lh - 1.25; roof0 = cab0 + 0.45; roof1 = cab1 - 0.6; }
  // glass house
  ctx.fillStyle = glass;
  rr(ctx, cab0, -hw + 0.18, cab1 - cab0, hw * 2 - 0.36, 0.3); ctx.fill();
  // roof
  const rg = ctx.createLinearGradient(0, -hw, 0, hw);
  rg.addColorStop(0, shade(body, -0.12)); rg.addColorStop(0.5, shade(body, 0.22)); rg.addColorStop(1, shade(body, -0.18));
  ctx.fillStyle = rg;
  rr(ctx, roof0, -hw + 0.26, roof1 - roof0, hw * 2 - 0.52, 0.22); ctx.fill();
  // windscreen glint
  ctx.fillStyle = 'rgba(160,200,230,.18)';
  ctx.beginPath(); ctx.moveTo(roof1 + 0.05, -hw + 0.3); ctx.lineTo(cab1 - 0.08, -hw + 0.24); ctx.lineTo(cab1 - 0.08, -0.1); ctx.lineTo(roof1 + 0.05, 0.1); ctx.fill();
  if (kind === 'pickup') { // open load bed
    ctx.fillStyle = shade(body, -0.45); rr(ctx, -Lh + 0.15, -hw + 0.16, Lh - 0.45, hw * 2 - 0.32, 0.08); ctx.fill();
    ctx.strokeStyle = shade(body, -0.25); ctx.lineWidth = 0.05;
    for (let x = -Lh + 0.4; x < -0.4; x += 0.35) { ctx.beginPath(); ctx.moveTo(x, -hw + 0.2); ctx.lineTo(x, hw - 0.2); ctx.stroke(); }
  }
  if (kind === 'van') {
    ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 0.04;
    for (let x = roof0 + 0.6; x < roof1 - 0.3; x += 0.7) { ctx.beginPath(); ctx.moveTo(x, -hw + 0.3); ctx.lineTo(x, hw - 0.3); ctx.stroke(); }
  }
  if (kind === 'taxi') {
    ctx.fillStyle = '#f6efe0'; rr(ctx, (roof0 + roof1) / 2 - 0.18, -0.35, 0.36, 0.7, 0.08); ctx.fill();
    ctx.fillStyle = '#c8453b'; ctx.fillRect((roof0 + roof1) / 2 - 0.04, -0.3, 0.08, 0.6);
  }
  if (opt.stripe) { // Siam Times livery: a cream stripe over the roof
    ctx.fillStyle = 'rgba(239,231,212,.9)';
    ctx.fillRect(-Lh + 0.05, -0.12, Lh * 2 - 0.1, 0.24);
    ctx.fillStyle = '#d6ad5f';

function drawMoto(ctx, col) {

/* Tuk-tuk, in the rear-axle frame: three wheels, a passenger bench under a canopy, the driver ahead */

/* Box truck in the rear-axle frame (ten-wheeler, or the truck that pulls the trailer) */

  for (const x of o.tandem ? [-0.68, 0.68] : [0]) { tyre(ctx, x, -hw + 0.1, 1.0, 0.42); tyre(ctx, x, hw - 0.1, 1.0, 0.42); }

  ctx.fillStyle = cg; rr(ctx, x1 - cab, -hw + 0.03, cab, hw * 2 - 0.06, 0.28); ctx.fill();
  ctx.fillStyle = '#1d2a36'; rr(ctx, x1 - 0.42, -hw + 0.16, 0.3, hw * 2 - 0.32, 0.08); ctx.fill();
  ctx.fillStyle = 'rgba(160,200,230,.18)'; ctx.fillRect(x1 - 0.4, -hw + 0.2, 0.12, hw - 0.3);
  ctx.fillStyle = shade(col, 0.25); rr(ctx, x1 - cab + 0.2, -hw + 0.3, cab - 0.75, hw * 2 - 0.6, 0.12); ctx.fill();

function roofText(ctx, cx, len, text) {

/* Trailer in its axle frame: drawbar forward to the hitch, box, tandem axle */
function drawTrailerUnit(ctx, t, opt = {}) {
  const hw = t.w / 2;
  shadow(ctx, -t.rear, t.front, hw);
  for (const x of [-0.65, 0.65]) { tyre(ctx, x, -hw + 0.1, 1.0, 0.42); tyre(ctx, x, hw - 0.1, 1.0, 0.42); }
  ctx.strokeStyle = '#2a2f36'; ctx.lineWidth = 0.14;
  ctx.beginPath(); ctx.moveTo(t.front - 0.1, -0.7); ctx.lineTo(t.d, 0); ctx.lineTo(t.front - 0.1, 0.7); ctx.stroke();
  ctx.fillStyle = '#1b1f24'; ctx.beginPath(); ctx.arc(t.d, 0, 0.14, 0, 7); ctx.fill();
  const box = opt.box || '#efe7d4';
  const g = ctx.createLinearGradient(0, -hw, 0, hw);
  g.addColorStop(0, shade(box, -0.22)); g.addColorStop(0.5, shade(box, 0.1)); g.addColorStop(1, shade(box, -0.28));
  ctx.fillStyle = g; rr(ctx, -t.rear, -hw, t.front + t.rear, hw * 2, 0.12); ctx.fill();

}

/* A parked vehicle, centred on its own box */
function drawParked(ctx, c, t) {
  const k = PK[c.kind];
  const blink = c.alarm > 0 && Math.floor(t * 4) % 2 === 0;
  ctx.save();
  let sx = 0, sy = 0;
  if (c.shake > 0) { sx = Math.sin(t * 70) * 0.06 * c.shake; sy = Math.cos(t * 55) * 0.05 * c.shake; }
  ctx.translate(c.x + sx, c.y + sy); ctx.rotate(c.a);
  if (c.kind === 'moto') drawMoto(ctx, c.col);
  else if (c.kind === 'tuktuk') { ctx.translate(-(k.L / 2 - 0.55), 0); drawTuk(ctx, c.col, { blink }); }
  else if (c.kind === 'truck') { ctx.translate(-(k.L / 2 - 2.5), 0); drawTruck(ctx, { wb: 5.6, fo: 1.4, ro: 2.5, hw: 1.25, cab: 2.2, col: c.col, box: '#d9d4c8', tandem: true, blink }); }
  else if (c.kind === 'longtruck') {
    // truck and trailer parked straight: draw the trailer behind, then the truck
    ctx.save(); ctx.translate(-k.L / 2 + 4.0, 0); drawTrailerUnit(ctx, { d: 5.8, front: 4.0, rear: 4.0, w: 2.5 }, { box: '#cfc9bb' }); ctx.restore();
    ctx.translate(k.L / 2 - 5.4, 0); drawTruck(ctx, { wb: 4.2, fo: 1.2, ro: 1.6, hw: 1.25, cab: 2.2, col: c.col, box: '#d9d4c8', tandem: false, blink });
  }
  else drawCar(ctx, c.kind, c.col, { blink });
  ctx.restore();
}

/* The player's vehicle */
function drawPlayer(ctx, st, opt) {
  const k = STAGES[stageIx];
  if (V.tr) {
    ctx.save(); ctx.translate(st.tx, st.ty); ctx.rotate(st.ta);
    drawTrailerUnit(ctx, V.tr, Object.assign({ text: 'The Siam Times' }, opt));
    ctx.restore();
  }
  ctx.save(); ctx.translate(st.x, st.y); ctx.rotate(st.a);
  const o = Object.assign({ steer: car.steer }, opt);
  if (k === 'tuktuk') drawTuk(ctx, '#2c5f8f', o);
  else if (k === 'sedan') { ctx.translate((V.wb + V.fo - V.ro) / 2, 0); drawCar(ctx, 'sedan', '#24527a', Object.assign(o, { stripe: true, L: 4.6, W: 1.82 })); }
  else if (k === 'van') { ctx.translate((V.wb + V.fo - V.ro) / 2, 0); drawCar(ctx, 'van', '#e7dfcc', Object.assign(o, { L: 5.4, W: 1.95 })); vanLivery(ctx); }
  else if (k === 'truck') drawTruck(ctx, Object.assign({ wb: 5.6, fo: 1.4, ro: 2.5, hw: 1.25, cab: 2.2, col: '#24527a', box: '#efe7d4', tandem: true, text: 'The Siam Times' }, o));
  else drawTruck(ctx, Object.assign({ wb: 4.2, fo: 1.2, ro: 1.6, hw: 1.25, cab: 2.2, col: '#24527a', box: '#efe7d4', tandem: false }, o));

}
function vanLivery(ctx) {
  ctx.fillStyle = '#24527a'; ctx.fillRect(-2.55, -0.98, 5.0, 0.12); ctx.fillRect(-2.55, 0.86, 5.0, 0.12);
  roofText(ctx, -0.3, 3.0, 'The Siam Times');
}

/* Small side-on icon of each vehicle for the stage list and cards (drawn from above, nose right) */
function drawIcon(cv, key) {
  const ctx = cv.getContext('2d');
  const d = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || cv.width / 2, h = cv.clientHeight || cv.height / 2;
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const spec = VEH[key];
  const len = spec.tr ? spec.wb + spec.fo + spec.hitch + spec.tr.d + spec.tr.rear : spec.wb + spec.fo + spec.ro;
  const s = Math.min((w - 6) / len, (h - 6) / 2.9);
  ctx.translate(w / 2, h / 2); ctx.scale(s, s);
  const prevV = V; V = spec;
  const back = spec.tr ? spec.hitch + spec.tr.d + spec.tr.rear : spec.ro;
  const st = { x: -len / 2 + back, y: 0, a: 0 };
  if (spec.tr) { st.tx = st.x - spec.hitch - spec.tr.d; st.ty = 0; st.ta = 0; }
  const keep = stageIx; stageIx = STAGES.indexOf(key);
  const keepSteer = car.steer; car.steer = 0;
  drawPlayer(ctx, st, {});
  car.steer = keepSteer; stageIx = keep; V = prevV;
}

/* ---------- The car park from above ---------- */
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');
let stageIx = 0;
let VW = 0, VH = 0, DPR = 1;
const cam = { x: 0, y: 0, z: 20, ready: false };
const fx = { parts: [], floats: [], confetti: [], shake: 0 };

let floorPat = null;
(function makeFloorTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const R = rng(7);
  const img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 128 + (R() - 0.5) * 34;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  for (let k = 0; k < 60; k++) { g.fillStyle = `rgba(${R() < 0.5 ? 0 : 255},${R() < 0.5 ? 0 : 255},${R() < 0.5 ? 0 : 255},.025)`; g.beginPath(); g.arc(R() * 256, R() * 256, 4 + R() * 20, 0, 7); g.fill(); }
  try {
    floorPat = ctx.createPattern(c, 'repeat');
    floorPat.setTransform(new DOMMatrix().scale(1 / 48));
  } catch (e) { floorPat = null; }
})();

function resize() {
  const r = canvas.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = Math.max(1, r.width); VH = Math.max(1, r.height);
  canvas.width = Math.round(VW * DPR); canvas.height = Math.round(VH * DPR);
  lightCv.width = Math.round(VW / 2); lightCv.height = Math.round(VH / 2);
}
function mirrorRect() {
  const w = clamp(VW * 0.46, 170, 380), h = Math.round(w * 0.36);
  return { x: (VW - w) / 2, y: 10, w, h };
}

/* Camera: keeps the vehicle (and, on Auto, the bay) in view, clear of the mirror and the controls */
function camGoal() {
  const m = mirrorRect();
  // the pedals and the wheel sit in the bottom corners: keep the vehicle above them
  const padT = m.y + m.h + 14, padB = save.cam === 'all' ? 20 : Math.min(150, VH * 0.24), padS = 14;
  let x0, y0, x1, y1;
  if (save.cam === 'all' || !L) { [x0, y0, x1, y1] = L.view; }
  else {
    x0 = Infinity; y0 = Infinity; x1 = -Infinity; y1 = -Infinity;
    const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
    const near = save.cam === 'near';
    const mg = near ? 4 : 3.2;
    for (const b of bodies(car)) for (const [px, py] of corners(b)) { add(px - mg, py - mg); add(px + mg, py + mg); }
    if (!near) for (const [px, py] of corners(L.slot.box)) { add(px - 1.5, py - 1.5); add(px + 1.5, py + 1.5); }
  }
  const aw = VW - padS * 2, ah = VH - padT - padB;
  let z = Math.min(aw / (x1 - x0), ah / (y1 - y0));
  z = clamp(z, 4, save.cam === 'near' ? 46 : 38);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  // shift so the box sits in the middle of the free area
  return { x: cx, y: cy - (padT - padB) / 2 / z, z };
}
function updateCam(dt, snap) {
  const g = camGoal();
  const k = snap || !cam.ready ? 1 : 1 - Math.exp(-dt * 2.6);
  cam.x += (g.x - cam.x) * k; cam.y += (g.y - cam.y) * k; cam.z += (g.z - cam.z) * k;
  cam.ready = true;
}
function worldXform(c, scale = 1) {
  let sx = 0, sy = 0;
  if (fx.shake > 0 && !REDUCED) { sx = (Math.random() - 0.5) * fx.shake * 8; sy = (Math.random() - 0.5) * fx.shake * 8; }
  c.setTransform(DPR * scale * cam.z, 0, 0, DPR * scale * cam.z, DPR * scale * (VW / 2 - cam.x * cam.z + sx), DPR * scale * (VH / 2 - cam.y * cam.z + sy));
}
const toScreen = (x, y) => [VW / 2 + (x - cam.x) * cam.z, VH / 2 + (y - cam.y) * cam.z];

function stains() {
  if (L.stains) return L.stains;
  const R = rng(99 + stageIx);
  L.stains = [];
  for (let k = 0; k < L.W * L.H / 14; k++) L.stains.push({ x: R() * L.W, y: R() * L.H, rx: 0.3 + R() * 1.4, ry: 0.2 + R() * 0.8, a: R() * 3, o: 0.03 + R() * 0.06 });
  return L.stains;
}

function drawWorld(t) {
  const out = L.outdoor;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = out ? '#0b1118' : '#0a0f15';
  ctx.fillRect(0, 0, VW, VH);
  worldXform(ctx);
  // roof of the press hall (yard stages)
  if (L.roof) drawRoof(L.roof);
  // floor
  ctx.fillStyle = out ? '#4a4d53' : '#8d8a82';
  ctx.fillRect(0, 0, L.W, L.H);
  if (floorPat) { ctx.globalAlpha = out ? 0.55 : 0.4; ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = floorPat; ctx.fillRect(0, 0, L.W, L.H); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
  for (const s of stains()) { ctx.fillStyle = `rgba(20,16,12,${s.o})`; ctx.beginPath(); ctx.ellipse(s.x, s.y, s.rx, s.ry, s.a, 0, 7); ctx.fill(); }
  // slab joints
  ctx.strokeStyle = out ? 'rgba(0,0,0,.25)' : 'rgba(40,36,30,.22)'; ctx.lineWidth = 0.04;
  ctx.beginPath();
  for (let x = 6; x < L.W; x += 6) { ctx.moveTo(x, 0); ctx.lineTo(x, L.H); }
  for (let y = 6; y < L.H; y += 6) { ctx.moveTo(0, y); ctx.lineTo(L.W, y); }
  ctx.stroke();
  // paint
  ctx.lineCap = 'butt';
  for (const [x1, y1, x2, y2, col, wd] of L.lines) { ctx.strokeStyle = col; ctx.globalAlpha = 0.85; ctx.lineWidth = wd; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const a of L.arrows) floorArrow(a);
  for (const m of L.marks) floorText(m);
  drawSlot(t);
  if (save.guide && state === 'drive') drawGuides();
  // props (paper rolls, the guard's booth)
  for (const p of L.props) drawProp(p);
  for (const c of L.parked) drawParked(ctx, c, t);
  const braking = Math.abs(car.v) > 0.05 && !input.fwd && !input.rev;
  drawPlayer(ctx, car, { head: true, brake: braking || state === 'parked', rev: car.gear === 'R' && state === 'drive' });
  for (const p of L.pillars) drawPillar(p);
  for (const w of L.walls) drawWall(w);
  for (const d of L.doors) drawDoor(d);
  drawLight(t);
  drawFixtures(t);
  drawFx();
}

function drawRoof(r) {
  ctx.fillStyle = '#1b222b'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 0.05;
  ctx.beginPath(); for (let x = 1; x < r.w; x += 1.2) { ctx.moveTo(x, r.y); ctx.lineTo(x, r.y + r.h); } ctx.stroke();
  ctx.save(); ctx.translate(r.x + r.w / 2, r.y + r.h / 2); ctx.scale(0.05, 0.05);
  ctx.fillStyle = 'rgba(239,231,212,.85)'; ctx.font = `${Math.round(r.h * 9)}px Chomsky, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('The Siam Times', 0, 4); ctx.restore();
  ctx.fillStyle = '#2b333d';
  for (const x of [4, r.w - 7]) { ctx.fillRect(x, r.y + 1.2, 3, 2.2); ctx.fillStyle = '#20272f'; ctx.beginPath(); ctx.arc(x + 1.5, r.y + 2.3, 0.8, 0, 7); ctx.fill(); ctx.fillStyle = '#2b333d'; }
}
function floorArrow(a) {

  ctx.fillStyle = 'rgba(239,231,212,.32)';
  ctx.beginPath(); ctx.moveTo(-1.3, -0.18); ctx.lineTo(0.3, -0.18); ctx.lineTo(0.3, -0.55); ctx.lineTo(1.2, 0); ctx.lineTo(0.3, 0.55); ctx.lineTo(0.3, 0.18); ctx.lineTo(-1.3, 0.18); ctx.closePath(); ctx.fill();

}

function render3D(x, y, w, h, t) {

  const el = $('msg');
  el.textContent = text;
  el.style.color = tone === 'bad' ? 'var(--bad)' : tone === 'good' ? 'var(--good)' : '';
}
const starsHTML = s => '★'.repeat(s) + `<span class="off">${'★'.repeat(3 - s)}</span>`;
const totalBest = () => save.best.reduce((a, b) => a + b, 0);
const clockText = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function updateBar() {
  $('sbStageLabel').textContent = T.stageOf(stageIx + 1, STAGES.length);
  $('sbStageSub').textContent = T.veh[STAGES[stageIx]];
  const sc = $('sbScore');
  if (run.score !== null) { sc.textContent = fmt(run.score); sc.classList.remove('neg'); }
  else { sc.textContent = run.pen ? '−' + fmt(run.pen) : '0'; sc.classList.toggle('neg', run.pen > 0); }
  const n = run.hitsCar + run.hitsWall + run.jacks;
  $('sbHits').textContent = fmt(n);
  $('sbHits').classList.toggle('neg', n > 0);
  $('sbTime').textContent = clockText(run.t);
  const b = save.best[stageIx];
  $('sbBest').innerHTML = b ? `<span class="sb-stars">${starsHTML(save.stars[stageIx])}</span> ${fmt(b)}` : '–';
  $('sbTotal').textContent = fmt(totalBest());
}

function renderStageList() {
  const ol = $('stageList');
  if (!ol.children.length) {
    STAGES.forEach((key, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<button class="stage-btn" type="button" data-i="${i}"><canvas></canvas><span class="st-name"></span><span class="st-meta"></span><span class="st-stars"></span></button>`;
      ol.appendChild(li);
      li.firstChild.addEventListener('click', () => {
        audioInit();
        if (!unlocked(i)) { setMsg(T.locked, 'bad', 1800); return; }
        loadStage(i, true);
      });
    });
  }
  [...ol.querySelectorAll('.stage-btn')].forEach((btn, i) => {
    const key = STAGES[i];
    btn.querySelector('.st-name').textContent = `${i + 1}. ${T.veh[key]}`;
    btn.querySelector('.st-meta').textContent = T.meta[i];
    btn.querySelector('.st-stars').innerHTML = unlocked(i) ? starsHTML(save.stars[i]) : '🔒';
    btn.setAttribute('aria-current', i === stageIx ? 'true' : 'false');
    btn.setAttribute('aria-disabled', unlocked(i) ? 'false' : 'true');
  });
  requestAnimationFrame(() => [...ol.querySelectorAll('canvas')].forEach((cv, i) => drawIcon(cv, STAGES[i])));
}

function loadStage(i, intro) {
  stageIx = i; save.stage = i; persist();
  L = buildLevel(i); V = VEH[STAGES[i]];
  jackObs.armed = true;
  placeCar();
  Object.assign(run, { t: 0, started: false, hitsCar: 0, hitsWall: 0, jacks: 0, pen: 0, hold: 0, score: null });
  fx.parts = []; fx.floats = []; fx.confetti = []; fx.shake = 0;
  src.pf = src.pr = src.kf = src.kr = false; src.centering = false;
  input.fwd = input.rev = false;
  parkNow = parkState(); sensor.gap = Infinity;
  msgLock = 0; msgKey = '';
  cam.ready = false; updateCam(0, true);
  if (AU.ctx) { buildEngine(); buildAmbience(); }
  renderStageList(); updateBar(); wheelUI(true);
  if (intro) showIntro(); else beginDrive();
}
function beginDrive() {
  audioInit();
  state = 'drive';
  hideOverlay();
  setMsg(T.msgStart, '', 0, 'start');
}

function showOverlay({ eyebrow, title, text = '', list = null, note = '', stars = null, pic = false, primary, secondary = null }) {
  $('ovEyebrow').textContent = eyebrow;
  $('ovTitle').textContent = title;
  $('ovText').textContent = text; $('ovText').hidden = !text;
  $('ovNote').textContent = note; $('ovNote').hidden = !note;
  const ul = $('ovList');
  ul.hidden = !list;
  if (list) ul.innerHTML = list.map(([k, v, neg, strong]) => `<li${strong ? ' style="font-weight:700"' : ''}><span>${k}</span><b class="${neg ? 'neg' : ''}">${v}</b></li>`).join('');
  $('ovStars').hidden = stars === null;
  if (stars !== null) $('ovStars').innerHTML = starsHTML(stars);
  const cv = $('ovPic'); cv.hidden = !pic;
  $('ovBtn').textContent = primary[0]; ovPrimary = primary[1];
  $('ovBtn2').hidden = !secondary;
  if (secondary) { $('ovBtn2').textContent = secondary[0]; ovSecondary = secondary[1]; }
  $('overlay').hidden = false;
  if (pic) requestAnimationFrame(() => drawIcon(cv, STAGES[stageIx]));
  setTimeout(() => $('ovBtn').focus({ preventScroll: true }), 30);
}
function hideOverlay() { $('overlay').hidden = true; }
function showIntro() {
  state = 'intro';
  const i = stageIx, b = save.best[i];
  showOverlay({
    eyebrow: `${T.stageOf(i + 1, STAGES.length)} · ${T.veh[STAGES[i]]}`,
    title: T.introTitle(L.slot.label),
    text: T.intro[i],
    note: b ? T.bestWas(fmt(b)) : '',
    pic: true,
    primary: [T.start, beginDrive],
  });
  setMsg(T.meta[i], '', 0, 'meta' + i);
}

function onHit(o, speed) {
  let pen, text;
  if (o.kind === 'car') { pen = 100; run.hitsCar++; text = T.hitCar; o.ref.shake = 1; o.ref.alarm = 2.6; sfx.alarm(); }
  else if (o.kind === 'jack') { pen = 50; run.jacks++; text = T.jack; }
  else { pen = 50; run.hitsWall++; text = o.kind === 'pillar' ? T.hitPillar : T.hitWall; }
  run.pen += pen;
  sfx.bump(o.kind, speed);
  fx.shake = Math.min(1, 0.35 + speed * 0.3);
  const p = contactPoint(o);
  burst(p[0], p[1], 16, o.kind === 'car' ? [o.ref.col, '#ffffff', '#ffd27a'] : ['#ffd27a', '#ffffff', '#9aa1a9']);
  fx.floats.push({ x: p[0], y: p[1], text: '−' + pen, col: '#e58576', life: 1.6, big: o.kind === 'car' });
  setMsg(text, 'bad', 2200);
  updateBar();
  try { if (navigator.vibrate) navigator.vibrate(o.kind === 'car' ? 80 : 40); } catch (e) { /* not supported */ }
}
function contactPoint(o) {
  if (o.kind === 'jack') return [car.x - V.hitch * Math.cos(car.a), car.y - V.hitch * Math.sin(car.a)];
  let best = null, bd = Infinity;
  for (const b of bodies(car)) {
    const cs = corners(b);
    const pts = [...cs, ...cs.map((c, k) => [(c[0] + cs[(k + 1) % 4][0]) / 2, (c[1] + cs[(k + 1) % 4][1]) / 2])];
    for (const p of pts) { const d = pointDist(o.box, p[0], p[1]); if (d < bd) { bd = d; best = p; } }
  }
  return best || [car.x, car.y];
}

function checkPark(dt) {
  parkNow = parkState();
  const ps = parkNow;
  const stopped = Math.abs(car.v) < 0.02 && !input.fwd && !input.rev;
  if (ps.all && ps.aligned && !ps.nose) {
    if (stopped) { run.hold += dt; setMsg(T.holding, 'good', 0, 'hold'); if (run.hold > 0.7) finish(ps); }
    else { run.hold = 0; setMsg(T.inSlot, 'good', 0, 'in'); }
    return;
  }
  run.hold = 0;
  if (ps.all && ps.nose) setMsg(T.wrongWay, 'bad', 0, 'wrong');
  else if (ps.all) setMsg(T.crooked, '', 0, 'crooked');
  else if (ps.inside >= ps.total / 2 && stopped && !ps.nose) setMsg(T.partly, '', 0, 'partly');
}
/* Story mode: when this page runs inside the Siam Times story (in a frame), tell the story when a game ends. */
function storyDone(r) {
  try { if (window.parent !== window) window.parent.postMessage(Object.assign({ tst: 'story', game: 'parking' }, r), '*'); } catch (e) { /* not in a frame */ }
}
function finish(ps) {
  state = 'parked';
  car.v = 0;
  const i = stageIx;
  const accPts = Math.round(ps.acc * 500);
  const tb = Math.round(Math.max(0, PAR[i] - run.t) * 6);
  const touches = run.hitsCar + run.hitsWall + run.jacks;
  const total = Math.max(0, 1000 + accPts + tb - run.pen);
  const stars = 1 + (ps.acc >= 0.6 && touches <= 1 ? 1 : 0) + (ps.acc >= 0.8 && touches === 0 ? 1 : 0);
  const nextWasLocked = i + 1 < STAGES.length && !unlocked(i + 1);
  const prevBest = save.best[i];
  save.best[i] = Math.max(prevBest, total);
  save.stars[i] = Math.max(save.stars[i], stars);
  persist();
  run.score = total;
  storyDone({ won: true, score: total, stars, stage: i + 1 });
  updateBar(); renderStageList();
  sfx.clunk(); setTimeout(() => sfx.win(), 250);
  confetti();
  setMsg(T.okTitle[stars], 'good', 3000);
  const list = [[T.lParked, '+' + fmt(1000)], [T.lAcc(Math.round(ps.acc * 100)), '+' + fmt(accPts)], [T.lTime, '+' + fmt(tb)]];
  if (run.hitsCar) list.push([T.lCar(run.hitsCar), '−' + fmt(run.hitsCar * 100), true]);
  if (run.hitsWall) list.push([T.lWall(run.hitsWall), '−' + fmt(run.hitsWall * 50), true]);
  if (run.jacks) list.push([T.lJack(run.jacks), '−' + fmt(run.jacks * 50), true]);
  list.push([T.lTotal, fmt(total), false, true]);
  const last = i === STAGES.length - 1;
  let note = total > prevBest ? T.newBest : T.bestWas(fmt(prevBest));
  if (nextWasLocked) note += ' · ' + T.unlocked(T.veh[STAGES[i + 1]]);
  if (last) note += ' · ' + T.allNote(fmt(totalBest()));
  setTimeout(() => {
    if (state !== 'parked' || stageIx !== i) return;
    showOverlay({
      eyebrow: last ? T.allTitle : T.okEyebrow,
      title: T.okTitle[stars],
      stars, list, note,
      primary: last ? [T.first, () => loadStage(0, true)] : [T.next, () => loadStage(i + 1, true)],
      secondary: [T.retry, () => loadStage(i, false)],
    });
  }, 1100);
}

/* ---------- Controls ---------- */
const wheelEl = $('wheel'), wheelSvg = wheelEl.querySelector('svg');
let shownWheel = null;
function wheelUI(force) {
  if (!force && shownWheel === car.wheel) return;
  shownWheel = car.wheel;
  wheelSvg.style.transform = `rotate(${car.wheel.toFixed(1)}deg)`;
  const d = Math.round(car.wheel);
  wheelEl.setAttribute('aria-valuenow', String(Math.round(car.wheel / WHEEL_MAX * 100)));
  wheelEl.setAttribute('aria-valuetext', T.wheelAria(d));
  wheelEl.setAttribute('aria-label', T.wheelAria(d));
}
function pedal(el, key) {
  const on = v => {
    src[key] = v; el.classList.toggle('on', v);
    if (v) { audioInit(); if (state === 'intro') beginDrive(); }
  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } on(true); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(ev, () => on(false));
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); on(true); } });
  el.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.stopPropagation(); on(false); } });
  el.addEventListener('blur', () => on(false));
}
pedal($('fwdBtn'), 'pf');
pedal($('revBtn'), 'pr');

(function steeringWheel() {
  let id = null, lastA = 0, turned = 0, t0 = 0, nearHub = false;
  const angleOf = e => { const r = wheelEl.getBoundingClientRect(); const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2); return { a: Math.atan2(y, x), d: Math.hypot(x, y), R: r.width / 2 }; };
  wheelEl.addEventListener('pointerdown', e => {
    e.preventDefault(); audioInit();
    if (state === 'intro') beginDrive();
    id = e.pointerId; try { wheelEl.setPointerCapture(id); } catch (err) { /* ignore */ }
    const p = angleOf(e); lastA = p.a; turned = 0; t0 = performance.now(); nearHub = p.d < p.R * 0.36;
    src.centering = false;
    wheelEl.classList.add('grabbing');
  });
  wheelEl.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const p = angleOf(e);
    if (p.d < 10) return;
    const da = wrapA(p.a - lastA) / DEG;
    lastA = p.a; turned += Math.abs(da);
    if (state === 'drive') setWheel(car.wheel + da);
  });
  const end = e => {
    if (e.pointerId !== id) return;
    id = null; wheelEl.classList.remove('grabbing');
    if (nearHub && turned < 8 && performance.now() - t0 < 350) sfx.horn();
  };
  wheelEl.addEventListener('pointerup', end);
  wheelEl.addEventListener('pointercancel', end);
  wheelEl.addEventListener('contextmenu', e => e.preventDefault());
})();
$('hornBtn').addEventListener('click', () => { audioInit(); sfx.horn(); });
$('centerBtn').addEventListener('click', () => { audioInit(); src.centering = true; });

const typing = e => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
window.addEventListener('keydown', e => {
  if (typing(e) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  audioInit();
  if (!$('overlay').hidden && (k === 'Enter' || k === ' ')) { e.preventDefault(); if (e.target !== $('ovBtn') && e.target !== $('ovBtn2')) ovPrimary && ovPrimary(); return; }
  if (k === 'Shift') src.fast = true;
  const map = { ArrowUp: 'kf', w: 'kf', W: 'kf', ArrowDown: 'kr', s: 'kr', S: 'kr', ArrowLeft: 'kl', a: 'kl', A: 'kl', ArrowRight: 'kq', d: 'kq', D: 'kq' };
  if (map[k]) {
    e.preventDefault();
    if ((map[k] === 'kf' || map[k] === 'kr') && state === 'intro') beginDrive();
    src[map[k]] = true;
    if (map[k] === 'kl' || map[k] === 'kq') src.centering = false;
    return;
  }
  if (k === 'c' || k === 'C') src.centering = true;
  else if (k === 'h' || k === 'H') sfx.horn();
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'Shift') src.fast = false;
  const map = { ArrowUp: 'kf', w: 'kf', W: 'kf', ArrowDown: 'kr', s: 'kr', S: 'kr', ArrowLeft: 'kl', a: 'kl', A: 'kl', ArrowRight: 'kq', d: 'kq', D: 'kq' };
  if (map[k]) src[map[k]] = false;
});
window.addEventListener('blur', () => { for (const k of ['pf', 'pr', 'kf', 'kr', 'kl', 'kq']) src[k] = false; });

$('ovBtn').addEventListener('click', () => { audioInit(); ovPrimary && ovPrimary(); });
$('ovBtn2').addEventListener('click', () => { audioInit(); ovSecondary && ovSecondary(); });
$('restartBtn').addEventListener('click', () => { audioInit(); loadStage(stageIx, false); });
document.querySelectorAll('input[name="cam"]').forEach(r => {
  r.checked = r.value === save.cam;
  r.addEventListener('change', () => { if (r.checked) { save.cam = r.value; persist(); } });
});
function toggles() {
  const set = (id, on, a, b) => { const el = $(id); el.textContent = on ? a : b; el.setAttribute('aria-pressed', String(on)); };
  set('guideBtn', save.guide, T.guideOn, T.guideOff);
  set('sensorBtn', save.sensor, T.sensorOn, T.sensorOff);
  set('soundBtn', save.sound, T.soundOn, T.soundOff);
}
$('guideBtn').addEventListener('click', () => { save.guide = !save.guide; persist(); toggles(); });
$('sensorBtn').addEventListener('click', () => { save.sensor = !save.sensor; persist(); toggles(); });
$('soundBtn').addEventListener('click', () => { audioInit(); setSound(!save.sound); toggles(); });
document.addEventListener('pointerdown', () => audioInit(), { passive: true });
document.addEventListener('visibilitychange', () => {
  if (!AU.ctx) return;
  if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume();
});

/* ---------- Main loop ---------- */
let lastT = performance.now(), barT = 0, lastGear = 'N';
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  const t = now / 1000;
  if (state === 'drive') {
    input.fwd = src.pf || src.kf; input.rev = src.pr || src.kr;
    const rate = (src.fast ? 560 : 280) * dt;
    if (src.kl) setWheel(car.wheel - rate);
    if (src.kq) setWheel(car.wheel + rate);
    if (src.centering) { setWheel(Math.abs(car.wheel) < 720 * dt ? 0 : car.wheel - Math.sign(car.wheel) * 720 * dt); if (car.wheel === 0) src.centering = false; }
    if ((input.fwd || input.rev) && !run.started) run.started = true;
    pedals(dt);
    if (car.gear !== lastGear) { if (lastGear !== 'N') sfx.clunk(); lastGear = car.gear; }
    drive(dt);
    rearm();
    if (run.started) run.t += dt;
    sensor.dir = car.gear === 'D' ? 1 : -1;
    sensor.gap = sensorGap(sensor.dir);
    checkPark(dt);
  } else {
    input.fwd = input.rev = false;
    car.v = 0;
  }
  stepFx(dt);
  updateCam(dt);
  updateAudio(dt);
  drawWorld(t);
  drawMirror(t);
  wheelUI();
  barT -= dt;
  if (barT <= 0) {
    barT = 0.2;
    $('sbTime').textContent = clockText(run.t);
    const g = state === 'parked' ? 'P' : car.gear;
    $('readout').innerHTML = `<b>${g}</b>${(Math.abs(car.v) * 3.6).toFixed(1)} ${T.kmh}`;
  }
  requestAnimationFrame(frame);
}

/* ---------- Start ---------- */
toggles();
resize();
new ResizeObserver(() => { resize(); updateCam(0, true); }).observe($('scene'));
loadStage(unlocked(save.stage) ? save.stage : 0, true);
if (document.fonts && document.fonts.load) document.fonts.load('40px Chomsky').then(() => renderStageList()).catch(() => {});
requestAnimationFrame(frame);
})();
</script>
<script>
/* No zooming: a pinch or a double tap would leave the game half off the screen and stuck. */
(() => {
  const stop = e => e.preventDefault();
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
  document.documentElement.style.touchAction = 'manipulation';
})();
</script>
</body>
