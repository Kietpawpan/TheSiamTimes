/* Layout: the back room fills the left as the scene, with the scoreline across its top;
   a narrow control rail sits on the right and drops under the scene on phones.
   Deliberately one dark look (a dim room with lamps over the table), like Siam Times Darts. */
:root {
  color-scheme: dark;
  --night: #0c131b;      /* page ground */
  --rail: #121c27;       /* control rail and scoreline */
  --well: #0f1821;       /* inset fields */
  --rule: #263548;       /* hairlines and tracks */
  --paper: #efe7d4;      /* newsprint cream, main text */
  --muted: #9ba7b3;      /* secondary text, blue-grey */
  --blue: #6ca6d1;       /* Siam Times blue (dark value): aim, focus, sliders */
  --brass: #d6ad5f;      /* release button, scores */
  --brass-ink: #1d1606;
  --good: #82d09c;
  --bad: #e58576;
  --font-mast: "Chomsky", "Old English Text MT", "UnifrakturCook", serif;
  --font-text: "Newsreader", "Sarabun", Georgia, "Times New Roman", serif;
  --font-label: "Helvetica Neue", Helvetica, Arial, "Sarabun", sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--paper);
  font: 16px/1.45 var(--font-text);
  -webkit-font-smoothing: antialiased;
}
html:lang(th) body { font-family: "Sarabun", var(--font-text); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
  height: 100%;
}

/* ---------- Scene ---------- */
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.scorebar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 8px 26px;
  padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
  background: var(--rail);
  border-bottom: 1px solid var(--rule);
}
.sb-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.label {
  font: 600 11px/1.2 var(--font-label);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
html:lang(th) .label { font-size: 12.5px; letter-spacing: .01em; text-transform: none; }
.sb-sub { font-size: 15px; line-height: 1.2; }
.big {
  font: 600 32px/1 var(--font-text);
  font-variant-numeric: tabular-nums lining-nums;
  color: var(--brass);
}
.big.neg { color: var(--bad); }
.mid {
  font: 600 18px/1.2 var(--font-text);
  font-variant-numeric: tabular-nums lining-nums;
}
.pips { display: flex; align-items: center; gap: 5px; min-height: 32px; }
.stonepip {
  width: 13px; height: 13px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #e4dfd3, #8f897d 58%, #4b463e);
  box-shadow: 0 1px 0 rgba(0, 0, 0, .45);
}
.stonepip.used { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
.canpip {
  width: 12px; height: 21px; border-radius: 2px 2px 3px 3px;
  background: linear-gradient(to bottom, #c3c9d0 0 9%, #cf2034 9% 38%, #f6f1e7 38% 50%, #cf2034 50% 53%, #f6f1e7 53% 64%, #cf2034 64% 92%, #9aa1a9 92%);
  box-shadow: inset -3px 0 0 rgba(0, 0, 0, .18);
}
.canpip.down { opacity: .2; }
.pips .count { font: 600 18px/1 var(--font-text); font-variant-numeric: tabular-nums; }
.sb-msg {
  flex-basis: 100%;
  margin: 0;
  font-style: italic;
  font-size: 15px;
  min-height: 1.45em;
}
html:lang(th) .sb-msg { font-style: normal; }

.scene { position: relative; flex: 1; min-height: 0; background: #0f1b28; overflow: hidden; }
.scene canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
.scene canvas.grab { cursor: grab; }
.scene canvas.grabbing { cursor: grabbing; }
.scene canvas:focus-visible { outline-offset: -3px; }
.hint {
  position: absolute;
  left: max(12px, env(safe-area-inset-left, 0px));
  top: 12px;
  margin: 0;
  max-width: calc(100% - 24px);
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(12, 19, 27, .8);
  border: 1px solid var(--rule);
  font: 500 12.5px/1.35 var(--font-label);
  letter-spacing: .02em;
  pointer-events: none;
  transition: opacity .4s;
}
.hint.gone { opacity: 0; }
.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding: 16px;
  background: rgba(6, 10, 15, .55);
}
.card {
  width: min(380px, 100%);
  padding: 24px;
  border-radius: 10px;
  background: var(--rail);
  border: 1px solid var(--rule);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
  display: flex; flex-direction: column; gap: 10px;
  text-align: center;
}
.card h2 {
  margin: 0;
  font: 600 44px/1.05 var(--font-text);
  font-variant-numeric: tabular-nums lining-nums;
  color: var(--brass);
  text-wrap: balance;
}
.card p { margin: 0; }
.card .note { text-align: center; }
.card .btn-brass { margin-top: 8px; }

/* ---------- Control rail ---------- */
.rail {
  display: flex; flex-direction: column; gap: 22px;
  min-width: 0;
  overflow-y: auto;
  padding-block: 20px 28px;
  padding-left: 20px;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--rail);
  border-left: 1px solid var(--rule);
}
.brand { display: flex; flex-direction: column; gap: 6px; }
.brand-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.brand h1 { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-weight: 400; line-height: 1; }
.brand .mast { font: 400 34px/1 var(--font-mast); letter-spacing: .005em; }
.brand .game { font: italic 400 26px/1.1 var(--font-text); color: var(--brass); }
html:lang(th) .brand .game { font: 600 24px/1.2 "Sarabun", sans-serif; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; max-width: 36ch; }
.btn-lang {
  flex: none;
  display: inline-flex; align-items: center;
  min-height: 32px; padding: 0 12px;
  color: var(--paper); text-decoration: none;
  border: 1px solid var(--rule); border-radius: 999px;
  background: transparent;
  font: 600 13px/1 var(--font-label);
}
.btn-lang:hover { border-color: var(--paper); }

.group { display: flex; flex-direction: column; gap: 10px; border: 0; margin: 0; padding: 0; min-width: 0; }
.group > legend { padding: 0; margin-bottom: 10px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--well); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg label {
  padding: 9px 6px;
  text-align: center;
  font: 600 13px/1.2 var(--font-label);
  color: var(--muted);
  cursor: pointer;
  border-left: 1px solid var(--rule);
  transition: background .15s, color .15s;
}
html:lang(th) .seg label { font-size: 14px; }
.seg label:first-of-type { border-left: 0; }
.seg label:hover { color: var(--paper); }
.seg input:checked + label { background: var(--paper); color: var(--night); }
.seg input:focus-visible + label { outline: 2px solid var(--blue); outline-offset: -2px; }
.note { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.45; }

.ctl { display: flex; flex-direction: column; gap: 4px; }
.ctl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ctl-head label { font: 600 14px/1.3 var(--font-label); }
.ctl-head output { font: 600 15px/1.3 var(--font-text); font-variant-numeric: tabular-nums lining-nums; color: var(--blue); white-space: nowrap; }
.ctl-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; align-items: center; gap: 10px; }
.step {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--well);
  font: 500 20px/1 var(--font-label);
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
.step:hover { border-color: var(--blue); }
.step:active { background: var(--rule); }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 30px; margin: 0;
  background: transparent;
  --fill: 50%;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(to right, var(--blue) var(--fill), var(--rule) var(--fill));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; margin-top: -9px;
  border-radius: 50%;
  background: var(--paper);
  border: 3px solid var(--blue);
}
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--rule); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--blue); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 3px solid var(--blue); }
input[type="range"]:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }

.btn-brass {
  width: 100%; min-height: 52px;
  border: 0; border-radius: 8px;
  background: var(--brass);
  color: var(--brass-ink);
  font: 700 15px/1 var(--font-label);
  letter-spacing: .1em;
  text-transform: uppercase;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22);
  transition: filter .15s, transform .05s;
}
html:lang(th) .btn-brass { font-size: 17px; letter-spacing: .01em; }
.btn-brass:hover { filter: brightness(1.08); }
.btn-brass:active { transform: translateY(1px); }
.btn-brass:disabled { opacity: .5; cursor: default; filter: none; transform: none; }
.btn-brass:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
.keys { margin: 0; font: 12px/1.8 var(--font-label); color: var(--muted); }
html:lang(th) .keys { font-size: 13px; }
kbd {
  display: inline-block; min-width: 1.6em; padding: 0 5px;
  border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px;
  font: 600 11px/1.5 var(--font-label); color: var(--paper); text-align: center;
  background: var(--well);
}
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-line {
  flex: 1 1 auto;
  min-height: 40px; padding: 0 14px;
  border: 1px solid var(--rule); border-radius: 8px;
  background: transparent;
  font: 600 13px/1 var(--font-label);
}
html:lang(th) .btn-line { font-size: 14px; }
.btn-line:hover { border-color: var(--paper); }
.btn-line[aria-pressed="false"] { color: var(--muted); }

details { border-top: 1px solid var(--rule); padding-top: 14px; }
summary { cursor: pointer; font: 600 14px/1.3 var(--font-label); }
details ul { margin: 12px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; max-width: 60ch; }
details li::marker { color: var(--brass); }

@media (max-width: 899px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .scene { flex: none; height: clamp(320px, 62vh, 130vw); }
  .rail {
    overflow: visible;
    border-left: 0;
    border-top: 1px solid var(--rule);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
  }
  .scorebar { gap: 6px 12px; padding-block: 10px 8px; }
  .sb-sub { font-size: 14px; }
  .sb-layout { display: none; }
  .sb-msg { font-size: 14px; }
  .big { font-size: 26px; }
  .hint { top: auto; left: auto; bottom: 12px; right: max(12px, env(safe-area-inset-right, 0px)); max-width: 40%; border-radius: 12px; text-align: right; }
  .stonepip { width: 10px; height: 10px; }
  .canpip { width: 9px; height: 16px; }
  .pips { gap: 3px; min-height: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="scorebar">
      <div class="sb-cell">
        <span class="label" id="sbModeLabel">5 รอบ</span>
        <span class="sb-sub" id="sbModeSub">รอบ 1 จาก 5</span>
      </div>
      <div class="sb-cell">
        <span class="label" data-i18n="score">คะแนน</span>
        <span class="big" id="sbScore">0</span>
      </div>
      <div class="sb-cell">
        <span class="label" data-i18n="stones">ลูกหิน</span>
        <div class="pips" id="stonePips"></div>
      </div>
      <div class="sb-cell">
        <span class="label" data-i18n="cans">กระป๋อง</span>
        <div class="pips" id="canPips"></div>
      </div>
      <div class="sb-cell">
        <span class="label" id="sbSideLabel">ดีที่สุด</span>
        <span class="mid" id="sbSideValue">–</span>
      </div>
      <p class="sb-msg" id="msg" aria-live="polite"></p>
    </div>
    <div class="scene" id="scene">
      <canvas id="canvas" tabindex="0" role="img"></canvas>
      <p class="hint" id="hint" data-i18n="hint">แตะผนังเพื่อเล็ง · ลากหนังสติ๊กลงเพื่อง้าง แล้วปล่อยนิ้ว</p>
      <div class="overlay" id="overlay" hidden>
        <div class="card" role="dialog" aria-modal="false" aria-labelledby="ovTitle">
          <span class="label" id="ovEyebrow"></span>
          <h2 id="ovTitle"></h2>
          <p id="ovText"></p>
          <p class="note" id="ovBest"></p>
          <button class="btn-brass" id="ovBtn" type="button" data-i18n="again">เล่นอีกครั้ง</button>
        </div>
      </div>
    </div>
  </main>

  <aside class="rail">
    <header class="brand">
      <div class="brand-top">
        <h1><span class="mast">The Siam Times</span> <span class="game" data-i18n="gameName">หนังสติ๊ก</span></h1>
        <a class="btn-lang" href="GA-slingshot-en.html" hreflang="en" lang="en">English</a>
      </div>
      <p data-i18n="tagline">กระป๋องน้ำอัดลม 5 ใบตั้งอยู่บนโต๊ะท้ายห้อง ห่างออกไป 4 เมตร ข้างหลังโต๊ะคือหน้าต่างกระจก</p>
    </header>

    <fieldset class="group">
      <legend class="label" data-i18n="modeLegend">เกม</legend>
      <div class="seg" role="radiogroup" data-i18n-aria="modeLegend">
        <input type="radio" name="mode" id="mode-classic" value="classic" checked><label for="mode-classic" data-i18n="classic">5 รอบ</label>
        <input type="radio" name="mode" id="mode-practice" value="practice"><label for="mode-practice" data-i18n="practice">ฝึกซ้อม</label>
      </div>
      <p class="note" id="modeNote"></p>
    </fieldset>

    <fieldset class="group">
      <legend class="label" data-i18n="shotLegend">การยิง</legend>
      <div class="ctl">
        <div class="ctl-head"><label for="yaw" data-i18n="yaw">เล็งซ้าย–ขวา</label><output id="yawOut" for="yaw"></output></div>
        <div class="ctl-row">
          <button class="step" type="button" data-target="yaw" data-step="-0.1" data-i18n-aria="yawMinus">−</button>
          <input type="range" id="yaw" min="-15" max="15" step="0.1" value="0">
          <button class="step" type="button" data-target="yaw" data-step="0.1" data-i18n-aria="yawPlus">+</button>
        </div>
      </div>
      <div class="ctl">
        <div class="ctl-head"><label for="pitch" data-i18n="pitch">วิถีโค้ง (มุมเงย)</label><output id="pitchOut" for="pitch"></output></div>
        <div class="ctl-row">
          <button class="step" type="button" data-target="pitch" data-step="-0.1" data-i18n-aria="pitchMinus">−</button>
          <input type="range" id="pitch" min="-10" max="40" step="0.1" value="3">
          <button class="step" type="button" data-target="pitch" data-step="0.1" data-i18n-aria="pitchPlus">+</button>
        </div>
      </div>
      <div class="ctl">
        <div class="ctl-head"><label for="draw" data-i18n="draw">แรงง้าง</label><output id="drawOut" for="draw"></output></div>
        <div class="ctl-row">
          <button class="step" type="button" data-target="draw" data-step="-1" data-i18n-aria="drawMinus">−</button>
          <input type="range" id="draw" min="0" max="100" step="1" value="55">
          <button class="step" type="button" data-target="draw" data-step="1" data-i18n-aria="drawPlus">+</button>
        </div>
      </div>
      <button class="btn-brass" id="fireBtn" type="button">ปล่อยหนังสติ๊ก</button>
      <p class="keys" data-i18n-html="keys"></p>
    </fieldset>

    <fieldset class="group">
      <legend class="label" data-i18n="handLegend">ความนิ่งของมือ</legend>
      <div class="seg" role="radiogroup" data-i18n-aria="handLegend">
        <input type="radio" name="difficulty" id="diff-easy" value="easy"><label for="diff-easy" data-i18n="easy">ง่าย</label>
        <input type="radio" name="difficulty" id="diff-normal" value="normal" checked><label for="diff-normal" data-i18n="normal">ปกติ</label>
        <input type="radio" name="difficulty" id="diff-pro" value="pro"><label for="diff-pro" data-i18n="pro">โปร</label>
      </div>
      <p class="note" id="diffNote"></p>
      <div class="row">
        <button class="btn-line" id="soundBtn" type="button" aria-pressed="true">เสียง: เปิด</button>
        <button class="btn-line" id="newBtn" type="button" data-i18n="newGame">เริ่มเกมใหม่</button>
      </div>
    </fieldset>

    <details>
      <summary data-i18n="howTo">วิธีเล่น</summary>
      <ul id="howList"></ul>
    </details>
  </aside>
</div>

<script>

/* ---------- The room, in metres ---------- */
// x to the right, y up from the floor, z away from you. The slingshot's fork is at z = 0.
const TAU = Math.PI * 2, DEG = Math.PI / 180, G = 9.81;
const EYE = { x: 0, y: 1.50, z: -0.62 };        // your eye, behind and above the slingshot
const REL = { x: 0, y: 1.33, z: 0 };            // the stone leaves the pouch here, between the fork tips
const ROOM = { hw: 1.95, h: 2.95, near: -0.35 };
const WALL = 4.30;                              // back wall
const TABLE = { x0: -1.15, x1: 1.15, z0: 3.78, z1: 4.15, y: 1.02, thick: 0.045, apron: 0.10 };
const CAN = { r: 0.033, h: 0.115 };             // a 330 ml can
const CAN_Z = 3.98;                             // the row of cans on the table
const STONE_R = 0.0095;                         // a 19 mm stone
const WIN = { x0: -1.05, x1: 1.05, y0: 1.13, y1: 2.15, frame: 0.05, mull: 0.035, cols: 4, rows: 2, sill: 0.04 };
const GLASS = { x0: WIN.x0 + WIN.frame, x1: WIN.x1 - WIN.frame, y0: WIN.y0 + WIN.frame, y1: WIN.y1 - WIN.frame };
const SIGN = { cx: 0, cy: 2.50, w: 0.96, h: 0.27 };
const BOARD = { x: -1.50, y: 1.73 };            // a regulation dartboard, bull 1.73 m up
const RING = { bull: 0.00635, outerBull: 0.0159, trebleIn: 0.099, trebleOut: 0.107,
               doubleIn: 0.162, doubleOut: 0.170, face: 0.2255, surround: 0.27 };
const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
const CHALK = { x0: 1.22, x1: 1.78, y0: 1.26, y1: 2.04 };
const LAMPS = [{ x: -0.62, y: 2.40, z: 3.55 }, { x: 0.62, y: 2.40, z: 3.55 }];
const FIT = { tx: 0.265, top: 0.245, bottom: -0.37 };   // slopes from your eye that must stay on screen
const SLOW = 1.6;                               // flights play slower than real time so you can follow them
const STEP = 1 / 900;                           // physics step, seconds
const ROUNDS = 5, STONES = 6;
const PTS = { can: 100, multi: 50, spare: 50, glass: 150 };
const ROUND_LAYOUTS = ['row', 'stagger', 'pyramid', 'towers', 'wide'];
const HANDS = {
  easy:   { sway: 0,    power: 0,   preview: 1,    guide: true },
  normal: { sway: 0.22, power: 1.0, preview: 0.5,  guide: false },
  pro:    { sway: 0.5,  power: 2.5, preview: 0.22, guide: false },
};
const speedFor = d => 5 + d / 100 * 11;         // 5 to 16 m/s
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Saved preferences and best score (this browser only) ---------- */
const STORE_KEY = 'siamTimesSlingshot.v1';
const saved = (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } })();
const prefs = {
  sound: saved.sound !== false,
  difficulty: HANDS[saved.difficulty] ? saved.difficulty : 'normal',
  best: Number.isFinite(saved.best) ? saved.best : null,
};
function savePrefs() { try { localStorage.setItem(STORE_KEY, JSON.stringify(prefs)); } catch {} }
const LANG = document.documentElement.lang === 'th' ? 'th' : 'en';
const T = STR[LANG];

/* ---------- Game state ---------- */
const state = {
  mode: 'classic', yaw: 0, pitch: 3.0, draw: 55,
  round: 1, layout: 'row', stonesLeft: STONES, score: 0,
  phase: 'aim',                 // aim | flight | roundOver | gameOver | rack
  totals: { cans: 0, bonus: 0, glass: 0, panes: 0 },
  practice: { shots: 0 },
  message: [], overlay: null,       // message: [[key, ...args], ...], put into words when shown
};
let cans = [], panes = [], stones = [], shards = [];
const toasts = [];
let shot = null, lastTrail = null, layerDirty = true, shakeUntil = 0;

/* ---------- Small helpers ---------- */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round1 = v => Math.round(v * 10) / 10;
const norm = v => { const l = Math.hypot(v.x, v.y, v.z) || 1; return { x: v.x / l, y: v.y / l, z: v.z / l }; };
const cross = (a, b) => ({ x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x });
const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const overTable = (x, z) => x > TABLE.x0 && x < TABLE.x1 && z > TABLE.z0 && z < TABLE.z1;
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const textFont = (weight, px) => LANG === 'th'
  ? `${weight} ${px}px Sarabun, "Helvetica Neue", Arial, sans-serif`
  : `${weight} ${px}px Newsreader, Georgia, serif`;

/* ---------- Aim ---------- */
function launchVel(yawDeg, pitchDeg, speed) {
  const y = yawDeg * DEG, p = pitchDeg * DEG;
  return { x: speed * Math.cos(p) * Math.sin(y), y: speed * Math.sin(p), z: speed * Math.cos(p) * Math.cos(y) };
}
// Where the slingshot points, as a straight line, at the depth of the cans.
function aimPoint(yaw, pitch) {
  const d = launchVel(yaw, pitch, 1), t = (CAN_Z - REL.z) / d.z;
  return { x: REL.x + d.x * t, y: REL.y + d.y * t, z: CAN_Z };
}
function sway(t) {
  const a = HANDS[prefs.difficulty].sway;
  if (!a) return { yaw: 0, pitch: 0 };
  return {
    yaw: a * (0.62 * Math.sin(t * 1.27) + 0.38 * Math.sin(t * 2.91 + 1.7)),
    pitch: a * (0.6 * Math.sin(t * 1.63 + 0.5) + 0.4 * Math.sin(t * 3.37 + 2.2)),
  };
}

/* ---------- The back wall ---------- */
function makePanes() {
  const pw = (GLASS.x1 - GLASS.x0 - (WIN.cols - 1) * WIN.mull) / WIN.cols;
  const ph = (GLASS.y1 - GLASS.y0 - (WIN.rows - 1) * WIN.mull) / WIN.rows;
  const out = [];
  for (let r = 0; r < WIN.rows; r++) for (let c = 0; c < WIN.cols; c++) {
    const x0 = GLASS.x0 + c * (pw + WIN.mull), y0 = GLASS.y0 + r * (ph + WIN.mull);
    out.push({ x0, x1: x0 + pw, y0, y1: y0 + ph, broken: false, hole: null, cracks: null });
  }
  return out;
}
// What is on the back wall at (x, y)?
function wallAt(x, y) {
  if (x >= WIN.x0 && x <= WIN.x1 && y >= WIN.y0 - WIN.sill && y <= WIN.y1) {
    for (const pn of panes) if (x >= pn.x0 && x <= pn.x1 && y >= pn.y0 && y <= pn.y1) return { type: 'glass', pane: pn };
    return { type: 'frame' };
  }
  if (Math.abs(x - SIGN.cx) <= SIGN.w / 2 && Math.abs(y - SIGN.cy) <= SIGN.h / 2) return { type: 'sign' };
  if (Math.hypot(x - BOARD.x, y - BOARD.y) <= RING.surround) return { type: 'board' };
  if (x >= CHALK.x0 && x <= CHALK.x1 && y >= CHALK.y0 && y <= CHALK.y1) return { type: 'chalk' };
  return { type: 'wall' };
}
// A broken pane keeps jagged teeth of glass in the frame; cracks run from them to the edge.
function makeHole(pn, hx, hy) {
  const cx = clamp(hx, pn.x0 + 0.04, pn.x1 - 0.04), cy = clamp(hy, pn.y0 + 0.04, pn.y1 - 0.04);
  const N = 15, a0 = Math.random() * TAU, hole = [], cracks = [];
  for (let i = 0; i < N; i++) {
    const a = a0 + (i + (Math.random() - 0.5) * 0.6) / N * TAU, dx = Math.cos(a), dy = Math.sin(a);
    const tx = dx > 1e-6 ? (pn.x1 - cx) / dx : dx < -1e-6 ? (pn.x0 - cx) / dx : Infinity;
    const ty = dy > 1e-6 ? (pn.y1 - cy) / dy : dy < -1e-6 ? (pn.y0 - cy) / dy : Infinity;
    const edge = Math.min(tx, ty);
    const f = Math.random() < 0.3 ? 0.97 : 0.42 + Math.random() * 0.45;
    hole.push({ x: cx + dx * edge * f, y: cy + dy * edge * f });
    if (f < 0.9) {
      const line = [];
      for (let k = 0; k <= 3; k++) {
        const rr = edge * (f + (1 - f) * k / 3), j = k && k < 3 ? (Math.random() - 0.5) * 0.018 : 0;
        line.push({ x: cx + dx * rr - dy * j, y: cy + dy * rr + dx * j });
      }
      cracks.push(line);
    }
  }
  pn.hole = hole; pn.cracks = cracks;
}

/* ---------- Cans ---------- */
function setupCans(name) {
  const r = Math.random, z = CAN_Z;
  let spec;
  if (name === 'row') spec = [-0.56, -0.28, 0, 0.28, 0.56].map(x => ({ x, z }));
  else if (name === 'stagger') spec = [-0.64, -0.32, 0, 0.32, 0.64].map((x, i) => ({ x: x + (r() - 0.5) * 0.06, z: z + (i % 2 ? 0.09 : -0.08) }));
  else if (name === 'pyramid') {
    const c = (r() - 0.5) * 0.7, d = CAN.r * 2 + 0.003;
    spec = [{ x: c - d, z }, { x: c, z }, { x: c + d, z },
            { x: c - d / 2, z, level: 1, on: [0, 1] }, { x: c + d / 2, z, level: 1, on: [1, 2] }];
  } else if (name === 'towers') {
    const a = -0.5 + (r() - 0.5) * 0.2, b = 0.5 + (r() - 0.5) * 0.2;
    spec = [{ x: a, z }, { x: a, z, level: 1, on: [0] }, { x: (r() - 0.5) * 0.2, z: z + 0.06 },
            { x: b, z }, { x: b, z, level: 1, on: [3] }];
  } else spec = [-0.94, -0.47, 0, 0.47, 0.94].map(x => ({ x: x + (r() - 0.5) * 0.05, z: z + (r() - 0.5) * 0.12 }));
  cans = spec.map((s, i) => ({
    i, on: s.on || null, state: 'stand',
    p: { x: s.x, y: TABLE.y + CAN.h * ((s.level || 0) + 0.5), z: s.z },
    v: { x: 0, y: 0, z: 0 }, u: { x: 0, y: 1, z: 0 }, w: { x: 0, y: 0, z: 0 },
    sleep: false, still: 0, lastSound: 0,
  }));
}

/* ---------- Physics ---------- */
// A can that is hit flies off along dir (a horizontal unit vector), tipping over as it goes.
function knock(c, dir, speed, spin) {
  if (c.state !== 'stand') return;
  c.state = 'fly'; c.sleep = false; c.still = 0;
  c.v = { x: dir.x * speed, y: 0.4 + Math.random() * 0.6 * Math.min(1, speed / 2), z: dir.z * speed };
  c.w = { x: dir.z * spin, y: (Math.random() - 0.5) * 5, z: -dir.x * spin };
  canDown(c);
}

function stepWorld(dt) {
  for (const s of stones) if (s.live) stepStone(s, dt);
  for (const c of cans) if (c.state === 'fly' && !c.sleep) stepCan(c, dt);
  for (const c of cans) {
    if (c.state !== 'stand' || !c.on) continue;
    const gone = c.on.find(j => cans[j].state !== 'stand');
    if (gone === undefined) continue;
    const s = cans[gone];
    let dx = s.p.x - c.p.x + (Math.random() - 0.5) * 0.02, dz = 0.4 + Math.random() * 0.4;
    const l = Math.hypot(dx, dz);
    knock(c, { x: dx / l, z: dz / l }, 0.25 + Math.random() * 0.35, 3 + Math.random() * 3);
  }
  for (const sh of shards) if (!sh.rest) stepShard(sh, dt);
  if (shot) {
    shot.t += dt;
    const s = shot.stone;
    if (shot.trailOpen && s.live && shot.t - shot.trailT >= 1 / 90) { shot.trailT = shot.t; shot.trail.push({ ...s.p }); }
  }
}

function stepStone(s, dt) {
  const p = s.p, v = s.v, r = STONE_R;
  const py = p.y, pz = p.z;
  if (s.ground) {
    const f = Math.exp(-6 * dt);
    v.x *= f; v.z *= f; v.y = 0;
    p.x += v.x * dt; p.z += v.z * dt;
    if (s.ground === 'table' && !overTable(p.x, p.z)) s.ground = null;
    if (s.ground && Math.hypot(v.x, v.z) < 0.06) { s.live = false; s.rest = true; return; }
  } else {
    v.y -= G * dt;
    p.x += v.x * dt; p.y += v.y * dt; p.z += v.z * dt;
  }
  for (const c of cans) { if (c.state === 'stand') hitStandingCan(s, c); else hitLooseCan(s, c); }
  // The table top, then its front edge and apron.
  if (!s.ground && v.y < 0 && overTable(p.x, p.z) && py - r >= TABLE.y - 1e-4 && p.y - r < TABLE.y) {
    p.y = TABLE.y + r; bounce(s, 'table');
  }
  if (v.z > 0 && pz + r <= TABLE.z0 && p.z + r > TABLE.z0 && p.x > TABLE.x0 && p.x < TABLE.x1 &&
      p.y < TABLE.y && p.y > TABLE.y - TABLE.thick - TABLE.apron) {
    contact(s, 'table', v.z);
    p.z = TABLE.z0 - r; v.z = -v.z * 0.3; v.x *= 0.7;
  }
  if (p.z + r >= WALL && v.z > 0) { wallHit(s); if (!s.live) return; }
  if (Math.abs(p.x) + r > ROOM.hw) { contact(s, 'wall', Math.abs(v.x)); p.x = Math.sign(p.x) * (ROOM.hw - r); v.x = -v.x * 0.4; }
  if (p.y + r > ROOM.h) { p.y = ROOM.h - r; v.y = -Math.abs(v.y) * 0.4; }
  if (!s.ground && p.y - r < 0) { p.y = r; bounce(s, 'floor'); }
  if (p.z < EYE.z + 0.4) { s.live = false; s.gone = true; }
}

function bounce(s, kind) {
  const imp = -s.v.y;
  contact(s, kind, imp);
  s.v.y = imp * 0.32;
  s.v.x *= 0.78; s.v.z *= 0.78;
  if (s.v.y < 0.35) { s.v.y = 0; s.ground = kind; }
}

function hitStandingCan(s, c) {
  const p = s.p, dx = p.x - c.p.x, dz = p.z - c.p.z, d = Math.hypot(dx, dz);
  const yb = c.p.y - CAN.h / 2, yt = c.p.y + CAN.h / 2, R = CAN.r + STONE_R;
  if (d >= R || p.y < yb - STONE_R || p.y > yt + STONE_R) return;
  const n = p.y > yt && d < CAN.r ? { x: 0, y: 1, z: 0 } : d > 1e-6 ? { x: dx / d, y: 0, z: dz / d } : { x: 0, y: 0, z: -1 };
  const vn = dot(s.v, n);
  if (vn >= 0) return;
  let hx = -n.x, hz = -n.z, hl = Math.hypot(hx, hz);
  if (hl < 0.2) { hx = s.v.x; hz = s.v.z; hl = Math.hypot(hx, hz) || 1; }

  knock(c, { x: hx / hl, z: hz / hl }, Math.min(3.2, 0.3 + along * 0.32), 6 + hf * 16);
  s.v.x -= 1.3 * vn * n.x; s.v.y -= 1.3 * vn * n.y; s.v.z -= 1.3 * vn * n.z;
  s.v.x *= 0.55; s.v.y *= 0.55; s.v.z *= 0.55;

}

// Distance from point p to a can's axis, treated as a capsule.
function canAxis(c, p) {
  const e = CAN.h / 2 - CAN.r * 0.6;
  const a = { x: c.p.x - c.u.x * e, y: c.p.y - c.u.y * e, z: c.p.z - c.u.z * e };
  const ab = { x: c.u.x * 2 * e, y: c.u.y * 2 * e, z: c.u.z * 2 * e };
  const t = clamp(((p.x - a.x) * ab.x + (p.y - a.y) * ab.y + (p.z - a.z) * ab.z) / (4 * e * e), 0, 1);

  return { q, d: Math.hypot(p.x - q.x, p.y - q.y, p.z - q.z) };

function hitLooseCan(s, c) {
  const { q, d } = canAxis(c, s.p), R = CAN.r + STONE_R;
  if (d >= R || d < 1e-6) return;

  const vn = dot(s.v, n) - dot(c.v, n);

  s.v.x += n.x * j / ms; s.v.y += n.y * j / ms; s.v.z += n.z * j / ms;
  c.v.x -= n.x * j / mc; c.v.y -= n.y * j / mc; c.v.z -= n.z * j / mc;
  c.w.x += (Math.random() - 0.5) * 8; c.w.z += (Math.random() - 0.5) * 8;
  s.p.x = q.x + n.x * R; s.p.y = q.y + n.y * R; s.p.z = q.z + n.z * R;

function wallHit(s) {
  const p = s.p, v = s.v, what = wallAt(p.x, p.y);

  contact(s, what.type, v.z);

  if (what.type === 'board') { v.z = -v.z * 0.08; v.x *= 0.3; v.y *= 0.3; }
  else { v.z = -v.z * 0.35; v.x *= 0.75; v.y *= 0.75; }

function contact(s, type, speed) {
  if (shot && shot.stone === s) {
    if (!shot.first) shot.first = { type, x: s.p.x, y: s.p.y, z: s.p.z, t: shot.t };
    if (shot.trailOpen) { shot.trail.push({ ...s.p }); shot.trailOpen = false; }

}

function stepCan(c, dt) {
  const v = c.v;
  v.y -= G * dt;

  const wu = cross(c.w, c.u);
  c.u = norm({ x: c.u.x + wu.x * dt, y: c.u.y + wu.y * dt, z: c.u.z + wu.z * dt });
  const uy = Math.abs(c.u.y), sy = Math.sqrt(Math.max(0, 1 - c.u.y * c.u.y));

  let ground = false;
  const gap = c.p.y - low - floorY;
  if (gap < 0.004 && v.y < 0.3) {          // touching, or resting on it while it rolls over
    ground = true;
    c.p.y = floorY + low;
    const imp = -v.y;
    if (imp > 0.8) canSound(c, imp);
    v.y = imp > 1.4 ? imp * 0.22 : 0;      // a hard landing bounces it clear; otherwise it stays down
    const f = Math.exp(-8 * dt);
    v.x *= f; v.z *= f; c.w.x *= f; c.w.y *= f; c.w.z *= f;
    // Gravity lays it down on its side, or stands it back up if it barely tipped.
    const tilt = Math.acos(Math.min(1, uy)), crit = Math.atan2(CAN.r, CAN.h / 2);
    let hx = c.u.x, hz = c.u.z, hl = Math.hypot(hx, hz);
    if (hl < 1e-4) { const a = Math.random() * TAU; hx = Math.cos(a); hz = Math.sin(a); hl = 1; }
    const tgt = tilt > crit ? { x: hx / hl, y: 0, z: hz / hl } : { x: 0, y: Math.sign(c.u.y) || 1, z: 0 };
    const k = Math.min(1, 7 * dt);
    c.u = norm({ x: c.u.x + (tgt.x - c.u.x) * k, y: c.u.y + (tgt.y - c.u.y) * k, z: c.u.z + (tgt.z - c.u.z) * k });

      if (o.state !== 'stand') continue;
      for (const t of [-1, 0, 1]) {

        const dx = o.p.x - q.x, dz = o.p.z - q.z, d = Math.hypot(dx, dz);

        }

    }
  }
  if (ground && sp < 0.12 && Math.hypot(c.w.x, c.w.y, c.w.z) < 1) {
    c.still += dt;
    if (c.still > 0.2) { c.sleep = true; c.v = { x: 0, y: 0, z: 0 }; c.w = { x: 0, y: 0, z: 0 }; }
  } else c.still = 0;
  if (c.p.y < -1) c.sleep = true;
}

function stepShard(sh, dt) {
  sh.v.y -= G * dt;
  sh.p.x += sh.v.x * dt; sh.p.y += sh.v.y * dt; sh.p.z += sh.v.z * dt;
  sh.a += sh.va * dt;
  const y = overTable(sh.p.x, sh.p.z) ? TABLE.y : sh.p.z > WALL - 0.06 && sh.p.x > WIN.x0 && sh.p.x < WIN.x1 && sh.p.y > WIN.y0 - 0.02 ? WIN.y0 : 0;

function canSound(c, speed) {
  const now = performance.now();
  if (now - c.lastSound < 90) return;
  c.lastSound = now;

/* ---------- What the hand can see before letting go ---------- */
function predict(yaw, pitch, speed) {
  const v = launchVel(yaw, pitch, speed), p = { ...REL }, dt = 1 / 480, pts = [{ ...p }];
  let hit = null;
  for (let i = 0; i < 1100 && !hit; i++) {
    const py = p.y, pz = p.z;
    v.y -= G * dt; p.x += v.x * dt; p.y += v.y * dt; p.z += v.z * dt;
    for (const c of cans) {
      if (c.state !== 'stand') continue;
      if (Math.hypot(p.x - c.p.x, p.z - c.p.z) < CAN.r + STONE_R && Math.abs(p.y - c.p.y) < CAN.h / 2 + STONE_R) { hit = { type: 'can' }; break; }
    }
    if (!hit) {
      if (v.y < 0 && overTable(p.x, p.z) && py - STONE_R >= TABLE.y && p.y - STONE_R < TABLE.y) hit = { type: 'table' };
      else if (pz + STONE_R <= TABLE.z0 && p.z + STONE_R > TABLE.z0 && p.x > TABLE.x0 && p.x < TABLE.x1 && p.y < TABLE.y && p.y > TABLE.y - TABLE.thick - TABLE.apron) hit = { type: 'table' };

      else if (p.y - STONE_R <= 0 || Math.abs(p.x) >= ROOM.hw || p.y >= ROOM.h) hit = { type: 'wall' };

/* ---------- Canvas and camera ---------- */
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
const tlayer = document.createElement('canvas'), tctx = tlayer.getContext('2d');
const cam = { F: 1, cx: 0, cy: 0, kW: 1, dpr: 1, vig: null };

function project(p) {
  const k = cam.F / Math.max(0.03, p.z - EYE.z);
  return { x: cam.cx + (p.x - EYE.x) * k, y: cam.cy - (p.y - EYE.y) * k, k };
}
const P = (x, y, z) => project({ x, y, z });
const wx = x => cam.cx + (x - EYE.x) * cam.kW;      // points on the back wall
const wy = y => cam.cy - (y - EYE.y) * cam.kW;

function resize() {
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return;
  cam.dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.round(r.width * cam.dpr), H = Math.round(r.height * cam.dpr);
  canvas.width = layer.width = tlayer.width = W;
  canvas.height = layer.height = tlayer.height = H;
  cam.F = Math.min(W / (2 * FIT.tx), H / (FIT.top - FIT.bottom));
  cam.cx = W / 2;
  cam.cy = H / 2 + (FIT.top + FIT.bottom) / 2 * cam.F;
  cam.kW = cam.F / (WALL - EYE.z);
  cam.vig = null;
  buildLayer(); buildTable(); layerDirty = false;
}

function roundRectPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function poly(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.closePath(); }

/* The room never moves, so it is drawn once per resize (and again when a pane breaks). */
function buildLayer() {
  const g = lctx, W = layer.width, H = layer.height, s = cam.kW, hw = ROOM.hw, h = ROOM.h, n = ROOM.near;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#0a1118'; g.fillRect(0, 0, W, H);

  // Ceiling with dark beams.
  poly(g, [P(-hw, h, n), P(hw, h, n), P(hw, h, WALL), P(-hw, h, WALL)]);
  g.fillStyle = '#0b1016'; g.fill();
  g.fillStyle = '#06090d';
  for (let z = 0.6; z < WALL; z += 0.9) poly(g, [P(-hw, h, z), P(hw, h, z), P(hw, h, z + 0.14), P(-hw, h, z + 0.14)]), g.fill();

  // Floorboards running away from you.
  poly(g, [P(-hw, 0, n), P(hw, 0, n), P(hw, 0, WALL), P(-hw, 0, WALL)]);
  const fl = g.createLinearGradient(0, wy(0), 0, H);
  fl.addColorStop(0, '#2a1b11'); fl.addColorStop(1, '#130c07');
  g.fillStyle = fl; g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = Math.max(1, cam.dpr);
  for (let x = -hw; x <= hw + 1e-6; x += 0.14) {
    const a = P(x, 0, n), b = P(x, 0, WALL);
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
  }

  // Side walls: blue tongue-and-groove above a dark wainscot, like the darts wall.
  for (const sx of [-1, 1]) {
    const x = sx * hw;
    poly(g, [P(x, 0, n), P(x, 0, WALL), P(x, h, WALL), P(x, h, n)]);
    const sg = g.createLinearGradient(P(x, 1, n).x, 0, P(x, 1, WALL).x, 0);
    sg.addColorStop(0, '#0b1621'); sg.addColorStop(1, '#162a3c');
    g.fillStyle = sg; g.fill();
    poly(g, [P(x, 0, n), P(x, 0, WALL), P(x, 0.95, WALL), P(x, 0.95, n)]);
    g.fillStyle = '#1d140d'; g.fill();
    for (let z = WALL - 0.125; z > n; z -= 0.125) {
      const a = P(x, 0.98, z), b = P(x, h, z);
      g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = Math.max(1, 0.004 * a.k);
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
    poly(g, [P(x, 0.95, n), P(x, 0.95, WALL), P(x, 1.0, WALL), P(x, 1.0, n)]);
    g.fillStyle = '#3a2716'; g.fill();
  }

  // Back wall.
  const bx0 = wx(-hw), bx1 = wx(hw), by0 = wy(h), by1 = wy(0);
  g.save();
  g.beginPath(); g.rect(bx0, by0, bx1 - bx0, by1 - by0); g.clip();
  const base = g.createLinearGradient(0, by0, 0, by1);
  base.addColorStop(0, '#172b3e'); base.addColorStop(1, '#0d1823');
  g.fillStyle = base; g.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
  const PW = 0.125;
  for (let k = Math.floor(-hw / PW) - 1; k * PW < hw + PW; k++) {
    const rnd = mulberry32(k * 9973 + 17), x0 = k * PW;
    const tone = rnd() - 0.5;
    g.fillStyle = tone > 0 ? `rgba(255,255,255,${tone * 0.05})` : `rgba(0,0,0,${-tone * 0.12})`;
    g.fillRect(wx(x0), by0, PW * s, by1 - by0);
    for (let i = 0; i < 9; i++) {
      const gx = x0 + 0.01 + rnd() * (PW - 0.02), amp = 0.0015 + rnd() * 0.003, ph = rnd() * TAU, fr = 6 + rnd() * 10;
      g.strokeStyle = rnd() > 0.5 ? `rgba(255,255,255,${0.02 + rnd() * 0.03})` : `rgba(0,0,0,${0.06 + rnd() * 0.08})`;
      g.lineWidth = Math.max(1, s * 0.0015);
      g.beginPath();
      for (let y = 0; y <= h; y += 0.04) {
        const px = wx(gx + Math.sin(y * fr + ph) * amp), py = wy(y);
        if (y === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.stroke();
    }
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(wx(x0) - Math.max(1, s * 0.002), by0, Math.max(1.5, s * 0.004), by1 - by0);
    g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(wx(x0) + Math.max(1, s * 0.002), by0, Math.max(1, s * 0.0015), by1 - by0);
  }
  // Wainscot and chair rail.
  g.fillStyle = '#1d140d'; g.fillRect(bx0, wy(0.95), bx1 - bx0, by1 - wy(0.95));
  g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = Math.max(1, s * 0.004);
  for (let x = -hw + 0.4; x < hw; x += 0.4) { g.beginPath(); g.moveTo(wx(x), wy(0.95)); g.lineTo(wx(x), by1); g.stroke(); }
  const rail = g.createLinearGradient(0, wy(1.0), 0, wy(0.95));
  rail.addColorStop(0, '#5a3d24'); rail.addColorStop(1, '#2c1d10');
  g.fillStyle = rail; g.fillRect(bx0, wy(1.0), bx1 - bx0, wy(0.95) - wy(1.0));

  // Warm pools of light from the two pendants and the dartboard lamp.
  for (const L of LAMPS) {
    const lg = g.createRadialGradient(wx(L.x), wy(1.9), 0, wx(L.x), wy(1.75), s * 1.15);
    lg.addColorStop(0, 'rgba(255,205,145,0.22)'); lg.addColorStop(0.5, 'rgba(255,205,145,0.07)'); lg.addColorStop(1, 'rgba(255,205,145,0)');
    g.fillStyle = lg; g.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
  }
  const bl = g.createRadialGradient(wx(BOARD.x), wy(2.05), 0, wx(BOARD.x), wy(1.9), s * 0.75);
  bl.addColorStop(0, 'rgba(255,208,150,0.2)'); bl.addColorStop(1, 'rgba(255,208,150,0)');
  g.fillStyle = bl; g.fillRect(bx0, by0, bx1 - bx0, by1 - by0);

  drawWindow(g, s);
  drawSign(g, s);
  drawBoard(g, s);
  drawChalkboard(g, s);
  g.restore();

  // Wall corners in shadow.
  for (const sx of [-1, 1]) {
    const cg = g.createLinearGradient(wx(sx * hw), 0, wx(sx * (hw - 0.35)), 0);
    cg.addColorStop(0, 'rgba(0,0,0,0.45)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = cg; g.fillRect(Math.min(wx(sx * hw), wx(sx * (hw - 0.35))), by0, Math.abs(wx(sx * hw) - wx(sx * (hw - 0.35))), by1 - by0);
  }

  drawLamps(g);
}

function drawWindow(g, s) {
  // Outside: Bangkok at night.

    g.fillStyle = `rgba(230,236,255,${0.25 + rnd() * 0.55})`;

  g.fillStyle = mg; g.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
  g.fillStyle = '#f1e9d0'; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
  g.fillStyle = '#0d1a3a'; g.beginPath(); g.arc(mx + mr * 0.45, my - mr * 0.2, mr * 0.92, 0, TAU); g.fill();

  const haze = g.createLinearGradient(0, wy(GLASS.y0 + 0.5), 0, gyB);
  haze.addColorStop(0, 'rgba(255,160,90,0)'); haze.addColorStop(1, 'rgba(255,150,80,0.22)');
  g.fillStyle = haze; g.fillRect(gx0, gyT, gx1 - gx0, gyB - gyT);

/* ---------- Drawing things that move ---------- */

// The slingshot: a forked hazel stick held out in front of you, latex bands and a leather pouch.

// A small side view of the room, so you can see the curve of the shot you are setting up.
function drawSideView(g, pr, hand, now) {
  const d = cam.dpr, W = canvas.width, H = canvas.height;
  const w = clamp(W * 0.3, 150 * d, 290 * d), h = w * 0.46;
  const x0 = Math.max(12 * d, 12 * d), y0 = H - h - 12 * d;
  g.save();
  roundRectPath(g, x0, y0, w, h, 8 * d);
  g.fillStyle = 'rgba(10,16,23,0.84)'; g.fill();
  g.strokeStyle = '#263548'; g.lineWidth = d; g.stroke();
  g.fillStyle = '#9ba7b3'; g.textAlign = 'left'; g.textBaseline = 'top';
  g.font = LANG === 'th' ? `600 ${11 * d}px Sarabun, sans-serif` : `600 ${9.5 * d}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  if ('letterSpacing' in g && LANG !== 'th') g.letterSpacing = `${0.9 * d}px`;
  g.fillText(T.sideTitle, x0 + 9 * d, y0 + 7 * d);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  const left = x0 + 12 * d, right = x0 + w - 10 * d, top = y0 + 24 * d, bottom = y0 + h - 8 * d;
  const Z0 = -0.12, Z1 = WALL + 0.06, Y0 = 0.86, Y1 = 2.26;
  const sx = z => left + (z - Z0) / (Z1 - Z0) * (right - left);
  const sy = y => bottom - (y - Y0) / (Y1 - Y0) * (bottom - top);
  g.beginPath(); g.rect(x0 + d, top - 4 * d, w - 2 * d, bottom - top + 6 * d); g.clip();
  // Where the shot crosses each depth, sideways, to tell which cans and panes are in its way.
  const xAt = z => {
    const pts = pr ? pr.pts : null;
    if (!pts || !pts.length) return 0;
    let best = pts[0];
    for (const p of pts) { if (Math.abs(p.z - z) < Math.abs(best.z - z)) best = p; if (p.z > z) break; }
    if (best.z < z - 0.05) { const a = aimPoint(state.yaw, state.pitch); return a.x * (z - REL.z) / (CAN_Z - REL.z); }
    return best.x;
  };
  // Back wall, window and the pane in the line of fire.
  const xw = xAt(WALL - 0.01);
  g.fillStyle = '#4a321d'; g.fillRect(sx(WALL), top - 4 * d, 3 * d, bottom - top + 8 * d);
  const inWindow = xw > GLASS.x0 && xw < GLASS.x1;
  for (const pn of panes) {
    if (!(xw >= pn.x0 - WIN.mull && xw <= pn.x1 + WIN.mull) && inWindow) continue;
    if (!inWindow && pn !== panes[0] && pn !== panes[WIN.cols]) continue;
    g.fillStyle = !inWindow ? 'rgba(143,197,238,0.18)' : pn.broken ? 'rgba(229,133,118,0.55)' : 'rgba(143,197,238,0.85)';
    g.fillRect(sx(WALL) - d, sy(pn.y1), 3 * d, sy(pn.y0) - sy(pn.y1));
    if (pn.broken && inWindow) { g.fillStyle = '#0a1017'; for (let y = pn.y0 + 0.06; y < pn.y1; y += 0.12) g.fillRect(sx(WALL) - d, sy(y), 3 * d, 2.5 * d); }
  }
  // Table and cans.
  g.fillStyle = '#6a4426'; g.fillRect(sx(TABLE.z0), sy(TABLE.y), sx(TABLE.z1) - sx(TABLE.z0), Math.max(2, 2.5 * d));
  g.fillRect(sx(TABLE.z0 + 0.04), sy(TABLE.y), 2 * d, bottom + 6 * d - sy(TABLE.y));
  g.fillRect(sx(TABLE.z1 - 0.05), sy(TABLE.y), 2 * d, bottom + 6 * d - sy(TABLE.y));
  for (const c of cans) {
    if (c.state !== 'stand') continue;
    const near = Math.abs(xAt(c.p.z) - c.p.x) < CAN.r + 0.025;
    g.globalAlpha = near ? 1 : 0.28;
    g.fillStyle = '#d0283a';
    const cw = Math.max(3 * d, (sx(CAN.r * 2) - sx(0)));
    g.fillRect(sx(c.p.z) - cw / 2, sy(c.p.y + CAN.h / 2), cw, sy(c.p.y - CAN.h / 2) - sy(c.p.y + CAN.h / 2));
    g.fillStyle = '#f6f1e7';
    g.fillRect(sx(c.p.z) - cw / 2, sy(c.p.y + CAN.h * 0.12), cw, Math.max(1, (sy(c.p.y - CAN.h * 0.14) - sy(c.p.y + CAN.h * 0.12))));

      g.fillStyle = pr.hit.type === 'can' ? '#82d09c' : pr.hit.type === 'glass' ? '#e58576' : '#e7bd6a';

function drawChalk(g) {

    }

  const gy = yT + s * (n > 15 ? 0.53 : 0.46);
  g.fillText(T.chalkGlass, lx, gy);
  const panesN = Math.min(state.totals.panes, 8);
  for (let i = 0; i < panesN; i++) {
    const xx = lx + s * (0.012 + i * 0.045), yy = gy + s * 0.025;
    g.beginPath(); g.moveTo(xx, yy); g.lineTo(xx + s * 0.03, yy + s * 0.03); g.moveTo(xx + s * 0.03, yy); g.lineTo(xx, yy + s * 0.03); g.stroke();

/* ---------- Frame loop ---------- */
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (!pouch.dragging) {
    const target = loaded() ? state.draw / 100 : 0;
    const stiff = loaded() ? 70 : 520, damp = loaded() ? 16 : 10;
    pouch.vf += (stiff * (target - pouch.f) - damp * pouch.vf) * dt;
    pouch.f += pouch.vf * dt;
  }
  const active = shot || stones.some(s => s.live) || cans.some(c => c.state === 'fly' && !c.sleep) || shards.some(s => !s.rest);
  if (active) {
    let sim = dt / SLOW;
    while (sim > 1e-9) { const h = Math.min(STEP, sim); stepWorld(h); sim -= h; }
    if (shot) {
      // Once the stone is rolling out or has dropped below the table top, and every can that fell is
      // lying still or has gone below the table top too, nothing more can change the result.
      const s = shot.stone, spent = s.live && shot.first && shot.t - shot.first.t > 0.3 && (s.ground || s.p.y < TABLE.y - 0.05);
      const settled = (!s.live || spent) && shot.t > 0.35 && cans.every(c => c.state === 'stand' || c.sleep || c.p.y < TABLE.y - 0.1);
      if (settled || shot.t > 3) finishShot();
    }
  }
  for (let i = toasts.length - 1; i >= 0; i--) if (now - toasts[i].born > 1600) toasts.splice(i, 1);
  draw(now);
  requestAnimationFrame(frame);
}

function draw(now) {
  const g = ctx;
  if (!layer.width) return;
  if (layerDirty) { buildLayer(); layerDirty = false; }
  g.setTransform(1, 0, 0, 1, 0, 0);
  let ox = 0, oy = 0;
  if (!reduceMotion && now < shakeUntil) {
    const a = (shakeUntil - now) / 300 * 7 * cam.dpr;
    ox = (Math.random() - 0.5) * a; oy = (Math.random() - 0.5) * a;
  }
  g.setTransform(1, 0, 0, 1, ox, oy);
  g.drawImage(layer, 0, 0);
  drawChalk(g);

  // Things behind or under the table, then the table, then everything in front of it, far to near.
  const behind = [], front = [];
  const put = (p, fn) => ((p.z > TABLE.z0 && p.y < TABLE.y - 0.004) ? behind : front).push({ z: p.z, fn });
  for (const c of cans) put(c.p, () => drawCan(g, c));
  for (const s of stones) if (!s.gone && (!s.live || s.p.z > 0.35)) put(s.p, () => drawStone(g, s.p));
  for (const sh of shards) put(sh.p, () => drawShard(g, sh, now));
  behind.sort((a, b) => b.z - a.z).forEach(d => d.fn());
  g.drawImage(tlayer, 0, 0);
  for (const c of cans) if (c.state === 'stand' && c.p.y < TABLE.y + CAN.h) drawCanShadow(g, c);
  front.sort((a, b) => b.z - a.z).forEach(d => d.fn());

  const ready = loaded();
  const hand = HANDS[prefs.difficulty], sw = sway(now / 1000);
  const ay = state.yaw + sw.yaw, ap = state.pitch + sw.pitch;
  if (lastTrail && lastTrail.length > 1) {
    g.save();
    g.fillStyle = 'rgba(239,231,212,0.28)';
    lastTrail.forEach((p, i) => {
      if (p.z < 0.3 || i % 2) return;
      const q = project(p);
      g.beginPath(); g.arc(q.x, q.y, Math.max(1.1 * cam.dpr, Math.min(3 * cam.dpr, 0.006 * q.k)), 0, TAU); g.fill();
    });
    const e = project(lastTrail[lastTrail.length - 1]), d = 5 * cam.dpr;
    g.strokeStyle = 'rgba(239,231,212,0.5)'; g.lineWidth = 1.5 * cam.dpr;
    g.beginPath(); g.moveTo(e.x - d, e.y - d); g.lineTo(e.x + d, e.y + d); g.moveTo(e.x + d, e.y - d); g.lineTo(e.x - d, e.y + d); g.stroke();
    g.restore();
  }
  const pred = ready ? predict(ay, ap, speedFor(state.draw)) : null;
  if (ready) {

    g.save();
    for (let t = 0.012; t <= tShow + 1e-9; t += 0.016) {
      const p = pr.pts[Math.min(pr.pts.length - 1, Math.round(t / pr.dt))];
      if (p.z < 0.3) continue;
      const q = project(p), fade = hand.preview < 1 ? 1 - Math.pow(t / Math.max(tShow, 1e-6), 3) * 0.85 : 1;
      const r = Math.max(1.3 * cam.dpr, Math.min(4 * cam.dpr, 0.0065 * q.k));

      g.fillStyle = '#efe7d4'; g.beginPath(); g.arc(q.x, q.y, r, 0, TAU); g.fill();
    }
    g.restore();
    if (hand.guide && pr.hit) {
      const e = project(pr.pts[pr.pts.length - 1]);
      const col = pr.hit.type === 'can' ? '#82d09c' : pr.hit.type === 'glass' ? '#e58576' : '#e7bd6a';
      g.save();

      g.beginPath(); g.arc(e.x, e.y, 4.5 * cam.dpr, 0, TAU); g.fill(); g.stroke();
      g.restore();
    }
  }

  drawSlingshot(g);
  for (const s of stones) if (s.live && s.p.z <= 0.35) drawStone(g, s.p);

  if (!cam.vig) {
    const W = canvas.width, H = canvas.height;
    cam.vig = g.createRadialGradient(W / 2, H * 0.45, Math.max(W, H) * 0.4, W / 2, H * 0.45, Math.max(W, H) * 0.85);
    cam.vig.addColorStop(0, 'rgba(4,8,12,0)'); cam.vig.addColorStop(1, 'rgba(4,8,12,0.5)');
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = cam.vig; g.fillRect(0, 0, canvas.width, canvas.height);
  g.setTransform(1, 0, 0, 1, ox, oy);

  drawSideView(g, pred, hand, now);

  if (ready || state.phase === 'flight') {
    const aim = aimPoint(ay, ap), q = project(aim);
    g.save(); if (!ready) g.globalAlpha = 0.45;
    drawReticle(g, clamp(q.x, 14 * cam.dpr, canvas.width - 14 * cam.dpr), clamp(q.y, 14 * cam.dpr, canvas.height - 14 * cam.dpr));
    g.restore();
  }

  for (const tst of toasts) {
    const age = (now - tst.born) / 1600, q = project(tst.p);
    const x = q.x, y = q.y - (reduceMotion ? 0 : age * 42 * cam.dpr) - 26 * cam.dpr;
    g.save();
    g.globalAlpha = age < 0.7 ? 1 : 1 - (age - 0.7) / 0.3;
    g.textAlign = 'center'; g.textBaseline = 'bottom';
    g.font = `700 ${26 * cam.dpr}px Newsreader, Georgia, serif`;
    g.lineWidth = 5 * cam.dpr; g.strokeStyle = 'rgba(5,10,16,0.85)'; g.lineJoin = 'round';
    g.strokeText(tst.text, x, y);
    g.fillStyle = tst.bad ? '#e58576' : '#f0c56f';
    g.fillText(tst.text, x, y);
    g.font = textFont(600, 12.5 * cam.dpr);
    g.strokeText(tst.sub, x, y + 17 * cam.dpr);
    g.fillStyle = '#efe7d4';
    g.fillText(tst.sub, x, y + 17 * cam.dpr);
    g.restore();
  }

}

/* ---------- Sound (made in the browser, starts after your first tap) ---------- */
const sfx = (() => {
  let ac = null, noise = null;
  function get() {
    if (!prefs.sound) return null;
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;

        noise = ac.createBuffer(1, ac.sampleRate * 1, ac.sampleRate);
        const d = noise.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    } catch { return null; }
  }

    const t = a.currentTime + delay;

    const gn = a.createGain();

  }

    const t = a.currentTime + delay;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const gn = a.createGain();
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(gain, t + 0.005); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    prime() { get(); },
    stretch() { const a = get(); if (a) burst(a, { dur: 0.22, f0: 260, f1: 520, q: 4, gain: 0.05 }); },
    twang() {
      const a = get(); if (!a) return;

      burst(a, { dur: 0.12, f0: 1400, f1: 320, q: 1.2, gain: 0.22 });
    },
    can() {
      const a = get(); if (!a) return;
      const base = 600 + Math.random() * 180;
      [1, 2.24, 3.51, 4.93].forEach((m, i) => tone(a, { f0: base * m, f1: base * m * 0.985, dur: 0.26 - i * 0.04, gain: 0.15 / (i + 1) }));

    },
    clink(speed) {
      const a = get(); if (!a) return;
      const g = Math.min(0.12, 0.03 + speed * 0.03), base = 900 + Math.random() * 500;
      tone(a, { f0: base, f1: base * 0.97, dur: 0.1, gain: g });
      tone(a, { f0: base * 2.6, dur: 0.06, gain: g * 0.5 });
      burst(a, { dur: 0.03, type: 'highpass', f0: 3200, f1: 2400, gain: g });
    },
    glass() {
      const a = get(); if (!a) return;
      burst(a, { dur: 0.09, type: 'highpass', f0: 1600, f1: 1100, gain: 0.5 });
      burst(a, { dur: 0.8, type: 'highpass', f0: 4200, f1: 2600, gain: 0.16, delay: 0.02 });
      for (let i = 0; i < 18; i++) tone(a, { f0: 2400 + Math.random() * 4800, dur: 0.04 + Math.random() * 0.12, gain: 0.04 + Math.random() * 0.06, delay: 0.03 + Math.random() * 0.7 });
    },
    hit(type, speed) {
      const a = get(); if (!a) return;
      const g = Math.min(1, speed / 6);
      if (type === 'board') { tone(a, { f0: 120, f1: 60, dur: 0.14, gain: 0.4 * g + 0.05 }); burst(a, { dur: 0.05, type: 'lowpass', f0: 900, f1: 400, gain: 0.2 * g }); }
      else if (type === 'sign') { tone(a, { f0: 950, f1: 760, dur: 0.16, type: 'triangle', gain: 0.14 * g + 0.02 }); tone(a, { f0: 1900, f1: 1520, dur: 0.1, gain: 0.05 * g }); }

/* ---------- Game flow ---------- */
function startRound() {
  state.layout = state.mode === 'classic' ? ROUND_LAYOUTS[state.round - 1] : ROUND_LAYOUTS[Math.floor(Math.random() * ROUND_LAYOUTS.length)];
  setupCans(state.layout);
  panes = makePanes();
  stones = []; shards = []; shot = null;
  state.stonesLeft = STONES;
  state.phase = 'aim';
  layerDirty = true;
}
function newGame() {
  state.round = 1; state.score = 0;
  state.totals = { cans: 0, bonus: 0, glass: 0, panes: 0 };
  state.practice = { shots: 0 };
  state.overlay = null; lastTrail = null;
  toasts.length = 0;
  startRound();
  state.message = [[state.mode === 'classic' ? 'msgStart' : 'msgPractice']];
  renderOverlay();
  renderUI();
}
function primaryAction() {
  if (state.overlay) return;
  if (state.phase === 'aim') fire();
  else if (state.phase === 'roundOver') nextRound();
  else if (state.phase === 'gameOver') newGame();
}
function fire() {
  if (!loaded()) return;
  const hand = HANDS[prefs.difficulty], sw = sway(performance.now() / 1000);
  const drawPct = clamp(state.draw + (Math.random() * 2 - 1) * hand.power, 0, 100);
  const v = launchVel(state.yaw + sw.yaw, state.pitch + sw.pitch, speedFor(drawPct));
  const stone = { p: { ...REL }, v, live: true, ground: null, rest: false, gone: false, lastSound: 0 };
  stones.push(stone);
  shot = { stone, cans: 0, panes: 0, first: null, t: 0, trail: [{ ...REL }], trailOpen: true, trailT: 0 };
  if (state.mode === 'classic') state.stonesLeft--;
  else state.practice.shots++;
  state.phase = 'flight';
  pouch.vf = -9;
  sfx.twang();
  hideHint();
  renderUI();
}
function canDown(c) {
  state.score += PTS.can;
  state.totals.cans++;
  if (shot) shot.cans++;
  // Cans that go down together share one label that counts up.
  const now = performance.now(), tst = shot && shot.toast;
  if (tst && now - tst.born < 700) {
    tst.n++; tst.text = `+${PTS.can * tst.n}`; tst.sub = T.toastCan(tst.n); tst.born = now - 120;
  } else {
    const nt = { n: 1, text: `+${PTS.can}`, sub: T.toastCan(1), p: { ...c.p }, born: now };
    toasts.push(nt);
    if (shot) shot.toast = nt;
  }
  sfx.can();
  renderUI();
}
function breakPane(pn, x, y) {
  pn.broken = true;
  makeHole(pn, x, y);
  layerDirty = true;
  state.score -= PTS.glass;
  state.totals.glass += PTS.glass; state.totals.panes++;
  if (shot) shot.panes++;
  toasts.push({ text: `−${PTS.glass}`, sub: T.toastGlass, p: { x, y, z: WALL }, born: performance.now(), bad: true });
  for (let i = 0; i < 34; i++) {
    shards.push({
      p: { x: x + (Math.random() - 0.5) * (pn.x1 - pn.x0) * 0.8, y: y + (Math.random() - 0.5) * (pn.y1 - pn.y0) * 0.6, z: WALL - 0.01 },
      v: { x: (Math.random() - 0.5) * 1.6, y: Math.random() * 1.4 - 0.3, z: -(0.25 + Math.random() * 1.6) },
      a: Math.random() * TAU, va: (Math.random() - 0.5) * 30, s: 0.006 + Math.random() * 0.018, rest: false, flat: false, seed: Math.random(),
    });

}
function missMessage(sh) {
  const f = sh.first;

  const standing = cans.filter(c => c.state === 'stand');
  if ((f.type === 'table' || f.type === 'floor') && f.z < CAN_Z - 0.05) return ['short'];
  const topY = standing.length ? Math.max(...standing.map(c => c.p.y + CAN.h / 2)) : TABLE.y + CAN.h;
  if (f.y > topY + 0.005 || f.type === 'glass' || !standing.length) return ['high'];

function finishShot() {

  lastTrail = sh.trail;
  if (sh.trailOpen) lastTrail.push({ ...sh.stone.p });
  const n = sh.cans;
  const parts = [];
  if (sh.panes) parts.push(['glassMsg', sh.panes]);
  if (n >= 2) {
    const b = (n - 1) * PTS.multi;
    state.score += b; state.totals.bonus += b;
    toasts.push({ text: `+${b}`, sub: T.toastMulti, p: { x: 0, y: TABLE.y + 0.35, z: CAN_Z }, born: performance.now() + 250 });
  }
  if (n) parts.push(['hit', n]);
  if (!n && !sh.panes) parts.push(missMessage(sh));
  const standing = cans.filter(c => c.state === 'stand').length;
  if (standing === 0) {

      const spare = state.stonesLeft * PTS.spare;
      state.score += spare; state.totals.bonus += spare;
      parts.push(spare ? ['clear', spare] : ['clearNone']);
      if (spare) toasts.push({ text: `+${spare}`, sub: T.toastClear, p: { x: 0, y: TABLE.y + 0.55, z: CAN_Z }, born: performance.now() + 500 });
      sfx.cheer();

    } else {

    }

  state.message = parts;
  renderUI();
}
/* Story mode: when this page runs inside the Siam Times story (in a frame), tell the story when a game ends. */
function storyDone(r) {
  try { if (window.parent !== window) window.parent.postMessage(Object.assign({ tst: 'story', game: 'slingshot' }, r), '*'); } catch (e) { /* not in a frame */ }
}
function endRound() {
  if (state.round >= ROUNDS) {
    state.phase = 'gameOver';
    const prev = prefs.best, isBest = prev === null || state.score > prev;
    if (isBest) { prefs.best = state.score; savePrefs(); }
    const t = state.totals;

}
function nextRound() {

}

/* ---------- Overlay ---------- */
let overlayTimer = 0;

  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(renderOverlay, 1400);
}

/* ---------- Aim and draw ---------- */
const yawEl = $('yaw'), pitchEl = $('pitch'), drawEl = $('draw');
function setAim(yaw, pitch) {
  state.yaw = clamp(round1(yaw), +yawEl.min, +yawEl.max);
  state.pitch = clamp(round1(pitch), +pitchEl.min, +pitchEl.max);

}
function setDraw(d) {

}

  $('yawOut').textContent = T.yawOut(state.yaw);
  $('pitchOut').textContent = T.pitchOut(state.pitch);

    $('sbModeSub').append(sp);
  }

  sc.classList.toggle('neg', state.score < 0);
  const sp = $('stonePips');
  if (classic) {
    sp.innerHTML = Array.from({ length: STONES }, (_, i) => `<span class="stonepip${i < state.stonesLeft ? '' : ' used'}"></span>`).join('');
  } else sp.innerHTML = '<span class="stonepip"></span><span class="count">∞</span>';
  $('canPips').innerHTML = cans.map(c => `<span class="canpip${c.state === 'stand' ? '' : ' down'}"></span>`).join('');
  if (classic) { $('sbSideLabel').textContent = T.best; $('sbSideValue').textContent = prefs.best === null ? '–' : String(prefs.best); }
  else { $('sbSideLabel').textContent = T.panes; $('sbSideValue').textContent = String(state.totals.panes); }
  $('msg').textContent = state.message.map(([k, ...a]) =>
    k === 'msgRound' ? T.msgRound(a[0], T.layout[a[1]]) : typeof T[k] === 'function' ? T[k](...a) : T[k]).join(' ');
  const btn = $('fireBtn');
  btn.textContent = state.phase === 'gameOver' ? T.again : state.phase === 'roundOver' ? T.next
    : state.phase === 'flight' || state.phase === 'rack' ? T.wait : T.fire;
  btn.disabled = state.phase === 'flight' || state.phase === 'rack' || !!state.overlay;
  $('modeNote').textContent = classic ? T.noteClassic : T.notePractice;
  document.querySelector(`input[name="mode"][value="${state.mode}"]`).checked = true;
  document.querySelector(`input[name="difficulty"][value="${prefs.difficulty}"]`).checked = true;
  $('diffNote').textContent = T['note' + prefs.difficulty[0].toUpperCase() + prefs.difficulty.slice(1)];
  const sb = $('soundBtn');
  sb.setAttribute('aria-pressed', String(prefs.sound));
  sb.textContent = prefs.sound ? T.soundOn : T.soundOff;
}
function fillWords() {
  document.title = T.docTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = T[el.dataset.i18nHtml]; });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', T[el.dataset.i18nAria]));
  $('howList').innerHTML = '';
  for (const line of T.how) { const li = document.createElement('li'); li.textContent = line; $('howList').appendChild(li); }
  canvas.setAttribute('aria-label', T.canvasLabel);
  renderControls();
  renderUI();
  renderOverlay();
}

/* ---------- Input ---------- */
function hideHint() { $('hint').classList.add('gone'); }
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * cam.dpr, y: (e.clientY - r.top) * cam.dpr };
}
function onSlingshot(pt) {
  const geo = slingGeo(), half = (geo.tipR.x - geo.tipL.x) / 2;
  return pt.y > Math.min(geo.tipL.y, geo.tipR.y) - 26 * cam.dpr && Math.abs(pt.x - geo.rest.x) < Math.max(half * 1.7, 70 * cam.dpr);
}
function aimAt(pt) {
  const k = cam.F / (CAN_Z - EYE.z);
  const x = EYE.x + (pt.x - cam.cx) / k, y = EYE.y - (pt.y - cam.cy) / k, dz = CAN_Z - REL.z;
  setAim(Math.atan2(x - REL.x, dz) / DEG, Math.atan2(y - REL.y, Math.hypot(x - REL.x, dz)) / DEG);
}
let drag = null;
canvas.addEventListener('pointerdown', e => {
  if (state.overlay || e.button > 0) return;
  sfx.prime();
  const pt = canvasPoint(e);
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  hideHint();
  if (onSlingshot(pt)) {
    if (!loaded()) return;
    drag = { kind: 'pull', x0: pt.x, y0: pt.y, d0: state.draw, moved: 0 };
    pouch.dragging = true; pouch.vf = 0;
    canvas.classList.add('grabbing');
    sfx.stretch();
  } else {
    drag = { kind: 'aim' };
    aimAt(pt);
  }
});
canvas.addEventListener('pointermove', e => {
  const pt = canvasPoint(e);
  if (!drag) { canvas.classList.toggle('grab', loaded() && onSlingshot(pt)); return; }
  if (drag.kind === 'aim') aimAt(pt);
  else {
    drag.moved = Math.max(drag.moved, Math.hypot(pt.x - drag.x0, pt.y - drag.y0));
    setDraw(drag.d0 + (pt.y - drag.y0) / Math.max(150 * cam.dpr, canvas.height * 0.34) * 100);
    pouch.f = state.draw / 100;
  }
});
function endDrag(fireIt) {
  if (!drag) return;
  const d = drag; drag = null;
  canvas.classList.remove('grabbing');
  if (d.kind !== 'pull') return;
  pouch.dragging = false;
  if (fireIt && d.moved > 6 * cam.dpr && state.draw >= 5) fire();
  else if (state.draw < 5) setDraw(d.d0);
}
canvas.addEventListener('pointerup', () => endDrag(true));
canvas.addEventListener('pointercancel', () => endDrag(false));

yawEl.addEventListener('input', () => setAim(+yawEl.value, state.pitch));
pitchEl.addEventListener('input', () => setAim(state.yaw, +pitchEl.value));
drawEl.addEventListener('input', () => setDraw(+drawEl.value));

document.querySelectorAll('.step').forEach(b => {
  let wait = 0, repeat = 0;
  const go = () => nudge(b.dataset.target, parseFloat(b.dataset.step));
  const stop = () => { clearTimeout(wait); clearInterval(repeat); wait = repeat = 0; };
  b.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    e.preventDefault();
    go(); stop();
    wait = setTimeout(() => { repeat = setInterval(go, 60); }, 380);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, stop));
  b.addEventListener('click', e => { if (e.detail === 0) go(); });
});

$('fireBtn').addEventListener('click', () => { sfx.prime(); primaryAction(); });
$('ovBtn').addEventListener('click', () => { newGame(); canvas.focus({ preventScroll: true }); });
$('newBtn').addEventListener('click', newGame);
$('soundBtn').addEventListener('click', () => { prefs.sound = !prefs.sound; savePrefs(); renderUI(); });
document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', () => {
  if (!r.checked) return;
  state.mode = r.value;
  newGame();
}));
document.querySelectorAll('input[name="difficulty"]').forEach(r => r.addEventListener('change', () => {
  if (!r.checked) return;
  prefs.difficulty = r.value; savePrefs(); renderUI();
}));

window.addEventListener('keydown', e => {
  const t = e.target;
  const free = t === document.body || t === canvas || t === document.documentElement;
  const onSlider = t && t.type === 'range';
  if (!free && !(onSlider && e.key === ' ')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const big = e.shiftKey ? 10 : 1;
  switch (e.key) {
    case 'ArrowLeft': setAim(state.yaw - 0.1 * big, state.pitch); break;
    case 'ArrowRight': setAim(state.yaw + 0.1 * big, state.pitch); break;
    case 'ArrowUp': setAim(state.yaw, state.pitch + 0.1 * big); break;
    case 'ArrowDown': setAim(state.yaw, state.pitch - 0.1 * big); break;
    case 'w': case 'W': case '+': case '=': setDraw(state.draw + (e.shiftKey ? 5 : 1)); break;
    case 's': case 'S': case '-': case '_': setDraw(state.draw - (e.shiftKey ? 5 : 1)); break;
    case ' ': case 'Enter': sfx.prime(); primaryAction(); break;
    default: return;
  }
  hideHint();
  e.preventDefault();
});

/* ---------- Start ---------- */
newGame();
fillWords();
new ResizeObserver(resize).observe(canvas);
resize();
if (document.fonts) {
  Promise.all([
    document.fonts.load('40px Chomsky'),
    document.fonts.load('600 20px Newsreader'),
    document.fonts.load('600 20px Sarabun'),
  ]).catch(() => {}).then(() => document.fonts.ready).then(() => { layerDirty = true; });
}
requestAnimationFrame(t => { lastFrame = t; frame(t); });
})();
</script>
<script>
/* No zooming: a pinch or a double tap would leave the game half off the screen and stuck. */
(() => {
  const stop = e => e.preventDefault();
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
  document.documentElement.style.touchAction = 'manipulation';
})();
</script>
</body>
