  color-scheme: dark;
  --night: #0c131b;
  --glass: rgba(9, 15, 22, .62);
  --glass-hi: rgba(9, 15, 22, .84);
  --rule: rgba(239, 231, 212, .16);

  --brass: #d6ad5f;
  --brass-hi: #f2d28c;
  --brass-ink: #1d1606;
  --blue: #6ca6d1;
  --sign: #1c4d99;
  --red: #e0573f;
  --font-mast: "Chomsky", "Old English Text MT", "UnifrakturCook", serif;
  --font-display: "Chonburi", "Newsreader", Georgia, serif;
  --font-text: "Sarabun", "Newsreader", system-ui, sans-serif;
  --font-ui: "Kanit", "Sarabun", system-ui, -apple-system, sans-serif;
  --safe-l: max(16px, env(safe-area-inset-left, 0px));
  --safe-r: max(16px, env(safe-area-inset-right, 0px));

  --safe-b: max(12px, env(safe-area-inset-bottom, 0px));

}

html, body { height: 100%; margin: 0; background: var(--night); color: var(--paper); overflow: hidden; overscroll-behavior: none; }
body { font: 16px/1.5 var(--font-text); -webkit-font-smoothing: antialiased; padding-left: var(--safe-l); padding-right: var(--safe-r); }
#game { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: var(--night); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button { font: inherit; color: inherit; touch-action: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; }
[hidden] { display: none !important; }

/* ---------- loading ---------- */
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--night); z-index: 50; transition: opacity .6s; }
#loading.gone { opacity: 0; pointer-events: none; }
#loading .box { text-align: center; display: grid; gap: 10px; }
#loading .mast { font: 34px var(--font-mast); letter-spacing: .01em; }
#loading .bar { width: min(260px, 60vw); height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; margin: 6px auto 0; }
#loading .bar i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .25s; }
#loading p { margin: 0; color: var(--muted); font: 15px var(--font-ui); }

/* ---------- title ---------- */
#title { position: absolute; inset: 0; z-index: 20; display: flex; pointer-events: none; }
#title .col {
  pointer-events: auto; width: min(470px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box;
  padding: calc(var(--safe-t) + 18px) 28px calc(var(--safe-b) + 18px) calc(var(--safe-l) + 12px);
  background: linear-gradient(90deg, rgba(8, 12, 18, .93) 0%, rgba(8, 12, 18, .82) 62%, rgba(8, 12, 18, 0) 100%);
  display: flex; flex-direction: column; gap: 14px; scrollbar-width: none;
}
#title .col::-webkit-scrollbar { display: none; }
.mast { font: 26px/1 var(--font-mast); color: var(--paper); opacity: .92; }
.kicker { font: 600 12px/1 var(--font-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--brass); margin-top: 6px; }
#title h1 { margin: 0; font: 400 clamp(54px, 9vw, 92px)/1.05 var(--font-display); color: var(--paper); text-wrap: balance; text-shadow: 0 4px 30px rgba(0, 0, 0, .5); }
:root:lang(en) #title h1 { font-size: clamp(42px, 6.6vw, 72px); }
#title h1::after { content: ""; display: block; width: 84px; height: 3px; background: var(--brass); margin-top: 14px; border-radius: 2px; }
#title .lede { margin: 0; color: #d9d2c2; font-size: 16.5px; max-width: 36ch; }
.opt { display: grid; gap: 8px; }
.opt > span { font: 600 11.5px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  border: 1px solid var(--rule); background: rgba(239, 231, 212, .05); border-radius: 999px;
  padding: 8px 14px; font: 500 14.5px/1.1 var(--font-ui); cursor: pointer; min-height: 38px;
}
.chip[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.vol { display: flex; align-items: center; gap: 12px; max-width: 380px; }
.vol svg { width: 22px; height: 22px; color: var(--muted); flex: none; }
.vol output { font: 600 14px var(--font-ui); color: var(--paper); min-width: 64px; font-variant-numeric: tabular-nums; }
.vol input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 36px; background: transparent; touch-action: none; cursor: pointer; --v: 80%; }
.vol input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--brass) var(--v), rgba(239, 231, 212, .16) var(--v)); }
.vol input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--brass) var(--v), rgba(239, 231, 212, .16) var(--v)); }
.vol input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f6dfaa, var(--brass) 60%, #8d6a2a); box-shadow: 0 3px 10px rgba(0, 0, 0, .45); border: 0; }
.vol input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--brass); border: 0; }
.vol input[type=range]:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 4px; border-radius: 4px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; padding: 3px; background-clip: content-box; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); }
.swatch[aria-pressed="true"] { border-color: var(--brass-hi); }
.paintname { font: 500 14px var(--font-ui); color: var(--paper); margin-left: 4px; }
.startbar { position: sticky; bottom: calc(-1 * (var(--safe-b) + 18px)); margin: 4px -28px calc(-1 * (var(--safe-b) + 18px)) calc(-1 * (var(--safe-l) + 12px)); padding: 14px 28px calc(var(--safe-b) + 18px) calc(var(--safe-l) + 12px); background: linear-gradient(180deg, rgba(8, 12, 18, 0), rgba(8, 12, 18, .96) 30%); display: grid; gap: 10px; }
#startBtn {
  align-self: flex-start; justify-self: start; border: 0; border-radius: 999px; cursor: pointer;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: var(--brass-ink);
  font: 600 20px/1 var(--font-ui); padding: 17px 34px 16px; box-shadow: 0 10px 30px rgba(214, 173, 95, .25);
  display: inline-flex; gap: 12px; align-items: center;
}
#startBtn svg { width: 22px; height: 22px; }
#startBtn:active { transform: translateY(1px); }
.help { font: 13.5px/1.55 var(--font-ui); color: var(--muted); margin: 0; }
.help b { color: var(--paper); font-weight: 600; }
.foot { font: 13px var(--font-ui); color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.foot a { color: var(--brass); text-decoration: none; }
.foot a:hover { text-decoration: underline; }
.revwrap { position: absolute; right: calc(var(--safe-r) + 6px); bottom: calc(var(--safe-b) + 10px); display: flex; align-items: flex-end; gap: 18px; pointer-events: none; }
.paintcap { font: 500 13px var(--font-ui); color: rgba(239, 231, 212, .75); text-align: right; pointer-events: none; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); padding-bottom: 6px; }
.paintcap b { display: block; font: 400 22px var(--font-display); color: var(--paper); }
#revBtn {
  pointer-events: auto; width: 124px; height: 124px; border-radius: 50%; border: 0; cursor: pointer; color: var(--paper); display: grid; place-content: center; gap: 3px; flex: none;
  --r: 0; --c: #d6ad5f;
  background: radial-gradient(circle closest-side, rgba(9, 15, 22, .9) 82%, transparent 84%), conic-gradient(from 225deg, var(--c) calc(var(--r) * 270deg), rgba(239, 231, 212, .16) 0 270deg, transparent 0);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45); font: 600 19px/1.1 var(--font-ui);
}
#revBtn small { font: 500 11.5px/1.2 var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
#revBtn.on { color: var(--brass-hi); }
#gearBox { position: absolute; left: calc(var(--safe-l) + 4px); bottom: calc(var(--safe-b) + 124px); display: flex; flex-direction: column; gap: 10px; }
.gbtn { width: 78px; height: 62px; border-radius: 16px; border: 1px solid var(--rule); background: var(--glass); color: var(--paper); cursor: pointer; display: grid; place-content: center; font: 600 22px/1 var(--font-ui); gap: 2px; }
.gbtn small { font: 500 10.5px/1 var(--font-ui); color: var(--muted); letter-spacing: .06em; }
.gbtn.on { background: rgba(214, 173, 95, .35); border-color: var(--brass); }
.gbtn[hidden] { display: none; }
.dbtn b { font: 700 26px/1 var(--font-ui); }
.dbtn.d b { color: #8fc3ea; }
.dbtn.n { border-color: var(--brass); animation: dpulse 1.1s ease-in-out infinite; }
.dbtn.n b { color: var(--brass-hi); }
@keyframes dpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(214, 173, 95, 0); } 50% { box-shadow: 0 0 0 6px rgba(214, 173, 95, .35); } }
#steer.auto .pad { opacity: .45; }
#steer.auto .lbl { color: var(--blue); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#hud > * { pointer-events: auto; }
.tl { position: absolute; left: var(--safe-l); top: var(--safe-t); display: flex; gap: 12px; align-items: flex-start; pointer-events: none; }
#minimap { width: 148px; height: 148px; border-radius: 50%; box-shadow: 0 6px 24px rgba(0, 0, 0, .45), 0 0 0 2px rgba(239, 231, 212, .22); background: rgba(9, 15, 22, .7); }
.roadsign { background: var(--sign); border: 2px solid #fff; border-radius: 6px; padding: 6px 12px 7px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); min-width: 120px; transition: opacity .4s, transform .4s; }
.roadsign.dim { opacity: .0; transform: translateY(-6px); }
.roadsign b { display: block; font: 600 20px/1.2 var(--font-ui); color: #fff; }
.roadsign span { display: block; font: 500 12.5px/1.2 "Helvetica Neue", Arial, var(--font-ui); color: #dfe8f7; letter-spacing: .02em; }
.vis { font: 500 12.5px var(--font-ui); color: var(--paper); background: var(--glass); border-radius: 999px; padding: 4px 10px; margin-top: 8px; display: inline-block; }
.tr { position: absolute; right: var(--safe-r); top: var(--safe-t); display: flex; gap: 8px; }
.ib {
  min-width: 54px; height: 54px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--rule); background: var(--glass);
  display: grid; place-items: center; cursor: pointer; font: 500 11px/1.1 var(--font-ui); color: var(--paper); gap: 2px;
}
.ib svg { width: 22px; height: 22px; display: block; }
.ib[aria-pressed="true"] { border-color: var(--brass); color: var(--brass-hi); }
#district { position: absolute; left: 50%; top: calc(var(--safe-t) + 18px); transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity 1s; white-space: nowrap; }
#district.on { opacity: 1; }
#district b { display: block; font: 400 clamp(26px, 4vw, 40px)/1.15 var(--font-display); text-shadow: 0 2px 18px rgba(0, 0, 0, .7); }
#district span { font: 600 12px/1 var(--font-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--brass-hi); text-shadow: 0 1px 8px rgba(0, 0, 0, .8); }
#toast { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); background: var(--glass-hi); border: 1px solid var(--rule); border-radius: 999px; padding: 9px 18px; font: 500 16px var(--font-ui); pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
#toast.on { opacity: 1; }
#gauge { position: absolute; left: 50%; bottom: calc(var(--safe-b) - 4px); transform: translateX(-50%); width: 230px; height: 230px; pointer-events: none; }
#steer { position: absolute; left: 0; bottom: 0; width: 42%; height: 58%; }
#steer .pad {
  position: absolute; left: calc(var(--safe-l) + 4px); bottom: calc(var(--safe-b) + 8px); width: 250px; height: 92px; border-radius: 46px;
  background: var(--glass); border: 1px solid var(--rule); display: grid; place-items: center; pointer-events: none;
}
#steer .pad i { position: absolute; top: 50%; width: 2px; height: 34px; margin-top: -17px; background: var(--rule); }
#steer .pad i:nth-child(1) { left: 25%; } #steer .pad i:nth-child(2) { left: 50%; } #steer .pad i:nth-child(3) { left: 75%; }
#steer .lbl { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font: 500 11px var(--font-ui); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; transform: translateY(100%); padding-top: 4px; }
#knob { position: absolute; left: 50%; top: 50%; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f6dfaa, var(--brass) 60%, #8d6a2a); box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }
#knob::after { content: ""; position: absolute; inset: 22px; border-radius: 50%; border: 2px solid rgba(29, 22, 6, .45); }
#steer.tilt .pad { opacity: .35; }
.pedals { position: absolute; right: var(--safe-r); bottom: calc(var(--safe-b) + 6px); display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 12px 14px; align-items: end; justify-items: center; }
.pbtn { border-radius: 50%; border: 1px solid var(--rule); background: var(--glass); display: grid; place-items: center; cursor: pointer; font: 600 15px/1 var(--font-ui); color: var(--paper); }
.pbtn small { display: block; font: 500 10.5px/1 var(--font-ui); color: var(--muted); letter-spacing: .1em; margin-top: 4px; }
.pbtn.on { background: rgba(214, 173, 95, .3); border-color: var(--brass); }
#throttleBtn { width: 132px; height: 132px; font-size: 19px; background: radial-gradient(circle at 50% 35%, rgba(214, 173, 95, .35), rgba(9, 15, 22, .7) 70%); border-color: rgba(214, 173, 95, .55); }
#throttleBtn.on { background: radial-gradient(circle at 50% 35%, rgba(242, 210, 140, .75), rgba(214, 173, 95, .35) 70%); color: var(--brass-ink); }
#brakeBtn { width: 104px; height: 104px; font-size: 17px; }
#brakeBtn.on { background: rgba(224, 87, 63, .45); border-color: var(--red); }
#hornBtn, #cruiseBtn { width: 66px; height: 66px; font-size: 13px; }
#cruiseBtn[aria-pressed="true"] { border-color: var(--blue); background: rgba(108, 166, 209, .3); }

/* ---------- postcard ---------- */
#postcard {
  position: absolute; right: var(--safe-r); top: calc(var(--safe-t) + 70px); width: min(330px, 70vw); pointer-events: none;
  background: #f3ecdc; color: #1b232c; border-radius: 6px; padding: 14px 16px 15px; box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
  transform: translateX(130%) rotate(2deg); transition: transform .7s cubic-bezier(.2, .9, .2, 1);
}
#postcard.on { transform: translateX(0) rotate(-1.5deg); }
#postcard .pk { font: 600 11px/1 var(--font-ui); letter-spacing: .2em; text-transform: uppercase; color: #8a6420; }
#postcard h3 { margin: 6px 0 4px; font: 400 25px/1.2 var(--font-display); }
#postcard p { margin: 0; font-size: 15px; line-height: 1.5; color: #39434e; }
#postcard .stamp { position: absolute; right: 12px; top: 10px; width: 46px; height: 54px; border: 2px dashed #b68c3c; border-radius: 3px; display: grid; place-items: center; font: 30px/1 var(--font-mast); color: #8a6420; transform: rotate(6deg); }

/* ---------- pause ---------- */
#pause { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(6, 10, 15, .62); padding: 16px; box-sizing: border-box; }
#pause .card { width: min(780px, 100%); max-height: 100%; overflow-y: auto; background: var(--glass-hi); border: 1px solid var(--rule); border-radius: 18px; padding: 22px 24px; display: grid; gap: 14px; box-sizing: border-box; }
#pause h2 { margin: 0; font: 400 32px/1.1 var(--font-display); }
#pause .stats { display: flex; gap: 22px; flex-wrap: wrap; font: 500 14px var(--font-ui); color: var(--muted); }
#pause .stats b { display: block; font: 600 24px/1.1 var(--font-ui); color: var(--paper); font-variant-numeric: tabular-nums; }
.pgrid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
.pside { display: grid; gap: 14px; min-width: 0; }
#bigmap { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--rule); background: #121a22; }
@media (max-width: 640px) { .pgrid { grid-template-columns: 1fr; } #bigmap { max-width: 300px; justify-self: center; } }
.album { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-content: start; }
.album div { border: 1px solid var(--rule); border-radius: 8px; padding: 6px 7px; font: 500 12px/1.3 var(--font-ui); color: var(--muted); }
.album div.got { background: #f3ecdc; color: #1b232c; border-color: #f3ecdc; }
.album div.got::before { content: "✓ "; color: #8a6420; font-weight: 700; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 1px solid var(--rule); background: rgba(239, 231, 212, .06); border-radius: 999px; padding: 11px 18px; font: 500 15px/1 var(--font-ui); cursor: pointer; color: var(--paper); text-decoration: none; display: inline-block; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 600; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; z-index: 40; }
#fade.on { opacity: 1; }
#rotate { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 250px); transform: translateX(-50%); z-index: 15; background: var(--glass-hi); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; font: 500 14px var(--font-ui); text-align: center; width: max-content; max-width: 80vw; }

/* phones and portrait */
@media (max-width: 760px), (max-height: 560px) {
  #minimap { width: 112px; height: 112px; }
  .roadsign b { font-size: 16px; }
  #gauge { width: 180px; height: 180px; }
  #throttleBtn { width: 106px; height: 106px; }
  #brakeBtn { width: 86px; height: 86px; }
  #hornBtn, #cruiseBtn { width: 56px; height: 56px; }
  #steer .pad { width: 200px; height: 80px; }
  #knob { width: 64px; height: 64px; margin: -32px 0 0 -32px; }
  .ib { min-width: 46px; height: 46px; padding: 0 8px; }
  .ib span { display: none; }
  #gearBox { bottom: calc(var(--safe-b) + 108px); gap: 8px; }
  .gbtn { width: 64px; height: 52px; font-size: 19px; }
  #revBtn { width: 100px; height: 100px; font-size: 16px; }
  .revwrap .paintcap { display: none; }
}
@media (orientation: portrait) and (max-width: 760px) {
  #gauge { bottom: calc(var(--safe-b) + 150px); }
}
/* the mission */
.mpanel { margin-top: 6px; max-width: 340px; background: var(--glass); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 11px; font: 500 12.5px/1.35 var(--font-ui); color: var(--paper); }
.mpanel .mt { font: 600 10.5px var(--font-ui); letter-spacing: .1em; color: #5fe39c; text-transform: uppercase; }
.mpanel .mo { margin: 3px 0 5px; }
.mpanel .ms { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.mpanel .ms .warn { color: #ff7b6a; font-weight: 600; }
#actBtn { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 236px); transform: translateX(-50%); z-index: 7; border: 1px solid #c99a3c; background: #0b4a2c; color: #f2d68a; font: 600 17px var(--font-ui); padding: 12px 22px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.4); cursor: pointer; white-space: nowrap; animation: actpulse 1.4s ease-in-out infinite; }
#actBtn[hidden] { display: none; }
@keyframes actpulse { 50% { box-shadow: 0 0 0 7px rgba(95,227,156,.25), 0 8px 24px rgba(0,0,0,.4); } }
#flash { position: absolute; inset: 0; z-index: 20; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,40,30,0) 30%, rgba(255,40,30,.55) 100%); }
#flash.on { animation: redflash 1.1s ease-out; }
@keyframes redflash { 0% { opacity: 1; } 100% { opacity: 0; } }
#floats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
.float { position: absolute; left: 0; top: 0; font: 700 19px var(--font-ui); color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.7); white-space: nowrap; }
#cut { position: absolute; inset: 0; z-index: 25; display: grid; place-items: end center; }
#cut[hidden] { display: none; }
#cut::before, #cut::after { content: ""; position: absolute; left: 0; right: 0; height: 8vh; background: #000; animation: bars .6s ease-out both; }
#cut::before { top: 0; transform-origin: top; } #cut::after { bottom: 0; transform-origin: bottom; }
@keyframes bars { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.cutcard { position: relative; z-index: 1; margin-bottom: calc(8vh + 14px); width: min(760px, calc(100% - 32px)); max-height: calc(84vh - 28px); overflow-y: auto; background: var(--glass-hi); border: 1px solid var(--rule); border-radius: 16px; padding: 16px 18px; box-sizing: border-box; color: var(--paper); font: 15px/1.45 var(--font-ui); animation: cardin .45s ease-out both; }
@keyframes cardin { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.cutcard.talk { border-color: #2f7a52; }
.shophd { display: flex; align-items: center; gap: 10px; background: #0b4a2c; color: #f2d68a; margin: -16px -18px 12px; padding: 10px 18px; border-radius: 16px 16px 0 0; font: 600 18px Georgia, "Times New Roman", serif; letter-spacing: .08em; }
.cutcard.st .shophd { background: #0c131b; color: var(--brass-hi); font: 24px var(--font-mast); letter-spacing: 0; }
.shophd .em, .introhd .em { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font: 22px/1 var(--font-mast); }
.cutcard.talk:not(.st) .shophd .em { font: 18px/1 Georgia, serif; }
.introhd { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; color: var(--brass-hi); }
.introhd .em { width: 44px; height: 44px; font-size: 30px; }
.introhd small { color: #5fe39c; font: 600 11px var(--font-ui); letter-spacing: .1em; text-transform: uppercase; }
.introhd h3 { margin: 2px 0 0; font: 400 26px/1.15 var(--font-display); color: var(--paper); }
.talkbody { display: flex; gap: 16px; align-items: center; }
.watchpic { width: 150px; height: 150px; flex: none; }
.watchpic.big { width: 190px; height: 190px; display: block; margin: 0 auto; }
.talktext small { color: var(--muted); }
.talktext p { margin: 4px 0 0; }
.talktext ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
.talktext li { margin: 3px 0; }
.money { display: flex; gap: 22px; margin-top: 10px; }
.money small { display: block; color: var(--muted); font-size: 12px; }
.money b { font: 600 20px var(--font-ui); color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.money.big { justify-content: center; margin: 12px 0 4px; }
.money.big b { font-size: 34px; }
.cutcard.work { text-align: center; width: min(420px, calc(100% - 32px)); }
.cal { width: 200px; margin: 0 auto; background: #f6f1e3; color: #1b232c; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.calhd { background: #b8402e; color: #fff; font: 600 14px var(--font-ui); padding: 6px; }
.calday { font: 700 84px/1.1 var(--font-ui); font-variant-numeric: tabular-nums; }
.calsub { font: 500 13px var(--font-ui); padding: 0 8px 10px; color: #4a4a4a; min-height: 36px; }
.skip { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.workdone { font-weight: 600; color: var(--brass-hi); }
.cutcard.done, .cutcard.fail { text-align: center; width: min(520px, calc(100% - 32px)); }
.cutcard.done h3, .cutcard.fail h3 { font: 400 32px/1.15 var(--font-display); margin: 6px 0; }
.cutcard.fail h3 { color: #ff7b6a; }
.stats2 { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; margin: 10px 0 4px; }
.stats2 b { display: block; font: 600 22px var(--font-ui); font-variant-numeric: tabular-nums; }
.stats2 span { font-size: 12px; color: var(--muted); }
.cutcard .btnrow { justify-content: center; margin-top: 14px; }
#hud.cutting .tr, #hud.cutting .pedals, #hud.cutting #steer, #hud.cutting #gearBox, #hud.cutting #gauge, #hud.cutting .tl, #hud.cutting #postcard, #hud.cutting #toast, #hud.cutting #district { opacity: 0; pointer-events: none; transition: opacity .3s; }
/* the Want List: a cream card */
.cutcard.want { background: #efe7cf; color: #1b232c; border: 2px solid #0b4a2c; text-align: center; width: min(480px, calc(100% - 32px)); box-shadow: 0 18px 50px rgba(0,0,0,.55); }
.wantpic { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.wanttext { min-height: 2.9em; margin: 10px 0 0; font-weight: 500; color: #0b4a2c; }
/* buying it, and the ending: green velvet and gold */
#cut[data-kind="buy"], #cut[data-kind="done"] { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(4,10,6,.6) 100%); }

/* Shadow stand-ins: each chunk of the city, and the bike with its rider, casts its shadow from one
   merged, position-only mesh. They are switched on only while the shadow map is drawn: the first
   object the shadow pass meets turns them on, and they are turned off again after the frame. */
const SHADOW = { proxies: [], mat: new THREE.MeshBasicMaterial() };
{
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute([0, -50, 0, 0, -50, 0, 0, -50, 0], 3));
  g.setDrawRange(0, -1);
  const trigger = new THREE.Mesh(g, SHADOW.mat);
  trigger.castShadow = true; trigger.frustumCulled = false;
  trigger.onBeforeShadow = () => { for (const p of SHADOW.proxies) p.visible = true; };
  scene.add(trigger);
}
function shadowProxy(geos, parent) {
  // merge positions (already in the parent's frame) into one indexed geometry
  let n = 0, ni = 0; for (const g of geos) { n += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; }
  if (!n) return null;
  const pos = new Float32Array(n * 3), idx = n > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
  let o = 0, oi = 0;
  for (const g of geos) {
    const p = g.attributes.position; pos.set(p.array.subarray(0, p.count * 3), o * 3);
    if (g.index) for (let i = 0; i < g.index.count; i++) idx[oi++] = g.index.getX(i) + o; else for (let i = 0; i < p.count; i++) idx[oi++] = i + o;
    o += p.count;
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setIndex(new THREE.BufferAttribute(idx, 1)); geo.computeBoundingSphere();
  const m = new THREE.Mesh(geo, SHADOW.mat); m.castShadow = true; m.receiveShadow = false; m.visible = false; m.matrixAutoUpdate = parent.type !== 'Group' || true;
  parent.add(m); SHADOW.proxies.push(m);
  return m;
}
function dropProxy(m) { if (!m) return; m.parent && m.parent.remove(m); m.geometry.dispose(); const i = SHADOW.proxies.indexOf(m); if (i >= 0) SHADOW.proxies.splice(i, 1); }

/* ---------- quality ---------- */
const QUALITY = {
  high: { pr: 1.75, shadow: 2048, bloom: true, samples: 4 },
  medium: { pr: 1.3, shadow: 1024, bloom: true, samples: 4 },
  low: { pr: 1.0, shadow: 0, bloom: false, samples: 2 },

/* ---------- post-processing ---------- */
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, vignette: { value: 0.32 }, saturation: { value: 1.08 }, tint: { value: new THREE.Vector3(1, 1, 1) }, lift: { value: 0.0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float vignette; uniform float saturation; uniform vec3 tint; uniform float lift; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec3 col = c.rgb * tint;
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722)); col = mix(vec3(l), col, saturation);
      col += lift * vec3(0.10, 0.12, 0.2) * (1.0 - smoothstep(0.0, 0.25, l));
      vec2 d = vUv - 0.5; float v = smoothstep(0.85, 0.2, length(d * vec2(1.25, 1.0)));
      col *= mix(1.0, v, vignette); gl_FragColor = vec4(col, c.a); }`,
};
let composer, renderPass, bloomPass, gradePass, outputPass;
function buildComposer() {
  const q = QUALITY[qualityLevel];
  if (composer) { composer.renderTarget1.dispose(); composer.renderTarget2.dispose(); }
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const rt = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType, samples: q.samples });
  composer = new EffectComposer(renderer, rt);
  renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);
  bloomPass = new UnrealBloomPass(new THREE.Vector2(size.x / 2, size.y / 2), 0.5, 0.55, 0.85);
  bloomPass.enabled = q.bloom;
  composer.addPass(bloomPass);
  gradePass = new ShaderPass(GradeShader);
  composer.addPass(gradePass);
  outputPass = new OutputPass();
  composer.addPass(outputPass);
}
function applyQuality() {
  const q = QUALITY[qualityLevel];
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q.pr));
  renderer.shadowMap.enabled = q.shadow > 0;
  renderer.shadowMap.type = qualityLevel === 'high' ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
  sun.castShadow = q.shadow > 0;
  if (q.shadow > 0) {
    sun.shadow.mapSize.set(q.shadow, q.shadow);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  scene.traverse(o => { if (o.material) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => { m.needsUpdate = true; }); } });
  resize();
  buildComposer();
  applyTimeLook();
}
function resize() {
  const w = APP.clientWidth || window.innerWidth, h = APP.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (composer) {
    const s = renderer.getDrawingBufferSize(new THREE.Vector2());
    composer.setSize(w, h);
    composer.setPixelRatio(renderer.getPixelRatio());
    bloomPass.setSize(s.x / 2, s.y / 2);
  }

}

/* ---------- Thai roof: three overlapping gables, orange tiles, green edge, red and gold gable ends ---------- */
function thaiRoof(cx, cz, L, W, y0, alongX = false, tiers = 3) {
  const t = gb('temple'), gd = gb('gold');
  const P = (a, b, y) => alongX ? [cx + a, y, cz + b] : [cx + b, y, cz + a];
  for (let k = 0; k < tiers; k++) {
    const l = L * (1 - k * 0.18), w = W + 2.4 - k * 1.2, yb = y0 + k * 1.3, ridge = yb + w * 0.62;
    const hl = l / 2, hw = w / 2;
    const s1 = [P(-hl, hw, yb), P(hl, hw, yb), P(hl, 0, ridge), P(-hl, 0, ridge)];
    const s2 = [P(hl, -hw, yb), P(-hl, -hw, yb), P(-hl, 0, ridge), P(hl, 0, ridge)];
    for (const s of [s1, s2]) {
      const q = alongX ? [s[1], s[0], s[3], s[2]] : s;
      t.color(0xc2481f); t.quad(...q);
      const e = (a, b, f) => [lerp(a[0], b[0], f), lerp(a[1], b[1], f) + 0.03, lerp(a[2], b[2], f)];
      const b2 = e(q[1], q[2], 0.16), b3 = e(q[0], q[3], 0.16);
      t.color(0x2d6a3c); t.quad([q[0][0], q[0][1] + 0.03, q[0][2]], [q[1][0], q[1][1] + 0.03, q[1][2]], b2, b3);
    }
    for (const sgn of [-1, 1]) {
      const a = P(sgn * hl, hw, yb), b = P(sgn * hl, -hw, yb), c = P(sgn * hl, 0, ridge);
      t.color(0x7d1a14); t.tri(a, b, c);
      gd.geo(GEO.box, between(a, c, 0.42, 0.28)); gd.geo(GEO.box, between(b, c, 0.42, 0.28));
      const m = [(a[0] + b[0] + c[0]) / 3, (a[1] + b[1] + c[1]) / 3, (a[2] + b[2] + c[2]) / 3];
      const out = alongX ? [sgn * 0.06, 0, 0] : [0, 0, sgn * 0.06];
      gd.geo(GEO.sphere, mat(m[0] + out[0], m[1] - 0.4, m[2] + out[2], 0, w * 0.045, w * 0.07, w * 0.045));
      const tip = P(sgn * (hl + 0.6), 0, ridge + 1.4);
      gd.geo(GEO.cone, new THREE.Matrix4().compose(new THREE.Vector3((c[0] + tip[0]) / 2, (c[1] + tip[1]) / 2, (c[2] + tip[2]) / 2),
        new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(tip[0] - c[0], tip[1] - c[1], tip[2] - c[2]).normalize()), new THREE.Vector3(0.22, 1.6, 0.22)));
    }
  }
}

function buildRoads() {

  const paint = (x0, z0, x1, z1, c) => { const m = gb('mark'); m.color(c); m.top(x0, z0, x1, z1, 0.012); };
  for (let i = 0; i < NX; i++) for (let j = 0; j < NZ; j++) rect(RX[i] - WX[i] / 2, RZ[j] - WZ[j] / 2, RX[i] + WX[i] / 2, RZ[j] + WZ[j] / 2);
  for (let i = 0; i < NX; i++) for (let j = 0; j < NZ - 1; j++) {
    const x = RX[i], w = WX[i], z0 = RZ[j] + WZ[j] / 2, z1 = RZ[j + 1] - WZ[j + 1] / 2;
    rect(x - w / 2, z0, x + w / 2, z1); segMarks(paint, x, w, z0, z1, false, W, Y);

}
// lane paint for one segment. c = centreline coordinate, a0..a1 = extent along the road
function segMarks(paint, c, w, a0, a1, alongX, W, Y) {

  const A0 = a0 + 4.2, A1 = a1 - 4.2;

  if (!median) { P(A0, c - 0.28, A1, c - 0.14, Y); P(A0, c + 0.14, A1, c + 0.28, Y); }
  for (const s of [-1, 1]) {
    const lc = c + s * (median ? 6.0 : w / 4 + (w >= 20 ? 0.6 : 0));
    for (let a = A0 + 1; a < A1 - 3; a += 8) P(a, lc - 0.07, a + 3, lc + 0.07, W);
    const e = c + s * (w / 2 - 0.35); P(A0 - 3, e - 0.07, A1 + 3, e + 0.07, W);

  for (const end of [0, 1]) {
    const a = end ? a1 : a0, dir = end ? -1 : 1;
    for (let v = c - w / 2 + 0.8; v < c + w / 2 - 0.6; v += 1.1) P(Math.min(a, a + dir * 3), v, Math.max(a, a + dir * 3), v + 0.55, W);

    const s0 = c + (sideSign > 0 ? 0.3 : -w / 2 + 0.3), s1 = c + (sideSign > 0 ? w / 2 - 0.3 : -0.3);
    const sa = a + dir * 3.6; P(Math.min(sa, sa + dir * 0.4), s0, Math.max(sa, sa + dir * 0.4), s1, W);
  }
}

function buildBlocks() {

    let z1 = j === -1 ? RZ[0] - WZ[0] / 2 : j < NZ - 1 ? RZ[j + 1] - WZ[j + 1] / 2 : RZ[NZ - 1] + 130;
    const outer = i === NX - 1 || j === -1 || j === NZ - 1;

}

/* ---------- street furniture: solid where it would be solid ---------- */
function tree(x, z, s, kind, y = 0, noCol = false) {

  inst('canopy', mat(x, y, z, R() * 6, s * (1 + R() * 0.2), s, s * (1 + R() * 0.2)), col(pick([0x3d6b2a, 0x4c7a2e, 0x355f26, 0x5a8434, 0x2f5a2a])));

function palm(x, z, s) { inst('palmTrunk', mat(x, KERB, z, R() * 6, s, s, s, (R() - 0.5) * 0.12, (R() - 0.5) * 0.12), null); inst('palmTop', mat(x, KERB + 8.6 * s, z, R() * 6, s, s, s), null); addCircle(x, z, 0.35); }
function foodCart(x, z, ry) {
  inst('cart', mat(x, KERB, z, ry), null);
  inst('umbrella', mat(x, KERB, z, ry), col(pick([0xd8352a, 0x2d6fb5, 0xf2c230, 0x3a9a55, 0xe8762a])));
  inst('bulb', mat(x, KERB + 2.05, z, 0, 0.12, 0.12, 0.12), col(0xffd090));
  inst('pool', mat(x, KERB + 0.04, z, 0, 5, 1, 5), col(0xffb060));
  addCircle(x, z, 1.0);
}
function nearIntersection(x, z, r) {

/* road name under a point */
function roadAt(x, z) {
  for (let i = 0; i < WORLD.sois.length; i++) { const [x0, z0, x1, z1] = WORLD.sois[i]; if (x >= x0 && x <= x1 && z >= z0 && z <= z1) return { th: `ซอย ${i + 1}`, en: `Soi ${i + 1}`, k: 'soi' + i }; }
  let best = null;
  for (let i = 0; i < NX; i++) if (Math.abs(x - RX[i]) < WX[i] / 2 + 1.5) best = { th: ROAD_X[i][0], en: ROAD_X[i][1], k: 'x' + i };
  for (let j = 0; j < NZ; j++) if (Math.abs(z - RZ[j]) < WZ[j] / 2 + 1.5) {

/* =====================================================================
   Above and below the street: Memorial Bridge over the river, a glass
   tunnel under it with fish all round, Arun Amarin Road on the Thonburi
   bank between them, and a car park whose roof you can ride up onto,
   with a narrow bridge down.
   Surfaces off the ground ("decks") each have a height; the bike stands
   on the highest one it can reach from where it is (a step up of at most
   STEP), so it can ride under a ramp or along a bridge above the water.
   Colliders can carry a height range: a roof's parapet stops you on the
   roof but not in the street below it.
   ===================================================================== */
const STEP = 0.45;
const DECKS = [];
const deck = o => (DECKS.push(o), o);
// a straight strip from A to B, w wide, at height f(t) for t = 0 … 1 along it
function stripDeck(ax, az, bx, bz, w, f, o = {}) {
  const L = Math.hypot(bx - ax, bz - az), dx = (bx - ax) / L, dz = (bz - az) / L, nx = -dz, nz = dx, hw = w / 2;
  const xs = [ax + nx * hw, ax - nx * hw, bx + nx * hw, bx - nx * hw], zs = [az + nz * hw, az - nz * hw, bz + nz * hw, bz - nz * hw];
  return deck({ kind: 'road', ...o, x0: Math.min(...xs), x1: Math.max(...xs), z0: Math.min(...zs), z1: Math.max(...zs), ax, az, bx, bz, w, f, L, dx, dz, nx, nz,
    h(x, z) { const t = ((x - ax) * dx + (z - az) * dz) / L, s = (x - ax) * nx + (z - az) * nz; return t < 0 || t > 1 || s < -hw || s > hw ? null : f(t); } });
}
const rectDeck = (x0, z0, x1, z1, y, o = {}) => deck({ kind: 'road', ...o, x0, z0, x1, z1, y, h: () => y });
// the deck under a point that the bike can stand on from height y (null: none)
function deckAt(x, z, y) {
  let best = null, bh = -1e9;
  for (const d of DECKS) {
    if (x < d.x0 || x > d.x1 || z < d.z0 || z > d.z1) continue;
    const h = d.h(x, z); if (h === null || h > y + STEP || h <= bh) continue;
    best = d; bh = h;
  }
  return best ? { d: best, h: bh } : null;
}
const NOY = [-1e9, 1e9];
// a collider box that only stops you between heights y0 and y1
const addRectY = (x0, z0, x1, z1, y0, y1) => { if (x1 < x0) [x0, x1] = [x1, x0]; if (z1 < z0) [z0, z1] = [z1, z0]; colInsert({ t: 0, x0, z0, x1, z1, y0, y1 }, x0, z0, x1, z1); };
const addCircleY = (x, z, r, y0, y1) => colInsert({ t: 1, x, z, r, y0, y1 }, x - r, z - r, x + r, z + r);

function riverSurface(x, z) {

// each shop front sits on a building line (z, running x0 → x1) and faces the street (out: +1 south, −1 north)
const SHOPS = [
  { id: 'siam', th: 'VERDANT สยาม', en: 'VERDANT Siam', x0: 244, x1: 256, z: 83, out: 1, road: 100, mall: true },
  { id: 'yao', th: 'VERDANT เยาวราช', en: 'VERDANT Yaowarat', x0: 119, x1: 131, z: 289, out: 1, road: 300 },

for (const S of SHOPS) { S.x = (S.x0 + S.x1) / 2; S.ring = [S.x, S.z + S.out * 5.5]; S.ax = S.x; S.az = S.road; }
// The Siam Times: a colonial building on Bamrung Mueang Road, across from the Giant Swing's block
const STB = { x0: 23, x1: 77, z0: 128, z1: 156, h: 15, ring: [50, 117], ax: 50, az: 100, th: 'ตึก The Siam Times', en: 'The Siam Times building' };

  for (const S of SHOPS) if (!S.mall && Math.abs(cz - S.z) < 0.6 && cx > S.x0 - 0.6 && cx < S.x1 + 0.6) return true;

  x.beginPath(); x.arc(0, -4, 7, 0, 7); x.fill(); x.restore();

// The Siam Times emblem: an S in Chomsky in a brass ring

function siamTimesFront(W, H) {
  const [c, x] = makeCanvas(1024, Math.round(1024 * H / W)), k = c.width / W;
  x.fillStyle = '#efe4c8'; x.fillRect(0, 0, c.width, c.height);

  x.fillStyle = '#d9cba6'; for (const y of [4.3, 8.4, 12.4]) x.fillRect(0, Y(y + 0.35), c.width, 0.35 * k);
  x.fillStyle = '#c9b88e'; x.fillRect(0, Y(H), c.width, 0.6 * k);

  const bays = 9, bw = W / bays;

    const cx = (i + 0.5) * bw * k, w = bw * 0.62 * k;
    x.fillStyle = '#2b2a26'; x.beginPath(); x.moveTo(cx - w / 2, Y(0)); x.lineTo(cx - w / 2, Y(2.6)); x.arc(cx, Y(2.6), w / 2, Math.PI, 0); x.lineTo(cx + w / 2, Y(0)); x.fill();
    x.fillStyle = 'rgba(255,214,150,.35)'; x.fillRect(cx - w / 2 + 4, Y(2.4), w - 8, 2.2 * k);
  }
  // upper floors: tall shuttered windows
  for (const y0 of [5.2, 9.3]) for (let i = 0; i < bays; i++) {

    x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = 2; for (let s = 0; s < 8; s++) { const yy = Y(y0 + 2.4) + s * h / 8; x.beginPath(); x.moveTo(cx - w / 2 - w * 0.55, yy); x.lineTo(cx - w / 2 - w * 0.05, yy); x.moveTo(cx + w / 2 + w * 0.05, yy); x.lineTo(cx + w / 2 + w * 0.55, yy); x.stroke(); }
  }
  // the name band over the arcade
  x.fillStyle = '#0c131b'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `400 ${Math.round(0.6 * k)}px "Chomsky", serif`; x.fillText('The Siam Times', c.width / 2, Y(3.95));
  // the name, large, across the top storey
  x.font = `400 ${Math.round(1.7 * k)}px "Chomsky", serif`; x.fillText('The Siam Times', c.width / 2, Y(13.75));
  x.font = `600 ${Math.round(0.42 * k)}px ${FONT_TH}`; x.fillStyle = '#5a4a2a'; x.fillText('เดอะ สยาม ไทมส์ · ก่อตั้ง พ.ศ. 2407 · FOUNDED 1864', c.width / 2, Y(12.05));
  return c;
}

}

class Bin {

  add(key, geo, m) { (this.g[key] || (this.g[key] = new GB())).geo(geo, m); }
  bake(parent, shadow = true, mats = BM) {

}

}

  bin.add('chrome', new THREE.TorusGeometry(rimR, 0.017, 8, 56).rotateY(Math.PI / 2), mat(0.025, 0, 0));

/* the bike against traffic: oriented boxes */
function collideTraffic(p, r) {
  for (const car of CARS) {
    const dx = p.x - car.pos.x, dz = p.z - car.pos.z;
    if (dx * dx + dz * dz > 64) continue;
    const hx = car.pos.hx, hz = car.pos.hz;
    const lx = dx * -hz + dz * hx, lz = dx * hx + dz * hz;   // local: x across, z along
    const ex = car.wid / 2 + r, ez = car.len / 2 + r;
    if (Math.abs(lx) < ex && Math.abs(lz) < ez) {
      const px = ex - Math.abs(lx), pz = ez - Math.abs(lz);
      let nx, nz;
      if (px < pz) { const s = Math.sign(lx) || 1; nx = -hz * s; nz = hx * s; p.x += nx * px; p.z += nz * px; }
      else { const s = Math.sign(lz) || 1; nx = hx * s; nz = hz * s; p.x += nx * pz; p.z += nz * pz; }
      return { car, nx, nz };
    }
  }
  return null;
}

/* where to start: on the rider's own road, 150–300 m off, coming their way (otherwise any road that way) */
function placeToward(car, p) {
  const tries = [], ri = Math.round(p.x / 100), rj = Math.round((p.z - RZ[0]) / 100);
  const onX = RZ.findIndex((z, k) => Math.abs(p.z - z) < WZ[k] / 2 + WALK + 1), onZ = RX.findIndex((x, k) => Math.abs(p.x - x) < WX[k] / 2 + WALK + 1);   // the footpath counts
  if (onX >= 0) for (const di of [-2, 2, -3, 3]) tries.push([ri + di, onX, di < 0 ? 0 : 2]);
  if (onZ >= 0) for (const dj of [-2, 2, -3, 3]) tries.push([onZ, rj + dj, dj < 0 ? 1 : 3]);
  for (let k = 0; k < 24; k++) {
    const i = ri + Math.floor(Math.random() * 7) - 3, j = rj + Math.floor(Math.random() * 7) - 3, dx = p.x - RX[clamp(i, 0, NX - 1)], dz = p.z - RZ[clamp(j, 0, NZ - 1)];
    tries.push([i, j, Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? 0 : 2) : (dz > 0 ? 1 : 3)]);
  }
  for (const [i, j, d] of tries) {
    if (!inGrid(i, j) || !inGrid(i + DIRS[d][0], j + DIRS[d][1])) continue;
    Object.assign(car, { i, j, d, lane: 0 }); legFor(car); car.s = 0; legPos(car.leg, 0, car.pos);
    const dist = Math.hypot(car.pos.x - p.x, car.pos.z - p.z);
    if (dist >= 140 && dist <= 320) return true;
  }
  return false;
}

  const lead = SIRENS.find(c => c.kind === (convoy ? 'police' : 'ambulance'));
  if (!placeToward(lead, p)) return false;
  Object.assign(lead, { siren: true, age: 0, dist: 0, straight: 3, v: E_SPEED[lead.kind] * 0.8, vmax: E_SPEED[lead.kind], bump: 0, blocked: 0, followers: [] });

  lead.trail = []; for (let k = 40; k >= 0; k--) lead.trail.push({ x: lead.pos.x - lead.pos.hx * k, z: lead.pos.z - lead.pos.hz * k, hx: lead.pos.hx, hz: lead.pos.hz, d: -k });
  CARS.push(lead);

  EMERG.last = convoy ? 'convoy' : 'ambulance';

}

    const ix = CARS.indexOf(c); if (ix >= 0) CARS.splice(ix, 1);
    const M = TRAFFIC.meshes[c.kind]; for (const m of Object.values(M)) { m.setMatrixAt(c.k, _m0); m.instanceMatrix.needsUpdate = true; }
    c.follow = null; c.siren = false;

// a point on the track d metres along, with its heading
function trailAt(tr, d, out) {
  if (d <= tr[0].d) { const a = tr[0], k = d - a.d; out.x = a.x + a.hx * k; out.z = a.z + a.hz * k; out.hx = a.hx; out.hz = a.hz; return; }

function forceGreen(node, axis, dt) {

  if (lightState(node, axis, TRAFFIC.time) === 'g') { if ((axis === 'x' ? 11 : 24) - t < 3) node.offset -= dt; return; }

function sirenBehind(car) {

    if (car.pos.hx * e.pos.hx + car.pos.hz * e.pos.hz < 0.6) continue;
    return true;

    if (!limiter) {

      s.buffer = weak ? E.soft[bank][Math.random() * 2 | 0] : E.pulses[bank][Math.random() * 4 | 0];

function missionObjective(m) {

    if (kept) return pt(kept);
    let best = null, bd = 1e9;
    for (const S of SHOPS) { if (m.order.includes(S.id)) continue; const d = Math.hypot(S.ring[0] - bike.x, S.ring[1] - bike.z); if (d < bd) { bd = d; best = S; } }

/* ---------- two toots of the horn for a rider nearby ---------- */
function missionHonk() {
  if (state !== 'ride') return;
  const now = performance.now() / 1000; MS.honks.push(now); MS.honks = MS.honks.filter(t => now - t < 1.3);
  if (MS.honks.length < 2) return;
  MS.honks = [];
  let best = null, bd = 16;
  for (const c of CARS) if (c.kind === 'scooter') { const d = Math.hypot(c.pos.x - bike.x, c.pos.z - bike.z); if (d < bd) { bd = d; best = c; } }
  if (!best || Math.abs(bike.y) > 1.5) return;
  best.waveT = 1.8;
  const m = mission();
  if (!m) { if (best.tipT === undefined || time - best.tipT > 20) { best.tipT = time; toast(MX.waveFree); floatText(best, '👋'); } return; }
  // each woman tips once in a mission: you need to find at least two
  const who = best.kind + best.k;
  if (m.tipped.includes(who)) { toast(MX.waveAgain); floatText(best, '👋'); return; }
  const [lo, hi] = MISSION.tip, before = m.money, amt = lo + Math.floor(Math.random() * ((hi - lo) / 1000 + 1)) * 1000;
  m.tipped.push(who); m.money += amt; m.tips += amt; m.tipN++; save();

}

function audioState(thr) {

    passGain: 0, passPan: 0, passSpeed: 0, tukGain: 0, tukPan: 0, tukSpeed: 0, trainGain: 0, trainHi: 0, riverGain: 0, reverb: 0.2 };

    const dx = c.pos.x - bike.x, dz = c.pos.z - bike.z, d = Math.hypot(dx, dz);
    const pan = clamp((dx * rx + dz * rz) / 8, -1, 1);
    if (c.kind === 'tuktuk' || c.kind === 'scooter') { if (d < td) { td = d; s.tukPan = pan; s.tukSpeed = c.v; } }
    if (d < nd) { nd = d; s.passPan = pan; s.passSpeed = c.v; s.passGain = d < 30 ? (1 - d / 30) ** 2 * Math.min(1, (c.v + 2) / 12) * (c.kind === 'bus' ? 0.32 : 0.2) : 0; }

}

  t.textContent = document.getElementById('game').getAttribute('data-lang') === 'en' ? 'Still loading. If this stays, check the connection and reload the page.' : 'ยังโหลดอยู่ ถ้าค้างนาน ตรวจอินเทอร์เน็ตแล้วโหลดหน้าใหม่';
}, 20000);
</script>
<script>
/* No zooming: a pinch or a double tap would leave the game half off the screen. */
(() => {
  const stop = e => { const vv = window.visualViewport; if (!vv || vv.scale <= 1.01) e.preventDefault(); };
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) stop(e); }, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) stop(e); }, { passive: false });
  window.addEventListener('wheel', e => { if (e.ctrlKey) stop(e); }, { passive: false });
})();
</script>
