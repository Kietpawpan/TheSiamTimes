*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: #000; color: var(--paper); font: 16px/1.5 var(--font-text); -webkit-font-smoothing: antialiased; touch-action: none; }
html:lang(th) body { font-family: "Sarabun", var(--font-text); line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* top bar: clock, message, tools */
.hud { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: max(6px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); pointer-events: none; z-index: 3; }
.hud > * { pointer-events: auto; }
.clock { padding: 4px 10px; border-radius: 8px; background: rgba(12, 19, 27, .78); border: 1px solid var(--rule); font: 700 13px/1.25 var(--font-label); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock b { font-size: 17px; color: var(--brass); }
.clock .late { color: var(--bad); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill { min-height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--rule); background: rgba(12, 19, 27, .8); font: 600 12.5px/1 var(--font-label); color: var(--paper); text-decoration: none; display: inline-flex; align-items: center; }
html:lang(th) .pill { font-size: 13.5px; }
.pill:hover { border-color: var(--paper); }
.pill[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
.msg { position: fixed; left: 50%; top: max(46px, calc(env(safe-area-inset-top, 0px) + 40px)); transform: translateX(-50%); max-width: min(620px, calc(100% - 24px)); padding: 7px 16px; border-radius: 10px; background: rgba(10, 16, 23, .82); border: 1px solid var(--rule); border-top: 2px solid var(--brass); font: 700 16px/1.35 var(--font-label); text-align: center; z-index: 3; pointer-events: none; transition: opacity .3s; }
html:lang(th) .msg { font-size: 17px; }
.msg.bad { border-top-color: var(--bad); color: #ffd9d2; }
.msg.good { border-top-color: var(--good); }
.msg.gone { opacity: 0; }

/* ticket: a traffic fine slides in at the side */
.ticket { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); top: 90px; width: min(260px, 60vw); padding: 10px 14px 12px; border-radius: 6px; background: #f4ecd8; color: #2a1f14; box-shadow: 0 12px 30px rgba(0, 0, 0, .5); border-top: 6px solid #b23a2e; z-index: 4; transform: translateX(120%); transition: transform .35s cubic-bezier(.2, 1.2, .4, 1); font: 15px/1.4 var(--font-label); }
.ticket.on { transform: none; }
.ticket b { display: block; font-size: 12px; letter-spacing: .1em; color: #b23a2e; text-transform: uppercase; }
html:lang(th) .ticket b { font-size: 13px; letter-spacing: .02em; }
.ticket span { display: block; font-weight: 700; font-size: 16px; }
.ticket i { font-style: normal; font-weight: 700; color: #b23a2e; }

/* controls over the cab */
.ctl { position: fixed; z-index: 2; }
.gear { left: max(8px, env(safe-area-inset-left, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, var(--g)); grid-template-rows: var(--g) calc(var(--g) * .55) var(--g); gap: 3px; --g: clamp(34px, 7.2vh, 52px); padding: 6px; border-radius: 12px; background: rgba(8, 12, 18, .72); border: 1px solid var(--rule); }
.gear button { border: 1px solid #39465a; border-radius: 8px; background: #1a222c; font: 700 17px/1 var(--font-label); color: var(--paper); padding: 0; }
.gear button.on { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.gear .n { grid-column: 1 / 4; font-size: 13px; border-radius: 6px; }
.pedals { right: max(8px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 8px; }
.pedal { width: clamp(52px, 9vh, 78px); height: clamp(70px, 15vh, 120px); border-radius: 12px 12px 16px 16px; border: 2px solid #3a4656; background: linear-gradient(180deg, #2b3440, #161c24); display: grid; place-items: center; align-content: center; gap: 2px; box-shadow: 0 6px 16px rgba(0, 0, 0, .5), inset 0 -6px 0 rgba(0, 0, 0, .35); padding: 0; }
.pedal .pk { font: 700 13px/1.1 var(--font-label); }
html:lang(th) .pedal .pk { font-size: 14px; }
.pedal .pl { font: 600 10.5px/1 var(--font-label); color: var(--muted); letter-spacing: .04em; }
.pedal.gas { height: clamp(84px, 18vh, 140px); }
.pedal.brake .pk { color: var(--bad); }
.pedal.gas .pk { color: var(--good); }
.pedal.clutch .pk { color: var(--blue); }
.pedal.on { transform: translateY(3px) scale(.98); box-shadow: 0 2px 6px rgba(0, 0, 0, .5); border-color: var(--paper); }
.blinks { position: fixed; z-index: 2; display: flex; gap: 10px; }
.blink { width: 46px; height: 34px; border-radius: 8px; border: 1px solid #3a4656; background: rgba(12, 19, 27, .8); color: #5fd17a; font: 700 18px/1 var(--font-label); padding: 0; }
.blink[aria-pressed="true"] { background: #1f5a2e; border-color: #5fd17a; }
.dash { position: fixed; z-index: 2; display: flex; flex-direction: column; gap: 5px; }
.dash .pill { justify-content: center; min-width: 92px; }
.dash .horn { min-height: 40px; border-color: var(--brass); color: var(--brass); font-size: 15px; }
.wheel-hit { position: fixed; z-index: 1; border-radius: 50%; touch-action: none; cursor: grab; }
.wheel-hit.grab { cursor: grabbing; }
.act { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); min-height: 48px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--brass); color: var(--brass-ink); font: 700 16px/1 var(--font-label); box-shadow: 0 8px 24px rgba(0, 0, 0, .5), inset 0 -3px 0 rgba(0, 0, 0, .2); }
html:lang(th) .act { font-size: 17px; }

/* cards */
.over { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 14px; background: rgba(6, 10, 15, .62); }
.card { width: min(520px, 100%); max-height: 100%; overflow-y: auto; padding: 22px 24px; border-radius: 12px; background: rgba(18, 28, 39, .97); border: 1px solid var(--rule); border-top: 2px solid var(--brass); box-shadow: 0 24px 60px rgba(0, 0, 0, .55); display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; }
.card .mast { font: 400 30px/1 var(--font-mast); text-align: center; }
.card .kick { font: 700 12px/1.2 var(--font-label); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); text-align: center; }
html:lang(th) .card .kick { font-size: 13.5px; letter-spacing: .02em; text-transform: none; }
.card h1, .card h2 { margin: 0; text-align: center; font: 700 28px/1.2 "Sarabun", var(--font-text); color: var(--brass); text-wrap: balance; }
html:lang(en) .card h1, html:lang(en) .card h2 { font: 600 30px/1.15 var(--font-text); }
.card p { margin: 0; }
.card ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 15px; }
.card li::marker { color: var(--brass); }
.card .route { font-size: 14px; color: var(--muted); text-align: center; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; }
.card .row > * { flex: 1 1 auto; }
.card table { width: 100%; border-collapse: collapse; font-size: 15px; }
.card td { padding: 3px 0; border-bottom: 1px dotted var(--rule); }
.card td:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.card td.neg { color: var(--bad); }
.btn { min-height: 50px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--brass); color: var(--brass-ink); font: 700 16px/1 var(--font-label); letter-spacing: .04em; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22); touch-action: manipulation; }
html:lang(th) .btn { font-size: 17px; }
.btn.line { background: transparent; color: var(--paper); border: 1px solid var(--rule); box-shadow: none; }
.btn.line[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
.keys { font: 12.5px/1.8 var(--font-label); color: var(--muted); }
kbd { display: inline-block; min-width: 1.6em; padding: 0 5px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; font: 600 11px/1.5 var(--font-label); color: var(--paper); text-align: center; background: var(--well); }
.bar { height: 10px; border-radius: 5px; background: var(--well); overflow: hidden; border: 1px solid var(--rule); }
.bar i { display: block; height: 100%; width: 0; background: var(--brass); }
#mapCv { width: 100%; aspect-ratio: 1 / 1; max-height: 62vh; border-radius: 8px; background: #e9e1cc; }
.rot { position: fixed; inset: auto 0 0 0; z-index: 7; padding: 6px; text-align: center; font: 600 13px/1.3 var(--font-label); background: rgba(178, 58, 46, .92); }
@media (orientation: landscape), (min-width: 700px) { .rot { display: none; } }
</style>

const ROUTE = [...LEGS.map((_, i) => ({ i, dir: 1 })), ...LEGS.map((_, i) => ({ i: LEGS.length - 1 - i, dir: -1 }))];

/* ---------- Building a road into segments ---------- */
function at(list, s, def) { let v = def; for (const [s0, x] of list) if (s >= s0) v = x; return v; }

function buildLeg(r, kind = 'main') {
  const route = ROUTE[r], sp = LEGS[route.i], dir = route.dir, len = sp.len;
  let J = kind === 'main' ? junctionAfter(r) : null;
  // easy mode: no bus-only road with the police at Ratchaprasong; straight on is an ordinary missed turn, and the sign says so
  if (J && J.trap && game.easy) J = { ...J, trap: false, sign: [J.sign[0], ['ปทุมวัน · สยาม', 'Pathum Wan · Siam'], J.sign[2]] };
  const lastOut = kind === 'main' && dir === 1 && route.i === LEGS.length - 1;
  const lastBack = kind === 'main' && dir === -1 && route.i === 0;
  const tail = kind !== 'main' ? 30 : J ? 200 : 90;
  const L = { r, kind, dir, sp, len, lanes: sp.lanes, H: sp.lanes * LANE, J, lastOut, lastBack, segs: [], lights: [], zebras: [], feats: [], tail };
  if (kind === 'detour') Object.assign(L, { len: 150, lanes: 1, H: LANE, tail: 30 });
  if (kind === 'station') Object.assign(L, { len: 95, lanes: 1, H: 4.2, tail: 10 });
  const total = L.len + L.tail, N = Math.ceil(total / SEG);
  const S = s => dir === 1 || kind !== 'main' ? s : len - s;        // position on the way there, for data lookups

  const curveAt = s => {

    return c * dir;

    const s = k * SEG, sm = s + SEG / 2;

        if (k % 3 === 0) put(s + 1, (th === 'market' && R() < 0.3 ? 'hotel' : 'shop') + Math.floor(R() * 6), edge + side * 6.5);
        if (k % 7 === 3) put(s, 'pole', side * (H + 1.3), { wires: true, flip: side > 0 });
        if (th !== 'shophouse' && k % 4 === 1 && R() < 0.7) put(s + 2, R() < 0.5 ? 'cart' : 'stall', side * (H + 2.2));
        if (th === 'soi' && k % 5 === 2 && side < 0) put(s + 3, R() < 0.5 ? 'tukParked' : 'motoParked', side * (H + 0.9));

      } else if (th === 'station') {

/* ---------- The route on the phone's map (a 600 × 700 sketch, north up) ---------- */
const MAPPTS = {
  charoen: [[118, 650], [118, 545]],
  bridge: [[118, 545], [172, 545], [252, 545], [430, 520]],
  witthayu: [[430, 520], [440, 335]],
  ploenchit: [[440, 335], [330, 335]],
  ratchadamri: [[330, 335], [330, 245], [338, 150]],
  rangnam: [[338, 150], [262, 150]],
  phayathai: [[262, 150], [262, 72]],

function polyAt(pts, u) {
  const lens = []; let tot = 0;

/* ---------- The pickup ----------

const GEARS = { '-1': -3.7, 0: 0, 1: 3.7, 2: 2.15, 3: 1.42, 4: 1.0, 5: 0.8 };

const car = { r: 0, L: null, s: 0, x: 0, v: 0, steer: 0, gear: 0, clutchP: 0, gasP: 0, brakeP: 0, rpm: 0, engine: false, crank: 0,
  fuel: 30, flat: false, blink: 0, lights: false, wipers: false, cap: false, slip: 0, odo: 0, lat: 0 };
const inp = { gas: false, brake: false, clutch: false, kl: false, kr: false, held: false, fast: false };
const game = { state: 'menu', clock: T0, t: 0, viol: [], lost: [], delivered: false, fueled: false, warned: false, assist: false, easy: false,
  trans: null, station: null, trap: false, uturnFrom: null, autoClutch: 0, speedT: 0, speedOk: 0, speedLatch: false,
  wrongT: 0, wrongOk: 0, wrongLatch: false, darkT: 0, darkDone: false, floodT: 0, curbT: 0, flash: 0, finished: false, best: null };

function daylight(c = game.clock) {
  const h = c / 3600;

  if (h < 17.33) return lerp(1, 0.68, (h - 16.75) / 0.58);
  if (h < 17.83) return lerp(0.68, 0.3, (h - 17.33) / 0.5);
  if (h < 18.25) return lerp(0.3, 0.07, (h - 17.83) / 0.42);

const segAt = (L, s) => L.segs[clamp(Math.floor(s / SEG), 0, L.segs.length - 1)];

/* ---------- Driving ---------- */
function setGear(g) {

  if ((g === -1 && car.v > 0.6) || (g > 0 && car.v < -0.6)) { sfx.grind(); say(T.stopFirst, 'bad', 1.6); return; }

}
function startEngine() {

  if (!game.assist && car.gear !== 0 && car.clutchP < 0.75) { say(T.needClutch, 'bad', 1.6); return; }

/* ---------- The rules of the road, and what happens on it ---------- */

  tr.t += dt;
  if (!tr.done && tr.t > tr.dur / 2) { tr.done = true; tr.mid(); }
  if (tr.t >= tr.dur) game.trans = null;
}

function enterStation(f) {
  game.station = { from: car.r, s: f.s, stopped: false, done: false, filled: false };
  transition(-0.6, () => { car.L = buildLeg(car.r, 'station'); car.s = 4; car.x = -2.1; car.v = Math.min(car.v, 4); traffic.length = 0; say(T.stationIn, 'good', 3); });
}
function leaveStation() {
  const st = game.station;
  if (car.cap) { say(T.stationCapOpen, 'bad', 2); return; }
  game.station = null;
  transition(-0.4, () => { car.L = buildLeg(st.from); car.s = st.s + 50; car.x = -car.L.H + LANE / 2; spawnTraffic(); });
}
function stationAction(kind) {
  const st = game.station; if (!st) return;
  if (kind === 'cap') {
    if (!car.cap) { if (car.engine) { say(T.stationEngine, 'bad', 2.5); return; } car.cap = true; sfx.cap(); say(T.stationCap, 'good', 3); }
    else { car.cap = false; st.done = true; sfx.cap(); say(T.stationFull, 'good', 3); }

}
function deliver() {
  game.delivered = true;
  runEvent('deliver', 10, () => {
    say(T.delivered, 'good', 5);
    uturn(() => enterLeg(LEGS.length, 10));

function addViol(kind) {
  const m = PENALTY[kind];
  game.viol.push(kind); game.clock += m * 60;
  ticket(T.v[kind], m);

/* ---------- Traffic and people ---------- */
const traffic = [];
const KINDS = {

  car: { w: 1.8, l: 4.5, h: 1.45, v: [10, 14], cols: ['#e9e4d8', '#a9b0b8', '#2b2f36', '#c8453b', '#3d6fa5'] },
  tuktuk: { w: 1.4, l: 2.9, h: 1.75, v: [7.5, 10], cols: ['#2f8f5b', '#d23a3a', '#2c63b0'] },
  truck: { w: 2.5, l: 9.5, h: 3.4, v: [7, 9.5], cols: ['#c8453b', '#2f6b4f', '#e2a326', '#3d6fa5'] },
  bus: { w: 2.55, l: 11, h: 3.2, v: [8, 10.5], cols: ['#c8453b', '#2c63b0', '#e9842e'] },
  moto: { w: 0.8, l: 2.0, h: 1.45, v: [11, 15], cols: ['#e9842e', '#2b2f36', '#c8453b'] },

const pick = a => a[Math.floor(Math.random() * a.length)];

function addVeh(dir, s, kind) {
  const L = car.L;
  kind = kind || pick(MIX);
  const K = KINDS[kind];
  const lane = kind === 'bus' && dir === 1 ? 0 : Math.floor(Math.random() * L.lanes);
  let x = dir === 1 ? -L.H + LANE * (lane + 0.5) : L.H - LANE * (lane + 0.5);
  if (kind === 'moto') x += (dir === 1 ? -1 : 1) * 0.9;
  const vt = lerp(K.v[0], K.v[1], Math.random()) * (dir === 1 ? 1 : 1.05);
  const veh = { kind, dir, s, x, tx: x, v: vt * 0.8, vt, w: K.w, l: K.l, h: K.h, col: pick(K.cols), stopT: 0, stopped: new Set(), hit: false, brake: false, laneT: 2 + Math.random() * 6, honkT: 0, num: pick(['29', '59', '34', '77', '515', '529']) };

}
function spawnTraffic() {
  traffic.length = 0;
  const L = car.L;
  if (L.kind === 'station') return;
  const end = L.len + (L.J && !L.J.trap ? 60 : 0);
  const nSame = Math.max(3, Math.round(L.len / 60 * L.lanes * 0.55));
  if (!game.easy) for (let i = 0; i < nSame; i++) { const s = car.s + 25 + Math.random() * Math.max(30, end - car.s - 25); addVeh(1, s); }
  if (!game.easy) for (let i = 0; i < 2; i++) addVeh(1, car.s - 30 - i * 25 - Math.random() * 20);
  const nOpp = Math.max(3, Math.round((L.len + L.tail) / 55 * L.lanes * 0.55));
  for (let i = 0; i < nOpp; i++) addVeh(-1, Math.random() * (L.len + L.tail));

}

const ROOM = 6;   // how far short of a pickup in its way oncoming traffic stops: room to steer back out
function stepTraffic(dt) {

      let tgt = Math.min(veh.vt, seg.limit / 3.6 + 1.5);

      const front = veh.s + veh.l / 2;
      for (const o of traffic) if (o !== veh && o.dir === 1 && o.s > veh.s && Math.abs(o.x - veh.x) < (o.w + veh.w) / 2 + 0.3) gap = Math.min(gap, o.s - o.l / 2 - front);

}
/* Someone on our half of the zebra (or just stepping into it from the middle): we stop for them */
function pedOurSide(p, L) { return p.x > -L.H - 0.6 && p.x < 0.8; }
/* The horn: the car in front, if it is waiting with nothing in its way, moves off */
function playerHorn() {
  sfx.horn();
  if (game.state !== 'drive') return;
  const L = car.L;
  let best = null, bd = 32;
  for (const veh of traffic) if (veh.dir === 1 && veh.s > car.s && veh.s - car.s < bd && Math.abs(veh.x - car.x) < 2.2) { bd = veh.s - car.s; best = veh; }
  if (!best || best.v > 3) return;
  const front = best.s + best.l / 2;
  if (L.lights.some(lt => lightState(lt) !== 'G' && lt.s - front > -0.5 && lt.s - front < 12)) { say(T.hornRed, '', 2.5); return; }
  best.hurry = 4;
  const z = L.zebras.find(q => q.s - 3 - front > -0.5 && q.s - 3 - front < 12);
  if (z && z.peds.some(p => pedOurSide(p, L) && Math.abs(p.x - best.x) < best.w / 2 + 1.2)) { z.peds.forEach(p => { p.rush = 2.5; }); say(T.hornPeds, 'bad', 3.5); }

function respawn(veh, dir) {
  const L = car.L;
  if (dir === 1) {
    const far = car.s + 200 + Math.random() * 220;
    if (far < L.len - 10) { veh.s = far; veh.v = veh.vt * 0.8; veh.stopped.clear(); veh.toBusRoad = false; veh.hit = false; }
    else { veh.s = car.s - 60 - Math.random() * 40; veh.v = veh.vt; veh.hit = false; }
    const lane = veh.kind === 'bus' ? 0 : Math.floor(Math.random() * L.lanes);
    veh.x = veh.tx = -L.H + LANE * (lane + 0.5) + (veh.kind === 'moto' ? -0.9 : 0);

    veh.s = car.s + 250 + Math.random() * 300; veh.v = veh.vt; veh.hit = false;

/* ---------- Pictures of the street, drawn once ----------
   Every roadside thing is drawn into its own small canvas at 20 px a metre (plus a layer of what
   glows at night); the road then just scales and places them. */
const PPM = 20, ATLAS = {};
let curPPM = PPM;
const THAI = '"Sarabun", "Noto Sans Thai", Tahoma, sans-serif';
function mk(key, w, h, draw, lit, ppm = PPM) {
  const make = () => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w * ppm)); c.height = Math.max(1, Math.ceil(h * ppm)); const g = c.getContext('2d'); g.scale(ppm, ppm); return [c, g]; };
  curPPM = ppm;

  curPPM = PPM;

}
const R = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
function RR(g, x, y, w, h, r, c) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fillStyle = c; g.fill(); }

  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.font = `${weight} ${Math.round(size * curPPM)}px ${font}`; g.fillStyle = c; g.textAlign = align; g.textBaseline = 'middle';

}

const SHOPWORDS = ['ข้าวมันไก่', 'ร้านทอง', 'ก๋วยเตี๋ยว', 'ร้านยา', 'ซ่อมมือถือ', 'กาแฟโบราณ', 'ร้านตัดผม', 'โชห่วย', 'ข้าวแกง', 'หมูปิ้ง', 'ร้านผ้า', 'เครื่องเขียน', 'ข้าวขาหมู', 'น้ำเต้าหู้'];

function person(g, x, y, h, shirt, legs, opt = {}) {  // standing figure, feet at y

function buildAtlas() {
  const rnd = rng(42);

  const facades = ['#e8d9b8', '#b9d8c8', '#f0c9a8', '#a9c8e0', '#e0c26a', '#c9c2b8'];
  for (let i = 0; i < 6; i++) {
    const w = 13, h = 9 + (i % 3) * 1.6, uw = w / 3, words = [0, 1, 2].map(() => SHOPWORDS[Math.floor(rnd() * SHOPWORDS.length)]), cols = [0, 1, 2].map(() => SIGNCOLS[Math.floor(rnd() * SIGNCOLS.length)]);

    mk('shop' + i, w, h + 1.2, (g) => {

          R(g, x + 0.3, y + 1.85, uw - 0.6, 0.12, shade(facades[i], -0.3));
          for (let p = 0; p < 3; p++) C(g, x + 0.7 + p * 0.5 + (f % 2) * 1.6, y + 1.75, 0.22, ['#3e7d3a', '#5a9a3c', '#2f6b2f'][p]);

const SAVE_KEY = 'tst-delivery-v1';
const prefs = { assist: false, sound: true, best: null, easy: false, bestEasy: null };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) { for (const k of ['assist', 'sound', 'easy']) if (typeof s[k] === 'boolean') prefs[k] = s[k]; for (const k of ['best', 'bestEasy']) if (typeof s[k] === 'number') prefs[k] = s[k]; } } catch (e) { /* no storage */ }
const savePrefs = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(prefs)); } catch (e) { /* ignore */ } };
AU.on = prefs.sound;

/* Story mode: when this page runs inside the Siam Times story (in a frame), tell the story when a game ends. */
function storyDone(r) {
  try { if (window.parent !== window) window.parent.postMessage(Object.assign({ tst: 'story', game: 'delivery' }, r), '*'); } catch (e) { /* not in a frame */ }
}

/* ---------- Messages, tickets, buttons ---------- */
let msgUntil = 0, msgKey = '';
const seenKey = {};
function say(text, tone = '', dur = 3, key = text, low = false) {
  const now = performance.now();
  // a reminder about the road (rain, school, flood) never covers another message, and comes back at most every 20 s
  if (low && ((now < msgUntil && key !== msgKey) || (seenKey[key] && now - seenKey[key] < 20000))) return;
  if (!low && seenKey[key] && now - seenKey[key] < dur * 1000 && key === msgKey) return;
  seenKey[key] = now; msgKey = key;
  const el = $('msg'); el.textContent = text; el.className = 'msg' + (tone ? ' ' + tone : '');
  msgUntil = now + dur * 1000;
}
let ticketT = 0;
function ticket(what, m) { $('tkWhat').textContent = what; $('tkFine').textContent = T.fine(m); $('ticket').classList.add('on'); clearTimeout(ticketT); ticketT = setTimeout(() => $('ticket').classList.remove('on'), 3200); }
const dur = sec => { const m = Math.max(0, Math.round(sec / 60)); return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')} ${LANG === 'th' ? 'ชม.' : 'h'}` : `${m} ${LANG === 'th' ? 'นาที' : 'min'}`; };
function gearUI() { for (const b of $('gear').querySelectorAll('button')) b.classList.toggle('on', Number(b.dataset.g) === car.gear); }
function engineUI() { $('engineBtn').textContent = car.engine ? T.engineStop : T.engineStart; $('engineBtn').setAttribute('aria-pressed', String(car.engine)); }
function blinkUI() { $('blinkL').setAttribute('aria-pressed', String(car.blink === -1)); $('blinkR').setAttribute('aria-pressed', String(car.blink === 1)); }
function lightsUI() { $('lightsBtn').setAttribute('aria-pressed', String(car.lights)); $('wipersBtn').setAttribute('aria-pressed', String(car.wipers)); }
function soundUI() { $('soundBtn').textContent = AU.on ? T.soundOn : T.soundOff; $('soundBtn').setAttribute('aria-pressed', String(AU.on)); }

/* ---------- Cards ---------- */
function card(html, onShow) { $('card').innerHTML = html; $('over').hidden = false; if (onShow) onShow(); const b = $('card').querySelector('button'); if (b) setTimeout(() => b.focus({ preventScroll: true }), 30); }
function closeCard() { $('over').hidden = true; }
// the road behind the start card, outside the building, as the chosen mode has it
function previewRoad() {
  game.easy = prefs.easy;
  car.r = 0; car.L = buildLeg(0);
  const h = car.L.feats.find(f => f.k === 'home'); car.s = h.s + 1; car.x = -car.L.H + 1.25;
  spawnTraffic();
}
function startCard(focus) {
  game.state = 'menu';
  const easy = prefs.easy, best = easy ? prefs.bestEasy : prefs.best;
  card(`<div class="mast">The Siam Times</div><span class="kick">${T.startKick}</span><h1>${T.startTitle}</h1>
    <p>${T.startText}</p><p class="route">${T.route}</p>
    <div class="row" role="group" aria-label="${T.modeLabel}"><button class="btn line" id="cNormal" type="button" aria-pressed="${!easy}">${T.modeNormal}</button><button class="btn line" id="cEasy" type="button" aria-pressed="${easy}">${T.modeEasy}</button></div>
    <p class="route">${easy ? T.modeEasyText : T.modeNormalText}</p>
    <ul>${(easy ? T.rulesEasy : T.rules).map(r => `<li>${r}</li>`).join('')}</ul>
    <p class="keys">${T.keys}</p>${best ? `<p class="route">${T.best(hhmm(best))}</p>` : ''}
    <div class="row"><button class="btn line" id="cAssist" type="button" aria-pressed="${prefs.assist}">${prefs.assist ? T.assistOn : T.assistOff}</button></div>
    <button class="btn" id="cGo" type="button">${T.go}</button>`, () => {
    const mode = e => () => { if (prefs.easy !== e) { prefs.easy = e; savePrefs(); previewRoad(); } startCard(e ? 'cEasy' : 'cNormal'); };
    $('cNormal').onclick = mode(false); $('cEasy').onclick = mode(true);
    $('cAssist').onclick = () => { prefs.assist = !prefs.assist; savePrefs(); $('cAssist').textContent = prefs.assist ? T.assistOn : T.assistOff; $('cAssist').setAttribute('aria-pressed', String(prefs.assist)); };
    $('cGo').onclick = () => { audioInit(); newGame(); };
  });
  if (focus) setTimeout(() => { const b = $(focus); if (b) b.focus({ preventScroll: true }); }, 40);
}
function runEvent(kind, minutes, onDone, notLost) {
  if (game.state !== 'drive') return;
  game.state = 'event';
  game.event = { kind, t: 0, dur: kind === 'deliver' ? 4 : 4.5, minutes, onDone, notLost };
  car.v = 0;
  const [title, text] = T.ev[kind];
  card(`<span class="kick">${hhmm(game.clock)}</span><h2>${title}</h2><p>${text}</p><div class="bar"><i id="evBar"></i></div><p class="route">${T.evLost(minutes)}</p>`);
  if (kind === 'flat') sfx.repair();
  if (kind === 'deliver') sfx.chime();
}
function stepEvent(dt) {
  const e = game.event; if (!e) return;
  e.t += dt;
  const bar = $('evBar'); if (bar) bar.style.width = `${clamp(e.t / e.dur, 0, 1) * 100}%`;
  game.clock += dt * (e.minutes * 60 / e.dur) - 0;
  if (e.t >= e.dur) {
    game.event = null; closeCard(); game.state = 'drive';
    if (!e.notLost) game.lost.push([e.kind, e.minutes]);
    e.onDone();
  }
}
function mapCard() {
  if (game.state !== 'drive' && game.state !== 'paused') return;
  game.state = 'map';
  card(`<h2>${T.mapTitle}</h2><canvas id="mapCv"></canvas><p class="route">${T.route}</p><button class="btn" id="cClose" type="button">${T.close}</button>`, () => {
    const c = $('mapCv'), r = c.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(r.width * d); c.height = Math.round(r.height * d);
    const g = c.getContext('2d'); g.scale(d, d); drawRouteMap(g, 0, 0, r.width, r.height, Math.min(r.width / 560, r.height / 700), [300, 360]);
    $('cClose').onclick = () => { closeCard(); game.state = 'drive'; };
  });
}
function pauseCard() {
  if (game.state !== 'drive') return;
  game.state = 'paused';
  card(`<h2>${T.paused}</h2><p class="route">${hhmm(game.clock)} · ${T.roads[segAt(car.L, car.s).name] || ''}${game.easy ? ` · ${T.modeEasy}` : ''}</p><p class="keys">${T.keys}</p><button class="btn" id="cRes" type="button">${T.resume}</button>`, () => { $('cRes').onclick = () => { closeCard(); game.state = 'drive'; }; });
}
function finish() {
  if (game.finished) return;
  game.finished = true; game.state = 'finished'; car.v = 0;
  const on = game.clock <= DEADLINE, nv = game.viol.length, won = on && nv <= 2, easy = game.easy, bk = easy ? 'bestEasy' : 'best';
  if (on && (!prefs[bk] || game.clock < prefs[bk])) { prefs[bk] = game.clock; savePrefs(); }
  storyDone({ won, score: Math.round((DEADLINE - game.clock) / 60), text: T.resultText(hhmm(game.clock), on) + (easy ? ` · ${T.modeEasy}` : ''), onTime: on, violations: nv, easy });
  sfx.fanfare();
  const counts = {}; for (const v of game.viol) counts[v] = (counts[v] || 0) + 1;
  const rows = Object.entries(counts).map(([k, n]) => `<tr><td>${T.v[k]}${n > 1 ? ` ×${n}` : ''}</td><td class="neg">+${PENALTY[k] * n} ${LANG === 'th' ? 'นาที' : 'min'}</td></tr>`).join('');
  const lost = game.lost.map(([k, m]) => `<tr><td>${T.ev[k][0]}</td><td class="neg">+${m} ${LANG === 'th' ? 'นาที' : 'min'}</td></tr>`).join('');
  card(`<div class="mast">The Siam Times</div><span class="kick">${T.finArrive(hhmm(game.clock))} · ${T.finDeadline}${easy ? ` · ${T.modeEasy}` : ''}</span><h1>${on ? T.finOn : T.finLate}</h1>
    <p>${on ? T.finOnText : T.finLateText}</p>${won ? `<p style="color:var(--good);font-weight:700">${T.finGood}</p>` : ''}
    <table><tr><td><b>${T.finViol}</b></td><td>${nv}</td></tr>${rows || `<tr><td colspan="2">${T.finNone}</td></tr>`}${lost ? `<tr><td colspan="2"><b>${T.finEvents}</b></td></tr>${lost}` : ''}
    <tr><td>${T.finDist}</td><td>${(car.odo / 1000).toFixed(1)} ${T.odo}</td></tr></table>
    <button class="btn" id="cAgain" type="button">${T.again}</button>`, () => { $('cAgain').onclick = () => { closeCard(); startCard(); }; });
}

/* ---------- A new run ---------- */
function newGame() {
  closeCard();
  Object.assign(game, { state: 'drive', clock: T0, t: 0, viol: [], lost: [], delivered: false, fueled: false, warned: false, assist: prefs.assist, easy: prefs.easy, trans: null, station: null, trap: false, uturnFrom: null,
    autoClutch: 0, speedT: 0, speedOk: 0, speedLatch: false, wrongT: 0, wrongOk: 0, wrongLatch: false, darkT: 0, darkDone: false, floodT: 0, curbT: 0, flash: 0, finished: false, event: null });
  car.r = 0; car.L = buildLeg(0);
  const home = car.L.feats.find(f => f.k === 'home');
  Object.assign(car, { s: home.s + 1, x: -car.L.H + 1.25, v: 0, steer: 0, gear: 0, clutchP: 0, gasP: 0, brakeP: 0, rpm: 0, engine: false, crank: 0, fuel: game.easy ? 100 : 30, flat: false, blink: 0, lights: false, wipers: false, cap: false, slip: 0, odo: 0 });
  spawnTraffic();
  gearUI(); engineUI(); blinkUI(); lightsUI();
  say(T.msgStart, '', 7);
}

/* ---------- Controls ---------- */
function hold(el, on, off) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } el.classList.add('on'); on(); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(ev, () => { el.classList.remove('on'); off(); });
  el.addEventListener('contextmenu', e => e.preventDefault());
}
hold($('gasBtn'), () => { inp.gas = true; }, () => { inp.gas = false; });
hold($('brakeBtn'), () => { inp.brake = true; }, () => { inp.brake = false; });
hold($('clutchBtn'), () => { inp.clutch = true; }, () => { inp.clutch = false; });
for (const b of $('gear').querySelectorAll('button')) b.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); if (game.state === 'drive') setGear(Number(b.dataset.g)); });
// the buttons by the wheel act as the finger lands (a touch there makes no click: see below); Enter or Space still works
function tap(el, fn) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); fn(); });
  el.addEventListener('click', e => { if (e.detail === 0) fn(); });
}
tap($('blinkL'), () => { car.blink = car.blink === -1 ? 0 : -1; blinkUI(); });
tap($('blinkR'), () => { car.blink = car.blink === 1 ? 0 : 1; blinkUI(); });
tap($('engineBtn'), () => { if (game.state === 'drive') startEngine(); });
tap($('lightsBtn'), () => { car.lights = !car.lights; lightsUI(); });
tap($('wipersBtn'), () => { car.wipers = !car.wipers; lightsUI(); });
$('hornBtn').addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); playerHorn(); });
$('mapBtn').addEventListener('click', () => { audioInit(); if (game.state === 'map') { closeCard(); game.state = 'drive'; } else mapCard(); });
$('pauseBtn').addEventListener('click', () => { if (game.state === 'paused') { closeCard(); game.state = 'drive'; } else pauseCard(); });
$('soundBtn').addEventListener('click', () => { audioInit(); setSoundOn(!AU.on); prefs.sound = AU.on; savePrefs(); soundUI(); });
// the fuel-station button: open the cap, hold to fill, close the cap
const act = $('actBtn'); let filling = false;
act.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); const st = game.station; if (!st) return; if (car.cap && !st.filled) filling = true; else stationAction('cap'); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) act.addEventListener(ev, () => { filling = false; });
function actUI(dt) {
  const st = game.station;
  let label = null;
  if (st && st.stopped && !st.done && game.state === 'drive') {
    if (!car.engine && !car.cap) label = T.capOpen;
    else if (car.cap && !st.filled) label = T.fill;
    else if (car.cap && st.filled) label = T.capClose;
  }
  act.hidden = !label; if (label && act.textContent !== label) act.textContent = label;
  if (filling && st && car.cap && !st.filled) {
    if (car.engine) { say(T.stationEngine, 'bad', 2); filling = false; }
    else { car.fuel = Math.min(100, car.fuel + dt * 24); AU.pumpT = (AU.pumpT || 0) - dt; if (AU.pumpT <= 0) { AU.pumpT = 0.25; tone(220 + car.fuel * 2, 0.2, { vol: 0.03 }); } if (car.fuel >= 100) { st.filled = true; filling = false; game.fueled = true; sfx.ding(); say(T.capClose, 'good', 3); } }
  }
}
// the steering wheel: turn it by dragging round the rim; tap the middle for the horn
(function wheel() {
  const el = $('wheelHit'); let id = null, last = 0, moved = 0, t0 = 0, hub = false;
  const ang = e => { const r = el.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2); return { a: Math.atan2(y, x), d: Math.hypot(x, y), R: r.width / 2 }; };
  el.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); id = e.pointerId; try { el.setPointerCapture(id); } catch (err) { /* ignore */ } const p = ang(e); last = p.a; moved = 0; t0 = performance.now(); hub = p.d < p.R * 0.3; inp.held = true; el.classList.add('grab'); });
  el.addEventListener('pointermove', e => { if (e.pointerId !== id) return; const p = ang(e); if (p.d < 12) return; let da = p.a - last; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI; last = p.a; moved += Math.abs(da); car.steer = clamp(car.steer + da * 180 / Math.PI / WHEEL_MAX, -1, 1); });
  const end = e => { if (e.pointerId !== id) return; id = null; inp.held = false; el.classList.remove('grab'); if (hub && moved < 0.12 && performance.now() - t0 < 350) playerHorn(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
})();
const KEYS = { ArrowUp: 'gas', KeyW: 'gas', ArrowDown: 'brake', KeyS: 'brake', ArrowLeft: 'kl', KeyA: 'kl', ArrowRight: 'kr', KeyD: 'kr', ShiftLeft: 'clutch', ShiftRight: 'clutch', KeyC: 'clutch' };
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  audioInit();
  const code = e.code;
  if (!$('over').hidden && (code === 'Enter' || code === 'NumpadEnter')) { const b = $('card').querySelector('#cGo, #cRes, #cClose, #cAgain'); if (b && document.activeElement !== b) { e.preventDefault(); b.click(); } return; }
  if (!$('over').hidden) return;
  if (KEYS[code]) { e.preventDefault(); inp[KEYS[code]] = true; return; }
  if (game.state !== 'drive' && !['KeyP', 'Escape', 'KeyM'].includes(code)) return;
  if (e.repeat && code !== 'KeyG') return;
  const gearOf = { Digit1: 1, Digit2: 2, Digit3: 3, Digit4: 4, Digit5: 5, Numpad1: 1, Numpad2: 2, Numpad3: 3, Numpad4: 4, Numpad5: 5, KeyR: -1, KeyN: 0, Digit0: 0, Numpad0: 0 };
  if (code in gearOf) setGear(gearOf[code]);
  else if (code === 'KeyQ') { car.blink = car.blink === -1 ? 0 : -1; blinkUI(); } else if (code === 'KeyE') { car.blink = car.blink === 1 ? 0 : 1; blinkUI(); }
  else if (code === 'KeyH') { car.lights = !car.lights; lightsUI(); } else if (code === 'KeyV') { car.wipers = !car.wipers; lightsUI(); }
  else if (code === 'KeyK') startEngine(); else if (code === 'Space') { e.preventDefault(); playerHorn(); }
  else if (code === 'KeyF') { if (game.station && game.station.stopped && !game.station.done && !(car.cap && !game.station.filled)) stationAction('cap'); }
  else if (code === 'KeyG') { if (game.station && car.cap && !game.station.filled) filling = true; }
  else if (code === 'KeyM') $('mapBtn').click(); else if (code === 'KeyP' || code === 'Escape') $('pauseBtn').click();
});
window.addEventListener('keyup', e => { const code = e.code; if (KEYS[code]) inp[KEYS[code]] = false; if (code === 'ShiftLeft' || code === 'ShiftRight') inp.fast = false; if (code === 'KeyG') filling = false; });
window.addEventListener('blur', () => { for (const k of ['gas', 'brake', 'clutch', 'kl', 'kr']) inp[k] = false; });
document.addEventListener('pointerdown', () => audioInit(), { passive: true });
document.addEventListener('visibilitychange', () => { if (AU.ctx) { if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); } if (document.hidden && game.state === 'drive') pauseCard(); });
window.addEventListener('resize', resize);
// Zoom. A touch on the road, the wheel, the pedals, the gears or the buttons by the wheel is the game's own:
// cancelling it stops Safari reading a quick second press or two fingers on the pedals as a zoom.
// If the page is zoomed in all the same, the game pauses, and the touches are left alone so it can be pinched back.
const VV = (() => { try { return window.top.visualViewport || window.visualViewport; } catch (e) { return window.visualViewport; } })();
const zoomedIn = () => !!VV && VV.scale > 1.01;
document.addEventListener('touchstart', e => { if (!zoomedIn() && e.target.closest && e.target.closest('#view, .ctl, .blinks, .dash, .wheel-hit, .act')) e.preventDefault(); }, { passive: false });
if (VV) VV.addEventListener('resize', () => { if (zoomedIn() && game.state === 'drive') { for (const k of ['gas', 'brake', 'clutch', 'kl', 'kr', 'held']) inp[k] = false; pauseCard(); } });

/* ---------- Main loop ---------- */
let lastT = performance.now(), acc = 0, hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - lastT) / 1000)); lastT = now;
  if (game.state === 'drive') {
    acc += dt;
    const h = 1 / 120;
    while (acc >= h) {
      acc -= h; game.t += h; game.clock += h * CLOCK_RATE;
      if (game.trans) { stepTransition(h); skyShift += game.trans ? game.trans.yaw * 0.9 * 60 * h * 10 : 0; }
      else { stepCar(h); const seg = segAt(car.L, car.s); skyShift += seg.curve * car.v * h * 6; }
      stepTraffic(h); stepTrain(h);
    }
    actUI(dt);
  } else if (game.state === 'event') { stepEvent(dt); }
  if (game.state === 'event' || game.state === 'drive') updateAudio(dt); else if (AU.eng) updateAudio(0);
  if (car.L) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const shake = game.state === 'drive' && !REDUCED ? (Math.random() - 0.5) * Math.min(2, Math.abs(car.v) * 0.05 + (car.flat ? 1.5 : 0)) : 0;
    const tr = game.trans, shift = tr ? -tr.yaw * VW * 0.9 * Math.sin(Math.PI * clamp(tr.t / tr.dur, 0, 1)) : 0;
    renderRoad(ctx, 0, shake, VW, CK.dashY + 10, false, { shift });
    drawCockpit(ctx);
  }
  hudT -= dt;
  if (hudT <= 0) {
    hudT = 0.25;
    const left = DEADLINE - game.clock;
    $('clock').innerHTML = T.clock(hhmm(game.clock), left >= 0 ? T.left(dur(left)) : T.lateBy(dur(-left)));
    $('wheelHit').setAttribute('aria-valuenow', String(Math.round(car.steer * 100)));
  }
  if (performance.now() > msgUntil) $('msg').classList.add('gone'); else $('msg').classList.remove('gone');
}

/* ---------- Start ---------- */
buildAtlas();
resize();
soundUI();
previewRoad(); gearUI(); engineUI(); blinkUI(); lightsUI();
startCard();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k of Object.keys(SIGNCACHE)) delete SIGNCACHE[k]; buildAtlas(); });
requestAnimationFrame(frame);
})();
</script>
<script>
/* No zooming: a pinch or a double tap would leave the game half off the screen and stuck.
   If the page is zoomed in all the same (Safari lets people zoom whatever a page asks), nothing is
   blocked any more, so it can be pinched back, and a note in the middle of the screen says how. */
(() => {
  const own = window.visualViewport;
  let vv = own;
  try { if (window.top !== window && window.top.visualViewport) vv = window.top.visualViewport; } catch (e) { /* a page from another site around this one */ }
  const zoomed = () => !!vv && vv.scale > 1.01;
  const stop = e => { if (!zoomed()) e.preventDefault(); };
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) stop(e); }, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) stop(e); }, { passive: false });
  window.addEventListener('wheel', e => { if (e.ctrlKey) stop(e); }, { passive: false });
  window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) stop(e); });
  document.documentElement.style.touchAction = 'manipulation';
  if (!own || window.top !== window) return;
  const th = /^th/i.test(document.documentElement.lang);
  let note = null;
  const show = () => {
    const z = zoomed();
    if (!note) {
      if (!z) return;
      note = document.createElement('div');
      note.setAttribute('role', 'status');
      note.style.cssText = 'position:fixed;left:0;top:0;z-index:2147483647;transform-origin:0 0;width:max-content;max-width:300px;padding:14px 18px;border-radius:12px;background:#b23a2e;color:#fff;font:600 17px/1.45 system-ui,-apple-system,"Sarabun",sans-serif;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;';
      note.textContent = th ? 'หน้าจอถูกขยายอยู่ ใช้สองนิ้วบีบเข้าหากันเพื่อย่อกลับ แล้วเล่นต่อได้' : 'The page is zoomed in. Pinch with two fingers to zoom back out, then carry on.';
      document.body.appendChild(note);
    }
    note.style.display = z ? 'block' : 'none';
    if (z) note.style.transform = `translate(${own.offsetLeft + own.width / 2}px, ${own.offsetTop + own.height * 0.42}px) scale(${1 / own.scale}) translate(-50%, -50%)`;
  };
  own.addEventListener('resize', show);
  own.addEventListener('scroll', show);
})();
</script>
