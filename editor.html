<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Siam Times HTML Editor</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CodeMirror Core and Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    
    <!-- CodeMirror Modes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <!-- CodeMirror Search Addons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/search.min.js"></script>

    <!-- Google Fonts: Roboto Mono for Editor -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .css-app-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9998 !important;
            background-color: #f3f4f6;
        }
        .css-output-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            border-radius: 0 !important;
            border: none !important;
        }
        .css-output-fullscreen #output-header {
            display: none !important;
        }
        .CodeMirror {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            border-bottom-left-radius: 0.75rem;
            border-bottom-right-radius: 0.75rem;
        }
        .CodeMirror-dialog {
            background: #282a36;
            color: #f8f8f2;
            padding: 10px 16px;
            border-bottom: 1px solid #44475a;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
        }
        .CodeMirror-dialog input {
            background: #44475a;
            color: white;
            border: 1px solid #6272a4;
            border-radius: 4px;
            padding: 4px 8px;
            outline: none;
            margin: 0 8px;
        }
        .CodeMirror-dialog button {
            background: #6272a4;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="app-wrapper" class="flex flex-col h-full bg-gray-100 text-gray-800 font-sans transition-all duration-300">
        
        <!-- Header / Toolbar -->
        <header class="bg-white shadow-sm border-b border-gray-200 px-4 md:px-6 py-3 flex flex-col md:flex-row justify-between items-center shrink-0 gap-3">
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-sm">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                    </div>
                    <h1 class="text-lg md:text-xl font-bold text-gray-800">THE SIAM TIMES - HTML Editor</h1>
                </div>
                <button id="runBtnMobile" class="md:hidden bg-blue-600 hover:bg-blue-700 text-white font-semibold py-1.5 px-3 rounded-md shadow-sm transition-all flex items-center gap-1 text-xs">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    Run
                </button>
            </div>
            
            <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 hide-scrollbar">
                <button id="settingsBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-3 rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm whitespace-nowrap" title="Settings">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span class="hidden lg:inline">Settings</span>
                </button>
                <button id="appFullscreenBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-3 rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm whitespace-nowrap" title="Toggle App Fullscreen">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    <span class="hidden lg:inline">App Fullscreen</span>
                </button>
                <button id="downloadBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-3 rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm whitespace-nowrap" title="Download Code">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span class="hidden lg:inline">Download</span>
                </button>
                <button id="clearBtn" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-semibold py-2 px-3 rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm whitespace-nowrap" title="Clear Code">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    <span>Clear</span>
                </button>
                <button id="themeBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-3 rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <span class="hidden sm:inline">Theme</span>
                </button>
                <button id="copyBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-3 rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span id="copyText">Copy</span>
                </button>
                <button id="findBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-3 rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span class="hidden lg:inline">Find</span>
                </button>
                <button id="runBtnDesktop" class="hidden md:flex bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition-all items-center gap-2 text-sm whitespace-nowrap">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    Run Code
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col lg:flex-row p-4 gap-4 overflow-hidden relative">
            
            <!-- Editor Pane -->
            <section id="editor-section" class="flex-1 flex flex-col bg-gray-900 rounded-xl shadow-lg border border-gray-700 transition-colors duration-300 min-h-[300px]">
                <div id="editor-header" class="bg-gray-800 px-4 py-2.5 rounded-t-xl border-b border-gray-700 flex justify-between items-center transition-colors duration-300">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        <span class="text-sm font-medium text-gray-300">index.html</span>
                    </div>
                </div>
                <div class="flex-1 relative w-full h-full rounded-b-xl overflow-hidden">
                    <textarea id="html-code"></textarea>
                </div>
            </section>

            <!-- Output/Preview Pane -->
            <section id="output-pane" class="flex-1 flex flex-col bg-white rounded-xl shadow-lg border border-gray-200 min-h-[300px] transition-all duration-300">
                <div id="output-header" class="bg-gray-50 px-4 py-2.5 border-b border-gray-200 flex justify-between items-center rounded-t-xl">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        <span class="text-sm font-medium text-gray-600">Output Preview</span>
                    </div>
                    <button id="maximizeOutputBtn" class="bg-white hover:bg-gray-100 border border-gray-300 text-gray-700 py-1 px-3 rounded-md shadow-sm transition-all flex items-center gap-2 text-xs font-semibold">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                        Maximize
                    </button>
                </div>
                <div class="flex-1 relative bg-white w-full h-full rounded-b-xl overflow-hidden" id="iframe-container">
                    <iframe id="output-iframe" class="w-full h-full border-0 absolute inset-0 bg-white" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                </div>
            </section>
        </main>
    </div>

    <!-- Floating Button for Exiting Maximize Output -->
    <button id="exitMaxBtn" class="fixed bottom-6 right-6 z-[10000] hidden bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-full shadow-2xl transition-all flex items-center gap-2 text-sm border-2 border-white/20">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        Exit Max Output
    </button>

    <!-- Modal: Settings (External CSS/JS) -->
    <div id="settingsModal" class="fixed inset-0 z-[10005] hidden items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full mx-4 transform scale-95 transition-transform duration-200" id="settingsModalContent">
            <h3 class="text-lg font-bold text-gray-900 mb-4">External Links Settings</h3>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">External CSS (One URL per line)</label>
                <textarea id="extCssInput" rows="3" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="https://cdn.tailwindcss.com"></textarea>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">External JS (One URL per line)</label>
                <textarea id="extJsInput" rows="3" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="https://code.jquery.com/jquery-3.6.0.min.js"></textarea>
            </div>
            <div class="flex justify-end gap-3">
                <button id="cancelSettingsBtn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Cancel</button>
                <button id="saveSettingsBtn" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">Save</button>
            </div>
        </div>
    </div>

    <!-- Modal: Clear Confirmation -->
    <div id="clearModal" class="fixed inset-0 z-[10005] hidden items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200" id="clearModalContent">
            <h3 class="text-lg font-bold text-gray-900 mb-2">Clear All Code?</h3>
            <p class="text-gray-600 text-sm mb-6">Are you sure you want to delete everything in the editor? This action cannot be undone.</p>
            <div class="flex justify-end gap-3">
                <button id="cancelClearBtn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Cancel</button>
                <button id="confirmClearBtn" class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors">Yes, Clear Code</button>
            </div>
        </div>
    </div>

    <script>
        // Load saved code or start empty
        const savedCode = localStorage.getItem('siamTimesHtmlEditorCode');
        const initialCode = savedCode !== null ? savedCode : ``;

        // Initialize CodeMirror Editor
        const htmlCodeElement = document.getElementById('html-code');
        htmlCodeElement.value = initialCode;

        const editor = CodeMirror.fromTextArea(htmlCodeElement, {
            mode: 'htmlmixed',
            theme: 'dracula',
            lineNumbers: true,
            autoCloseTags: true,
            autoCloseBrackets: true,
            lineWrapping: true,
            tabSize: 4
        });

        // Auto-save on change
        editor.on("change", () => {
            localStorage.setItem('siamTimesHtmlEditorCode', editor.getValue());
        });

        // Run Code Function
        function runCode() {
            const code = editor.getValue();
            const iframe = document.getElementById('output-iframe');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            // Get external links
            const extCss = localStorage.getItem('siamTimesExtCss') || "";
            const extJs = localStorage.getItem('siamTimesExtJs') || "";
            
            let injectHtml = "";
            
            if (extCss.trim()) {
                extCss.split('\n').forEach(url => {
                    if (url.trim()) injectHtml += `<link rel="stylesheet" href="${url.trim()}">\n`;
                });
            }
            if (extJs.trim()) {
                extJs.split('\n').forEach(url => {
                    if (url.trim()) injectHtml += `<script src="${url.trim()}"><\/script>\n`;
                });
            }

            // Inject into code if there are external links
            let finalCode = code;
            if (injectHtml) {
                if (finalCode.includes('<head>')) {
                    finalCode = finalCode.replace('<head>', '<head>\n' + injectHtml);
                } else {
                    finalCode = injectHtml + finalCode;
                }
            }
            
            iframeDoc.open();
            iframeDoc.write(finalCode);
            iframeDoc.close();
        }

        // Event Listeners for Run buttons
        document.getElementById('runBtnDesktop').addEventListener('click', runCode);
        document.getElementById('runBtnMobile').addEventListener('click', runCode);

        // Download HTML Function
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const code = editor.getValue();
            const blob = new Blob([code], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "index.html";
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 0);
        });

        // Find Function
        document.getElementById('findBtn').addEventListener('click', () => {
            editor.execCommand("find");
        });

        // Copy Code Function
        document.getElementById('copyBtn').addEventListener('click', () => {
            const code = editor.getValue();
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const copyText = document.getElementById('copyText');
                copyText.innerText = 'Copied!';
                setTimeout(() => { copyText.innerText = 'Copy'; }, 2000);
            } catch (err) {
                console.error("Copy failed", err);
            }
            document.body.removeChild(textArea);
        });

        // ==========================================
        // SETTINGS MODAL LOGIC (External CSS/JS)
        // ==========================================
        const settingsModal = document.getElementById('settingsModal');
        const settingsModalContent = document.getElementById('settingsModalContent');
        const extCssInput = document.getElementById('extCssInput');
        const extJsInput = document.getElementById('extJsInput');

        document.getElementById('settingsBtn').addEventListener('click', () => {
            extCssInput.value = localStorage.getItem('siamTimesExtCss') || "";
            extJsInput.value = localStorage.getItem('siamTimesExtJs') || "";
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
            setTimeout(() => {
                settingsModalContent.classList.remove('scale-95');
                settingsModalContent.classList.add('scale-100');
            }, 10);
        });

        function hideSettingsModal() {
            settingsModalContent.classList.remove('scale-100');
            settingsModalContent.classList.add('scale-95');
            setTimeout(() => {
                settingsModal.classList.add('hidden');
                settingsModal.classList.remove('flex');
            }, 200);
        }

        document.getElementById('cancelSettingsBtn').addEventListener('click', hideSettingsModal);

        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            localStorage.setItem('siamTimesExtCss', extCssInput.value);
            localStorage.setItem('siamTimesExtJs', extJsInput.value);
            hideSettingsModal();
            runCode();
        });

        // ==========================================
        // CLEAR MODAL LOGIC
        // ==========================================
        const clearModal = document.getElementById('clearModal');
        const clearModalContent = document.getElementById('clearModalContent');

        document.getElementById('clearBtn').addEventListener('click', () => {
            clearModal.classList.remove('hidden');
            clearModal.classList.add('flex');
            setTimeout(() => {
                clearModalContent.classList.remove('scale-95');
                clearModalContent.classList.add('scale-100');
            }, 10);
        });

        function hideClearModal() {
            clearModalContent.classList.remove('scale-100');
            clearModalContent.classList.add('scale-95');
            setTimeout(() => {
                clearModal.classList.add('hidden');
                clearModal.classList.remove('flex');
            }, 200);
        }

        document.getElementById('cancelClearBtn').addEventListener('click', hideClearModal);

        document.getElementById('confirmClearBtn').addEventListener('click', () => {
            editor.setValue('');
            localStorage.removeItem('siamTimesHtmlEditorCode');
            runCode();
            hideClearModal();
        });

        // ==========================================
        // APP FULLSCREEN LOGIC 
        // ==========================================
        let isAppFullscreen = false;
        const appWrapper = document.getElementById('app-wrapper');
        const appFullscreenBtn = document.getElementById('appFullscreenBtn');

        appFullscreenBtn.addEventListener('click', () => {
            isAppFullscreen = !isAppFullscreen;
            if (isAppFullscreen) {
                appWrapper.classList.add('css-app-fullscreen');
                appFullscreenBtn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3"></path></svg>
                    <span class="hidden lg:inline">Exit App Full</span>
                `;
            } else {
                appWrapper.classList.remove('css-app-fullscreen');
                appFullscreenBtn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    <span class="hidden lg:inline">App Fullscreen</span>
                `;
            }
            setTimeout(() => editor.refresh(), 50);
        });

        // ==========================================
        // MAXIMIZE OUTPUT LOGIC
        // ==========================================
        const outputPane = document.getElementById('output-pane');
        const maximizeOutputBtn = document.getElementById('maximizeOutputBtn');
        const exitMaxBtn = document.getElementById('exitMaxBtn');
        const iframeContainer = document.getElementById('iframe-container');

        maximizeOutputBtn.addEventListener('click', () => {
            outputPane.classList.add('css-output-fullscreen');
            iframeContainer.classList.remove('rounded-b-xl'); 
            exitMaxBtn.classList.remove('hidden');
            exitMaxBtn.classList.add('flex');
        });

        exitMaxBtn.addEventListener('click', () => {
            outputPane.classList.remove('css-output-fullscreen');
            iframeContainer.classList.add('rounded-b-xl'); 
            exitMaxBtn.classList.add('hidden');
            exitMaxBtn.classList.remove('flex');
        });

        // ==========================================
        // THEME TOGGLE LOGIC
        // ==========================================
        let isDarkMode = true;
        document.getElementById('themeBtn').addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            
            editor.setOption("theme", isDarkMode ? "dracula" : "default");
            
            const editorSection = document.getElementById('editor-section');
            const editorHeader = document.getElementById('editor-header');
            const headerTitle = editorHeader.querySelector('span');
            
            if (isDarkMode) {
                editorSection.className = "flex-1 flex flex-col bg-gray-900 rounded-xl shadow-lg border border-gray-700 transition-colors duration-300 min-h-[300px]";
                editorHeader.className = "bg-gray-800 px-4 py-2.5 rounded-t-xl border-b border-gray-700 flex justify-between items-center transition-colors duration-300";
                headerTitle.className = "text-sm font-medium text-gray-300";
            } else {
                editorSection.className = "flex-1 flex flex-col bg-white rounded-xl shadow-lg border border-gray-200 transition-colors duration-300 min-h-[300px]";
                editorHeader.className = "bg-gray-50 px-4 py-2.5 rounded-t-xl border-b border-gray-200 flex justify-between items-center transition-colors duration-300";
                headerTitle.className = "text-sm font-medium text-gray-700";
            }
        });

        // Initialize on load
        window.onload = () => {
            runCode();
            setTimeout(() => editor.refresh(), 100);
        };
    </script>
</body>
</html>
